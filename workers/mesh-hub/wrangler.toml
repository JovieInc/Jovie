name = "jovie-mesh-hub"
main = "src/index.ts"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

# Company agent mesh hub (gbrain projects/jovie/agent-mesh-hub-architecture-2026-10-31).
# Runs on Cloudflare only: no Vercel, Gem or Mac in the delivery path.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[durable_objects.bindings]]
name = "MCP_AUTH"
class_name = "McpAuth"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Registry"]

# Fleet task board (canon MESH-SWARM.md).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]

# Remote MCP OAuth server state (src/mcp-oauth.ts).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["McpAuth"]

# Hub model executor (failover for kinds with no live reader). Workers AI binding: no secret.
[ai]
binding = "AI"

[observability]
enabled = true

# Secrets (wrangler secret put; values live in Doppler agent-mesh/prd, never here):
#   HUB_ADMIN_TOKEN            registry writes only
#   MCP_OWNER_TOTP_SECRET      base32 TOTP secret of Tim; without it /mcp consent refuses everyone
#   SUMMER_HUB_WEBHOOK_SECRET  HMAC for pushes to Summer (optional until Summer consumes the hub)

[vars]
# Stand-ins are disabled: registered agent mail must wait for its real runtime.
# A hub-generated reply is never evidence that the addressed agent is available.
EXECUTOR_KINDS = ""
EXECUTOR_GRACE_MS = "20000"
# Alarm once when peer mail sits unhandled this long (ms).
MAIL_STALE_MS = "600000"
# summer-config #387: Summer consumes hub pushes here (HMAC with SUMMER_HUB_WEBHOOK_SECRET).
SUMMER_HUB_WEBHOOK_URL = "https://summer.jov.ie/summer/v1/mesh/hub"

# Registry sweep (presence, silence, probes) every minute; also the dead-man for DO alarms.
[triggers]
crons = ["* * * * *"]
