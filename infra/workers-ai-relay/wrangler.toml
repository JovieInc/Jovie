name = "jovie-workers-ai"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = true

[ai]
binding = "AI"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1029"
  [ratelimits.simple]
  limit = 300
  period = 60

# WORKERS_AI_BEARER is a Worker secret (wrangler secret put), never a var here.

# /v1/embeddings gets its own bucket so a bulk re-embed never starves chat.
[[ratelimits]]
name = "EMBED_LIMITER"
namespace_id = "1031"
  [ratelimits.simple]
  limit = 600
  period = 60
