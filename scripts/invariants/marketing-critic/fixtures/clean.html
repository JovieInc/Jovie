<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean</title>
<style>
  body { margin: 0; background: #08090a; color: #e6e6e6; font: 16px/1.5 sans-serif; }
  section { padding: 96px 64px; }
  .hero { background: linear-gradient(180deg, rgb(14, 15, 18), rgb(8, 9, 10)); }
  .field { border-radius: 16px; border: 1px solid #333; padding: 8px; width: 320px; }
  .field input { border: 0; border-radius: 12px; background: transparent; color: inherit; width: 100%; }
  .field input:focus-visible { outline: 2px solid rgb(60, 160, 255); }
  img { display: block; width: 640px; height: 400px; border-radius: 24px; background: #15161a; }
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>One link for every release</h1>
    <p>Fans land on the right service in one tap.</p>
    <a href="/signup">Create a smart link</a>
  </section>
  <section>
    <h2>Built from your catalogue</h2>
    <p>Jovie reads your releases and keeps every link current.</p>
    <img alt="Product view" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
  </section>
  <section>
    <h2>Search everything</h2>
    <div class="field"><input type="search" placeholder="Search"></div>
  </section>
</main>
</body>
</html>
