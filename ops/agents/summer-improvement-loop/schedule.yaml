# Scheduled deployment settings for the Summer improvement loop.
# Not an `ant apply` file on purpose: the deployment carries GitHub repository
# tokens that must never be committed, so deploy.sh builds the create body from
# this file plus tokens read at a silent prompt.
#
# Budget math (validated in scripts/lib/__tests__/summer-improvement-loop-config.test.mjs):
#   every 6 hours -> at most 31 days x 4 = 124 sessions/month
#   124 x ($1.00 cap + $0.20 single-request overshoot allowance) = $148.80 <= $150
#   leaving >= $50 of the $200/month API credit as headroom.
name: summer-improvement-loop
description: Every 6h, pick the top repeated Summer/closed-loop failure and ship one tested PR or a justified no-op.
schedule:
  type: cron
  expression: "17 */6 * * *"
  timezone: UTC
budget:
  type: limit
  max_list_cost: {amount: "100", currency: USD}
budget_policy:
  monthly_ceiling_usd: 150
  credit_usd: 200
  overshoot_allowance_usd: 0.20
repositories:
  - url: https://github.com/JovieInc/Jovie
    mount_path: /workspace/Jovie
    token_env: LOOP_GITHUB_TOKEN
  - url: https://github.com/JovieInc/summer-config
    mount_path: /workspace/summer-config
    token_env: LOOP_GITHUB_TOKEN
memory_store:
  access: read_write
  instructions: >-
    Your memory across runs. Read runs.jsonl, open-fix.json and needs-tim.md
    before deciding anything, and append this run's receipt before finishing.
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Run one Summer improvement loop iteration now: read state, verify the
          previous fix, pick one qualifying repeated failure or no-op, ship at
          most one PR, and write the receipt.
