[Service]
# symphony-concurrency-autoscale-v1: GLOBAL chairs from WORKFLOW (40).
# Occupied = running. Empty chairs fill automatically.
# Codex exhausted is not a reason to cap Grok/Kimi.
# Independent OAuth lanes: last-chair reserve so one cannot steal the other.
Environment=SYMPHONY_GLOBAL_MAX=40
UnsetEnvironment=SYMPHONY_GROK_MAX
UnsetEnvironment=SYMPHONY_KIMI_MAX
