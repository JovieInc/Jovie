# Codecov configuration
# Documentation: https://docs.codecov.com/docs/codecov-yaml
#
# Pull requests do not upload coverage. The pull-request line-coverage gate is
# Exact-head Coverage in .github/workflows/ci.yml. This file describes the
# main-branch upload from Test Coverage Audit
# (.github/workflows/test-coverage-audit.yml), flag nightly-unittests.
#
# codecov/test-results-action flags (unittests, mergegroup-unittests) are test
# analytics, not coverage flags, so they are not declared here.
#
# scripts/lib/gate-config-consistency.mjs fails when this file claims a coverage
# flag or a blocking patch check that no workflow produces.

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        # Report only. Pull requests do not upload a project baseline.
        informational: true
        only_pulls: true
    patch:
      default:
        target: 60%
        threshold: 5%
        # Informational until a pull_request workflow uploads coverage with
        # codecov/codecov-action. A blocking patch status has no producer.
        informational: true

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
  hide_project_coverage: false

flags:
  nightly-unittests:
    paths:
      - apps/web/
    carryforward: true

ignore:
  - "**/*.d.ts"
  - "**/*.config.*"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/tests/**"
  - "**/coverage/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/__mocks__/**"
  - "**/storybook-static/**"
  - "packages/ui/**"

component_management:
  individual_components:
    - component_id: app
      name: App Core
      paths:
        - apps/web/app/**
    - component_id: components
      name: Components
      paths:
        - apps/web/components/**
    - component_id: lib
      name: Libraries
      paths:
        - apps/web/lib/**
    - component_id: hooks
      name: Hooks
      paths:
        - apps/web/hooks/**
