# The structural CI action discovers this repository-local file directly.
# Keep every non-hosted runner label explicit so runner placement remains linted
# without treating the repository's declared infrastructure as a syntax error.
self-hosted-runner:
  labels:
    - hermes
    - jovie-eph-isolation
    - jovie-ephemeral
    - jovie-fixed
    - jovie-mac
    - jovie-native-subscription
    - jovie-runner
    - jovie-runner-image-canary
    - ubicloud-standard-2
    - ubicloud-standard-8

# GitHub supports this repository's bounded production queue setting, while
# the pinned actionlint version does not yet recognize it. Keep the exception
# exact and path-scoped; every other workflow syntax check remains enforced.
paths:
  .github/workflows/source-validation.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section.*'
  .github/workflows/staging-controller.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section.*'
  .github/workflows/production-controller.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section.*'
  .github/workflows/production-marker-recovery.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section.*'
  .github/workflows/rolling-ci-dispatch.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section.*'
  .github/workflows/pr-conflict-handler.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section.*'
  # job.workflow_sha and job.workflow_repository identify the reusable
  # workflow file (September 2026). github.workflow_sha is the caller.
  # actionlint 1.7.12's job object does not include them yet. The ignore
  # is this file only; a typo of either property still fails.
  .github/workflows/production-release.yml:
    ignore:
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
