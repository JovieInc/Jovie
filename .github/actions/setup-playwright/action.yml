name: 'Setup Playwright (Chromium)'
description: 'Restores the Playwright browser cache and installs Chromium for @jovie/web'

# Chromium only, no apt-based `--with-deps`: slow font package mirrors can
# consume tight job budgets before tests run (see ci-layout-guard).
runs:
  using: 'composite'
  steps:
    - name: Verify baked Playwright prerequisites
      id: runner-prereqs
      shell: bash
      run: node .github/runner-image/verify-prerequisites.mjs --component playwright

    - name: Use baked Playwright browsers
      if: steps.runner-prereqs.outputs.playwright_warm == 'true'
      shell: bash
      run: |
        echo "PLAYWRIGHT_BROWSERS_PATH=${{ steps.runner-prereqs.outputs.playwright_browsers_path }}" >> "$GITHUB_ENV"

    # Key by the installed Playwright version, not the whole lockfile: the
    # browser build only changes with the package, and a lockfile-hashed key
    # saved one identical 260 MB entry per dependabot lockfile (9 copies on
    # 2026-10-10), crowding the 10 GB repo cache and evicting merge-group
    # workspaces mid-group.
    - name: Resolve Playwright version
      id: playwright-version
      if: steps.runner-prereqs.outputs.playwright_warm != 'true'
      shell: bash
      run: |
        version="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || true)"
        [[ -n "$version" ]] || version="lock-${{ hashFiles('pnpm-lock.yaml') }}"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright Browsers
      if: steps.runner-prereqs.outputs.playwright_warm != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-chromium-

    - name: Install Playwright (Chromium)
      if: steps.runner-prereqs.outputs.playwright_warm != 'true'
      shell: bash
      run: pnpm --filter=@jovie/web exec playwright install chromium

    - name: Name the runner image when Playwright cannot install
      if: failure()
      shell: bash
      run: |
        os_name="$(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME" || uname -sr)"
        echo "::error title=Playwright cannot install on this runner image::runner image ${ImageOS:-unknown} ${ImageVersion:-unknown} (${os_name}); runs-on may be a floating label. Pin it to a supported image such as ubuntu-24.04; see scripts/workflow-runner-pin-check.mjs."
