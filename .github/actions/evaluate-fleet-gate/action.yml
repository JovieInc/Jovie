name: Evaluate fleet gate
description: >
  One evaluate path for Fleet Gate Refresh, Queue-Deferred Release,
  merge-queue fleet-policy, and Production Controller. Runs the shipped
  gem-priority-gate CLI and writes typed outputs. Requires a prior
  checkout of gate source.

inputs:
  dry-run:
    description: >
      Pass --dry-run (do not persist latest.json). Live persist stays
      refuse-closed for placeholder/malformed receipts. Never set
      FLEET_GATE_ALLOW_LIVE_PERSIST; any nonzero spelling fails the live path.
    required: false
    default: 'false'
  consumer:
    description: Gate consumer (fleet or deployment).
    required: false
    default: fleet
  expected-sha:
    description: When set, receipt main.sha must match this exact subject.
    required: false
    default: ''
  surface:
    description: Exact affected surface for this admission decision.
    required: false
    default: fleet-control
  mutation:
    description: Exact requested mutation.
    required: false
    default: refresh-fleet-admission
  risk-lane:
    description: Exact CI risk lane from the JOV-5937 receipt.
    required: false
    default: not_applicable
  health-signals-json:
    description: Additional typed dependency observations as a JSON array.
    required: false
    default: '[]'
  github-token:
    description: Token for live GitHub observation.
    required: true

outputs:
  gate_rc:
    description: CLI exit code (0 allowed, 2 denied, unexpected fails the step).
    value: ${{ steps.evaluate.outputs.gate_rc }}
  work_allowed:
    description: workAdmission.allowed
    value: ${{ steps.evaluate.outputs.work_allowed }}
  new_issue_intake_allowed:
    description: Effective new issue intake after Summer closure and fleet gates.
    value: ${{ steps.evaluate.outputs.new_issue_intake_allowed }}
  promotion_allowed:
    description: promotionAdmission.allowed
    value: ${{ steps.evaluate.outputs.promotion_allowed }}
  deployment_allowed:
    description: deploymentAdmission.allowed
    value: ${{ steps.evaluate.outputs.deployment_allowed }}
  promotion_mode:
    description: Receipt promotionMode when present.
    value: ${{ steps.evaluate.outputs.promotion_mode }}
  mode:
    description: normal when GREEN+promotion, else receipt promotionMode or blocked.
    value: ${{ steps.evaluate.outputs.mode }}
  state:
    description: GREEN, AMBER, or RED.
    value: ${{ steps.evaluate.outputs.state }}
  receipt_age_seconds:
    description: Age of receipt.observedAt in seconds.
    value: ${{ steps.evaluate.outputs.receipt_age_seconds }}
  capacity_accepted:
    description: concurrency.gem.evidenceAccepted
    value: ${{ steps.evaluate.outputs.capacity_accepted }}
  capacity_max_concurrent:
    description: concurrency.gem.maxConcurrent
    value: ${{ steps.evaluate.outputs.capacity_max_concurrent }}
  capacity_reason:
    description: concurrency.gem.reason
    value: ${{ steps.evaluate.outputs.capacity_reason }}
  new_mutation_allowed:
    description: concurrency.gem.newMutationAllowed (new dispatch only)
    value: ${{ steps.evaluate.outputs.new_mutation_allowed }}
  receipt_path:
    description: Path to the written receipt JSON.
    value: ${{ steps.evaluate.outputs.receipt_path }}
  receipt_b64:
    description: Base64 bounded admission projection for job outputs.
    value: ${{ steps.evaluate.outputs.receipt_b64 }}

runs:
  using: composite
  steps:
    - name: Evaluate fleet gate
      id: evaluate
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GEM_PRIORITY_GATE_REPO: ${{ github.repository }}
        FLEET_GATE_DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '0' }}
        FLEET_GATE_CONSUMER: ${{ inputs.consumer }}
        FLEET_GATE_SURFACE: ${{ inputs.surface }}
        FLEET_GATE_MUTATION: ${{ inputs.mutation }}
        FLEET_GATE_RISK_LANE: ${{ inputs.risk-lane }}
        FLEET_GATE_HEALTH_SIGNALS_JSON: ${{ inputs.health-signals-json }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
      shell: bash
      run: bash scripts/fleet-gate/evaluate-fleet-gate.sh
