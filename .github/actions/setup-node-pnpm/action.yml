name: 'Setup Node.js and pnpm'
description: 'Sets up Node.js, pnpm, and installs dependencies with optimal caching'

inputs:
  package_cache:
    description: 'Enable setup-node package cache restore and post-job save'
    required: false
    default: 'true'
  reuse_merge_group_workspace:
    description: 'Require the prepared merge-group installed tree and skip dependency fetch/install'
    required: false
    default: 'false'
  save_merge_group_workspace:
    description: 'Allow the merge-group workspace producer to save the exact installed tree'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Self-hosted runners reuse a workspace whose owner can differ from the job
    # user, tripping git's dubious-ownership guard. That makes turbo's SCM probe
    # report the checkout as "not part of a Git repository" and breaks
    # `turbo --affected` (typecheck/build/unit tests). Trust the workspace so SCM
    # detection works. No-op on hosted runners. Idempotent to avoid bloating the
    # self-hosted ~/.gitconfig across runs.
    - name: Trust workspace for git (self-hosted ownership)
      shell: bash
      run: |
        # No-op when git is not in PATH (minimal self-hosted runner environments).
        # The safe.directory concern only applies when git is actually used.
        if command -v git &>/dev/null; then
          git config --global --get-all safe.directory \
            | grep -qxF "$GITHUB_WORKSPACE" \
            || git config --global --add safe.directory "$GITHUB_WORKSPACE"
        fi

    # Decide whether this image is exact before running either setup action.
    # The missing-marker path does not inspect Node or pnpm, so old images and
    # GitHub-hosted runners fall back without needing baked prerequisites.
    - name: Verify baked runner prerequisites
      id: runner-prereqs
      shell: bash
      run: node .github/runner-image/verify-prerequisites.mjs --component dependencies

    # Pin the Node 24-based v6.1 installer. v5's bundled pnpm bootstrap calls
    # deprecated url.parse() under Node 24 (run 37219316854); v6.1 bootstraps
    # through npm and then selects the repo's exact packageManager version
    # without that deprecation. v6.0.9's older bootstrap intermittently failed
    # while downgrading to pnpm 9.15.4 (run 29657049045); v6.1's refreshed
    # bootstrap installs the current 9.15.9 pin successfully. The per-job
    # install dir still prevents the two earlier
    # self-hosted pool failure modes caused by a shared persistent dest:
    #   1. default ~/setup-pnpm carried a pnpm v11 layout that crashed pinned
    #      9.15.4 ("Worker pnpm exited with code 1", run 29070623310)
    #   2. version-scoped ~/setup-pnpm-v9 raced between CONCURRENT runner
    #      processes on the same machine (shared $HOME) — ENOTEMPTY rmdir
    #      during action-setup's reinstall (job 86298003824)
    # runner.temp is per-job, so no sharing is possible; the pnpm tarball
    # re-download costs seconds. The package store stays shared and safe.
    - name: Setup pnpm
      if: steps.runner-prereqs.outputs.dependencies_warm != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        dest: ${{ runner.temp }}/setup-pnpm

    # GitHub-hosted only: restore the installed tree itself. In run
    # 36175640539 each Unit Tests shard spent 12-24s extracting the 1.3 GB
    # pnpm store and another 13-18s in `pnpm fetch` linking 3,083 packages
    # into node_modules/.pnpm. An exact node_modules hit replaces both with
    # one extract. No restore-keys: only an exact lockfile, workspace, patch,
    # .npmrc and Node pin match restores. Standard jobs still run frozen
    # install; merge-group consumers validate the prepared-tree receipt and
    # installed lockfile. Self-hosted runners never use Actions caches.
    # Bump v4 when the install command, its environment or the pruned set
    # below changes; scripts/lib/actions-cache-supersede.mjs tracks it.
    - name: Restore installed node_modules (GitHub-hosted)
      id: node-modules-cache
      if: steps.runner-prereqs.outputs.dependencies_warm != 'true' && runner.environment == 'github-hosted' && inputs.package_cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          workers/*/node_modules
        key: pnpm-node-modules-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'workers/*/package.json', 'patches/**') }}

    # setup-node's pnpm cache is GitHub-hosted only. Every self-hosted runner,
    # fixed or ephemeral, skips Actions cache restore/save. Fixed runners reuse
    # their persistent local pnpm store; ephemeral runners warm a fresh store
    # below. Do not add a separate actions/cache step here: run 29220980115
    # uploaded a 1.335 GB store at 1-1.5 MB/s until the 20-minute canary timed
    # out after all tests had passed. An exact node_modules hit needs no
    # store, so the store restore is skipped then too. merge_group skips it:
    # its post-job save cost ~16s/job and no later run can read it.
    - name: Setup Node.js with pnpm cache
      if: steps.runner-prereqs.outputs.dependencies_warm != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: ${{ runner.environment == 'github-hosted' && inputs.package_cache == 'true' && github.event_name != 'merge_group' && steps.node-modules-cache.outputs.cache-hit != 'true' && 'pnpm' || '' }}
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: Warm pnpm store
      if: steps.runner-prereqs.outputs.dependencies_warm != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true' && !(github.event_name == 'merge_group' && inputs.reuse_merge_group_workspace == 'true')
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: pnpm fetch --frozen-lockfile

    - name: Install dependencies
      if: github.event_name != 'merge_group' || inputs.reuse_merge_group_workspace != 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: |
        if [[ "${{ steps.runner-prereqs.outputs.dependencies_warm }}" == "true" ]]; then
          .github/runner-image/restore-installed-tree.sh \
            "${{ steps.runner-prereqs.outputs.installed_tree_archive_path }}" \
            "${{ steps.runner-prereqs.outputs.installed_tree_archive_sha256 }}"
        else
          pnpm install --frozen-lockfile
        fi

    # The repo's Actions cache runs over its 10 GB cap on dependabot days (12.3 GB
    # on 2026-10-10: one 1.25 GB store, one 580 MB workspace and one 260 MB
    # browser cache per distinct lockfile), so a producer's workspace can be
    # evicted before a slow consumer restores it. That ejected #21141 and #21097
    # from the queue. Rebuild the same tree from the frozen lockfile instead of
    # failing the group; `prepare` then `validate` keep the receipt contract.
    - name: Require prepared merge-group workspace
      if: github.event_name == 'merge_group' && inputs.reuse_merge_group_workspace == 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: |
        if [[ "${{ runner.environment }}" != 'github-hosted' ]]; then
          echo "::error::Prepared merge-group dependency workspace was not restored."
          exit 1
        fi
        if [[ "${{ steps.node-modules-cache.outputs.cache-hit }}" != 'true' ]]; then
          echo "::warning::Prepared merge-group dependency workspace was not restored (cache evicted); installing the frozen lockfile instead."
          pnpm fetch --frozen-lockfile
          pnpm install --frozen-lockfile
          node scripts/lib/ci-dependency-workspace.mjs prepare
        fi
        node scripts/lib/ci-dependency-workspace.mjs validate

    # app-builder-bin picks binaries by process.platform, so a Linux tree
    # never loads its mac/win copies.
    - name: Drop unloadable binaries before save
      if: >-
        runner.os == 'Linux' &&
        steps.node-modules-cache.outcome == 'success' &&
        steps.node-modules-cache.outputs.cache-hit != 'true' &&
        (github.event_name == 'push' ||
        (github.event_name == 'merge_group' && inputs.save_merge_group_workspace == 'true') ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
      shell: bash
      run: |
        cd node_modules/.pnpm
        rm -rf app-builder-bin@*/node_modules/app-builder-bin/{mac,win}
        # pnpm 9 installs musl builds too (lockfile has no libc). Glibc loaders
        # never pick them: ~630 MB raw. Keep package.json so a frozen install
        # still treats them as linked instead of refetching them on every hit.
        find . -maxdepth 1 \( -name '*-musl@*' -o -name '*linuxmusl-*@*' \) \
          -exec find {}/node_modules -type f ! -name package.json -delete \;
        # Only promptfoo's optional providers reach these native payloads
        # (@huggingface/transformers -> onnxruntime-*, codex-sdk -> codex,
        # claude-agent-sdk -> its bundled CLI), each via a lazy import(), and
        # no CI promptfoo config uses those providers: ~1.1 GB raw, ~440 MB
        # zstd. The SDK JS wrappers stay; only the payload packages hollow.
        find . -maxdepth 1 \( -name 'onnxruntime-node@*' -o -name 'onnxruntime-web@*' \
          -o -name '@openai+codex@*-linux-*' \
          -o -name '@anthropic-ai+claude-agent-sdk-linux-*' \) \
          -exec find {}/node_modules -type f ! -name package.json -delete \;

    - name: Stamp installed workspace receipt
      if: steps.runner-prereqs.outputs.dependencies_warm != 'true' && runner.environment == 'github-hosted' && inputs.package_cache == 'true' && !(github.event_name == 'merge_group' && inputs.reuse_merge_group_workspace == 'true')
      shell: bash
      run: node scripts/lib/ci-dependency-workspace.mjs prepare

    # Save right after install, before any job step can write build or test
    # output under node_modules. Same-repository pushes/PRs seed their scoped
    # caches; one merge-group producer seeds its queue ref for sibling jobs.
    - name: Save installed node_modules (GitHub-hosted)
      if: >-
        steps.node-modules-cache.outcome == 'success' &&
        steps.node-modules-cache.outputs.cache-hit != 'true' &&
        (github.event_name == 'push' ||
        (github.event_name == 'merge_group' && inputs.save_merge_group_workspace == 'true') ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          workers/*/node_modules
        key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}
