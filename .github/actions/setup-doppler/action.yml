name: 'Setup Doppler'
description: 'Install Doppler CLI without exporting secrets (Ubuntu/Debian runners only)'

runs:
  using: 'composite'
  steps:
    - name: Install Doppler CLI
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update && sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
        bash .github/scripts/install-doppler-keyring.sh \
          'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' \
          'BD8F51EC1320748CED4E6E3BDE2A7741A397C129' \
          '/usr/share/keyrings/doppler-archive-keyring.gpg'
        echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main" | sudo tee /etc/apt/sources.list.d/doppler-cli.list
        sudo apt-get update && sudo apt-get install doppler

    - name: Verify Doppler installation
      shell: bash
      run: doppler --version
