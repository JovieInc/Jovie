name: Golden Path Nightly
# clock-class: skip-if-unchanged
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: A hosted schedule dispatches the existing manual real-auth + Stripe test-mode Golden Path lane in ci.yml on main (actions: write only) and exits; ci.yml's Golden Path Report job files or resolves the fingerprinted Linear issue when that run finishes. It holds no Stripe, auth, database or deploy credentials.
# removal-trigger: Remove when Production Controller or ci.yml runs the real-auth Golden Path lane on its own clock.
#
# JOV-6920: the revenue gate must return to RED automatically. The Golden Path
# lane (signup -> claim -> live profile + checkout -> verified payment ->
# entitlement -> refund) only runs on workflow_dispatch of ci.yml, so without
# this clock a regression stays invisible until someone dispatches it by hand.
#
# Event-driven (JOV-INV-042): this workflow never waits on the dispatched run.
# The dispatched ci.yml run reports its own Golden Path result from the
# `ci-golden-path-report` job, and acquisition eligibility reads that job.

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: golden-path-nightly
  cancel-in-progress: false

jobs:
  golden-path:
    name: Dispatch the Golden Path lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_API_HOLD_BUDGET_SECONDS: '480'
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Skip when main is unchanged since a recent green Golden Path
        id: skip
        run: |
          set -euo pipefail
          main_sha="$(bash "$GITHUB_WORKSPACE/.github/scripts/gh-api-hold.sh" api "repos/$REPO/commits/main" --jq .sha)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          # Acquisition eligibility needs Golden Path proof under 48 h old, so
          # a green run on an unchanged head counts only while under 24 h old.
          fresh_after="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          last_green="$(bash "$GITHUB_WORKSPACE/.github/scripts/gh-api-hold.sh" api "repos/$REPO/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=main&status=completed&created=>=$fresh_after&per_page=20" \
            --jq '.workflow_runs[].id' | while read -r run; do
              ok="$(bash "$GITHUB_WORKSPACE/.github/scripts/gh-api-hold.sh" api "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "Golden Path (manual)" and .conclusion == "success")] | length')"
              if [ "$ok" != "0" ]; then bash "$GITHUB_WORKSPACE/.github/scripts/gh-api-hold.sh" api "repos/$REPO/actions/runs/$run" --jq .head_sha; break; fi
            done)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last_green" = "$main_sha" ]; then
            echo "Golden Path already green on $main_sha within 24 h; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the Golden Path lane
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          source scripts/lib/gh-retry.sh
          # ci.yml's Golden Path Report job reports the result when the run
          # finishes; nothing here waits on it.
          gh_retry workflow run ci.yml --repo "$REPO" --ref main

      - name: File Linear issue when the dispatch fails
        if: ${{ failure() && steps.skip.outputs.skip != 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          GOLDEN_PATH_RESULT: missing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIN_SHA: ${{ steps.skip.outputs.main_sha }}
        run: node scripts/golden-path-nightly-intake.mjs

      - name: Resolve Linear issue when main is already green
        if: ${{ steps.skip.outputs.skip == 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          GOLDEN_PATH_RESULT: success
          MAIN_SHA: ${{ steps.skip.outputs.main_sha }}
        run: node scripts/golden-path-nightly-intake.mjs
