name: Gem Producer Drift
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Ops
# necessary-trust-boundary: Read-only: the check runs on the Gem host to read its
#   local attestation file and compare it to symphony-control main; it mutates no
#   repository, runner, or host state — failure is the alarm.
# revisit-trigger: Remove when symphony-control ships a native drift alarm on
#   its own CI (the follow-up PR tracked by JOV-7223).
# JOV-7223: alarms when the Gem host's producer attestation
# (~/gem-workspace/state/gem-pr-rehabilitation-attestation.json, written by
# symphony-control scripts/symphony/install-gem-pr-rehabilitation.sh) is
# missing or its sourceRevision no longer matches symphony-control main.
# The "Activate Gem Delivery Controller" workflow that reinstalled the
# producer set was removed in #18812, so drift currently fails silently —
# this is the no-silent-failures replacement. Reinstall itself stays a
# host-side action owned by the operator.

on:
  schedule:
    # Every 6 h, not hourly: drift only appears when symphony-control main
    # advances or the Gem host install changes, neither of which sends this
    # repository an event, and reinstall is a manual host action that an hour
    # of extra latency does not change. Each tick also holds a jovie-fixed
    # slot that admission work needs.
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gem-producer-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Check producer attestation freshness
    # The attestation file lives on the Gem host disk; only that runner can read it.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 5
    steps:
      - name: Checkout main checker code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify attestation against symphony-control main
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gem-producer-drift/check-attestation.mjs --json
