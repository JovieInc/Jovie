# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: A read-only weekly digest of stuck agent PRs, retired hold labels and recent CI failures; GitHub has no native report for these, and the report only writes a job summary (no mutations).
# revisit-trigger: Remove when Summer's shipping read (company_shipping_lanes_read) or the Ovie Home ops view reports stuck agent PRs, retired hold labels and CI failures, and this report has had no reader for 30 days.
name: Agent Harness Health Report

# On-demand snapshot of open agent PRs and recent CI runs; no clock. The weekly
# run wrote only a step summary that nothing consumed, so it runs on dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: agent-harness-health-report
  cancel-in-progress: true

jobs:
  report:
    name: Generate Agent Harness Health Report
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_PATH: ${{ runner.temp }}/agent-harness-health-report.md
        run: |
          set -euo pipefail

          REPORT="$REPORT_PATH"
          NOW_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOW_SECONDS=$(date -u +%s)

          # One 100-PR GraphQL query with mergeStateStatus returned HTTP 502 (2026-10-21 run
          # 39644519804; JOV-7954). Page 25 at a time; same JSON shape as gh pr list --json.
          PRS=$(gh api graphql --paginate -F owner="${GH_REPO%%/*}" -F name="${GH_REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 25, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { number title headRefName headRefOid isDraft updatedAt mergeStateStatus
                          labels(first: 50) { nodes { name } } autoMergeRequest { enabledAt } }
                }
              }
            }' --jq '.data.repository.pullRequests.nodes[] | .labels = .labels.nodes' | jq -s '.')
          AGENT_PRS=$(echo "$PRS" | jq '[.[] | select((.headRefName | test("^(linear/|claude/|codegen-bot/|codex/)"; "i")) or (.headRefName | test("(^|/)jov-[0-9]+"; "i")))]')
          SYSTEMIC_PRS=$(gh pr list --repo "$GH_REPO" --state open --label systemic-blocker --limit 50 --json number,title,headRefName,updatedAt)
          RETIRED_HOLD_PRS=$(echo "$PRS" | jq '[.[] | select([.labels[].name] | any(. == "needs-human" or . == "needs-human-review" or . == "human-review-required" or . == "no-auto" or . == "no-auto-merge" or . == "no-automerge" or . == "needs:taste" or . == "needs-human-taste"))]')
          CI_RUNS=$(gh run list --repo "$GH_REPO" --workflow CI --status completed --limit 30 --json databaseId,conclusion,createdAt,displayTitle,event,headBranch,url)

          {
            echo "# Agent Harness Health Report"
            echo
            echo "Generated: $NOW_ISO"
            echo
            echo "## Summary"
            echo
            echo "- Open agent PRs: $(echo "$AGENT_PRS" | jq 'length')"
            echo "- Systemic blocker PRs: $(echo "$SYSTEMIC_PRS" | jq 'length')"
            echo "- Retired hold-label violations: $(echo "$RETIRED_HOLD_PRS" | jq 'length')"
            echo "- Recent failed CI runs: $(echo "$CI_RUNS" | jq '[.[] | select(.conclusion != "success")] | length')"
            echo "- Backlog: Linear is canonical. GitHub Issues are historical and are not counted here."
            echo
            echo "## Stuck Agent PRs"
            echo
            echo "| PR | Branch | Age | State | Labels |"
            echo "| --- | --- | ---: | --- | --- |"
            echo "$AGENT_PRS" | jq -r --argjson now "$NOW_SECONDS" '
              .[]
              | .ageHours = (($now - (.updatedAt | fromdateiso8601)) / 3600 | floor)
              | select(.ageHours >= 24)
              | "| #\(.number) \(.title) | `\(.headRefName)` | \(.ageHours)h | \(.mergeStateStatus // "unknown") | \([.labels[].name] | join(", ")) |"
            '
            echo
            echo "## Auto-Merge Miss Candidates"
            echo
            echo "Agent PRs with an auto-landing label but no active auto-merge request."
            echo
            echo "| PR | Branch | Merge state | Labels |"
            echo "| --- | --- | --- | --- |"
            echo "$AGENT_PRS" | jq -r '
              .[]
              | select(.isDraft == false)
              | select(.autoMergeRequest == null)
              | select([.labels[].name] | any(. == "automerge" or . == "auto-approved" or . == "ai:ready-to-merge"))
              | "| #\(.number) \(.title) | `\(.headRefName)` | \(.mergeStateStatus // "unknown") | \([.labels[].name] | join(", ")) |"
            '
            echo
            echo "## Systemic Blockers"
            echo
            echo "$SYSTEMIC_PRS" | jq -r '.[] | "- #\(.number) \(.title) (`\(.headRefName)`, updated \(.updatedAt))"' || true
            echo
            echo "## Retired Hold-Label Violations"
            echo
            echo "$RETIRED_HOLD_PRS" | jq -r '.[] | "- #\(.number) \(.title) (`\(.headRefName)`, updated \(.updatedAt)); remove: \([.labels[].name | select(. == \"needs-human\" or . == \"needs-human-review\" or . == \"human-review-required\" or . == \"no-auto\" or . == \"no-auto-merge\" or . == \"no-automerge\" or . == \"needs:taste\" or . == \"needs-human-taste\")] | join(\", \))"' || true
            echo
            echo "## Recent CI Failures"
            echo
            echo "| Run | Branch | Event | Conclusion | Created |"
            echo "| --- | --- | --- | --- | --- |"
            echo "$CI_RUNS" | jq -r '
              .[]
              | select(.conclusion != "success")
              | "| [\(.displayTitle)](\(.url)) | `\(.headBranch)` | \(.event) | \(.conclusion) | \(.createdAt) |"
            '
          } > "$REPORT"

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-harness-health-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-harness-health-report.md
          retention-days: 30
