name: Design Governance
# clock-class: skip-if-unchanged

# Standing governance reconciliation. Reuses one weekly scheduler for design and
# invariant stewardship; founder-decision, registry-change, and enforcement-failure
# events run the invariant audit immediately. Not a ci-fast / PR Ready merge gate.

on:
  push:
    branches: [main]
    paths:
      - 'canon/invariants.jsonl'
      - 'scripts/invariants/**'
      - 'apps/web/lib/ovie/generated/invariant-stewardship.current-week.json'
      - 'scripts/invariant-stewardship/**'
      - 'scripts/invariants/performance-factory.mjs'
      - 'scripts/invariants/performance-budgets.mjs'
      - 'apps/web/lib/ovie/generated/performance-invariants-v1.json'
      - 'apps/web/.lighthouserc*.json'
      - 'scripts/backlog-orchestrator/config/model-registry.json'
      - '.claude/skills/**'
      - 'skills-lock.json'
      - 'scripts/design-governance-audit.mjs'
      - 'scripts/design-governance-audit.test.mjs'
      - 'scripts/design-drift-ledger.mjs'
      - 'docs/design-system/drift-ledger.json'
      - 'docs/design-system/DRIFT_LEDGER.md'
      - '.github/workflows/design-governance.yml'
  pull_request:
    branches: [main]
    # JOV-5231: skill-plumbing PRs classify as docs-only/operations elsewhere,
    # so this workflow carries its own path filter to keep the audit a gate.
    paths:
      - '.claude/skills/**'
      - 'skills-lock.json'
      - 'scripts/design-governance-audit.mjs'
      - 'scripts/design-governance-audit.test.mjs'
      - 'scripts/design-drift-ledger.mjs'
      - 'docs/design-system/drift-ledger.json'
      - 'docs/design-system/DRIFT_LEDGER.md'
      - '.github/workflows/design-governance.yml'
  repository_dispatch:
    types: [founder-decision-recorded, invariant-enforcement-failed]
  schedule:
    # Monday 08:17 UTC, offset from the :00/:30 scheduled-suite pileup.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # One author/reconciler at a time; this does not limit Symphony coding lanes.
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'repository_dispatch' }}
    name: Design Governance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for all branches: the audit resolves a trusted base
          # via `git merge-base origin/main HEAD`, which fails on a
          # depth-1 pull_request merge-ref fetch.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install typescript for the component classifier
        # The audit transitively imports scripts/component-ship-policy.mjs,
        # which parses .tsx sources through the TypeScript compiler. Keep
        # this job install-free otherwise: extract just that one package,
        # at the spec package.json declares, into the root node_modules so
        # ESM resolution finds it.
        run: |
          set -euo pipefail
          spec=$(node -p "require('./package.json').devDependencies.typescript")
          mkdir -p node_modules/typescript
          tarball=$(npm pack "typescript@${spec}" --silent)
          tar -xzf "$tarball" -C node_modules/typescript --strip-components=1
          rm "$tarball"
          node -e "import('typescript').then(m => console.log('typescript', m.default.version))"

      - name: Run design governance audit
        id: audit
        # Pure node + git — no pnpm install. Capture the report for the
        # standing issue without failing this step.
        run: |
          set +e
          node scripts/design-governance-audit.mjs 2>&1 | tee design-governance-audit.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update standing drift issue
        if: ${{ github.event_name == 'schedule' && steps.audit.outputs.exit_code != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Design governance drift detected"
          BODY=$(cat <<EOF
          The weekly design governance audit failed.

          Run: $RUN_URL

          \`\`\`
          $(cat design-governance-audit.txt)
          \`\`\`

          Remediation: docs/design-system/GOVERNANCE.md — run \`pnpm design:governance:audit\` locally.
          EOF
          )
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == "Design governance drift detected") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated standing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "design-governance" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-governance-audit-${{ github.run_id }}
          path: design-governance-audit.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail on audit failure
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1

  invariant-stewardship:
    name: Invariant Stewardship Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Validate current-week invariant stewardship state
        # Pure node + checked-in evidence. No external API calls, database,
        # queue, credentials, or package install.
        run: node scripts/invariant-stewardship/audit.mjs | tee invariant-stewardship-audit.json

      - name: Project and audit performance invariants
        # JOV-INV-026. Receipt only; do not steal the Kimi remediator.
        run: node scripts/invariants/performance-factory.mjs | tee performance-invariants-factory.json

      - name: Upload invariant stewardship receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invariant-stewardship-${{ github.run_id }}
          path: invariant-stewardship-audit.json
          retention-days: 30
          if-no-files-found: error
