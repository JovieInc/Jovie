name: Eve Pilot

on:
  pull_request:
    paths:
      - 'apps/eve-pilot/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/eve-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'apps/eve-pilot/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/eve-pilot.yml'

permissions:
  contents: read

concurrency:
  group: eve-pilot-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify isolated Eve pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/eve-pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/eve-pilot/pnpm-lock.yaml
      # The pilot is intentionally excluded from the root workspace and owns its
      # own lockfile. Ignore the parent workspace so pnpm installs this unit's
      # dependencies instead of the monorepo root graph.
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
