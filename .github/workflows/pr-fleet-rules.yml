name: PR Fleet Rules
on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
concurrency:
  # Serialize metadata revisions for a PR; groups have independent exact-head keys.
  group: pr-fleet-rules-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  fleet:
    name: PR Fleet Rules
    runs-on: ${{ github.event_name == 'merge_group' && vars.MERGE_GATE_POOL == 'fixed' && fromJSON('["self-hosted","Linux","X64","jovie-fixed"]') || fromJSON(vars.RUNNER_CONTROL_PLANE || '"ubuntu-latest"') }}
    # 3 min of work plus bounded quota holds (FLEET_RULES_QUOTA_HOLD_SECONDS, 120s).
    timeout-minutes: 6
    steps:
      - name: Reset workspace git state (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          # Fixed runners reuse one workspace; a sparse checkout left by an earlier job hides files
          # (.nvmrc, .github/scripts) from this full checkout (PR Fleet Rules merge_group 40908938908).
          if [[ -d .git ]]; then
            git sparse-checkout disable 2>/dev/null || true
            git config --local --unset-all core.sparseCheckout 2>/dev/null || true
            git config --local --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Every workflow spends one repo-wide GITHUB_TOKEN bucket (~1,000 REST
      # calls/hour). New unbudgeted spend fails here; grandfathered sites only
      # shrink (scripts/lib/workflow-token-budget.ratchet.json).
      - name: Workflow GITHUB_TOKEN budget
        run: node scripts/workflow-token-budget-guard.mjs && node --test scripts/workflow-token-budget-guard.test.mjs
      # The policy self-test depends only on the checked-out scripts, which a
      # label or body edit cannot change (a script change arrives as opened or
      # synchronize). Label and edit events still run the verdict step below.
      - name: Test fleet policy with coverage
        if: github.event_name != 'pull_request' || contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
        run: node --test --experimental-test-coverage --test-coverage-include=scripts/pr-fleet-rules.mjs --test-coverage-lines=95 --test-coverage-functions=100 --test-coverage-branches=90 scripts/pr-fleet-rules.test.mjs
      # One evidence read prints the blast-radius warnings and enforces the
      # blocking rules. Two reads doubled this workflow's installation-budget
      # spend on every PR event. --advisory: this pull_request copy duplicates
      # the authoritative Fleet Rules Evidence verdict (CI App budget, read by
      # PR Ready), and the App key never enters a pull_request workflow. It reads
      # the PR from the event payload (files are the only API call), holds with
      # backoff up to 120s, and a quota/outage answer that outlasts that is an
      # "Infrastructure, not a verdict" warning (github-quota-deferred), never
      # red. Policy reds still fail.
      - name: Enforce receipts, red-before-green and locked areas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-fleet-rules.mjs --with-warnings --advisory
