name: PR Size Guard

# Forces small, reviewable PRs — which forces stacking. A change too big to
# review as one PR must be split into dependent PRs using native GitHub
# stacked-PR discipline (each child retargeted and rebased after its parent
# lands) or independent sibling PRs. Opt out for
# approved mechanical codemods (token sweeps, renames, generated output) with
# the `big-pr` label. Thresholds tunable via repo vars PR_MAX_LINES / PR_MAX_FILES.
# Circular shared-CI repair trains may use `integration-train`, but only with a
# machine-readable source block naming 2+ component PRs, each pinned as
# `- https://github.com/JovieInc/Jovie/pull/123 @ <40-character-head-sha>`.
# Every source path must be present in the train unless a reviewed path appears
# in the JSON `integration-train-omissions` body block. Source identity, path
# coverage, and the fixed 2500-line / 60-file cap are fail-closed in
# pr-size-guard-policy.mjs.

# PR size can only change on a source update (opened/synchronize/reopened) or
# when a draft becomes ready for review, never on a label event. This guard is
# a REQUIRED check, so re-running it on
# labeled/unlabeled is not just wasteful: rapid label churn (the autonomous
# merge loop does this constantly) cancels the in-flight run via
# cancel-in-progress, leaving a CANCELLED/QUEUED run as the latest for a
# required context → GitHub pins the PR BLOCKED even though it's green
# (JOV-3580). The same pinning hits two pull_request runs firing on the SAME
# head SHA in the same second (e.g. opened + synchronize, or a duplicate
# webhook delivery — PR #14453): they share the per-PR concurrency group, so
# cancel-in-progress kills one and the rollup can pin the CANCELLED run.
# pull_request runs therefore never cancel (cancel-in-progress is
# merge_group-only below); at ~12s per run, serializing same-PR duplicates is
# negligible. The big-pr/codemod opt-out is honored on push via the webhook
# payload (no GraphQL — avoids rate-limit flakes on bypass). When the label
# lands after a failing run,
# pr-size-guard-label-override.yml posts a passing check-run override.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Active native-queue required-context producer. Labels and policy inputs can
  # change after a source status turns green, so revalidate every member of the
  # exact synthetic group before reproducing the required context on the head.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-size-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.number }}
  # pull_request: never cancel — duplicate same-head-SHA runs must each reach
  # a terminal success/failure so the rollup cannot pin a CANCELLED run for
  # this required context (JOV-3580). merge_group stays keyed by exact head.
  cancel-in-progress: ${{ github.event_name == 'merge_group' }}

jobs:
  merge-group-size:
    name: ${{ github.event_name == 'merge_group' && 'PR Size Guard' || 'PR Size Guard (merge-group inactive)' }}
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out trusted queue policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute policy code from the synthetic PR-controlled head.
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/lib/merge-group-member-policy.mjs
            scripts/lib/pr-size-guard-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Revalidate every merge-group member's size policy
        env:
          # The synthetic head controls this workflow definition. Never expose
          # an App private key here; the read-only ephemeral token is enough.
          GH_TOKEN: ${{ github.token }}
          MAX_LINES: ${{ vars.PR_MAX_LINES || '800' }}
          MAX_FILES: ${{ vars.PR_MAX_FILES || '40' }}
        run: node scripts/lib/merge-group-member-policy.mjs --policy=size

  size:
    name: ${{ github.event_name == 'pull_request' && 'PR Size Guard' || 'PR Size Guard (source inactive)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Enforce repository hygiene
        run: node scripts/repo-hygiene-guard.mjs --diff-base "${{ github.event.pull_request.base.sha }}" --report repo-health-receipt.json

      - name: Upload repository health receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-receipt-${{ github.event.pull_request.number }}
          path: repo-health-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Agent Skill governance
        run: node scripts/skill-governance-guard.mjs

      - name: Detect screenshot integrity changes
        id: screenshot-integrity
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
            apps/web/lib/screenshots/ \
            apps/web/screenshot-catalog/current/ \
            apps/web/public/product-screenshots/ \
            'apps/web/scripts/check-screenshot-catalog*.ts'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node and pnpm for screenshot integrity
        if: steps.screenshot-integrity.outputs.required == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Enforce screenshot catalog integrity
        if: steps.screenshot-integrity.outputs.required == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/check-screenshot-catalog.ts

      - name: Enforce size cap
        # Lockfile and generated screenshot churn skip line-count review, but the
        # repository-hygiene byte/path gate above still applies.
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.ref != 'screenshots/auto-update'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MAX_LINES: ${{ vars.PR_MAX_LINES || '800' }}
          MAX_FILES: ${{ vars.PR_MAX_FILES || '40' }}
        run: |
          set -euo pipefail

          labels="$PR_LABELS"
          case ",$labels," in
            *,big-pr,*|*,codemod,*)
              echo "✅ opt-out label present — PR Size Guard skipped"; exit 0;;
          esac

          # Exclude generated / lock / snapshot / vendored noise from the count.
          EXCLUDE='pnpm-lock\.yaml|package-lock\.json|yarn\.lock|\.lock$|/generated/|\.gen\.|__snapshots__/|\.snap$|\.svg$|\.po$|/dist/|/build/|\.min\.|drizzle/migrations/meta/'
          # The GraphQL-backed `gh pr view --json files` shares an installation
          # quota with the rest of the fleet and can fail before counting a
          # two-file PR. Use the paginated REST endpoint and retry only
          # transient quota/server failures; every other error fails closed.
          api_error="$RUNNER_TEMP/pr-size-guard-api.err"
          rows=''
          for attempt in 1 2 3; do
            if rows=$(gh api --paginate \
              "repos/$REPO/pulls/$PR/files?per_page=100" \
              --jq '.[] | "\(.additions+.deletions)\t\(.filename)"' \
              2>"$api_error"); then
              break
            fi
            if [[ "$attempt" -eq 3 ]] || ! grep -qiE \
              "rate limit|HTTP 403|HTTP 429|HTTP 5[0-9][0-9]|invalid character '<'" "$api_error"; then
              cat "$api_error" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Transient GitHub REST failure (attempt $attempt/3); retrying in ${delay}s"
            sleep "$delay"
          done
          counted=$(printf '%s\n' "$rows" | grep -vE "$EXCLUDE" || true)
          lines=$(printf '%s\n' "$counted" | awk -F'\t' '{s+=$1} END{print s+0}')
          files=$(printf '%s\n' "$counted" | grep -c . || true)

          PR_LINES="$lines" PR_FILES="$files" \
            node scripts/lib/pr-size-guard-policy.mjs
