# Retired external admission writer. Exact-head intent belongs to its owner.
name: Merge Queue Auto-Enroll
on:
  workflow_dispatch:
permissions: {}
jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retired admission path
        run: |
          echo 'Retired: use scripts/writer-owned-pr-promote.sh for proof + ready + native intent.'
          echo 'Already qualified ready PRs use node scripts/native-merge-intent.mjs --repo OWNER/REPO --pr NUMBER --head SHA from persistent owner storage.'
          exit 2
