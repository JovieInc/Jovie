name: Merge Queue Auto-Enroll

# Event-driven admission plus one bounded maintenance heartbeat.
#
# Eligibility changes wake one repo-wide writer mutex. GitHub may replace an
# older pending run in that mutex, so every surviving pass also performs bounded,
# idempotent receipt recovery and stale-head remediation. This controller is
# native-only after cutover: a missing or non-native repository variable fails
# closed before any queue/rebase mutation. Existing labels are intent/audit
# evidence, never an alternate transport.
#
# Triggers:
#   pull_request      — exact PR label/reopen event
#   workflow_run      — CI completion (green PRs are now enrollable)
#   repository_dispatch — ownerless-recovery maintenance nudge from the existing sweeper
#   push (main)       — main moved → queued PRs may conflict or get stale
#   schedule          — liveness heartbeat; no unique maintenance authority
#   workflow_dispatch — maintenance-only unless exact PR + head are supplied
#
# Two jobs run (not at the same time — concurrency group serializes):
#   enroll    — classify open PRs, enroll the event-scoped exact head plus at
#               most one bounded missed-admission recovery head,
#               dequeue broken ones,
#               flag conflicts for the fix agent (no pytest/Python setup;
#               drain regression tests run in CI Structural Contract instead)
#   rebase    — refresh or escalate exact stale agent PR heads
#
# GH-13630 scope boundary: pr-conflict-handler debounce + lighter model are
# follow-ups — handler lacks a durable "recently resolved" marker contract.
#
# GitHub concurrency retains only one pending run, so any newer event can
# replace a pending CI-completion or cron event. Every surviving run therefore
# consumes bounded exact bot-authored hold/controller receipts and remediates at
# most two stale heads. In a clean-admitting fleet mode it also reconciles at
# most two otherwise-eligible same-repository heads.
# Every candidate still crosses the same fresh-check, exact-head, and native
# positioned-readback gates; this is eventual event repair, not a bulk queue.

on:
  pull_request:
    # `ready_for_review` starts a fresh CI run. New admission must wait for its
    # completed CI workflow_run; otherwise GitHub legitimately cannot prove a
    # native queue entry while required checks are pending.
    types: [reopened, labeled, unlabeled]
  workflow_run:
    workflows: ['CI', 'Production Controller']
    types: [completed]
  repository_dispatch:
    types: [ownerless-recovery-admission]
  push:
    branches: [main]
  schedule:
    # Offset from both the hour boundary and Ownerless Recovery's :07 cadence.
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional exact PR number to admit; omit for maintenance-only'
        required: false
        type: string
      head_sha:
        description: 'Required exact 40-character head SHA when pr_number is set'
        required: false
        type: string

concurrency:
  group: merge-queue-drain-mutex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fleet-policy:
    name: Resolve fleet promotion policy
    # The checked-in controller evaluates a fresh receipt on Gem, where the
    # canonical integrity and Symphony state live. Unknown/unavailable evidence
    # produces no new admission; this is not a second queue or mutator.
    # The same exact-main evaluation also persists the canonical receipt under
    # the gate's one-writer lock so /home/timwhite/gem-workspace/state/
    # gem-priority-gate/latest.json never depends on the disabled Gem PR drain.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 5
    outputs:
      main_sha: ${{ steps.main-head.outputs.sha }}
      mode: ${{ steps.policy.outputs.promotion_mode }}
      receipt_b64: ${{ steps.policy.outputs.receipt_b64 }}
    steps:
      - name: Generate read-only Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Checkout canonical main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve immutable main policy head
        id: main-head
        shell: bash
        run: |
          main_sha="$(git rev-parse HEAD)"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout HEAD is not an exact lowercase commit SHA" >&2
            exit 2
          fi
          echo "sha=$main_sha" >>"$GITHUB_OUTPUT"
      - name: Evaluate fresh fleet policy
        id: policy
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: 'false'
          expected-sha: ${{ steps.main-head.outputs.sha }}

  enroll:
    needs: fleet-policy
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion != 'cancelled' &&
        (
          github.event.workflow_run.path == '.github/workflows/production-controller.yml' ||
          startsWith(github.event.workflow_run.path, '.github/workflows/production-controller.yml@') ||
          github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'merge_group'
        )
      )
    # API-only fleet controller. ubuntu-latest deterministically includes gh;
    # the heterogeneous self-hosted fast pool does not.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: write
      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fleet-policy.outputs.main_sha }}
          persist-credentials: false
      - name: Verify GitHub CLI
        run: gh --version
      - name: Resolve exact admission scope
        id: admission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR: ${{ inputs.pr_number || '' }}
          MANUAL_HEAD: ${{ inputs.head_sha || '' }}
          FLEET_POLICY_MAIN_SHA: ${{ needs.fleet-policy.outputs.main_sha }}
        run: |
          pr_number=''
          head_sha=''
          # A pending cron can be replaced by any newer event in this mutex.
          # Maintenance authority therefore belongs to every surviving pass;
          # exact receipt provenance, live gates, caps, and idempotent readback
          # keep this continuous without creating another writer.
          recover_holds=1
          recover_controller_failures=1
          deferred_release=0
          reconcile_queue_reentry=0

          case "$EVENT_NAME" in
            pull_request)
              base_ref="$(jq -er '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
              if [[ "$base_ref" == "main" ]]; then
                pr_number="$(jq -er '.pull_request.number | tostring' "$GITHUB_EVENT_PATH")"
                head_sha="$(jq -er '.pull_request.head.sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
                # A `queue-deferred` unlabeled event is special only when the
                # canonical Jovie App actor emitted it. The drain still reads
                # a fresh exact-head controller release receipt before native
                # enrollment; this event discriminator merely prevents a
                # manual/untrusted label mutation from selecting that path.
                if jq -e '
                  .action == "unlabeled" and
                  .label.name == "queue-deferred" and
                  .sender.login == "jovie-bot[bot]"
                ' "$GITHUB_EVENT_PATH" >/dev/null; then
                  deferred_release=1
                fi
              else
                echo "PR targets $base_ref, not main; maintenance-only"
              fi
              ;;
            workflow_run)
              head_sha="$(jq -er '.workflow_run.head_sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              workflow_path="$(jq -er '.workflow_run.path | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH")"
              workflow_path="${workflow_path%%@*}"
              workflow_conclusion="$(jq -er '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")"
              if [[ "$workflow_path" == ".github/workflows/production-controller.yml" ]]; then
                echo "Production Controller completed; maintenance-only exact fleet-hold recovery signal"
                head_sha=''
              else
                prs_json="$(gh pr list -R "$REPO" --state open --limit 200 --json number,headRefOid,baseRefName)"
                matching_prs=()
                while IFS= read -r matching_pr; do
                  [[ -n "$matching_pr" ]] && matching_prs+=("$matching_pr")
                done < <(jq -r --arg head "$head_sha" '
                  .[]
                  | select(.baseRefName == "main")
                  | select(((.headRefOid // "") | ascii_downcase) == $head)
                  | .number
                ' <<<"$prs_json")
                if [[ "${#matching_prs[@]}" -eq 1 ]]; then
                  pr_number="${matching_prs[0]}"
                else
                  echo "No unique open main PR owns workflow_run head $head_sha; maintenance-only"
                  # A merge-group CI run carries GitHub's synthetic composite
                  # SHA, so no source PR can own it. This is the sole event
                  # that may reconcile prior bot-authored exact-head native
                  # admission receipts; the drain revalidates all live gates
                  # and admits at most a tiny bounded cohort.
                  if [[ "$workflow_path" == ".github/workflows/ci.yml" \
                    && "$(jq -r '.workflow_run.event // empty' "$GITHUB_EVENT_PATH")" == "merge_group" \
                    && "$workflow_conclusion" == "success" ]]; then
                    reconcile_queue_reentry=1
                    echo 'Composite merge-group CI completed; bounded exact-head re-entry recovery enabled'
                  fi
                  head_sha=''
                fi
              fi
              ;;
            workflow_dispatch)
              if [[ -z "$MANUAL_PR" && -z "$MANUAL_HEAD" ]]; then
                echo 'Untargeted manual dispatch; no primary target (bounded reconciliation remains enabled)'
              elif [[ "$MANUAL_PR" =~ ^[1-9][0-9]*$ && "${MANUAL_HEAD,,}" =~ ^[0-9a-f]{40}$ ]]; then
                pr_number="$MANUAL_PR"
                head_sha="${MANUAL_HEAD,,}"
              else
                echo '::error::Targeted manual admission requires pr_number and an exact 40-character head_sha' >&2
                exit 2
              fi
              ;;
            repository_dispatch)
              sender="$(jq -er '.sender.login' "$GITHUB_EVENT_PATH")"
              pr_number="$(jq -er '.client_payload.pr_number | tostring | select(test("^[1-9][0-9]*$"))' "$GITHUB_EVENT_PATH")"
              head_sha="$(jq -er '.client_payload.head_sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              payload_main_sha="$(jq -r '(.client_payload.main_sha // empty) | strings | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              payload_ownerless_since="$(jq -r '(.client_payload.ownerless_since // empty) | strings | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' "$GITHUB_EVENT_PATH")"
              if [[ "$sender" != 'jovie-bot[bot]' ]]; then
                echo "::error::Ownerless recovery admission requires the Jovie Bot sender" >&2
                exit 2
              fi
              if [[ "$payload_main_sha" == "$FLEET_POLICY_MAIN_SHA" && -n "$payload_ownerless_since" ]]; then
                echo "Ownerless recovery nudge for #$pr_number at $head_sha on main $payload_main_sha; maintenance-only"
              else
                echo "Ownerless recovery nudge is malformed or not bound to immutable main; maintenance-only"
              fi
              # Ownerless eligibility can change without moving the head. Do
              # not turn this asynchronous event into exact-PR admission
              # authority. The sweeper may ready a narrowly proven draft, but
              # all queue admission flows through the controller's fresh,
              # bounded same-repository reconciliation below.
              pr_number=''
              head_sha=''
              ;;
            push)
              echo 'Main push; no primary target (bounded reconciliation remains enabled)'
              ;;
            schedule)
              echo 'Scheduled maintenance; bounded receipt and lost-event reconciliation only'
              ;;
            *)
              echo "::error::Unsupported admission event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "recover_holds=$recover_holds"
            echo "recover_controller_failures=$recover_controller_failures"
            echo "deferred_release=$deferred_release"
            echo "reconcile_queue_reentry=$reconcile_queue_reentry"
          } >>"$GITHUB_OUTPUT"
      - name: Enroll clean PRs
        id: drain
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GH_RETRY_ATTEMPTS: 8
          GH_RETRY_MAX_DELAY: 60
          MERGE_QUEUE_BACKEND: ${{ vars.MERGE_QUEUE_BACKEND }}
          DRAIN_MUTATION_AUTHORIZATION: merge-queue-autoenroll
          MERGE_QUEUE_NATIVE_AUTHORIZATION: merge-queue-autoenroll
          # Primary admission is event-scoped and pinned to the triggering
          # published head. A surviving mutex owner may additionally recover a
          # tiny exact-green cohort when GitHub replaced an older pending event;
          # this is never an unbounded clean-backlog sweep.
          DRAIN_ADMISSION_PR: ${{ steps.admission.outputs.pr_number }}
          DRAIN_ADMISSION_HEAD: ${{ steps.admission.outputs.head_sha }}
          # A Jovie Bot queue-deferred release can proceed through the narrow
          # exact-head fallback while Gem's *observation endpoint* is down.
          # The shared Bash pre-enqueue guard requires the bot-authored typed
          # release receipt plus green source/main/production evidence. It is
          # not a general AMBER admission path.
          DRAIN_PROMOTION_MODE: ${{ steps.admission.outputs.deferred_release == '1' && 'deferred-release-only' || needs.fleet-policy.outputs.mode }}
          DRAIN_FLEET_GATE_B64: ${{ needs.fleet-policy.outputs.receipt_b64 }}
          DRAIN_EXPECTED_MAIN_SHA: ${{ needs.fleet-policy.outputs.main_sha }}
          DRAIN_RECOVER_FLEET_HOLDS: ${{ steps.admission.outputs.recover_holds == '1' && contains(fromJSON('["normal","hold-intake"]'), needs.fleet-policy.outputs.mode) && '1' || '0' }}
          DRAIN_FLEET_HOLD_RECOVERY_MAX_PER_RUN: '2'
          DRAIN_RECOVER_CONTROLLER_FAILURES: ${{ steps.admission.outputs.recover_controller_failures == '1' && contains(fromJSON('["normal","hold-intake"]'), needs.fleet-policy.outputs.mode) && '1' || '0' }}
          DRAIN_CONTROLLER_RECOVERY_MAX_PER_RUN: '2'
          # Composite CI heads cannot map to source PRs. The drain consumes
          # only bot-authored exact-head native-admission receipts, with fresh
          # checks and the shared total cap below; it is never a global sweep.
          DRAIN_RECONCILE_QUEUE_REENTRY: ${{ needs.fleet-policy.outputs.mode == 'normal' && steps.admission.outputs.reconcile_queue_reentry == '1' && '1' || '0' }}
          # GitHub's single pending slot can replace an exact CI admission event
          # even with cancel-in-progress=false. Reconcile only in the same fleet
          # modes that already permit clean exact-head admission, sharing the
          # total cap below with the event-scoped candidate and native re-entry.
          DRAIN_RECONCILE_MISSED_ADMISSION: ${{ steps.admission.outputs.deferred_release != '1' && (needs.fleet-policy.outputs.mode == 'normal' || needs.fleet-policy.outputs.mode == 'hold-intake') && '1' || '0' }}
          DRAIN_QUEUE_REENTRY_MAX_PER_RUN: '2'
          # `queue-deferred` has no typed provenance separating a temporary
          # pressure deferral from an explicit repair/human hold. Main-push
          # maintenance must preserve it until an owner explicitly releases it.
          DRAIN_RECONCILE_QUEUE_DEFERRED: '0'
        run: |
          if [[ "$MERGE_QUEUE_BACKEND" != "native" ]]; then
            echo "::error::Merge Queue Auto-Enroll requires MERGE_QUEUE_BACKEND=native" >&2
            exit 2
          fi
          bash scripts/drain-pr-queue.sh
      - name: Record exact-head controller outcome
        # Ownerless intents are re-emitted by the sweeper only while the PR is
        # still ownerless. Never convert a failed/stale ownerless attempt into
        # the generic replay authority consumed by scheduled controller repair.
        if: ${{ always() && !cancelled() && github.event_name != 'repository_dispatch' && steps.admission.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.admission.outputs.pr_number }}
          HEAD_SHA: ${{ steps.admission.outputs.head_sha }}
          CONTROLLER_STATE: ${{ steps.drain.outcome == 'success' && 'success' || 'failure' }}
          CONTROLLER_DESCRIPTION: ${{ steps.drain.outcome == 'success' && 'Exact-head queue controller completed' || 'Exact-head queue controller requires Gem remediation' }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$CONTROLLER_STATE" \
            -f context="jovie-gem-queue-remediation/v1/pr-$PR_NUMBER" \
            -f description="PR #$PR_NUMBER: $CONTROLLER_DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

  fleet-policy-failure-receipt:
    name: Record unavailable fleet-policy receipt
    needs: fleet-policy
    if: >-
      always() &&
      !cancelled() &&
      needs.fleet-policy.result != 'success' &&
      github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate receipt-only Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write
      - name: Record exact-head fleet-policy failure receipt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR: ${{ inputs.pr_number || '' }}
          MANUAL_HEAD: ${{ inputs.head_sha || '' }}
        run: |
          pr_number=''
          head_sha=''
          case "$EVENT_NAME" in
            pull_request)
              if [[ "$(jq -er '.pull_request.base.ref' "$GITHUB_EVENT_PATH")" == 'main' ]]; then
                pr_number="$(jq -er '.pull_request.number | tostring' "$GITHUB_EVENT_PATH")"
                head_sha="$(jq -er '.pull_request.head.sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              fi
              ;;
            workflow_run)
              workflow_path="$(jq -er '.workflow_run.path | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH")"
              workflow_path="${workflow_path%%@*}"
              workflow_event="$(jq -r '.workflow_run.event // empty' "$GITHUB_EVENT_PATH")"
              workflow_conclusion="$(jq -r '.workflow_run.conclusion // empty' "$GITHUB_EVENT_PATH")"
              if [[ "$workflow_path" == '.github/workflows/ci.yml' \
                && "$workflow_conclusion" != 'cancelled' \
                && "$workflow_event" =~ ^(pull_request|push|merge_group)$ ]]; then
                head_sha="$(jq -er '.workflow_run.head_sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
                pulls="$(gh api --paginate --slurp \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/$REPO/pulls?state=open&base=main&per_page=100")"
                pr_number="$(jq -r --arg head "$head_sha" '
                  [.[][] | select(((.head.sha // "") | ascii_downcase) == $head)]
                  | if length == 1 then (.[0].number | tostring) else empty end
                ' <<<"$pulls")"
              fi
              ;;
            workflow_dispatch)
              if [[ "$MANUAL_PR" =~ ^[1-9][0-9]*$ && "${MANUAL_HEAD,,}" =~ ^[0-9a-f]{40}$ ]]; then
                pr_number="$MANUAL_PR"
                head_sha="${MANUAL_HEAD,,}"
              fi
              ;;
          esac

          if [[ -z "$pr_number" || -z "$head_sha" ]]; then
            echo 'Fleet policy failed without one exact admission target; no PR-scoped receipt'
            exit 0
          fi
          current="$(gh pr view "$pr_number" -R "$REPO" --json state,baseRefName,headRefOid)"
          if ! jq -e --arg head "$head_sha" '
            .state == "OPEN" and .baseRefName == "main" and
            ((.headRefOid // "") | ascii_downcase) == $head
          ' <<<"$current" >/dev/null; then
            echo "Exact target #$pr_number@$head_sha changed before failure receipt; no write"
            exit 0
          fi
          gh api -X POST "repos/$REPO/statuses/$head_sha" \
            -f state=failure \
            -f context="jovie-gem-queue-remediation/v1/pr-$pr_number" \
            -f description="PR #$pr_number: Fleet promotion policy unavailable; replay required" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

  rebase:
    needs: [fleet-policy, enroll]
    if: >-
      !cancelled() &&
      needs.fleet-policy.result == 'success' &&
      needs.enroll.result == 'success' &&
      needs.fleet-policy.outputs.main_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fleet-policy.outputs.main_sha }}
          persist-credentials: false
      - name: Verify GitHub CLI
        run: gh --version
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Preflight native queue cutover
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          MERGE_QUEUE_BACKEND: ${{ vars.MERGE_QUEUE_BACKEND }}
          MERGE_QUEUE_NATIVE_AUTHORIZATION: merge-queue-autoenroll
        run: |
          if [[ "$MERGE_QUEUE_BACKEND" != "native" ]]; then
            echo "::error::Merge Queue Auto-Enroll requires MERGE_QUEUE_BACKEND=native" >&2
            exit 2
          fi
          node scripts/merge-queue-backend.mjs preflight
      - name: Refresh or escalate stale agent PR heads (Phase 2)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRAIN_REMEDIATE_APPLY: '1'
          # Every surviving mutex owner makes bounded maintenance progress, so
          # keep branch mutation far below the standalone/manual default.
          DRAIN_REMEDIATE_MAX_PER_RUN: '2'
          DRAIN_REMEDIATE_COOLDOWN_HOURS: '4'
          DRAIN_REMEDIATE_EXPECTED_MAIN_SHA: ${{ needs.fleet-policy.outputs.main_sha }}
        run: node scripts/drain-pr-remediate.mjs --apply
