name: Merge Queue Auto-Enroll

# Event-driven, with ownerless recovery admitted only after exact main/head
# validation. The existing ownerless-recovery-sweep cron remains the heartbeat.
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Shipping-Control
# necessary-trust-boundary: Ownerless recovery dispatch is admitted only after exact main/head validation by this controller.
# revisit-trigger: Revisit when native merge queue exposes durable exact-head admission for recovered PRs.
#
# Eligibility changes wake one repo-wide writer mutex. GitHub may replace an
# older pending run in that mutex, so every surviving clean-admitting pass also
# performs one bounded exact-head reconciliation. This controller is native-only after
# cutover: a missing or non-native repository variable fails closed before any
# queue/rebase mutation. Existing labels are intent/audit evidence, never an
# alternate transport.
#
# Triggers:
#   pull_request      — PR label/reopen maintenance plus native-enqueue continuation
#   workflow_run      — CI completion (green PRs are now enrollable)
#   repository_dispatch — ownerless-recovery exact-head intent from the sweeper
#   push (main)       — main moved → queued PRs may conflict or get stale
#   workflow_dispatch — maintenance-only unless exact PR + head are supplied
#
# Two jobs run (not at the same time — concurrency group serializes):
#   enroll    — classify open PRs, enroll the event-scoped exact head plus a
#               bounded missed-admission cohort under one total cap,
#               dequeue broken ones,
#               flag conflicts for the fix agent (no pytest/Python setup;
#               drain regression tests run in CI Structural Contract instead)
#   rebase    — mechanically rebase blocked agent PRs onto latest main
#
# GH-13630 scope boundary: pr-conflict-handler debounce + lighter model are
# follow-ups — handler lacks a durable "recently resolved" marker contract.
#
# No schedule. No watchdog label-cycling. No unbounded polling.

on:
  pull_request:
    # Ready transitions do not restart CI. The owning agent pairs ready with
    # native auto-merge intent; the first source CI flight remains authoritative.
    # A successful native enqueue emits `enqueued`, which advances the next
    # bounded recovery cohort after the event target proves idempotently
    # already queued.
    types: [reopened, labeled, unlabeled, enqueued]
  workflow_run:
    workflows: ['CI', 'Production Controller']
    types: [completed]
  repository_dispatch:
    types: [ownerless-recovery-admission]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional exact PR number to admit; omit for maintenance-only'
        required: false
        type: string
      head_sha:
        description: 'Required exact 40-character head SHA when pr_number is set'
        required: false
        type: string

concurrency:
  group: merge-queue-drain-mutex
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write

jobs:
  fleet-policy:
    name: Resolve fleet promotion policy
    # The checked-in controller evaluates a fresh receipt on Gem, where the
    # canonical integrity and Symphony state live. Unknown/unavailable evidence
    # produces no new admission; this is not a second queue or mutator.
    # The same exact-main evaluation also persists the canonical receipt under
    # the gate's one-writer lock so /home/timwhite/gem-workspace/state/
    # gem-priority-gate/latest.json never depends on the disabled Gem PR drain.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.policy.outputs.promotion_mode }}
      receipt_b64: ${{ steps.policy.outputs.receipt_b64 }}
      main_sha: ${{ steps.main-head.outputs.sha }}
    steps:
      - name: Checkout canonical main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve immutable main policy head
        id: main-head
        shell: bash
        run: |
          main_sha="$(git rev-parse HEAD)"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid main policy SHA: $main_sha" >&2
            exit 2
          fi
          echo "sha=$main_sha" >>"$GITHUB_OUTPUT"
      - name: Evaluate fresh fleet policy
        id: policy
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ github.token }}
          dry-run: 'false'
          expected-sha: ${{ steps.main-head.outputs.sha }}

  enroll:
    needs: fleet-policy
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion != 'cancelled' &&
        (
          github.event.workflow_run.path == '.github/workflows/production-controller.yml' ||
          startsWith(github.event.workflow_run.path, '.github/workflows/production-controller.yml@') ||
          github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'merge_group'
        )
      )
    # API-only fleet controller. ubuntu-latest deterministically includes gh;
    # the heterogeneous self-hosted fast pool does not.
    runs-on: ubuntu-latest
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ref: main is resolved once in fleet-policy; consumers pin that SHA.
          ref: ${{ needs.fleet-policy.outputs.main_sha }}
          persist-credentials: false
      - name: Verify GitHub CLI
        run: gh --version
      - name: Resolve exact admission scope
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR: ${{ inputs.pr_number || '' }}
          MANUAL_HEAD: ${{ inputs.head_sha || '' }}
          FLEET_POLICY_MAIN_SHA: ${{ needs.fleet-policy.outputs.main_sha }}
        run: |
          pr_number=''
          head_sha=''
          recover_holds=0
          deferred_release=0
          reconcile_queue_reentry=0
          admission_disposition='neutral'
          admission_reason='event-maintenance'

          case "$EVENT_NAME" in
            pull_request)
              base_ref="$(jq -er '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
              if [[ "$base_ref" == "main" ]]; then
                pr_number="$(jq -er '.pull_request.number | tostring' "$GITHUB_EVENT_PATH")"
                head_sha="$(jq -er '.pull_request.head.sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
                admission_disposition='candidate'
                admission_reason='pull-request-exact-head'
                # A `queue-deferred` unlabeled event is special only when the
                # canonical Jovie App actor emitted it. The drain still reads
                # a fresh exact-head controller release receipt before native
                # enrollment; this event discriminator merely prevents a
                # manual/untrusted label mutation from selecting that path.
                if jq -e '
                  .action == "unlabeled" and
                  .label.name == "queue-deferred" and
                  .sender.login == "jovie-bot[bot]"
                ' "$GITHUB_EVENT_PATH" >/dev/null; then
                  deferred_release=1
                fi
              else
                echo "PR targets $base_ref, not main; maintenance-only"
                admission_reason='non-main-base'
              fi
              ;;
            workflow_run)
              head_sha="$(jq -er '.workflow_run.head_sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              workflow_path="$(jq -er '.workflow_run.path | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH")"
              workflow_path="${workflow_path%%@*}"
              workflow_conclusion="$(jq -r '.workflow_run.conclusion // empty' "$GITHUB_EVENT_PATH")"
              if [[ "$workflow_path" == ".github/workflows/production-controller.yml" ]]; then
                echo "Production Controller completed; maintenance-only exact fleet-hold recovery signal"
                [[ "$workflow_conclusion" == "success" ]] && recover_holds=1
                admission_reason='production-controller-reconcile'
                head_sha=''
              elif [[ "$workflow_path" != ".github/workflows/ci.yml" || "$workflow_conclusion" != "success" ]]; then
                echo "CI workflow_run is not a terminal success; maintenance-only"
                admission_reason='ci-not-successful'
                head_sha=''
              else
                prs_json="$(gh pr list -R "$REPO" --state open --limit 200 --json number,headRefOid,baseRefName,isDraft)"
                matching_prs=()
                while IFS= read -r matching_pr; do
                  [[ -n "$matching_pr" ]] && matching_prs+=("$matching_pr")
                done < <(jq -r --arg head "$head_sha" '
                  .[]
                  | select(.baseRefName == "main")
                  | select(((.headRefOid // "") | ascii_downcase) == $head)
                  | .number
                ' <<<"$prs_json")
                if [[ "${#matching_prs[@]}" -eq 1 ]]; then
                  live_pr="$(jq -c --argjson number "${matching_prs[0]}" '.[] | select(.number == $number)' <<<"$prs_json")"
                  if [[ "$(jq -r '.isDraft' <<<"$live_pr")" == "false" ]]; then
                    pr_number="${matching_prs[0]}"
                    admission_disposition='candidate'
                    admission_reason='ci-success-exact-head'
                  else
                    echo "PR #${matching_prs[0]} is draft; maintenance-only"
                    admission_reason='draft-ineligible'
                    head_sha=''
                  fi
                else
                  echo "No unique open main PR owns workflow_run head $head_sha; maintenance-only"
                  # A merge-group CI run carries GitHub's synthetic composite
                  # SHA, so no source PR can own it. This is the sole event
                  # that may reconcile prior bot-authored exact-head native
                  # admission receipts; the drain revalidates all live gates
                  # and admits at most a tiny bounded cohort.
                  if [[ "$workflow_path" == ".github/workflows/ci.yml" \
                    && "$(jq -r '.workflow_run.event // empty' "$GITHUB_EVENT_PATH")" == "merge_group" \
                    && "$workflow_conclusion" == "success" ]]; then
                    reconcile_queue_reentry=1
                    admission_reason='composite-merge-group'
                    echo 'Composite merge-group CI completed; bounded exact-head re-entry recovery enabled'
                  elif [[ "${#matching_prs[@]}" -eq 0 ]]; then
                    admission_reason='superseded-ref'
                  else
                    admission_reason='ambiguous-ref'
                  fi
                  head_sha=''
                fi
              fi
              ;;
            workflow_dispatch)
              if [[ -z "$MANUAL_PR" && -z "$MANUAL_HEAD" ]]; then
                echo 'Untargeted manual dispatch; no primary target (bounded reconciliation remains enabled)'
                admission_reason='manual-maintenance'
                recover_holds=1
              elif [[ "$MANUAL_PR" =~ ^[1-9][0-9]*$ && "${MANUAL_HEAD,,}" =~ ^[0-9a-f]{40}$ ]]; then
                pr_number="$MANUAL_PR"
                head_sha="${MANUAL_HEAD,,}"
                admission_disposition='candidate'
                admission_reason='manual-exact-head'
              else
                echo '::error::Targeted manual admission requires pr_number and an exact 40-character head_sha' >&2
                exit 2
              fi
              ;;
            repository_dispatch)
              sender="$(jq -er '.sender.login' "$GITHUB_EVENT_PATH")"
              pr_number="$(jq -er '.client_payload.pr_number | tostring | select(test("^[1-9][0-9]*$"))' "$GITHUB_EVENT_PATH")"
              head_sha="$(jq -er '.client_payload.head_sha | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              payload_main_sha="$(jq -r '(.client_payload.main_sha // empty) | strings | ascii_downcase | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
              payload_ownerless_since="$(jq -r '(.client_payload.ownerless_since // empty) | strings | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"))' "$GITHUB_EVENT_PATH")"
              if [[ "$sender" != 'jovie-bot[bot]' ]]; then
                echo "::error::Ownerless recovery admission requires the Jovie Bot sender" >&2
                exit 2
              fi
              if [[ "$payload_main_sha" == "$FLEET_POLICY_MAIN_SHA" && -n "$payload_ownerless_since" ]]; then
                echo "Ownerless recovery exact admission for #$pr_number at $head_sha on main $payload_main_sha"
                admission_disposition='candidate'
                admission_reason='ownerless-recovery-exact-head'
                recover_holds=1
              else
                echo "Ownerless recovery nudge is malformed or not bound to immutable main; maintenance-only"
                pr_number=''
                head_sha=''
              fi
              ;;
            push)
              echo 'Main push; no primary target (bounded reconciliation remains enabled)'
              admission_reason='main-push-reconcile'
              recover_holds=1
              ;;
            *)
              echo "::error::Unsupported admission event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          if [[ "$admission_disposition" == 'neutral' ]]; then
            # Typed-neutral events can run bounded maintenance, but can never
            # carry an admission target into the mutating drain.
            pr_number=''
            head_sha=''
          elif [[ "$admission_disposition" != 'candidate' || -z "$pr_number" || -z "$head_sha" ]]; then
            echo "::error::Invalid admission scope: disposition=$admission_disposition reason=$admission_reason" >&2
            exit 2
          fi

          {
            echo "disposition=$admission_disposition"
            echo "reason=$admission_reason"
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "recover_holds=$recover_holds"
            echo "deferred_release=$deferred_release"
            echo "reconcile_queue_reentry=$reconcile_queue_reentry"
          } >>"$GITHUB_OUTPUT"
      - name: Enroll clean PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_MUTATION_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GH_RETRY_ATTEMPTS: 8
          GH_RETRY_MAX_DELAY: 60
          GH_INVENTORY_RETRY_ATTEMPTS: 3
          GH_INVENTORY_RETRY_MAX_DELAY: 15
          MERGE_QUEUE_BACKEND: ${{ vars.MERGE_QUEUE_BACKEND }}
          DRAIN_MUTATION_AUTHORIZATION: merge-queue-autoenroll
          MERGE_QUEUE_NATIVE_AUTHORIZATION: merge-queue-autoenroll
          # Primary admission is event-scoped and pinned to the triggering
          # published head. A surviving mutex owner may additionally recover a
          # tiny exact-green cohort when GitHub replaced an older pending event;
          # this is never an unbounded clean-backlog sweep.
          DRAIN_ADMISSION_PR: ${{ steps.admission.outputs.disposition == 'candidate' && steps.admission.outputs.pr_number || '' }}
          DRAIN_ADMISSION_HEAD: ${{ steps.admission.outputs.disposition == 'candidate' && steps.admission.outputs.head_sha || '' }}
          # A Jovie Bot queue-deferred release can proceed through the narrow
          # exact-head fallback while Gem's *observation endpoint* is down.
          # The shared Bash pre-enqueue guard requires the bot-authored typed
          # release receipt plus green source/main/production evidence. It is
          # not a general AMBER admission path.
          # Live #16211: jovie-bot unlabeled queue-deferred, this chose
          # deferred-release-only, and hold-intake fleet refused enrollment
          # ("does not authorize the exact queue-deferred release fallback")
          # while PR Ready was already green. Keep hold-intake as the AMBER
          # exact-head mode; deferred-release-only is only for when the fleet
          # policy itself is that fallback.
          DRAIN_PROMOTION_MODE: ${{ steps.admission.outputs.deferred_release == '1' && needs.fleet-policy.outputs.mode != 'hold-intake' && 'deferred-release-only' || needs.fleet-policy.outputs.mode }}
          # Bounded admission projection for isolated-only, hold-intake, draft-only, blocked.
          DRAIN_FLEET_GATE_B64: ${{ needs.fleet-policy.outputs.receipt_b64 }}
          DRAIN_RECOVER_FLEET_HOLDS: ${{ needs.fleet-policy.outputs.mode == 'normal' && steps.admission.outputs.recover_holds == '1' && '1' || '0' }}
          # Composite CI heads cannot map to source PRs. The drain consumes
          # only bot-authored exact-head native-admission receipts, with fresh
          # checks and the shared admission bound below; it is never a global sweep.
          DRAIN_RECONCILE_QUEUE_REENTRY: ${{ needs.fleet-policy.outputs.mode == 'normal' && steps.admission.outputs.reconcile_queue_reentry == '1' && '1' || '0' }}
          # GitHub's single pending slot can replace an exact CI admission event
          # even with cancel-in-progress=false. Reconcile only in the same fleet
          # modes that already permit clean exact-head admission. Admissions are
          # uncapped (0): native queue depth is the sole bound; a positive
          # integer re-caps event + recovery admissions per run.
          DRAIN_RECONCILE_MISSED_ADMISSION: ${{ steps.admission.outputs.deferred_release != '1' && (needs.fleet-policy.outputs.mode == 'normal' || needs.fleet-policy.outputs.mode == 'hold-intake' || needs.fleet-policy.outputs.mode == 'draft-only') && '1' || '0' }}
          DRAIN_QUEUE_REENTRY_MAX_PER_RUN: '0'
          # `queue-deferred` has no typed provenance separating a temporary
          # pressure deferral from an explicit repair/human hold. Main-push
          # maintenance must preserve it until an owner explicitly releases it.
          DRAIN_RECONCILE_QUEUE_DEFERRED: '0'
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          FLEET_POLICY_MAIN_SHA: ${{ needs.fleet-policy.outputs.main_sha }}
        run: |
          policy_checkout_sha="$(git rev-parse HEAD)"
          if [[ "$policy_checkout_sha" != "$FLEET_POLICY_MAIN_SHA" ]]; then
            echo "::error::Main policy checkout drifted from fleet-policy evidence ($policy_checkout_sha != $FLEET_POLICY_MAIN_SHA)" >&2
            exit 2
          fi
          if [[ "$MERGE_QUEUE_BACKEND" != "native" ]]; then
            echo "::error::Merge Queue Auto-Enroll requires MERGE_QUEUE_BACKEND=native" >&2
            exit 2
          fi
          set +e
          bash scripts/drain-pr-queue.sh
          drain_rc=$?
          set -e

          if [[ "$drain_rc" -eq 0 ]]; then
            exit 0
          fi

          # `enroll` is attached to the product PR head for pull_request events
          # and for CI-completion workflow_run events produced by pull_request.
          # Controller dispositions such as queue-noop must not paint that
          # product PR UNSTABLE; main-push/manual maintenance still fails closed.
          product_pr_check=0
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            product_pr_check=1
          elif [[ "$EVENT_NAME" == "workflow_run" && "$WORKFLOW_RUN_EVENT" == "pull_request" ]]; then
            product_pr_check=1
          fi

          if [[ "$product_pr_check" -eq 1 ]]; then
            pr_number="${DRAIN_ADMISSION_PR:-}"
            head_sha="${DRAIN_ADMISSION_HEAD:-}"
            if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Cannot emit delivery-control-failure without exact PR/head for suppressed product PR check" >&2
              exit "$drain_rc"
            fi
            failure='dropped-controller-event'
            if [[ "$drain_rc" -eq 3 ]]; then
              failure='queue-noop'
            fi
            run_url="${GITHUB_SERVER_URL:-https://github.com}/$REPO/actions/runs/$GITHUB_RUN_ID"
            payload="$(jq -cn \
              --arg source 'merge-queue-autoenroll' \
              --arg event 'suppressed-product-pr-check-failure' \
              --arg failure "$failure" \
              --arg delivery_key "merge-queue-autoenroll:${GITHUB_RUN_ID:-unknown}:${GITHUB_RUN_ATTEMPT:-unknown}:$pr_number:$head_sha:$drain_rc" \
              --arg pr_number "$pr_number" \
              --arg head_sha "$head_sha" \
              --arg exit_code "$drain_rc" \
              --arg github_event "$EVENT_NAME" \
              --arg workflow_run_event "$WORKFLOW_RUN_EVENT" \
              --arg run_id "${GITHUB_RUN_ID:-}" \
              --arg run_attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --arg run_url "$run_url" \
              '{
                event_type: "delivery-control-failure",
                client_payload: {
                  source: $source,
                  event: $event,
                  failure: $failure,
                  delivery_key: $delivery_key,
                  pr_number: ($pr_number | tonumber),
                  head_sha: $head_sha,
                  evidence: {
                    workflow: "Merge Queue Auto-Enroll",
                    exit_code: $exit_code,
                    github_event: $github_event,
                    workflow_run_event: $workflow_run_event,
                    run_id: $run_id,
                    run_attempt: $run_attempt,
                    run_url: $run_url
                  }
                }
              }')"
            gh api --method POST "repos/$REPO/dispatches" --input - <<<"$payload" >/dev/null
            echo "delivery-control-failure dispatched for $failure #$pr_number at $head_sha (exit $drain_rc)"
            if [[ "$drain_rc" -eq 3 ]]; then
              echo "queue-noop is a controller disposition, not a product-quality failure"
              exit 0
            fi
            echo "::error::dropped-controller-event fails closed (exit $drain_rc)" >&2
            exit "$drain_rc"
          fi

          exit "$drain_rc"

  rebase:
    needs: enroll
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify GitHub CLI
        run: gh --version
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Preflight native queue cutover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_QUEUE_BACKEND: ${{ vars.MERGE_QUEUE_BACKEND }}
          MERGE_QUEUE_NATIVE_AUTHORIZATION: merge-queue-autoenroll
        run: |
          if [[ "$MERGE_QUEUE_BACKEND" != "native" ]]; then
            echo "::error::Merge Queue Auto-Enroll requires MERGE_QUEUE_BACKEND=native" >&2
            exit 2
          fi
          node scripts/merge-queue-backend.mjs preflight
      - name: Rebase blocked agent PRs onto main (Phase 2)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRAIN_REMEDIATE_APPLY: '1'
          DRAIN_REMEDIATE_MAX_PER_RUN: '24'
          DRAIN_REMEDIATE_COOLDOWN_HOURS: '4'
        run: node scripts/drain-pr-remediate.mjs --apply
