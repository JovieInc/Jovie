name: Repository documentation shadow
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'coverage>=7.6,<8'
      - run: python3 -m coverage run --branch --include=scripts/repository_docs.py -m unittest discover -s tests -p test_repository_docs.py -v
      - run: python3 -m coverage report --show-missing --fail-under=100
      # Ratchet on pull requests: fail only when this PR makes the projection
      # stale or, on an already-stale base, adds drift the base does not have
      # (.github/scripts/repository-docs-ratchet.sh). Any merge that edits a
      # source without regenerating (for example a Dependabot manifest bump)
      # otherwise turns parity red on every open PR's merge ref for a change
      # none of them made. Pushes to main stay strict.
      # The event's pull_request base SHA is not refreshed when the PR head is
      # pushed, so a base drifted after it would be charged to this PR. Compare
      # against the base parent GitHub merged the checked-out merge ref onto.
      - name: Resolve merge-ref base parent
        id: parity-base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          parents="$(git cat-file commit HEAD | sed -n -e '/^$/q' -e 's/^parent //p')"
          [[ "$(wc -l <<<"$parents")" -eq 2 ]] || exit 1
          base="$(head -n1 <<<"$parents")"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check source projection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.parity-base.outputs.sha }}
        run: |
          if python3 scripts/repository_docs.py; then
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/parity-base" "$BASE_SHA"
          bash .github/scripts/repository-docs-ratchet.sh . "$RUNNER_TEMP/parity-base"
