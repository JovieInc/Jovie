name: Repository documentation shadow
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'coverage>=7.6,<8'
      - run: python3 -m coverage run --branch --include=scripts/repository_docs.py -m unittest discover -s tests -p test_repository_docs.py -v
      - run: python3 -m coverage report --show-missing --fail-under=100
      # Ratchet on pull requests: fail only when this PR makes the projection
      # stale. Any merge that edits a source without regenerating (for example a
      # Dependabot manifest bump) otherwise turns parity red on every open PR's
      # merge ref for a change none of them made. Pushes to main stay strict.
      - name: Check source projection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if python3 scripts/repository_docs.py; then
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/parity-base" "$BASE_SHA"
          if python3 scripts/repository_docs.py --root "$RUNNER_TEMP/parity-base"; then
            echo "::error::This PR makes docs/REPOSITORY_SOURCES.md stale; run: python3 scripts/repository_docs.py --write"
            exit 1
          fi
          echo "::warning::docs/REPOSITORY_SOURCES.md is already stale on the base branch; not caused by this PR"
