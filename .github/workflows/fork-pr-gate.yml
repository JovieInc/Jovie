# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Tim
# necessary-trust-boundary: fork review events lack App secrets; workflow_run executes protected-main metadata policy without consuming untrusted artifacts or code.
# revisit-trigger: remove the review signal bridge when GitHub supplies a trusted review-target metadata event with status-write permission.
# Required metadata policy runs trusted main code only. Native GitHub owns merging.
name: Fork PR Gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ['Fork PR Gate']
    types: [completed]
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: source-admission-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  review-signal:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Review metadata changed; trusted workflow_run revalidates current PR policy.'
  source-policy:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
      - name: Publish exact-head required metadata policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/source-admission-check.mjs
  merge-group-gate:
    name: ${{ github.event_name == 'merge_group' && 'Fork PR Gate' || 'Fork PR Gate (merge-group inactive)' }}
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - name: Revalidate every native group member
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/merge-group-member-policy.mjs --policy=fork
