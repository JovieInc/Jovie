name: HA CI remediator poke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Hyperagent
# necessary-trust-boundary: GitHub-hosted CI failure events on pull_request/merge_group
#   wake the Hyperagent remediator via X-Hyperagent-Webhook-Secret (HA docs;
#   ha-webhook-auth-only-v1). Timestamp/Signature HMAC headers are also sent;
#   HA ignores them and 401s only when the secret header is missing. Do not
#   send Authorization Bearer as a substitute. No self-hosted
#   runner access, no local systemd, no Symphony port pokes.
# removal-trigger: Delete when Hyperagent ingests GitHub CI workflow_run failures natively.
# idempotency-contract (JOV-5921): at most one delivered poke per PR + head SHA,
#   and at most one new remediator thread per open PR inside a 45-minute window.
#   - Workflow-level concurrency is per-PR (not PR+sha), FIFO, no cancel. Same-PR
#     storms serialize instead of racing; queued runs still hit the gate.
#   - Gate (merged/closed + commit-status receipt per sha + 45m per-PR cooldown /
#     in-flight via run-name `ha-remediate/PR<n>/`) runs before the webhook POST.
#   - Durable per-sha receipt is the commit status context `ha-ci-remediator-poke`
#     (success|pending). Do NOT use Actions `runs?head_sha=$HEAD_SHA&status=success`:
#     poke-run Actions `head_sha` is the default-branch tip that holds this file,
#     not the failing PR head, so that filter stays ~0.
#   - `force: true` on workflow_dispatch is the only bounded-retry escape hatch.
#   - HTTP 202 is accepted only for delivery. When its documented JSON body is
#     valid (`{runId:string,status:"accepted"}`), persist that exact runId and
#     the SHA-256 fingerprint of the exact sent payload in the existing receipt.
#     Missing or malformed 202 bodies remain pending/unknown; they never invent
#     an identifier or unlock a retry. Non-202 retains the existing failure receipt.
# FX canary overlap guard: while the existing hosted-FX single-PR canary is
# enabled, suppress HA for that PR (including forced dispatches). Keep
# merge_group deliveries on the existing HA lane: FX only accepts source-PR CI.
run-name: ha-remediate/PR${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'na' }}/${{ github.event.workflow_run.head_sha || github.sha }}
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
      run_url:
        type: string
      force:
        description: 'Bounded retry: poke even if a poke already succeeded for this head SHA'
        type: boolean
        default: false
permissions:
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: ha-ci-remediator-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'na' }}
  cancel-in-progress: false
jobs:
  poke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '16419') ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.pull_requests[0].number != 16419
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Gate duplicate, merged, closed, and cooldown keys
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FORCE: ${{ inputs.force || false }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PRODUCER_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          PR_ASSOCIATIONS: ${{ toJSON(github.event.workflow_run.pull_requests || fromJSON('[]')) }}
          FX_HOSTED_REMEDIATION_ENABLED: ${{ vars.FX_HOSTED_REMEDIATION_ENABLED }}
          FX_HOSTED_REMEDIATION_CANARY_PR: ${{ vars.FX_HOSTED_REMEDIATION_CANARY_PR }}
        run: |
          set -euo pipefail

          if [ "${PRODUCER_EVENT:-}" != "merge_group" ] &&
             [ "${FX_HOSTED_REMEDIATION_ENABLED:-}" = "true" ] &&
             [[ "${FX_HOSTED_REMEDIATION_CANARY_PR:-}" =~ ^[1-9][0-9]*$ ]]; then
            normalize_pr_number() {
              local value="${1:-}"
              if [[ ! "$value" =~ ^[0-9]+$ ]]; then
                return 1
              fi
              while [ "${#value}" -gt 1 ] && [ "${value:0:1}" = "0" ]; do
                value="${value#0}"
              done
              printf '%s' "$value"
            }

            canary_pr="$FX_HOSTED_REMEDIATION_CANARY_PR"
            event_pr=$(normalize_pr_number "${PR_NUMBER:-}" || true)
            if [ "$event_pr" = "$canary_pr" ]; then
              echo "::notice::PR #$canary_pr is owned by the active FX canary; suppressing the competing Hyperagent poke."
              exit 0
            fi

            if [ "$PRODUCER_EVENT" = "pull_request" ] && [ -z "$event_pr" ]; then
              if [ -z "${HEAD_REPOSITORY:-}" ]; then
                echo "::notice::The CI event has no PR association or source repository; skipping Hyperagent because FX canary ownership cannot be resolved."
                exit 0
              fi
              if [ "$HEAD_REPOSITORY" = "$REPO" ]; then
                if ! jq -e 'type == "array" and length == 0' <<<"${PR_ASSOCIATIONS:-}" >/dev/null 2>&1; then
                  echo "::notice::The same-repository CI event has a malformed or inconsistent PR association; skipping Hyperagent."
                  exit 0
                fi
                if [ -z "${HEAD_BRANCH:-}" ] || [[ ! "${HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::notice::The same-repository CI event lacks a valid source branch or head SHA; skipping Hyperagent."
                  exit 0
                fi

                repo_owner="${REPO%%/*}"
                branch_pr_candidates=$(gh api "repos/$REPO/pulls" --method GET \
                  -f state=open -f head="$repo_owner:$HEAD_BRANCH" -f per_page=100)
                if ! jq -e --arg repository "$REPO" --arg branch "$HEAD_BRANCH" --arg head "$HEAD_SHA" '
                  type == "array" and length == 1 and
                  (.[0].number | type == "number" and . > 0) and
                  .[0].state == "open" and
                  .[0].head.ref == $branch and .[0].head.sha == $head and
                  .[0].head.repo.full_name == $repository and
                  .[0].base.repo.full_name == $repository
                ' <<<"$branch_pr_candidates" >/dev/null 2>&1; then
                  echo "::notice::The same-repository CI branch does not resolve to one current open exact-head PR; skipping Hyperagent."
                  exit 0
                fi

                event_pr=$(jq -r '.[0].number' <<<"$branch_pr_candidates")
                if [ "$event_pr" = "$canary_pr" ]; then
                  echo "::notice::PR #$canary_pr is owned by the active FX canary; suppressing the competing Hyperagent poke."
                  exit 0
                fi
                echo "::notice::Resolved the empty CI PR association to current same-repository PR #$event_pr by exact head branch and SHA."
              fi
            fi
          fi

          if [ -n "${PR_NUMBER:-}" ]; then
            pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
            merged=$(jq -r '.merged' <<<"$pr_json")
            state=$(jq -r '.state' <<<"$pr_json")
            if [ "$merged" = "true" ] || [ "$state" != "open" ]; then
              echo "::notice::PR #$PR_NUMBER is $state (merged=$merged); remediation key is terminal. Skipping poke."
              exit 0
            fi
          fi

          if [ "${FORCE:-false}" != "true" ]; then
            if [ -n "${HEAD_SHA:-}" ]; then
              receipt_hits=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" \
                | jq '[.[] | select(.context == "ha-ci-remediator-poke" and (.state == "success" or .state == "pending"))] | length')
              if [ "${receipt_hits:-0}" -gt 0 ]; then
                echo "::notice::already delivered/in-flight for this head SHA ($HEAD_SHA). Skipping poke."
                exit 0
              fi
            fi

            if [ -n "${PR_NUMBER:-}" ]; then
              now_epoch=$(date -u +%s)
              cooldown_hits=$(gh api "repos/$REPO/actions/workflows/ha-ci-remediator-poke.yml/runs?per_page=30" \
                | jq --arg prefix "ha-remediate/PR${PR_NUMBER}/" --argjson run_id "${RUN_ID:-0}" --argjson now "$now_epoch" '
                  [
                    .workflow_runs[]
                    | select((.id | tonumber) != $run_id)
                    | select((.display_title // "") | startswith($prefix))
                    | select(
                        (.status == "in_progress" or .status == "queued")
                        or (
                          .status == "completed"
                          and ((.created_at | fromdateiso8601) as $created | ($now - $created) <= 2700)
                        )
                      )
                  ] | length
                ')
              if [ "${cooldown_hits:-0}" -gt 0 ]; then
                echo "::notice::remediator already poked for this PR within cooldown / in flight. Skipping poke."
                exit 0
              fi
            fi
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Poke Hyperagent CI remediator
        if: steps.gate.outputs.proceed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.HYPERAGENT_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HYPERAGENT_CI_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || inputs.run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_SECRET:-}" ]; then
            echo "::error::HYPERAGENT_CI_WEBHOOK_URL and HYPERAGENT_CI_WEBHOOK_SECRET are required. Refusing an unauthenticated Hyperagent poke (ha-webhook-auth-only-v1)."
            exit 1
          fi

          write_receipt() {
            local state="$1"
            local desc="$2"
            if [ -z "${HEAD_SHA:-}" ]; then
              return 0
            fi
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$state" \
              -f context=ha-ci-remediator-poke \
              -f description="$desc" \
              -f target_url="$RUN_URL"
          }

          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            --arg event "$EVENT" \
            --arg idempotency_key "ha-ci-remediator:${REPO}:PR${PR_NUMBER}:${HEAD_SHA}" \
            '{repository: $repo, pr_number: ($pr_number | tonumber? // null), head_sha: $head_sha, run_url: $run_url, event: $event, source: "ha-ci-remediator-poke", idempotency_key: $idempotency_key}')

          # GitHub commit-status descriptions are capped at 140 characters.
          # Keep the full payload digest and accept only run IDs short enough
          # to persist losslessly; never truncate a provider identifier.
          payload_fingerprint=$(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)
          write_receipt pending "ha-receipt pending fp=$payload_fingerprint"

          timestamp=$(date -u +%s)
          signature=$(printf '%s.%s' "$timestamp" "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)

          http_code=$(curl -sS -o /tmp/hyperagent-response -w '%{http_code}' \
            -X POST --max-time 5 \
            -H 'Content-Type: application/json' \
            -H "X-Hyperagent-Webhook-Secret: $WEBHOOK_SECRET" \
            -H "X-Hyperagent-Webhook-Timestamp: $timestamp" \
            -H "X-Hyperagent-Webhook-Signature: sha256=$signature" \
            -d "$payload" \
            "$WEBHOOK_URL")

          if [ "$http_code" != "202" ]; then
            echo "::error::Hyperagent CI webhook returned HTTP $http_code (expected 202). Response:"
            cat /tmp/hyperagent-response
            write_receipt failure "ha-receipt failed http=$http_code fp=$payload_fingerprint" || true
            exit 1
          fi

          response_run_id=""
          # Validate the provider string before jq -r extraction. The shell
          # command substitution strips trailing newlines and NULs, so accepting
          # them here would persist an altered runId rather than the response.
          if jq -e \
            'type == "object" and .status == "accepted" and (.runId | type == "string") and ((.runId | length) > 0) and ((.runId | length) <= 48) and ((.runId | test("[^A-Za-z0-9._:/-]") | not))' \
            /tmp/hyperagent-response >/dev/null 2>&1; then
            response_run_id=$(jq -r '.runId' /tmp/hyperagent-response)
          fi

          run_id_valid=true
          if [ -z "$response_run_id" ] || [ "${#response_run_id}" -gt 48 ]; then
            run_id_valid=false
          else
            case "$response_run_id" in
              *[!A-Za-z0-9._:/-]*) run_id_valid=false ;;
            esac
          fi
          if [ "$run_id_valid" != "true" ]; then
            echo "::warning::Hyperagent returned HTTP 202 without a bounded accepted runId; preserving the pending receipt as accepted-but-unbound/unknown."
            exit 0
          fi

          if ! write_receipt success "ha-receipt accepted run=$response_run_id fp=$payload_fingerprint"; then
            echo "::error::Failed to persist the accepted Hyperagent runId and payload fingerprint for $HEAD_SHA after HTTP 202; keeping the pending receipt and failing closed."
            exit 1
          fi

          echo "::notice::Hyperagent CI remediator poke accepted (HTTP 202); HA remediator poke delivered with provider runId; terminal outcome remains unknown."
