name: HA CI remediator poke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Hyperagent
# necessary-trust-boundary: GitHub-hosted CI failure events on pull_request/merge_group
#   wake the Hyperagent remediator via X-Hyperagent-Webhook-Secret (HA docs;
#   ha-webhook-auth-only-v1). Timestamp/Signature HMAC headers are also sent;
#   HA ignores them and 401s only when the secret header is missing. Do not
#   send Authorization Bearer as a substitute. No self-hosted
#   runner access, no local systemd, no Symphony port pokes.
# removal-trigger: Delete when Hyperagent ingests GitHub CI workflow_run failures natively.
# idempotency-contract (JOV-5921): at most one delivered poke per PR + head SHA.
#   - run-name ha-poke-<pr>-<sha> is the durable execution key in Actions history.
#   - Workflow-level concurrency serializes same-key runs (FIFO, no cancel).
#   - The gate skips when a remediator poke is already in flight, already
#     delivered, or recently poked for the same SHA; also pr/global rate-limit.
#   - Missing poke history fails closed (no POST). Cancelled/success CI never poke.
#   - Successful runs remain the durable dedup record; no external state.
#   - Gate skip reasons: ci_conclusion_ignored, excluded_pr, missing_pr_or_sha,
#     poke_history_unproven, remediator_in_flight, already_poked_sha,
#     recently_poked_sha, pr_rate_limit, global_rate_limit.
run-name: ha-poke-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'na' }}-${{ github.event.workflow_run.head_sha || github.sha }}
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
      run_url:
        type: string
      force:
        description: 'Bounded retry: poke even if a poke already succeeded for this head SHA'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: >-
    ha-ci-remediator-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'na' }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  poke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '16419') ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'success' &&
        contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.pull_requests[0].number != 16419
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Poke Hyperagent CI remediator
        env:
          WEBHOOK_URL: ${{ secrets.HYPERAGENT_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HYPERAGENT_CI_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || inputs.run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_SECRET:-}" ]; then
            echo "::error::HYPERAGENT_CI_WEBHOOK_URL and HYPERAGENT_CI_WEBHOOK_SECRET are required. Refusing an unauthenticated Hyperagent poke (ha-webhook-auth-only-v1)."
            exit 1
          fi

          if ! gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${REPO}/contents/scripts/ha-ci-remediator-poke-gate.py?ref=${GITHUB_SHA}" \
            > /tmp/ha-ci-remediator-poke-gate.py; then
            echo "::notice::Skipping Hyperagent poke; poke_history_unproven (gate script)."
            exit 0
          fi

          if ! gh api \
            "repos/${REPO}/actions/workflows/ha-ci-remediator-poke.yml/runs?per_page=100" \
            > /tmp/ha-poke-runs.json; then
            echo "::notice::Skipping Hyperagent poke; poke_history_unproven."
            exit 0
          fi

          decision_json=$(python3 /tmp/ha-ci-remediator-poke-gate.py \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --ci-conclusion "$CI_CONCLUSION" \
            --event-name "$EVENT_NAME" \
            --force "$FORCE" \
            --current-run-id "$CURRENT_RUN_ID" \
            --now-epoch "$(date -u +%s)" \
            --runs-json /tmp/ha-poke-runs.json)
          echo "$decision_json"
          decision=$(printf '%s' "$decision_json" | jq -r .decision)
          reason=$(printf '%s' "$decision_json" | jq -r .reason)
          if [ "$decision" != "poke" ]; then
            echo "::notice::Skipping Hyperagent poke; ${reason}."
            exit 0
          fi

          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            --arg event "$EVENT" \
            '{repository: $repo, pr_number: ($pr_number | tonumber? // null), head_sha: $head_sha, run_url: $run_url, event: $event, source: "ha-ci-remediator-poke"}')

          timestamp=$(date -u +%s)
          signature=$(printf '%s.%s' "$timestamp" "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)

          http_code=$(curl -sS -o /tmp/hyperagent-response -w '%{http_code}' \
            -X POST --max-time 5 \
            -H 'Content-Type: application/json' \
            -H "X-Hyperagent-Webhook-Secret: $WEBHOOK_SECRET" \
            -H "X-Hyperagent-Webhook-Timestamp: $timestamp" \
            -H "X-Hyperagent-Webhook-Signature: sha256=$signature" \
            -d "$payload" \
            "$WEBHOOK_URL")

          if [ "$http_code" != "202" ]; then
            echo "::error::Hyperagent CI webhook returned HTTP $http_code (expected 202). Response:"
            cat /tmp/hyperagent-response
            exit 1
          fi

          echo "::notice::Hyperagent CI remediator poke accepted (HTTP 202)."
