name: HA CI remediator poke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Rush
# necessary-trust-boundary: Repo webhook secret stays in GitHub Actions; Hyperagent only receives slim CI-failure JSON.
# removal-trigger: Delete when Hyperagent ingests GitHub CI workflow_run failures natively.
# idempotency-contract (JOV-5921): at most one delivered poke per PR + head SHA.
#   - Workflow-level concurrency serializes same-key runs (FIFO, no cancel), so
#     a redelivery storm can never race the gate below.
#   - The gate step fails closed: it skips the poke when the PR is merged/closed
#     or when any earlier run of this workflow already succeeded for the same
#     head SHA (a thread is in-flight or the key is terminal).
#   - `force: true` on workflow_dispatch is the only bounded-retry escape hatch;
#     the dispatch run itself is the recorded retry receipt.
#   - Successful runs are the durable dedup record (GitHub Actions run history);
#     no external state, so restarts cannot lose ownership of a key.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
      run_url:
        type: string
      force:
        description: 'Bounded retry: poke even if a poke already succeeded for this head SHA'
        type: boolean
        default: false
permissions:
  actions: read
  pull-requests: read
concurrency:
  group: >-
    ha-ci-remediator-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'na' }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  poke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '16419') ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.pull_requests[0].number != 16419
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gate duplicate, merged, and closed remediation keys
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            pr_json=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
            merged=$(jq -r '.merged' <<<"$pr_json")
            state=$(jq -r '.state' <<<"$pr_json")
            if [ "$merged" = "true" ] || [ "$state" != "open" ]; then
              echo "::notice::PR #$PR_NUMBER is $state (merged=$merged); remediation key is terminal. Skipping poke."
              exit 0
            fi
          fi
          if [ "$FORCE" != "true" ]; then
            prior=$(gh api "repos/${{ github.repository }}/actions/workflows/ha-ci-remediator-poke.yml/runs?head_sha=$HEAD_SHA&status=success&per_page=1" --jq '.total_count')
            if [ "${prior:-0}" -gt 0 ]; then
              echo "::notice::A poke already succeeded for head SHA $HEAD_SHA; one in-flight remediator per PR+SHA. Skipping duplicate."
              exit 0
            fi
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - name: Poke Hyperagent CI remediator
        if: steps.gate.outputs.proceed == 'true'
        env:
          URL: ${{ secrets.HYPERAGENT_CI_WEBHOOK_URL }}
          SECRET: ${{ secrets.HYPERAGENT_CI_WEBHOOK_SECRET }}
          PAYLOAD: ${{ format('{{"id":{0},"html_url":{1},"conclusion":{2},"head_sha":{3},"head_branch":{4},"event":{5},"pr_numbers":{6}}}', github.event.workflow_run.id || github.run_id, toJSON(github.event.workflow_run.html_url || inputs.run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)), toJSON(github.event.workflow_run.conclusion || 'failure'), toJSON(github.event.workflow_run.head_sha || github.sha), toJSON(github.event.workflow_run.head_branch || github.ref_name), toJSON(github.event.workflow_run.event || github.event_name), github.event_name == 'workflow_dispatch' && (inputs.pr_number && format('[{0}]', inputs.pr_number) || '[]') || toJSON(github.event.workflow_run.pull_requests.*.number)) }}
        run: |
          c=$(curl -fsS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-Hyperagent-Webhook-Secret: $SECRET" -d "$PAYLOAD" "$URL")
          test "$c" = 202
