name: HA CI remediator poke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Rush
# necessary-trust-boundary: Repo webhook secret stays in GitHub Actions; Hyperagent only receives slim CI-failure JSON.
# removal-trigger: Delete when Hyperagent ingests GitHub CI workflow_run failures natively.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
      run_url:
        type: string
permissions: {}
jobs:
  poke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '16419') ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.pull_requests[0].number != 16419
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          URL: ${{ secrets.HYPERAGENT_CI_WEBHOOK_URL }}
          SECRET: ${{ secrets.HYPERAGENT_CI_WEBHOOK_SECRET }}
          PAYLOAD: ${{ format('{{"id":{0},"html_url":{1},"conclusion":{2},"head_sha":{3},"head_branch":{4},"event":{5},"pr_numbers":{6}}}', github.event.workflow_run.id || github.run_id, toJSON(github.event.workflow_run.html_url || inputs.run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)), toJSON(github.event.workflow_run.conclusion || 'failure'), toJSON(github.event.workflow_run.head_sha || github.sha), toJSON(github.event.workflow_run.head_branch || github.ref_name), toJSON(github.event.workflow_run.event || github.event_name), github.event_name == 'workflow_dispatch' && (inputs.pr_number && format('[{0}]', inputs.pr_number) || '[]') || toJSON(github.event.workflow_run.pull_requests.*.number)) }}
        run: |
          c=$(curl -fsS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-Hyperagent-Webhook-Secret: $SECRET" -d "$PAYLOAD" "$URL")
          test "$c" = 202
