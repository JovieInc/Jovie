name: HA CI remediator poke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Symphony
# necessary-trust-boundary: GitHub-hosted CI failure events must wake Gem Symphony refresh plus the Grok/Kimi sidecar; Hyperagent is general product throughput, not the remediator queue.
# removal-trigger: Delete when Symphony ingests GitHub CI workflow_run failures natively without a poke hop.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
      run_url:
        type: string
permissions: {}
jobs:
  poke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '16419') ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.pull_requests[0].number != 16419
      )
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 2
    steps:
      - name: Poke Symphony remediator
        run: |
          set -euo pipefail
          # GitHub poke enters Symphony on :4041. Do not restart burrito.
          # Do not touch LYB :4042. HA remediator webhook is not the queue.
          curl -fsS -X POST --max-time 5 http://127.0.0.1:4041/api/v1/refresh >/dev/null
          systemctl --user --no-block start symphony-grok-sidecar.service
