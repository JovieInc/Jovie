name: HA CI remediator poke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Hyperagent CI remediator
# necessary-trust-boundary: GitHub-hosted CI failure events on pull_request/merge_group
#   wake the Hyperagent remediator via a signed outbound webhook. No self-hosted
#   runner access, no local systemd, no Symphony port pokes.
# removal-trigger: Delete when Hyperagent ingests GitHub CI workflow_run failures natively.
# idempotency-contract (JOV-5921): at most one delivered poke per PR + head SHA.
#   - Workflow-level concurrency serializes same-key runs (FIFO, no cancel), so
#     a redelivery storm can never race the webhook POST below.
#   - The job-level filter fails closed: only CI failures on pull_request/merge_group
#     for non-excluded PRs are forwarded.
#   - Successful runs are the durable dedup record (GitHub Actions run history);
#     no external state, so restarts cannot lose ownership of a key.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
      run_url:
        type: string
      force:
        description: 'Bounded retry: poke even if a poke already succeeded for this head SHA'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: >-
    ha-ci-remediator-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'na' }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  poke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '16419') ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.pull_requests[0].number != 16419
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Poke Hyperagent CI remediator
        env:
          WEBHOOK_URL: ${{ secrets.HYPERAGENT_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HYPERAGENT_CI_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || inputs.run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            --arg event "$EVENT" \
            '{repository: $repo, pr_number: ($pr_number | tonumber? // null), head_sha: $head_sha, run_url: $run_url, event: $event, source: "ha-ci-remediator-poke"}')

          timestamp=$(date -u +%s)
          signature=$(printf '%s.%s' "$timestamp" "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)

          http_code=$(curl -sS -o /tmp/hyperagent-response -w '%{http_code}' \
            -X POST --max-time 5 \
            -H 'Content-Type: application/json' \
            -H "X-Hyperagent-Webhook-Timestamp: $timestamp" \
            -H "X-Hyperagent-Webhook-Signature: sha256=$signature" \
            -d "$payload" \
            "$WEBHOOK_URL")

          if [ "$http_code" != "202" ]; then
            echo "::error::Hyperagent CI webhook returned HTTP $http_code (expected 202). Response:"
            cat /tmp/hyperagent-response
            exit 1
          fi

          echo "::notice::Hyperagent CI remediator poke accepted (HTTP 202)."
