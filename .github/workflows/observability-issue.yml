name: Observability Report (Linear)

on:
  repository_dispatch:
    types: [observability-report]

permissions: {}

concurrency:
  group: observability-issue-${{ github.event.client_payload.fingerprint }}
  cancel-in-progress: false

jobs:
  sync-issue:
    # Producer still dispatches observability-report. GitHub Issue writes stay
    # retired; this job files a deduped Linear issue and fails closed without
    # LINEAR_API_KEY. Never fall back to GitHub Issues.
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Sync deduped observability issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          OBSERVABILITY_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          OCCURRENCE_DELTA: ${{ github.event.client_payload.occurrence_delta }}
        run: node scripts/observability-issue-linear.mjs
