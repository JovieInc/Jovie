name: Chat Round Trip Smoke
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: The Cursor GitHub App can send repository_dispatch but cannot start ci.yml (HTTP 403, missing actions write). This hop starts the manual smoke lanes for the chat round-trip budget.
# removal-trigger: Remove after E2E Smoke and Extended Smoke are green on a main SHA that contains 67652c597b5b87dcaa309767af80753a9056c3cc.

on:
  repository_dispatch:
    types: [chat_round_trip_smoke]

permissions: {}

jobs:
  dispatch:
    name: Dispatch manual CI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Accept only the one-shot confirm
        env:
          CONFIRM: ${{ github.event.client_payload.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "dispatch-67652c597b" ]; then
            echo "::error::refusing chat smoke dispatch"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Dispatch ci.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node packages/api-client/cli.ts gh --priority repair -- workflow run ci.yml --repo "$REPO" --ref main
