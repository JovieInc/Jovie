name: Publish @jovie/cli to npm

# Publication is a deliberate operator action. Keep this workflow manual-only;
# a main push or pull request must never acquire npm publish authority.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional stable CLI YY.M.PATCH release; blank uses the desktop VERSION.
        type: string
        required: false
        default: ''
      publish_mcp_only:
        description: Verify the byte-identical published npm artifact and publish its MCP listing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-cli-main
  cancel-in-progress: false

jobs:
  # JOV-7714: the exact bytes we publish must first pass the black-box chaos
  # gate on every supported OS and Node line. The publish job re-packs and
  # refuses to publish unless its integrity equals this tested tarball.
  chaos-tarball:
    name: Pack the chaos-tested release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build @jovie/cli
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jovie/cli run build

      - name: Pack the versioned tarball
        id: pack
        shell: bash
        env:
          CLI_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          release_version="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { resolveReleaseVersion } from './packages/jovie-cli/scripts/pack-manifest.ts';
          process.stdout.write(resolveReleaseVersion(
            readFileSync('VERSION', 'utf8'), process.env.CLI_RELEASE_VERSION
          ));
          NODE
          )"
          staging_dir="$RUNNER_TEMP/jovie-cli-publish"
          pack_dir="$RUNNER_TEMP/jovie-cli-chaos"
          mkdir -p "$staging_dir" "$pack_dir"
          cp packages/jovie-cli/package.json "$staging_dir/package.json"
          cp -R packages/jovie-cli/dist "$staging_dir/dist"
          cp packages/jovie-cli/README.md packages/jovie-cli/LICENSE "$staging_dir/"
          RELEASE_VERSION="$release_version" STAGING_DIR="$staging_dir" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const manifestPath = `${process.env.STAGING_DIR}/package.json`;
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          (
            cd "$staging_dir"
            npm pack --ignore-scripts --json --pack-destination "$pack_dir" > "$RUNNER_TEMP/chaos-pack.json"
          )
          cp packages/jovie-cli/scripts/chaos-blackbox.mjs "$pack_dir/"
          integrity="$(node -e 'const [p] = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(p.integrity)' "$RUNNER_TEMP/chaos-pack.json")"
          test -n "$integrity"
          printf 'integrity=%s\n' "$integrity" >> "$GITHUB_OUTPUT"

      - name: Upload the release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jovie-cli-chaos-candidate
          path: ${{ runner.temp }}/jovie-cli-chaos
          if-no-files-found: error
          retention-days: 7

  chaos-matrix:
    name: CLI chaos gate (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: chaos-tarball
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The engines floor, the next major, and the Node 22 line that still runs.
        node: ['22.13.0', '24.21.0', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jovie-cli-chaos-candidate
          path: ${{ runner.temp }}/jovie-cli-chaos

      - name: Install the tarball into a clean directory and run the chaos gate
        shell: bash
        env:
          PACK_DIR: ${{ runner.temp }}/jovie-cli-chaos
          CLEAN_DIR: ${{ runner.temp }}/jovie-cli-clean
        run: |
          set -euo pipefail
          mkdir -p "$CLEAN_DIR"
          tarball="$(ls "$PACK_DIR"/jovie-cli-*.tgz)"
          npm install --prefix "$CLEAN_DIR" --ignore-scripts --no-audit --no-fund --package-lock=false "$tarball"
          shim="$CLEAN_DIR/node_modules/.bin/jovie"
          if [ "$RUNNER_OS" = Windows ]; then shim="$shim.cmd"; fi
          node "$PACK_DIR/chaos-blackbox.mjs" \
            --bin "$CLEAN_DIR/node_modules/@jovie/cli/dist/cli.js" \
            --shim "$shim" \
            --profile release

  publish:
    name: Publish @jovie/cli
    needs: [chaos-tarball, chaos-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Verify exact main and unpublished release
        id: release
        shell: bash
        env:
          PACKAGE_NAME: '@jovie/cli'
          REGISTRY_URL: https://registry.npmjs.org
          PUBLISH_MCP_ONLY: ${{ inputs.publish_mcp_only }}
          CLI_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::This workflow may only publish from refs/heads/main."
            exit 1
          }
          test "$(node --version)" = v24.21.0 || {
            echo "::error::The release lane requires Node.js v24.21.0."
            exit 1
          }

          git fetch --no-tags --depth=1 origin main
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse origin/main)"
          [[ "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$checked_out_sha" = "$current_main_sha" || {
            echo "::error::Checkout is not the exact current origin/main commit."
            exit 1
          }

          release_version="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { resolveReleaseVersion } from './packages/jovie-cli/scripts/pack-manifest.ts';
          process.stdout.write(resolveReleaseVersion(
            readFileSync('VERSION', 'utf8'), process.env.CLI_RELEASE_VERSION
          ));
          NODE
          )"
          export RELEASE_VERSION="$release_version"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(
            readFileSync('packages/jovie-cli/package.json', 'utf8')
          );
          const expectedVersion = process.env.RELEASE_VERSION;
          const required = [
            ['name', manifest.name === '@jovie/cli'],
            ['private', manifest.private === false],
            ['license', manifest.license === 'Apache-2.0'],
            [
              'repository.url',
              manifest.repository?.url === 'git+https://github.com/JovieInc/Jovie.git',
            ],
            [
              'repository.directory',
              manifest.repository?.directory === 'packages/jovie-cli',
            ],
            ['publishConfig.access', manifest.publishConfig?.access === 'public'],
            ['publishConfig.provenance', manifest.publishConfig?.provenance === true],
            [
              'publishConfig.registry',
              manifest.publishConfig?.registry === 'https://registry.npmjs.org',
            ],
          ];
          for (const [field, valid] of required) {
            if (!valid) throw new Error(`Invalid @jovie/cli publication field: ${field}`);
          }
          if (Object.hasOwn(manifest, 'version') && manifest.version !== expectedVersion) {
            throw new Error(
              `Package version ${manifest.version} does not match CLI release ${expectedVersion}.`
            );
          }
          NODE

          version_path="$(node --input-type=module -e \
            'process.stdout.write(encodeURIComponent(process.env.PACKAGE_NAME))')"
          registry_status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 1 \
            --retry-max-time 40 \
            --output "$RUNNER_TEMP/npm-version.json" \
            --write-out '%{http_code}' \
            "$REGISTRY_URL/$version_path/$release_version")"
          case "$registry_status" in
            404)
              test "$PUBLISH_MCP_ONLY" = false || {
                echo "::error::MCP-only publication requires an existing npm release."
                exit 1
              }
              echo "@jovie/cli@$release_version is not published; continuing."
              ;;
            200)
              if test "$PUBLISH_MCP_ONLY" = true; then
                echo "Existing npm release will be verified before MCP publication."
              else
                echo "::error::@jovie/cli@$release_version is already published."
                exit 1
              fi
              ;;
            *)
              echo "::error::Could not prove @jovie/cli@$release_version is unpublished (HTTP $registry_status)."
              exit 1
              ;;
          esac
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies with the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Test @jovie/cli with coverage
        run: pnpm --filter @jovie/cli run test:coverage

      - name: Typecheck @jovie/cli
        run: pnpm --filter @jovie/cli run typecheck

      - name: Build @jovie/cli
        run: pnpm --filter @jovie/cli run build

      - name: Run @jovie/cli package smoke
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm --filter @jovie/cli run pack:dry

      - name: Stage the versioned package
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TESTED_INTEGRITY: ${{ needs.chaos-tarball.outputs.integrity }}
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/jovie-cli-publish"
          mkdir -p "$staging_dir"
          cp packages/jovie-cli/package.json "$staging_dir/package.json"
          cp -R packages/jovie-cli/dist "$staging_dir/dist"
          cp packages/jovie-cli/README.md packages/jovie-cli/LICENSE "$staging_dir/"
          export STAGING_DIR="$staging_dir"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const manifestPath = `${process.env.STAGING_DIR}/package.json`;
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          test "$(node --input-type=module -e \
            'const fs = await import("node:fs"); const p = JSON.parse(fs.readFileSync(process.env.STAGING_DIR + "/package.json", "utf8")); process.stdout.write(p.version)')" \
            = "$RELEASE_VERSION"
          (
            cd "$staging_dir"
            npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/jovie-cli-pack.json"
          )
          export PACK_RESULT="$RUNNER_TEMP/jovie-cli-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [pack] = JSON.parse(readFileSync(process.env.PACK_RESULT, 'utf8'));
          if (
            pack?.name !== '@jovie/cli' ||
            pack.version !== process.env.RELEASE_VERSION ||
            !pack.files?.some(file => file.path === 'dist/cli.js') ||
            !pack.files?.some(file => file.path === 'LICENSE')
          ) {
            throw new Error('Versioned npm package smoke did not produce the expected CLI files.');
          }
          if (!process.env.TESTED_INTEGRITY || pack.integrity !== process.env.TESTED_INTEGRITY) {
            throw new Error('Publication bytes differ from the chaos-tested tarball; refusing to publish.');
          }
          NODE
          printf 'path=%s\n' "$staging_dir" >> "$GITHUB_OUTPUT"

      # Trusted publishing (OIDC): npm trades this job's GitHub identity for a
      # short-lived publish credential. No long-lived npm token exists.
      # Requires npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Use npm with trusted publishing support
        if: ${{ !inputs.publish_mcp_only }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.6.2
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("::error::npm >= 11.5.1 is required for trusted publishing"); process.exit(1) }' "$(npm --version)"

      - name: Publish with npm provenance
        if: ${{ !inputs.publish_mcp_only }}
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.path }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_DIR"
          test "$(node --input-type=module -e \
            'const fs = await import("node:fs"); const p = JSON.parse(fs.readFileSync(process.env.PACKAGE_DIR + "/package.json", "utf8")); process.stdout.write(p.version)')" \
            = "$RELEASE_VERSION"
          git fetch --no-tags --depth=1 origin main
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse origin/main)"
          [[ "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$checked_out_sha" = "$current_main_sha" || {
            echo "::error::Checkout drifted from current origin/main immediately before publication."
            exit 1
          }
          npm publish --provenance --access public "$PACKAGE_DIR"

      - name: Prove public registry release
        id: public_release
        shell: bash
        env:
          PACKAGE_NAME: '@jovie/cli'
          REGISTRY_URL: https://registry.npmjs.org
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          metadata_path="$RUNNER_TEMP/jovie-cli-public-metadata.json"
          encoded_name="$(node --input-type=module -e \
            'process.stdout.write(encodeURIComponent(process.env.PACKAGE_NAME))')"

          registry_status=000
          # npm trusted publishing can acknowledge a release several minutes
          # before the version is readable from the public registry.
          for attempt in {1..60}; do
            registry_status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$metadata_path" \
              --write-out '%{http_code}' \
              "$REGISTRY_URL/$encoded_name/$RELEASE_VERSION")"
            test "$registry_status" = 200 && break
            sleep 5
          done
          test "$registry_status" = 200 || {
            echo "::error::Published version was not readable from the public registry (HTTP $registry_status)."
            exit 1
          }

          export METADATA_PATH="$metadata_path"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const metadata = JSON.parse(readFileSync(process.env.METADATA_PATH, 'utf8'));
          const required = [
            ['name', metadata.name === process.env.PACKAGE_NAME],
            ['version', metadata.version === process.env.RELEASE_VERSION],
            ['repository.directory', metadata.repository?.directory === 'packages/jovie-cli'],
            ['dist.integrity', typeof metadata.dist?.integrity === 'string'],
            ['dist.tarball', typeof metadata.dist?.tarball === 'string'],
            ['dist.attestations.url', typeof metadata.dist?.attestations?.url === 'string'],
            ['dist.attestations.provenance', Boolean(metadata.dist?.attestations?.provenance)],
            ['maintainers', Array.isArray(metadata.maintainers) && metadata.maintainers.length > 0],
          ];
          for (const [field, valid] of required) {
            if (!valid) throw new Error(`Missing public @jovie/cli release receipt: ${field}`);
          }
          NODE

          install_root="$(mktemp -d "$RUNNER_TEMP/jovie-cli-public-install.XXXXXX")"
          npm install \
            --prefix "$install_root" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=false \
            --registry "$REGISTRY_URL" \
            "$PACKAGE_NAME@$RELEASE_VERSION"
          printf 'install_root=%s\n' "$install_root" >> "$GITHUB_OUTPUT"
          installed_cli="$install_root/node_modules/.bin/jovie"
          test -x "$installed_cli"
          test "$("$installed_cli" --version)" = "$RELEASE_VERSION"
          "$installed_cli" --help | grep -F 'Jovie for agents'
          "$installed_cli" api openapi \
            --base-url https://jov.ie \
            --json \
            > "$RUNNER_TEMP/jovie-cli-public-openapi.json"
          export OPENAPI_PATH="$RUNNER_TEMP/jovie-cli-public-openapi.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const contract = JSON.parse(readFileSync(process.env.OPENAPI_PATH, 'utf8'));
          if (
            typeof contract.openapi !== 'string' ||
            !contract.openapi.startsWith('3.') ||
            contract.info?.title !== 'Jovie Artist API'
          ) {
            throw new Error('Freshly installed CLI did not return the Jovie OpenAPI contract.');
          }
          NODE

          echo "Public npm registry, provenance, ownership, fresh install, and runtime receipts passed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact staged bytes and prepare MCP manifest
        if: ${{ inputs.publish_mcp_only }}
        shell: bash
        env:
          STAGING_DIR: ${{ steps.package.outputs.path }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          export MCP_PACK_PATH="$RUNNER_TEMP/jovie-mcp-pack.json"
          export METADATA_PATH="$RUNNER_TEMP/jovie-cli-public-metadata.json"
          export MCP_MANIFEST_PATH="$RUNNER_TEMP/jovie-mcp-server.json"
          (
            cd "$STAGING_DIR"
            npm pack --ignore-scripts --json > "$MCP_PACK_PATH"
          )
          node packages/jovie-cli/scripts/verify-published-package.mjs
          npm audit signatures --prefix '${{ steps.public_release.outputs.install_root }}'

      - name: Publish exact MCP listing using GitHub OIDC
        if: ${{ inputs.publish_mcp_only }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main advanced before MCP publication."
            exit 1
          }
          publisher_archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$publisher_archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $publisher_archive" | sha256sum --check
          publisher_dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$publisher_dir"
          tar -xzf "$publisher_archive" -C "$publisher_dir" mcp-publisher
          "$publisher_dir/mcp-publisher" validate "$RUNNER_TEMP/jovie-mcp-server.json"
          "$publisher_dir/mcp-publisher" login github-oidc
          "$publisher_dir/mcp-publisher" publish "$RUNNER_TEMP/jovie-mcp-server.json"
          registry_result="$RUNNER_TEMP/jovie-mcp-registry-readback.json"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            https://registry.modelcontextprotocol.io/v0.1/servers/io.github.JovieInc%2Fjovie/versions/latest \
            --output "$registry_result"
          export REGISTRY_RESULT="$registry_result"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/jovie-mcp-server.json`, 'utf8'));
          const actual = JSON.parse(readFileSync(process.env.REGISTRY_RESULT, 'utf8'));
          const { verifyRegistryReadback } = await import('./packages/jovie-cli/scripts/verify-published-package.mjs');
          verifyRegistryReadback(actual, expected);
          NODE
