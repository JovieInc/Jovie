name: Ownerless Recovery Sweep
on:
  pull_request:
    types: [opened, reopened, ready_for_review, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ownerless-recovery-sweep
jobs:
  sweep:
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 10
    steps:
      - name: Generate Jovie Bot recovery token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read # Linear/Symphony ownership audit gates mutation.
      - name: Checkout exact main recovery policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Verify GitHub CLI
        run: gh --version
      - name: Emit exact-head recovery intents for the canonical queue controller
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SYMPHONY_STATE_URL: http://127.0.0.1:4041/api/v1/state
        run: node scripts/ownerless-recovery-sweeper.mjs
