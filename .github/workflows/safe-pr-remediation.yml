name: Safe PR Remediation

# Credential-free deterministic repair for proven repeatable lockfile drift on
# Dependabot PRs: the isolated Eve lockfile (Eve Pilot failures) and the root
# workspace lockfile (CI ERR_PNPM_OUTDATED_LOCKFILE, e.g. PR #18250). An
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (pnpm.overrides drift, e.g. PR #18247) is
# refused with an error: overrides are deliberate pins and are never rewritten.
# Planning never executes PR code. The prepare job executes an allowlisted
# Dependabot-only diff with a read-only token and no repository/model secrets.
# The writer never executes PR code and commits one attested lockfile through
# GitHub's atomic expectedHeadOid mutation. Native Auto-Enroll remains the only
# queue writer.

on:
  workflow_run:
    workflows: ['Eve Pilot', 'CI']
    types: [completed]

permissions: {}

concurrency:
  group: safe-pr-remediation-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Classify exact failed head
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      expected_head: ${{ steps.plan.outputs.expected_head }}
      kind: ${{ steps.plan.outputs.kind }}
      plan_b64: ${{ steps.plan.outputs.plan_b64 }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Classify allowlisted lockfile drift
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/safe-pr-remediation.mjs plan

  prepare:
    name: Generate immutable lockfile artifact without write credentials
    needs: plan
    if: needs.plan.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout immutable trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .safe-remediation-policy
          persist-credentials: false
      - name: Checkout exact candidate head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.expected_head }}
          path: candidate
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/apps/eve-pilot/pnpm-lock.yaml
      - name: Decode exact-head plan
        env:
          PLAN_B64: ${{ needs.plan.outputs.plan_b64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/safe-remediation"
          printf '%s' "$PLAN_B64" | base64 --decode > "$RUNNER_TEMP/safe-remediation-plan.json"
      - name: Regenerate only the isolated lockfile
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        working-directory: candidate/apps/eve-pilot
        run: pnpm install --ignore-workspace --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Prove frozen install
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        working-directory: candidate/apps/eve-pilot
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Bind immutable artifact to the exact head
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        run: |
          node .safe-remediation-policy/scripts/lib/safe-pr-remediation.mjs receipt \
            --plan "$RUNNER_TEMP/safe-remediation-plan.json" \
            --package candidate/apps/eve-pilot/package.json \
            --lockfile candidate/apps/eve-pilot/pnpm-lock.yaml \
            --output "$RUNNER_TEMP/safe-remediation/receipt.json"
          install -m 0600 candidate/apps/eve-pilot/package.json "$RUNNER_TEMP/safe-remediation/package.json"
          install -m 0600 candidate/apps/eve-pilot/pnpm-lock.yaml "$RUNNER_TEMP/safe-remediation/pnpm-lock.yaml"
      # Root lane: lockfile-only resolution with scripts and pnpmfile disabled.
      # package.json and pnpm.overrides are inputs only; never rewritten.
      - name: Regenerate only the root workspace lockfile
        if: needs.plan.outputs.kind == 'root-workspace-lockfile'
        working-directory: candidate
        run: pnpm install --lockfile-only --ignore-scripts --ignore-pnpmfile --no-frozen-lockfile
      - name: Prove frozen root lockfile
        if: needs.plan.outputs.kind == 'root-workspace-lockfile'
        working-directory: candidate
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts --ignore-pnpmfile
      - name: Bind immutable root artifact to the exact head
        if: needs.plan.outputs.kind == 'root-workspace-lockfile'
        run: |
          node .safe-remediation-policy/scripts/lib/safe-pr-remediation.mjs receipt \
            --plan "$RUNNER_TEMP/safe-remediation-plan.json" \
            --lockfile candidate/pnpm-lock.yaml \
            --output "$RUNNER_TEMP/safe-remediation/receipt.json"
          install -m 0600 candidate/pnpm-lock.yaml "$RUNNER_TEMP/safe-remediation/pnpm-lock.yaml"
      - name: Upload exact-head remediation artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-remediation-${{ needs.plan.outputs.pr_number }}-${{ needs.plan.outputs.expected_head }}
          path: ${{ runner.temp }}/safe-remediation
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test exact generated lockfile without write credentials
    needs: [plan, prepare]
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.expected_head }}
          path: candidate
          persist-credentials: false
      - name: Download immutable generated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/safe-remediation
      - name: Install the exact generated lockfile under test
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        run: install -m 0600 "$RUNNER_TEMP/safe-remediation/pnpm-lock.yaml" candidate/apps/eve-pilot/pnpm-lock.yaml
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/apps/eve-pilot/pnpm-lock.yaml
      - name: Prove frozen install
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        working-directory: candidate/apps/eve-pilot
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Typecheck isolated Eve pilot
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        working-directory: candidate/apps/eve-pilot
        run: pnpm run typecheck
      - name: Test isolated Eve pilot
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        working-directory: candidate/apps/eve-pilot
        run: pnpm run test
      - name: Build isolated Eve pilot
        if: needs.plan.outputs.kind == 'eve-isolated-lockfile'
        working-directory: candidate/apps/eve-pilot
        run: pnpm run build
      # Root lane proof stays lockfile-scoped; the full CI suite reruns on the
      # committed head, and that exact-head CI remains the admission gate.
      - name: Install the exact generated root lockfile under test
        if: needs.plan.outputs.kind == 'root-workspace-lockfile'
        run: install -m 0600 "$RUNNER_TEMP/safe-remediation/pnpm-lock.yaml" candidate/pnpm-lock.yaml
      - name: Prove frozen root lockfile
        if: needs.plan.outputs.kind == 'root-workspace-lockfile'
        working-directory: candidate
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts --ignore-pnpmfile
      - name: Compare workspace manifest and lockfile specifiers
        if: needs.plan.outputs.kind == 'root-workspace-lockfile'
        working-directory: candidate
        run: node scripts/lockfile-specifier-preflight.mjs

  commit:
    name: Atomic expected-head writer
    needs: [plan, prepare, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout trusted main writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable generated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/safe-remediation
      - name: Decode the trusted plan output
        env:
          PLAN_B64: ${{ needs.plan.outputs.plan_b64 }}
        run: printf '%s' "$PLAN_B64" | base64 --decode > "$RUNNER_TEMP/safe-remediation-plan.json"
      - name: Generate short-lived Jovie App writer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Revalidate and atomically commit the tested lockfile
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS_TOKEN: ${{ github.token }}
        run: |
          node scripts/lib/safe-pr-remediation.mjs commit \
            --plan "$RUNNER_TEMP/safe-remediation-plan.json" \
            --package "$RUNNER_TEMP/safe-remediation/package.json" \
            --lockfile "$RUNNER_TEMP/safe-remediation/pnpm-lock.yaml" \
            --receipt "$RUNNER_TEMP/safe-remediation/receipt.json"
