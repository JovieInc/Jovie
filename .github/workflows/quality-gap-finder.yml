# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# capability-gap: No existing controller turns post-mortems, escaped defects, invariant evidence, route budgets, and test coverage into deduped test/guardrail/invariant proposals; this files capped Linear Backlog issues only and writes no code, branches, or deploys.
# removal-trigger: Remove when Summer's improvement loop runs scripts/quality-gap-finder.mjs natively on the same evidence and caps.
name: Quality Gap Finder

# When its evidence changes: propose missing tests, guardrails, and
# invariants from repo and Linear evidence. High confidence -> Linear Backlog
# `quality-gap` (+ `agent-ready` when mechanical). Low confidence ->
# `quality-gap:needs-tim`, which Summer turns into Ovie inbox cards (max
# 3/day). See docs/quality/QUALITY_GAP_FINDER.md.
# No clock. Repo evidence arrives as a main push of the paths below. Linear
# evidence arrives as quality-gap-scan: bug intake and dogfood events, and
# /api/webhooks/linear when a post-mortem action or escaped defect closes.

on:
  push:
    branches: [main]
    paths:
      - 'docs/postmortems/**'
      - 'canon/invariants.jsonl'
      - 'docs/performance/route-budgets.json'
      - 'docs/TEST_COVERAGE_HEATMAP.md'
      - '.github/ci-harness/ci-release-incidents.json'
      - 'scripts/ci-fast-lanes.mjs'
      - 'scripts/quality-gap-finder.mjs'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/data/detection-coverage-registry.json'
      - 'apps/web/lib/**'
      - 'apps/web/scripts/performance-route-manifest.ts'
      - '.github/workflows/quality-gap-finder.yml'
  repository_dispatch:
    types: [quality-gap-scan]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only, do not file Linear issues
        type: boolean
        default: false

permissions: {}

concurrency:
  group: quality-gap-finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Review post-mortems and reconcile controls
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GBRAIN_API_URL: ${{ secrets.GBRAIN_API_URL }}
          GBRAIN_API_KEY: ${{ secrets.GBRAIN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          flags=(--mirror)
          if [ "$DRY_RUN" != 'true' ]; then flags+=(--apply); fi
          node scripts/postmortem-review.mjs "${flags[@]}" \
            --out postmortem-review.json > /dev/null

      - name: Find and file quality gaps
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = 'true' ]; then
            node scripts/quality-gap-finder.mjs --out quality-gaps.json > /dev/null
          else
            node scripts/quality-gap-finder.mjs --file --out quality-gaps.json > /dev/null
          fi

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gaps-${{ github.run_id }}
          path: |
            postmortem-review.json
            quality-gaps.json
          retention-days: 14
          if-no-files-found: ignore
