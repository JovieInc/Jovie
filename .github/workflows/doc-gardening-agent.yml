# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: Source-file changes require computed doc-freshness repairs; the Jovie App publishes those repairs as PRs that trigger source CI.
# removal-trigger: Remove when the existing lanes writer generates the same freshness repairs directly from source-file change events.
# Doc-gardening agent (JOV-3644).
#
# Scans gardening-only stale docs (docs/doc-gardening/**) and opens fix-up PRs
# when freshness markers drift from computed repo facts.
name: Doc Gardening Agent

on:
  # The gardened facts are computed from these files, so a change to one of
  # them is the only thing that can make a freshness marker stale.
  push:
    branches: [main]
    paths:
      - '.claude/rules/*.md'
      - 'docs/doc-gardening/**'
      - 'docs/doc-freshness-registry.json'
      - 'scripts/lib/doc-freshness.mjs'
      - 'scripts/doc-gardening-agent.mjs'
      - '.github/workflows/doc-gardening-agent.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report stale gardening docs without opening a PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: doc-gardening-agent
  cancel-in-progress: false

jobs:
  garden:
    name: Scan and fix stale docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify CI-scope doc freshness is green
        run: pnpm doc:freshness:check

      - name: Run doc-gardening agent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/doc-gardening-agent.mjs --dry-run
          else
            node scripts/doc-gardening-agent.mjs
          fi

  # Nothing fails without a repair or a success (JOV-14467): a red main run opens or updates this
  # workflow's repair issue and the next green resolves it.
  report-outcome:
    name: Report outcome
    needs: [garden]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions
            .nvmrc
            packages/api-client
            scripts/lib
            scripts/remediation-signal-intake.mjs
      - uses: ./.github/actions/report-outcome
        with:
          results: ${{ toJSON(needs) }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
