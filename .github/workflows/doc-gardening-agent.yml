# Doc-gardening agent (JOV-3644).
#
# Scans gardening-only stale docs (docs/doc-gardening/**) and opens fix-up PRs
# when freshness markers drift from computed repo facts.
name: Doc Gardening Agent

on:
  # The gardened facts are computed from these files, so a change to one of
  # them is the only thing that can make a freshness marker stale.
  push:
    branches: [main]
    paths:
      - '.claude/rules/*.md'
      - 'docs/doc-gardening/**'
      - 'docs/doc-freshness-registry.json'
      - 'scripts/lib/doc-freshness.mjs'
      - 'scripts/doc-gardening-agent.mjs'
      - '.github/workflows/doc-gardening-agent.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report stale gardening docs without opening a PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: doc-gardening-agent
  cancel-in-progress: false

jobs:
  garden:
    name: Scan and fix stale docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify CI-scope doc freshness is green
        run: pnpm doc:freshness:check

      - name: Run doc-gardening agent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/doc-gardening-agent.mjs --dry-run
          else
            node scripts/doc-gardening-agent.mjs
          fi
