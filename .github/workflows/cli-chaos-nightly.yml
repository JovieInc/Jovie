# CLI Chaos Nightly (JOV-7714)
#
# PURPOSE: Run the black-box chaos gate against the @jovie/cli that users
# actually install from npm, on macOS, Linux, and Windows, plus read-only
# production probes. A red run files or updates one remediation issue through
# the shared intake; the next green run resolves it.
#
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Tim
# necessary-trust-boundary: Only a hosted schedule proves the npm-published bytes users install still pass the chaos gate; PR and release gates test source and candidates, never the live registry artifact.
# revisit-trigger: Fold into production-controller probes once they install and exercise @jovie/cli from npm on macOS, Linux, and Windows.
name: CLI Chaos Nightly

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Published @jovie/cli version or dist-tag to test
        type: string
        required: false
        default: latest

permissions:
  contents: read

concurrency:
  group: cli-chaos-nightly
  cancel-in-progress: false

jobs:
  chaos:
    name: Published CLI chaos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: packages/jovie-cli/scripts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install the published CLI into a clean directory and run the chaos gate
        shell: bash
        env:
          CLI_VERSION: ${{ inputs.version || 'latest' }}
          CLEAN_DIR: ${{ runner.temp }}/jovie-cli-published
        run: |
          set -euo pipefail
          mkdir -p "$CLEAN_DIR"
          npm install --prefix "$CLEAN_DIR" --ignore-scripts --no-audit --no-fund \
            --package-lock=false "@jovie/cli@$CLI_VERSION"
          shim="$CLEAN_DIR/node_modules/.bin/jovie"
          if [ "$RUNNER_OS" = Windows ]; then shim="$shim.cmd"; fi
          prod=()
          # Production is probed once, from Linux, with read-only GETs.
          if [ "$RUNNER_OS" = Linux ]; then prod=(--prod); fi
          node packages/jovie-cli/scripts/chaos-blackbox.mjs \
            --bin "$CLEAN_DIR/node_modules/@jovie/cli/dist/cli.js" \
            --shim "$shim" \
            --profile nightly \
            ${prod[@]+"${prod[@]}"} \
            --report "$RUNNER_TEMP/chaos-report.json"

  remediation:
    name: File or resolve CLI chaos remediation
    needs: [chaos]
    if: ${{ always() && needs.chaos.result != 'skipped' && needs.chaos.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: File or resolve cli-chaos-nightly
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_INTAKE_DISABLED: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
          REMEDIATION_MODE: monitor
          REMEDIATION_FINGERPRINT: cli-chaos-nightly
          REMEDIATION_SOURCE: cli-chaos-nightly.yml
          REMEDIATION_CONCLUSION: ${{ needs.chaos.result }}
          REMEDIATION_DETAIL: >-
            The published @jovie/cli failed the black-box chaos gate
            (packages/jovie-cli/scripts/chaos-blackbox.mjs) on at least one OS.
            The run log lists each failing scenario. Reproduce locally with
            `node packages/jovie-cli/scripts/chaos-blackbox.mjs --bin <installed dist/cli.js> --profile nightly`.
            Fix forward in packages/jovie-cli, then publish via npm-publish.yml.
          REMEDIATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/remediation-signal-intake.mjs
