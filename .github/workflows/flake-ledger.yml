# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Eve
# capability-gap: The HA flake collector is a pure file CLI and cannot see GitHub events; this hop is the event-driven workflow_run completed adapter that writes the run-file, calls that entrypoint, and asks for one infra-only retry.
# removal-trigger: Remove this hop when Source Validation itself records verified flips in-band from the same completed attempt and classifies a single infra retry without a sibling workflow.
# github-token-budget: 1 calls/run - one rerun-failed-jobs POST for a classified infra failure; every read uses the CI App token.
name: Flake Ledger

# JOV-13105 workflow half. Flip detection stays in scripts/lib/flake-ledger.mjs.
# This hop must not treat "attempt > 1 and now green" as a flake in YAML.
on:
  workflow_run:
    workflows: [Source Validation]
    types: [completed]

permissions: {}

concurrency:
  group: flake-ledger-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect completed-run evidence
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/source-validation.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/actions/prime-node-toolcache/action.yml
            .github/actions/prime-node-toolcache/prime.sh
            scripts/flake-ledger-workflow-hook.mjs
            scripts/lib/flake-ledger.mjs
            packages/api-client
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Mint CI App read token
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-pull-requests: read

      - name: Restore flake ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flake-ledger/ledger.json
          key: flake-ledger-v1-${{ github.run_id }}
          restore-keys: flake-ledger-v1-

      - name: Prepare output directory
        run: |
          mkdir -p .flake-ledger
          if [ ! -f .flake-ledger/ledger.json ]; then
            printf '%s\n' '{"schemaVersion":"jovie-flake-ledger/v1","failures":[],"flips":[],"retries":[]}' > .flake-ledger/ledger.json
          fi

      - name: Build the HA collector run-file
        env:
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          FLAKE_LEDGER_OUT_DIR: .flake-ledger
        run: node scripts/flake-ledger-workflow-hook.mjs build-run-file

      - name: Record and report with the HA collector
        env:
          FLAKE_LEDGER_OUT_DIR: .flake-ledger
          FLAKE_LEDGER_PATH: .flake-ledger/ledger.json
        run: node scripts/flake-ledger-workflow-hook.mjs record-and-report

      - name: Save flake ledger
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flake-ledger/ledger.json
          key: flake-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload flake ledger artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: .flake-ledger/
          retention-days: 14

      - name: Summarize collector outcome
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Flake ledger"
            echo
            echo "- Triggering run: ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}"
            echo "- Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "- Head: ${{ github.event.workflow_run.head_sha }}"
            if [ -f .flake-ledger/meta.json ]; then
              echo "- Meta:"
              echo
              echo '```json'
              cat .flake-ledger/meta.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  retry-infra:
    name: One infra-only retry
    needs: collect
    if: >-
      needs.collect.result == 'success' &&
      contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/actions/prime-node-toolcache/action.yml
            .github/actions/prime-node-toolcache/prime.sh
            scripts/flake-ledger-workflow-hook.mjs
            scripts/lib/flake-ledger.mjs
            packages/api-client
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Mint CI App read token
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-pull-requests: read

      - name: Restore collected ledger
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: .flake-ledger

      - name: Request one infra-only retry when the HA classifier allows it
        env:
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          FLAKE_LEDGER_OUT_DIR: .flake-ledger
          FLAKE_LEDGER_PATH: .flake-ledger/ledger.json
        run: node scripts/flake-ledger-workflow-hook.mjs maybe-retry
