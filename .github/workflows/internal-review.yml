name: Internal PR Review (advisory)

# JOV-7400: internal, advisory-only AI reviewer — the CodeRabbit replacement.
# Posts exactly one upserted comment per PR head covering correctness risks,
# test gaps, and migration hazards on non-draft PR open, reopen and push.
# ready_for_review has one subscriber (JOV-INV-029 PR lifecycle contract), so
# an undrafted PR is reviewed on its next push.
# The prompt carries the scoped .claude/rules conventions for changed paths,
# read from the trusted base checkout.
#
# Cost bounds: drafts, Dependabot and bot/* report branches are skipped;
# docs-only diffs never wake the job; a newer push cancels the stale run.
#
# Non-blocking by construction:
#   - This workflow is never a required status check (see
#     .github/BRANCH_PROTECTION.md) and is never an input to merge admission.
#   - The script always exits 0: a missing gateway key, rate limit, oversized
#     diff, or API failure degrades to a warning annotation, never a failure.
#   - It runs on pull_request_target and checks out only the trusted base ref;
#     the PR diff is read through the GitHub API as data, so no PR-controlled
#     code executes and secrets stay scoped to the gateway call.
#
# Because the script is resolved from the base ref, changes to
# .github/scripts/internal-pr-review.mjs take effect only after merge.
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Devin
# capability-gap: pull_request_target is required so fork PRs receive the same advisory review and secrets stay available; the workflow checks out only the trusted base ref and reads the PR diff through the API as data — no PR-controlled code executes.
# revisit-trigger: Re-evaluate if this reviewer ever acts on model output beyond upserting its one PR comment (pull-requests: write is the narrowest scope GitHub accepts for that), or if a required gate starts depending on its output.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/__snapshots__/**'
      - '**/*.snap'
  # Manual backfill for one PR from main (the event head is the live PR head).
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to review
        required: true
        type: string

permissions: {}

concurrency:
  # One review per PR at a time; a newer push supersedes the stale head's run
  # and the upserted comment always reflects the latest head SHA.
  group: internal-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Internal Review (advisory)
    if: >-
      (github.event_name == 'pull_request_target' ||
       github.ref == 'refs/heads/main') &&
      github.event.pull_request.draft != true &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'bot/') &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The issue-comments endpoint on a pull request needs pull-requests:
      # write for GITHUB_TOKEN; issues: write alone returned 403 on every
      # run from 2026-10-01 to 2026-10-08, so no review was ever posted.
      pull-requests: write
    steps:
      - name: Checkout trusted base ref for the review script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run advisory internal review
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/internal-pr-review.mjs
