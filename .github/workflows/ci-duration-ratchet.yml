name: CI Duration Ratchet
# clock-class: skip-if-unchanged
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# necessary-trust-boundary: The existing hosted clock checks the read-only Shipping SLO receipt and fleet fan-out budgets, and attributes unattended failures to their original probe for remediation. It never modifies CI admission or release authority.
# removal-trigger: Remove this clock when the Shipping SLO publisher and native workflow health evidence enforce receipt freshness, dev-loop and fan-out checks and publish probe-specific outcomes.
# github-token-budget: 201 calls/run - one unchanged-SHA read, plus at most ~200 total_count and skipped-run reads by the fan-out budget job (scripts/ci-trigger-budget.mjs) once a night

# Nightly freshness and p95 guard over Shipping SLO's canonical gate evidence.
# Dev-loop latency and workflow fan-out are independently measured here.

on:
  schedule:
    # Hosted API measurement, offset from the deeper scheduled suites.
    - cron: '25 6 * * *'
  # Causal trigger for the dev-loop job: a change to a local gate lands.
  push:
    branches: [main]
    paths:
      - '.husky/**'
      - 'package.json'
      - 'scripts/check-conflict-markers.sh'
      - 'scripts/security/scan-secrets.sh'
      - 'scripts/repo-hygiene-guard.mjs'
      - 'scripts/skill-governance-guard.mjs'
      - 'scripts/hooks/**'
      - 'scripts/dev-loop-latency.mjs'
      - 'apps/web/scripts/next-proxy-guard.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # JOV-6836: promotion-loss metrics read PR queue timelines.
  pull-requests: read

concurrency:
  group: ci-duration-ratchet-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dev-loop:
    # Local (pre-CI) loop: every .husky/pre-commit rung + pre-push publication
    # against budgets in scripts/dev-loop-latency.mjs.
    name: Measure dev-loop hook latency
    outputs:
      hooks-proof: ${{ steps.time-hooks.outcome == 'success' }}
      scheduled-proof: ${{ steps.time-hooks.outcome == 'success' && steps.typecheck.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip unchanged scheduled SHA
        id: unchanged
        uses: ./.github/actions/skip-if-unchanged
        with:
          workflow: ci-duration-ratchet.yml

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.unchanged.outputs.skip != 'true'

      - name: Time pre-commit and pre-push rungs
        id: time-hooks
        if: steps.unchanged.outputs.skip != 'true'
        run: node scripts/dev-loop-latency.mjs

      - name: Enforce repeated typecheck performance ratchet
        id: typecheck
        if: github.event_name != 'push' && steps.unchanged.outputs.skip != 'true'
        run: pnpm typecheck:performance -- --scenario ci --samples 3 --enforce --output "$RUNNER_TEMP/typecheck-performance.json"

      - name: Slack alert on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          jq -n --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{text: ("Dev-loop latency budget breached (pre-commit/pre-push). <" + $run + "|View summary>")}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

  measure:
    name: Measure p95 gate duration + check ratchet
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check canonical source and combined gate evidence
        run: |
          set -euo pipefail
          node scripts/ci-duration-ratchet.mjs check-snapshot | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Promotion-loss metrics (JOV-6836)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # Runner-minutes per merged PR is opt-in (`--runner-minutes`): one jobs call per CI run
        # is too many API calls for this 8-minute job. JOV-8044: metrics are
        # informational — a collection failure reports in the summary and must
        # not turn the p95 gate job red.
        run: |
          node scripts/promotion-loss-metrics.mjs --since 24h >> "$GITHUB_STEP_SUMMARY" || {
            echo "::warning::promotion-loss metrics collection failed; the p95 gate is unaffected."
            {
              echo "### Promotion-loss metrics (last 24 h)"
              echo
              echo "Unavailable: GitHub API collection failed. See the step log."
            } >> "$GITHUB_STEP_SUMMARY"
          }

      - name: Slack alert on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg run "$RUN_URL" \
            '{text: ("CI duration SLO breached or evidence unavailable. <" + $run + "|View summary>")}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

  # Audit finding 4: runs per merged PR and always-skipped workflows, measured
  # on the same nightly cron (no new clock). Read-only; never a PR check.
  # Fails when the 7-day runs per merged PR pass the ceiling in
  # scripts/ci-trigger-registry.json, or a busy workflow skips >95% of its runs.
  fan-out-budget:
    name: CI fan-out budget
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/actions/prime-node-toolcache
            packages/api-client
            scripts/ci-trigger-budget.mjs
            scripts/ci-trigger-registry.json
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        uses: ./.github/actions/prime-node-toolcache

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Measure runs per merged PR and skipped share
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-trigger-budget.mjs

  # JOV-14467: each red probe owns its repair. Only the same probe's
  # completed evidence may resolve it; push doesn't run the nightly probes.
  report-outcome:
    name: Report outcome
    needs: [dev-loop, measure, fan-out-budget]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions
            .nvmrc
            packages/api-client
            scripts/lib
            scripts/remediation-signal-intake.mjs
      - name: Report nightly duration and fan-out outcome
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/report-outcome
        with:
          conclusion: ${{
            (needs.measure.result == 'failure' || needs.fan-out-budget.result == 'failure') && 'failure'
            || (needs.measure.result == 'success' && needs.fan-out-budget.result == 'success') && 'success'
            || 'cancelled' }}
          detail: ${{ format('Gate duration evidence {0}, CI fan-out {1}', needs.measure.result, needs.fan-out-budget.result) }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
      - name: Report scheduled dev-loop outcome
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/report-outcome
        with:
          fingerprint: workflow-ci-dev-loop-scheduled
          conclusion: ${{
            needs.dev-loop.result == 'failure' && 'failure'
            || (needs.dev-loop.result == 'success' && needs.dev-loop.outputs.scheduled-proof == 'true') && 'success'
            || 'cancelled' }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
      - name: Report push dev-loop outcome
        if: always() && github.event_name == 'push'
        uses: ./.github/actions/report-outcome
        with:
          fingerprint: workflow-ci-dev-loop-push
          conclusion: ${{
            needs.dev-loop.result == 'failure' && 'failure'
            || (needs.dev-loop.result == 'success' && needs.dev-loop.outputs.hooks-proof == 'true') && 'success'
            || 'cancelled' }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
