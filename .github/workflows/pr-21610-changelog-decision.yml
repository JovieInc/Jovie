# One-shot for PR 21610 only. Removed in the following commit.
# The agent token cannot edit pull request bodies. This push records the
# internal customer-changelog decision with the repository GITHUB_TOKEN.
name: Record PR 21610 changelog decision
on:
  push:
    branches:
      - devin/jov-6764-20261013t133724
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  record:
    name: Record internal changelog decision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.repository == 'JovieInc/Jovie'
    steps:
      - name: Add releaseWorthy false when the decision is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          gh pr view 21610 --repo JovieInc/Jovie --json body --jq .body > "$body_file"
          if grep -q 'customer-changelog/v1' "$body_file"; then
            echo 'decision already present'
            exit 0
          fi
          printf '\n<!-- customer-changelog/v1 {"releaseWorthy":false} -->\n' >> "$body_file"
          gh pr edit 21610 --repo JovieInc/Jovie --body-file "$body_file"
          echo 'recorded internal changelog decision'
