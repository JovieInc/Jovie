# Metadata-only fork review signal. No checkout, artifacts, secrets or PR code.
name: Source Admission Review Signal
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
concurrency:
  # Serialize review signals per PR. Never cancel: each submitted/dismissed
  # review must reach a terminal receipt.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Review metadata changed; trusted main policy revalidates the current PR.'
