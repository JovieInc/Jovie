# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: Static-analysis findings (SonarCloud, code scanning, Dependabot, secret scanning, coverage gaps, knip, mutation floors) had no shared ledger, owner, SLO or remediation dispatch; each tool alarmed nobody. This reads their results, files deduped Linear work (critical as a Summer P0 incident) and fails a shrink-only ratchet. It writes no code and never merges.
# removal-trigger: Remove when Summer ingests every alert source natively and owns the ledger, SLOs and ratchets.
name: Findings Loop

# Event-driven: a scanner or audit run completing on main re-reads the ledger
# and dispatches remediation. GitHub Actions has no dependabot_alert,
# code_scanning_alert or secret_scanning_alert trigger, so alert webhooks reach
# this loop as repository_dispatch `security_alert` (Summer's GitHub ingress
# relays them; see docs/ci/findings-loop.md). The Gem lanes clock fires
# `clock_findings_loop` every 6h as the backstop only (JOV-INV-042 freezes
# GitHub crons); its dwell is alarmed by the automation-registry heartbeat.

on:
  workflow_run:
    workflows:
      - CodeQL
      - SonarCloud
      - Test Coverage Audit
      - Mutation Diff
      - Waste Sweep
      - Security Advisory Loop (Linear devin lane)
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [security_alert, clock_findings_loop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect, check and print the dispatch plan without writing Linear
        type: boolean
        default: false

permissions: {}

concurrency:
  group: findings-loop
  cancel-in-progress: false

jobs:
  loop:
    name: Collect, dispatch, ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: read
    env:
      FINDINGS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # Snapshot PR only on the clock or a manual run, so event storms do not churn main.
      PUBLISH_SNAPSHOT: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'clock_findings_loop' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm

      # Dependabot and secret-scanning alerts need app permissions the GITHUB_TOKEN
      # cannot hold. Without them those sources are recorded blind (a finding), not zero.
      - name: Generate alerts-read App token
        id: alerts-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-vulnerability-alerts: read
          permission-secret-scanning-alerts: read

      - name: Collect the ledger
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_TOKEN: ${{ steps.alerts-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/findings-loop.mjs collect --out "$RUNNER_TEMP/findings-ledger.json"

      - name: Dispatch remediation
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          flag=
          if [ "$FINDINGS_DRY_RUN" = 'true' ]; then flag=--dry-run; fi
          node scripts/findings-loop.mjs dispatch --ledger "$RUNNER_TEMP/findings-ledger.json" $flag

      - name: Ratchet - open findings per source only shrink
        run: node scripts/findings-loop.mjs check --ledger "$RUNNER_TEMP/findings-ledger.json"

      - name: Preserve ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/findings-ledger.json
          if-no-files-found: ignore
          retention-days: 30

  snapshot:
    name: Publish metrics and tighten the baseline
    needs: loop
    if: ${{ always() && needs.loop.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.action == 'clock_findings_loop')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download ledger
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.0.0
        with:
          name: findings-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
      - name: Publish snapshot PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/findings-loop.mjs publish --ledger "$RUNNER_TEMP/findings-ledger.json" --tighten
          BRANCH="bot/findings-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git switch -c "$BRANCH"
          git add docs/metrics/findings-latest.json docs/metrics/findings-public-stats.json docs/metrics/findings-baseline.json
          if git diff --staged --quiet; then echo "Snapshot unchanged."; exit 0; fi
          git commit -m "chore(metrics): refresh findings ledger snapshot" \
            -m "Generated by .github/workflows/findings-loop.yml. Baseline only tightens."
          git push -u origin "$BRANCH"
          node packages/api-client/cli.ts gh --priority report -- pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "chore(metrics): refresh findings ledger snapshot" --label compounding \
            --body "Refreshes docs/metrics/findings-*.json from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Baselines only tighten."
