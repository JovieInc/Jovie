# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: A failed scheduled run has no PR or reviewer to surface it, so one job with only issues:write opens or updates a single standing issue per lane (GOVERNANCE.md: nothing fails silently).
# removal-trigger: Remove the report-scheduled-failure job when a shared scheduled-failure reporter covers every scheduled workflow.
name: Visual & A11y Tests
# clock-class: skip-if-unchanged

# Storybook axe lane (JOV-4042). Playwright page-level visual compare lives in
# visual-regression.yml (self-healing baselines + admin surfaces). This workflow
# stays Storybook-only to avoid double Neon/build cost. It is deep evidence, so
# source PRs and main releases never wait on it.
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Keep at most one deep Storybook audit per ref.
concurrency:
  group: visual-a11y-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci-visual-path-changes:
    name: Visual Path Detection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_visual_changes: ${{ steps.detect.outputs.has_visual_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect visual-relevant changes
        id: detect
        run: |
          VISUAL_PATTERNS='^(apps/web/components/|apps/web/\.storybook/|apps/web/app/globals\.css|apps/web/styles/|apps/web/(tailwind|postcss)\.config\.|apps/web/vitest\.config\.storybook\.mts|apps/web/package\.json|packages/ui/|pnpm-lock\.yaml|\.github/workflows/visual-a11y\.yml)'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "schedule" ]; then
            echo "has_visual_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_visual_changes=false" >> "$GITHUB_OUTPUT"
          fi

  storybook-a11y:
    name: Storybook A11y Checks (${{ matrix.shard }}/8)
    needs: [ci-visual-path-changes]
    if: ${{ needs.ci-visual-path-changes.outputs.has_visual_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One Chromium page runs every story file in a shard. A single ~1,200-file
    # run lost the browser ("Browser connection was closed") after 127-173
    # files, so ~1,000 stories never ran while the lane looked like an a11y
    # failure. Eight fresh browsers keep each run well under that.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - run: pnpm --filter @jovie/web exec playwright install chromium --with-deps
      - name: Run Storybook A11y Tests
        id: a11y-test
        run: pnpm --filter @jovie/web test:a11y --shard=${{ matrix.shard }}/8
      - name: A11y Results Summary
        if: always()
        run: |
          if [ "${{ steps.a11y-test.outcome }}" == "failure" ]; then
            echo "## A11y Check Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: Accessibility violations detected - blocking this PR." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "To run locally: pnpm --filter @jovie/web test:a11y" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## A11y Check Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: All Storybook components passed accessibility checks." >> "$GITHUB_STEP_SUMMARY"
          fi

  report-scheduled-failure:
    # Nothing fails silently (docs/design-system/GOVERNANCE.md): a red scheduled
    # run opens or updates one standing issue, deduped by title. Not required.
    name: Report scheduled failure
    needs: [ci-visual-path-changes, storybook-a11y]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Visual a11y lane red"
          BODY=$(cat <<EOF
          The scheduled $GITHUB_WORKFLOW run failed on ${GITHUB_SHA::8}.

          Run: $RUN_URL

          Reproduce locally: \`pnpm --filter @jovie/web test:a11y\`
          EOF
          )
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == "Visual a11y lane red") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated standing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "design-governance" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
