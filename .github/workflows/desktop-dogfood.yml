name: desktop-dogfood
# clock-class: event-driven
# github-token-budget: 12 calls/run - authorize selects/decides dogfood SHA against main+CI+last staging feed; package re-checks main ancestry before and after publish
run-name: Desktop dogfood ${{ github.event.workflow_run.head_sha || github.sha }}

# Founder Mac dogfood channel (Tim's daily-driver MBP).
# Restores continuous signed Jovie Staging builds from green main so the
# installed staging app auto-updates without babysitting. Production publish
# stays on desktop-release.yml + VERSION stamps.
#
# Triggers:
# - Successful CI on main (exact SHA) — primary event path.
# - Manual dispatch for bootstrap / force rebuild of current main tip.
# No cron: the cron allowlist is frozen; the next green CI is the backstop.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Publish even when desktop source matches the last dogfood feed"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: desktop-dogfood-publisher-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize dogfood desktop publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.select.outputs.release_sha }}
      should_release: ${{ steps.decide.outputs.should_release || steps.select.outputs.should_release }}
    steps:
      - name: Checkout quota-safe mainline resolvers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: mainline-resolvers
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/resolve-main-sha.sh
            .github/scripts/gh-api-hold.sh
          sparse-checkout-cone-mode: false

      - name: Stage mainline resolvers outside the release checkout
        shell: bash
        run: |
          set -euo pipefail
          cp mainline-resolvers/.github/scripts/resolve-main-sha.sh "$RUNNER_TEMP/resolve-main-sha.sh"
          cp mainline-resolvers/.github/scripts/gh-api-hold.sh "$RUNNER_TEMP/gh-api-hold.sh"
          rm -rf mainline-resolvers

      - name: Select dogfood generation
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '240'
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          MANUAL_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_RUN_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_RUN_PATH: ${{ github.event.workflow_run.path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            [[ "$TRIGGER_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]] &&
              [ "$TRIGGER_HEAD_REPOSITORY" = "$REPOSITORY" ] &&
              [ "$TRIGGER_RUN_EVENT" = "push" ] &&
              [ "$TRIGGER_RUN_PATH" = ".github/workflows/ci.yml" ] || {
              echo "::error::Dogfood trigger was not an exact successful main CI push run."
              exit 1
            }
            release_sha="$TRIGGER_HEAD_SHA"
          else
            [[ "$MANUAL_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Manual dogfood dispatch did not resolve a full commit SHA."
              exit 1
            }
            release_sha="$MANUAL_SHA"
          fi

          current_main_sha="$(bash "$RUNNER_TEMP/resolve-main-sha.sh" "$REPOSITORY")"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve exact current main for dogfood authorization."
            exit 1
          }
          if [ "$current_main_sha" != "$release_sha" ]; then
            mainline_compare="$(bash "$RUNNER_TEMP/gh-api-hold.sh" api \
              "repos/$REPOSITORY/compare/$release_sha...$current_main_sha")"
            jq -e --arg release "$release_sha" --arg current "$current_main_sha" '
              type == "object" and
              .status == "ahead" and
              .base_commit.sha == $release and
              .merge_base_commit.sha == $release and
              (.ahead_by | type == "number" and . > 0 and floor == .) and
              (.commits | type == "array" and length > 0 and .[-1].sha == $current) and
              .behind_by == 0
            ' >/dev/null <<<"$mainline_compare" || {
              echo "::notice::Dogfood generation $release_sha left main's lineage (main is $current_main_sha); skipping."
              exit 0
            }
            echo "::notice::Dogfood generation $release_sha is a trusted ancestor of current main $current_main_sha; continuing forward-only."
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_REBUILD" = "true" ]; then
            echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Explicit dogfood rebuild authorized for $release_sha."
            exit 0
          fi

          # Prove exact green CI for the candidate when dispatched manually
          # without force, or when reconciling an ancestor via workflow_run.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ci_workflow="$(bash "$RUNNER_TEMP/gh-api-hold.sh" api \
              "repos/$REPOSITORY/actions/workflows/ci.yml")"
            jq -e '
              type == "object" and
              (.id | type == "number" and . >= 1) and
              .name == "CI" and
              .path == ".github/workflows/ci.yml"
            ' >/dev/null <<<"$ci_workflow" || {
              echo "::error::CI workflow identity is malformed."
              exit 1
            }
            ci_workflow_id="$(jq -r '.id' <<<"$ci_workflow")"
            ci_runs="$(bash "$RUNNER_TEMP/gh-api-hold.sh" api \
              "repos/$REPOSITORY/actions/workflows/$ci_workflow_id/runs?branch=main&head_sha=$release_sha&per_page=100")"
            jq -e --arg repo "$REPOSITORY" --arg sha "$release_sha" '
              type == "object" and
              (.workflow_runs | type == "array") and
              ([.workflow_runs[]? | select(
                .head_sha == $sha and
                .head_branch == "main" and
                .head_repository.full_name == $repo and
                .event == "push" and
                .path == ".github/workflows/ci.yml" and
                .status == "completed" and
                .conclusion == "success"
              )] | length) >= 1
            ' >/dev/null <<<"$ci_runs" || {
              echo "::error::Current main lacks an exact successful CI run for dogfood publication."
              exit 1
            }
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact authorized main
        if: ${{ steps.select.outputs.release_sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.release_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether desktop source needs a dogfood publish
        id: decide
        if: ${{ steps.select.outputs.release_sha != '' && steps.select.outputs.should_release != 'true' }}
        env:
          RELEASE_SHA: ${{ steps.select.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '240'
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          staging_release="$(bash .github/scripts/gh-api-hold.sh api \
            "repos/$REPOSITORY/releases/tags/desktop-staging")" || {
            echo "::error::Signed dogfood baseline (desktop-staging) is unavailable; use workflow_dispatch with force_rebuild=true once."
            exit 1
          }
          staging_baseline="$(jq -er '
            select(type == "object" and .tag_name == "desktop-staging")
            | .target_commitish
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' <<<"$staging_release")" || {
            echo "::error::Signed dogfood baseline has no exact source revision."
            exit 1
          }
          git cat-file -e "${staging_baseline}^{commit}"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          if [ "$staging_baseline" = "$RELEASE_SHA" ]; then
            echo "Exact dogfood generation $RELEASE_SHA is already published."
            exit 0
          fi
          git merge-base --is-ancestor "$staging_baseline" "$RELEASE_SHA" || {
            echo "::error::Signed dogfood baseline is not an ancestor of the candidate."
            exit 1
          }
          if git merge-base --is-ancestor "$RELEASE_SHA" "$staging_baseline"; then
            echo "Candidate $RELEASE_SHA is already covered by newer dogfood publish $staging_baseline."
            exit 0
          fi
          desktop_changes="$(git diff --name-status --find-renames \
            "$staging_baseline" "$RELEASE_SHA" -- \
            .github/workflows/desktop-dogfood.yml \
            .github/workflows/desktop-release.yml \
            apps/desktop/build apps/desktop/electron-builder.yml \
            apps/desktop/electron-builder.staging.yml apps/desktop/package.json \
            apps/desktop/scripts apps/desktop/src pnpm-lock.yaml \
            scripts/desktop-release-assets.mjs)"
          if [ -n "$desktop_changes" ]; then
            printf '%s\n' "$desktop_changes"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Verified main contains unpublished dogfood desktop changes."
          else
            echo "Dogfood feed already contains the current desktop source."
          fi

  publish:
    name: Publish dogfood desktop prerelease
    needs: [authorize]
    if: >-
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.should_release == 'true' &&
      needs.authorize.outputs.release_sha != ''
    timeout-minutes: 45
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
      HAS_MAC_SIGNING_CREDENTIALS: ${{ secrets.MAC_CERTIFICATE_BASE64 != '' && secrets.MAC_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_API_CREDENTIALS: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate authorized mainline source before packaging
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '600'
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(bash .github/scripts/resolve-main-sha.sh "$REPOSITORY")"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve exact current main before dogfood packaging."
            exit 1
          }
          if [ "$current_main_sha" != "$RELEASE_SHA" ]; then
            mainline_compare="$(bash .github/scripts/gh-api-hold.sh api \
              "repos/$REPOSITORY/compare/$RELEASE_SHA...$current_main_sha")"
            jq -e --arg release "$RELEASE_SHA" --arg current "$current_main_sha" '
              type == "object" and
              .status == "ahead" and
              .base_commit.sha == $release and
              .merge_base_commit.sha == $release and
              (.ahead_by | type == "number" and . > 0 and floor == .) and
              (.commits | type == "array" and length > 0 and .[-1].sha == $current) and
              .behind_by == 0
            ' >/dev/null <<<"$mainline_compare" || {
              echo "::error::Dogfood generation $RELEASE_SHA is not a trusted ancestor of current main before packaging."
              exit 1
            }
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Prime Node toolcache
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-downloads-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/electron-builder*.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-downloads-

      - name: Compute monotonic staging release version
        id: staging-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node apps/desktop/scripts/sync-version.mjs \
            --staging-version "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Require staging signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          [ "$HAS_MAC_SIGNING_CREDENTIALS" = "true" ] &&
            [ "$HAS_APPLE_API_CREDENTIALS" = "true" ] &&
            [ "$HAS_APPLE_TEAM_ID" = "true" ] || {
            echo "::error::Dogfood publication requires macOS signing certificate, App Store Connect API key, and Apple team ID secrets."
            exit 1
          }

      - name: Validate rolling staging prerelease
        id: prepare-staging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/desktop-release-assets.mjs prepare \
            --environment staging \
            --sha "$RELEASE_SHA" \
            --version "${{ steps.staging-version.outputs.version }}"
          status=$?
          set -e
          bash .github/scripts/desktop-quota-defer-exit.sh "$status"

      - name: Import Apple Developer cert (macOS)
        if: ${{ steps.prepare-staging.outputs.quota_deferred != 'true' }}
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/jovie-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MAC_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychain -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              awk '/"Developer ID Application:/{print $2}'
          )"
          SIGNING_IDENTITY_COUNT="$(
            printf '%s\n' "$SIGNING_IDENTITY" |
              awk 'NF { count++ } END { print count + 0 }'
          )"
          [ "$SIGNING_IDENTITY_COUNT" -eq 1 ] || {
            echo "::error::Expected exactly one Developer ID Application identity."
            exit 1
          }

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "JOVIE_MAC_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Stage Apple API key (macOS)
        if: ${{ steps.prepare-staging.outputs.quota_deferred != 'true' }}
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          if printf '%s' "$APPLE_API_KEY_CONTENTS" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_CONTENTS" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_CONTENTS" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          head -1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY" || {
            echo "::error::Staged Apple API key is not a valid PEM .p8 file"
            exit 1
          }
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package staging desktop app
        if: ${{ steps.prepare-staging.outputs.quota_deferred != 'true' }}
        env:
          JOVIE_DESKTOP_SOURCE_REVISION: ${{ env.RELEASE_SHA }}
          JOVIE_RELEASE_DMG: 'true'
          ELECTRON_ENV: staging
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
        run: pnpm --filter @jovie/desktop package:staging

      - name: Verify staging desktop artifact set
        if: ${{ steps.prepare-staging.outputs.quota_deferred != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${{ steps.staging-version.outputs.version }}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-staging\.[1-9][0-9]*\.[1-9][0-9]*$ ]] || {
            echo "::error::Staging version is not valid prerelease semver."
            exit 1
          }
          staging_files=(
            "apps/desktop/dist/Jovie-Staging-${release_version}-universal.dmg"
            "apps/desktop/dist/Jovie-Staging-${release_version}-universal.dmg.blockmap"
            "apps/desktop/dist/Jovie-Staging-${release_version}-universal.zip"
            "apps/desktop/dist/Jovie-Staging-${release_version}-universal.zip.blockmap"
            "apps/desktop/dist/staging-mac.yml"
          )
          for staging_file in "${staging_files[@]}"; do
            [ -f "$staging_file" ] || {
              echo "::error::Expected staging desktop artifact is missing: $staging_file"
              exit 1
            }
          done

          staging_app="apps/desktop/dist/mac-universal/Jovie Staging.app"
          [ -d "$staging_app" ] || {
            echo "::error::Packaged staging app bundle is missing."
            exit 1
          }
          codesign --verify --deep --strict "$staging_app"
          spctl --assess --type execute --verbose=2 "$staging_app"
          xcrun stapler validate "$staging_app"

          identity_file="$staging_app/Contents/Resources/build-identity.json"
          cmp apps/desktop/build/build-identity.json "$identity_file"
          node -e '
            const fs = require("fs");
            const [file, version, sha] = process.argv.slice(1);
            const record = JSON.parse(fs.readFileSync(file, "utf8"));
            const exact = Object.keys(record).sort().join(",") === "builtAt,channel,sourceRevision,version" &&
              record.channel === "staging" && record.version === version &&
              record.sourceRevision === sha &&
              new Date(record.builtAt).toISOString() === record.builtAt;
            if (!exact) throw new Error("Packaged staging build identity is not exact.");
          ' "$identity_file" "$release_version" "$RELEASE_SHA"
          runtime_identity="$("$staging_app/Contents/MacOS/Jovie Staging" --print-build-identity | tail -n 1)"
          node -e '
            const fs = require("fs");
            const expected = {...JSON.parse(fs.readFileSync(process.argv[1], "utf8")), provenance: "verified"};
            if (JSON.stringify(JSON.parse(process.argv[2])) !== JSON.stringify(expected))
              throw new Error("Runtime staging build identity is not exact.");
          ' "$identity_file" "$runtime_identity"
          embedded_version="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$staging_app/Contents/Info.plist")"
          [ "$embedded_version" = "$release_version" ] || {
            echo "::error::Staging app embedded version is not exact."
            exit 1
          }
          update_config="$staging_app/Contents/Resources/app-update.yml"
          grep -Eq '^provider:[[:space:]]*generic[[:space:]]*$' "$update_config"
          grep -Eq '^url:[[:space:]]*https://github.com/JovieInc/Jovie/releases/download/desktop-staging[[:space:]]*$' "$update_config"
          grep -Eq '^channel:[[:space:]]*staging[[:space:]]*$' "$update_config"
          grep -Eq "^updaterCacheDirName:[[:space:]]*'?jovie-desktop-staging-updater'?[[:space:]]*$" "$update_config"

          staging_dmg="apps/desktop/dist/Jovie-Staging-${release_version}-universal.dmg"
          xcrun stapler validate "$staging_dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$staging_dmg"

      - name: Publish staging desktop prerelease
        id: publish-staging
        if: ${{ steps.prepare-staging.outputs.quota_deferred != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '600'
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(bash .github/scripts/resolve-main-sha.sh "$REPOSITORY")"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve exact current main before dogfood publication."
            exit 1
          }
          if [ "$current_main_sha" != "$RELEASE_SHA" ]; then
            mainline_compare="$(bash .github/scripts/gh-api-hold.sh api \
              "repos/$REPOSITORY/compare/$RELEASE_SHA...$current_main_sha")"
            jq -e --arg release "$RELEASE_SHA" --arg current "$current_main_sha" '
              type == "object" and
              .status == "ahead" and
              .base_commit.sha == $release and
              .merge_base_commit.sha == $release and
              (.ahead_by | type == "number" and . > 0 and floor == .) and
              (.commits | type == "array" and length > 0 and .[-1].sha == $current) and
              .behind_by == 0
            ' >/dev/null <<<"$mainline_compare" || {
              echo "::error::Dogfood generation $RELEASE_SHA is not a trusted ancestor of current main before publication."
              exit 1
            }
          fi
          set +e
          node scripts/desktop-release-assets.mjs upload-and-publish \
            --environment staging \
            --sha "$RELEASE_SHA" \
            --version="${{ steps.staging-version.outputs.version }}" \
            --dist "apps/desktop/dist"
          status=$?
          set -e
          bash .github/scripts/desktop-quota-defer-exit.sh "$status"

      - name: Clean up keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Clean up Apple API key
        if: always() && env.APPLE_API_KEY != ''
        run: |
          rm -f "$APPLE_API_KEY"
