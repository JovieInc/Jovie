name: Test Flakiness Report
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: Retry artifacts exist only after test workflows terminate; this hop clusters them, files Linear signatures and publishes bound queue results without rerunning a suite.
# removal-trigger: Collapse this hop when each test producer emits the shared flakiness report and ratchet result in-band from the same exact artifacts.

on:
  workflow_run:
    workflows: [CI, Changed-Evidence Test Suites, E2E Full Browser Matrix]
    types: [completed]
    branches: [main, 'gh-readonly-queue/main/**']
  workflow_dispatch:
    inputs:
      merge_group_run_id:
        description: Completed merge-group CI run to publish (optional)
        type: string
        required: false

concurrency:
  # Serialize Linear writes; queue publication cannot replace main analysis.
  group: test-flakiness-report-${{ github.event.workflow_run.event || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  analyze-flakiness:
    name: Analyze Test Flakiness
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Exercise retry-cluster and dependency-parity contracts
        if: github.event_name == 'workflow_dispatch'
        run: node --test scripts/file-quarantine-clusters.test.mjs .github/scripts/dependency-parity-evidence.test.mjs

      # Completed-run jobs/artifacts are immutable per (run id, attempt), so
      # each wake reads only runs it has not seen (JOV-7744).
      - name: Restore completed-run evidence
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flaky-run-cache
          key: flaky-run-evidence-${{ github.run_id }}
          restore-keys: flaky-run-evidence-

      # Reads ride the Jovie Bot installation's own quota: this hop woke on
      # every main CI completion and drew on the repo's shared GITHUB_TOKEN
      # bucket (1,000 REST/h) that ran dry three times on 2026-10-13. It is
      # never merge_group-reachable (workflow_run runs the default branch's
      # file) and only reads; github.token stays the fallback.
      - name: Generate Jovie Bot read token
        id: read-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read

      # Keep exhaustive seven-day quarantine collection off this hot path.
      # Merge-queue volume exceeds GitHub's 1,000-result search window, and
      # missing quarantine evidence cannot authorize a ledger change.
      - name: Analyze test results from recent runs
        id: analyze
        env:
          GITHUB_TOKEN: ${{ steps.read-token.outputs.token || secrets.GITHUB_TOKEN }}
          # gh run download reads Unit Tests unit-flaky-* artifacts.
          GH_TOKEN: ${{ steps.read-token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FLAKY_RUN_CACHE_DIR: .flaky-run-cache
        run: node .github/scripts/analyze-test-flakiness.js

      # The analyzer bounds the cache and emits a content-digest key (also on
      # a red high-flakiness exit); an unchanged cache matches an existing key.
      - name: Save completed-run evidence
        if: ${{ !cancelled() && steps.analyze.outputs.run_evidence_key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flaky-run-cache
          key: ${{ steps.analyze.outputs.run_evidence_key }}

      - name: Check flaky-rate ratchet
        id: ratchet
        if: ${{ !cancelled() && steps.analyze.outputs.flaky_count != '' }}
        env:
          FLAKY_COUNT: ${{ steps.analyze.outputs.flaky_count }}
        run: node .github/scripts/check-flaky-ratchet.js

      - name: Upload flakiness report
        if: always() && hashFiles('flakiness-report.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flakiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            flakiness-report.md
            flakiness-clusters.json
          retention-days: 90

      # Signals: a test failing then passing on retry is direct flake evidence.
      # Cross-shard and queue-only failures are clustered diagnostic signals;
      # neither alone authorizes quarantine. Three distinct successful retry
      # attempts in 24h make a signature a candidate, never three shards.
      # This positive-only filing path never collects clean recovery history
      # or writes the ledger. A red analyzer/ratchet must still file evidence.
      - name: File verified failure signatures in Linear
        if: ${{ !cancelled() && steps.analyze.outputs.signature_quarantine_candidates != '' && steps.analyze.outputs.signature_quarantine_candidates != '0' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/file-quarantine-clusters.mjs --report-only

      - name: File Linear remediation when the ratchet is red
        if: ${{ failure() && steps.ratchet.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          FLAKY_COUNT: ${{ steps.analyze.outputs.flaky_count || '0' }}
          RATCHET_STATUS: ${{ steps.ratchet.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/flaky-test-filing-intake.mjs

      - name: Summarize report
        if: always()
        env:
          FLAKY_COUNT: ${{ steps.analyze.outputs.flaky_count || 'unknown' }}
          RETRY_RATE: ${{ steps.analyze.outputs.retry_rate || 'unknown' }}
          HIGH_SEVERITY: ${{ steps.analyze.outputs.high_severity || 'unknown' }}
          RATCHET_STATUS: ${{ steps.ratchet.outcome }}
        run: |
          {
            echo "### Test flakiness report"
            echo
            echo "- Flaky tests: $FLAKY_COUNT"
            echo "- High severity: $HIGH_SEVERITY"
            echo "- Retry rate: $RETRY_RATE%"
            echo "- Ratchet: $RATCHET_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-queue-results:
    name: Publish verified merge-group test results
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.merge_group_run_id != '') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.workflow_id == 178737329 &&
      github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the completed run's XML is read; producer source is never checked
      # out with credentials. Publication is limited to failure-containing runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare verified failure-containing JUnit reports
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_JUNIT_RUN_ID: ${{ inputs.merge_group_run_id }}
        run: node .github/scripts/publish-queue-junit.mjs
      - name: Publish queue results to Codecov
        if: ${{ steps.reports.outputs.upload == 'true' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          flags: mergegroup-unittests
          override_commit: ${{ steps.reports.outputs.head_sha }}
          override_branch: ${{ steps.reports.outputs.branch }}
          override_build: ${{ steps.reports.outputs.run_id }}
          fail_ci_if_error: true
