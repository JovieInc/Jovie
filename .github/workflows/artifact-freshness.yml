name: Artifact Freshness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# necessary-trust-boundary: Actions observes desktop release/feed identity off-device; pages Summer on certified→published→feed divergence.
# removal-trigger: Remove once Ovi Shipping owns the stage graph with device heartbeats.

on:
  workflow_run:
    workflows: ['desktop-release']
    types: [completed]
  # No cron (JOV-INV-042). Stamp dwell waits on next desktop-release or workflow_dispatch.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read # stamp list/detail via github.token

concurrency:
  group: artifact-freshness
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile desktop stage graph
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile certified → published → feed
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >
          node scripts/artifact-freshness-reconcile.mjs
          --output "$RUNNER_TEMP/artifact-freshness.json"
      - name: Upload freshness receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-freshness.json
          retention-days: 14
          if-no-files-found: warn

  # Nothing fails without a repair or a success (JOV-14467): a red main run opens or updates this
  # workflow's repair issue and the next green resolves it.
  report-outcome:
    name: Report outcome
    needs: [reconcile]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions
            .nvmrc
            packages/api-client
            scripts/lib
            scripts/remediation-signal-intake.mjs
      - uses: ./.github/actions/report-outcome
        with:
          results: ${{ toJSON(needs) }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
