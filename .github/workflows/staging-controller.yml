name: Staging Controller
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Symphony
# capability-gap: Exact successful CI receipts are available only after the source CI workflow completes.
# revisit-trigger: Remove this hop when CI can invoke one post-success staging job without a workflow boundary.
run-name: ${{ github.event.workflow_run.head_sha }} from CI ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: {actions: read, contents: read}
concurrency: {group: staging-mutation, queue: max, cancel-in-progress: false}
jobs:
  authorize-staging:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs: {exact_sha: "${{ steps.lineage.outputs.exact_sha }}", outcome: "${{ steps.routing.outputs.outcome }}"}
    steps:
      - name: Fetch sealed product-lane release receipt
        env: {EXPECTED_SHA: "${{ github.event.workflow_run.head_sha }}", REPOSITORY: "${{ github.repository }}", SOURCE_CI_RUN_ID: "${{ github.event.workflow_run.id }}", SOURCE_CI_RUN_ATTEMPT: "${{ github.event.workflow_run.run_attempt }}", GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/product-lane-release"
          receipt_name="product-lane-release-${EXPECTED_SHA}-${SOURCE_CI_RUN_ATTEMPT}"
          artifact_id="$(gh api \
            "repos/$REPOSITORY/actions/artifacts?name=$receipt_name&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty')"
          if [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]; then
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$RUNNER_TEMP/product-lane-release/receipt.zip"
            unzip -q "$RUNNER_TEMP/product-lane-release/receipt.zip" \
              -d "$RUNNER_TEMP/product-lane-release"
            rm "$RUNNER_TEMP/product-lane-release/receipt.zip"
          else
            # A main attempt that was superseded or never release-authorized
            # seals no receipt; the lineage step resolves that outcome instead
            # of hard-failing the hop.
            echo "::notice::Source CI attempt $SOURCE_CI_RUN_ID/$SOURCE_CI_RUN_ATTEMPT sealed no $receipt_name artifact."
          fi
      - id: lineage
        env: {EXPECTED_SHA: "${{ github.event.workflow_run.head_sha }}", REPOSITORY: "${{ github.repository }}", SOURCE_CI_RUN_ID: "${{ github.event.workflow_run.id }}", SOURCE_CI_RUN_ATTEMPT: "${{ github.event.workflow_run.run_attempt }}", SOURCE_CI_WORKFLOW_PATH: "${{ github.event.workflow_run.path }}", SOURCE_CI_HEAD_BRANCH: "${{ github.event.workflow_run.head_branch }}", SOURCE_CI_HEAD_REPOSITORY: "${{ github.event.workflow_run.head_repository.full_name }}", GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] && [ "$SOURCE_CI_WORKFLOW_PATH" = ".github/workflows/ci.yml" ] && [ "$SOURCE_CI_HEAD_BRANCH" = "main" ] && [ "$SOURCE_CI_HEAD_REPOSITORY" = "$REPOSITORY" ] || { echo "::error::Staging Controller received malformed exact-main CI evidence."; exit 1; }
          receipt="$RUNNER_TEMP/product-lane-release/release.json"
          receipt_missing=false
          if [ -f "$receipt" ]; then
            jq -e --arg sha "$EXPECTED_SHA" --arg run "$SOURCE_CI_RUN_ID" '.provenance.sha == $sha and .releaseRouting.sourceMainRunId == $run and .aggregatePassed == true and (.selectedLanes | type == "array")' "$receipt" >/dev/null || { echo "::error::Canonical release lineage receipt does not match the exact successful CI attempt."; exit 1; }
          else
            receipt_missing=true
          fi
          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha // empty')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve exact main before staging mutation."; exit 1; }
          outcome=proceed replacement_sha="$EXPECTED_SHA"
          if [ "$receipt_missing" = true ]; then
            # An authorized attempt always seals its receipt, so a missing
            # receipt means this generation was never release-authorized. It is
            # superseded once current main is a strict descendant; a current
            # head without its own receipt stays fail-closed.
            if [ "$current_main" = "$EXPECTED_SHA" ]; then
              echo "::error::Current main CI attempt sealed no product-lane release receipt."
              exit 1
            fi
            compare_status="$(gh api "repos/$REPOSITORY/compare/${EXPECTED_SHA}...${current_main}" --jq '.status // empty')"
            if [ "$compare_status" != ahead ]; then
              echo "::error::Unreceipted CI attempt $EXPECTED_SHA is not an ancestor of current main; supersession cannot be proven."
              exit 1
            fi
            outcome=superseded replacement_sha="$current_main"
          elif ! jq -e '.selectedLanes | index("web") != null' "$receipt" >/dev/null; then
            outcome=not_applicable
          elif [ "$current_main" != "$EXPECTED_SHA" ]; then
            compare_status="$(gh api "repos/$REPOSITORY/compare/${EXPECTED_SHA}...${current_main}" --jq '.status // empty')"
            if [ "$compare_status" != ahead ]; then
              outcome=superseded replacement_sha="$current_main"
            else
              newer_runs="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100")"
              while IFS=$'\t' read -r candidate_id candidate_attempt candidate_sha; do
                [[ "$candidate_id" =~ ^[1-9][0-9]*$ ]] && [[ "$candidate_attempt" =~ ^[1-9][0-9]*$ ]] && [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
                # A later CI run can replay an older SHA after a main rewind.
                # Only a strict descendant may replace this staging generation.
                replacement_status="$(gh api "repos/$REPOSITORY/compare/${EXPECTED_SHA}...${candidate_sha}" --jq '.status // empty')"
                [ "$replacement_status" = ahead ] || continue
                candidate_status="$(gh api "repos/$REPOSITORY/compare/${candidate_sha}...${current_main}" --jq '.status // empty')"
                [[ "$candidate_status" =~ ^(ahead|identical)$ ]] || continue
                candidate_name="product-lane-release-${candidate_sha}-${candidate_attempt}"
                if gh run download "$candidate_id" --repo "$REPOSITORY" --name "$candidate_name" --dir "$RUNNER_TEMP/product-lane-$candidate_id" && jq -e --arg sha "$candidate_sha" --arg run "$candidate_id" '.provenance.sha == $sha and .releaseRouting.sourceMainRunId == $run and .aggregatePassed == true and (.selectedLanes | index("web") != null)' "$RUNNER_TEMP/product-lane-$candidate_id/release.json" >/dev/null; then
                  outcome=superseded replacement_sha="$candidate_sha"; break
                fi
              done < <(jq -r --argjson source "$SOURCE_CI_RUN_ID" '[.workflow_runs[] | select(.id > $source and .head_branch == "main" and .path == ".github/workflows/ci.yml" and .conclusion == "success")] | sort_by(.id) | reverse[] | [.id, .run_attempt, .head_sha] | @tsv' <<<"$newer_runs")
            fi
          fi
          printf 'exact_sha=%s\noutcome=%s\nreplacement_sha=%s\n' "$EXPECTED_SHA" "$outcome" "$replacement_sha" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$EXPECTED_SHA" --arg outcome "$outcome" --arg replacementSha "$replacement_sha" --arg sourceCiRunId "$SOURCE_CI_RUN_ID" '{schema:"jovie-staging-lineage/v1", sha:$sha, outcome:$outcome, replacementSha:$replacementSha, sourceCiRunId:$sourceCiRunId}' > "$RUNNER_TEMP/staging-lineage.json"
          echo "::notice::Staging lineage $EXPECTED_SHA outcome=$outcome replacement=$replacement_sha"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: steps.lineage.outputs.outcome == 'not_applicable'
        with: {ref: "${{ github.event.workflow_run.head_sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        if: steps.lineage.outputs.outcome == 'not_applicable'
        with: {node-version: 24.21.0}
      - id: routing
        env: {INITIAL_OUTCOME: "${{ steps.lineage.outputs.outcome }}", EXPECTED_SHA: "${{ github.event.workflow_run.head_sha }}", SOURCE_CI_RUN_ID: "${{ github.event.workflow_run.id }}", REPOSITORY: "${{ github.repository }}", GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          outcome="$INITIAL_OUTCOME"
          if [ "$outcome" = not_applicable ]; then
            current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha // empty')"
            [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Current main identity is malformed."; exit 1; }
            if [ "$current_main" != "$EXPECTED_SHA" ]; then
              relation="$(gh api "repos/$REPOSITORY/compare/${EXPECTED_SHA}...${current_main}" --jq '.status // empty')"
              [ "$relation" = ahead ] || { echo "::error::Staging carryover main is not on the source lineage."; exit 1; }
              outcome=superseded
              jq --arg replacement "$current_main" '.outcome="superseded" | .replacementSha=$replacement' "$RUNNER_TEMP/staging-lineage.json" > "$RUNNER_TEMP/staging-lineage-next.json"
            else
              CANONICAL_STAGING_IDENTITY="$(curl --fail --silent --show-error --max-time 20 https://staging.jov.ie/api/health/build-info)"
              export CANONICAL_STAGING_IDENTITY
              node --input-type=module <<'NODE' > "$RUNNER_TEMP/staging-carryover.json"
          import { readFileSync } from 'node:fs';
          import { resolveStagingCarryover } from './.github/scripts/staging-lane-carryover.mjs';
          const env = process.env;
          console.log(JSON.stringify(resolveStagingCarryover({
            repository: env.REPOSITORY, expectedSha: env.EXPECTED_SHA, sourceCiRunId: env.SOURCE_CI_RUN_ID,
            identity: JSON.parse(env.CANONICAL_STAGING_IDENTITY),
            currentReceipt: JSON.parse(readFileSync(`${env.RUNNER_TEMP}/product-lane-release/release.json`, 'utf8')),
          })));
          NODE
              outcome="$(jq -er '.outcome' "$RUNNER_TEMP/staging-carryover.json")"
              jq --arg outcome "$outcome" --slurpfile proof "$RUNNER_TEMP/staging-carryover.json" '.outcome=$outcome | .carryover=$proof[0]' "$RUNNER_TEMP/staging-lineage.json" > "$RUNNER_TEMP/staging-lineage-next.json"
            fi
            mv "$RUNNER_TEMP/staging-lineage-next.json" "$RUNNER_TEMP/staging-lineage.json"
          fi
          printf 'outcome=%s\n' "$outcome" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "staging-lineage-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/staging-lineage.json", if-no-files-found: error, retention-days: 30}
  staging-release:
    needs: [authorize-staging]
    if: ${{ needs.authorize-staging.result == 'success' && needs.authorize-staging.outputs.outcome == 'proceed' }}
    uses: ./.github/workflows/production-release.yml
    permissions: {actions: read, attestations: write, contents: read, id-token: write}
    with: {expected_sha: "${{ needs.authorize-staging.outputs.exact_sha }}", release_mode: staging}
    secrets: inherit
  staging-result:
    needs: [authorize-staging, staging-release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env: {AUTHORIZATION_RESULT: "${{ needs.authorize-staging.result }}", AUTHORIZATION_OUTCOME: "${{ needs.authorize-staging.outputs.outcome }}", EXACT_SHA: "${{ needs.authorize-staging.outputs.exact_sha || github.event.workflow_run.head_sha }}", RELEASE_RESULT: "${{ needs.staging-release.result }}", STAGING_ELIGIBLE: "${{ needs.staging-release.outputs.staging_eligible }}", STAGING_DEPLOYED: "${{ needs.staging-release.outputs.staging_deployed }}", STAGING_STATE: "${{ needs.staging-release.outputs.staging_state }}"}
        run: |
          set -euo pipefail
          if [ "$AUTHORIZATION_RESULT" != success ]; then echo "::error::Staging blocker: exact CI lineage authorization failed. Next: inspect the product-lane receipt. Proof: CI run ${{ github.event.workflow_run.id }}."; exit 1; fi
          if [ "$AUTHORIZATION_OUTCOME" = not_applicable ] || [ "$AUTHORIZATION_OUTCOME" = superseded ]; then
            outcome="$AUTHORIZATION_OUTCOME"
          elif [ "$RELEASE_RESULT" = success ] && [ "$STAGING_ELIGIBLE" != true ]; then
            outcome=superseded
          elif [ "$RELEASE_RESULT" != success ] || [ "$STAGING_DEPLOYED" != true ]; then
            echo "::error::Staging blocker: exact environment mutation or verification failed. Next: inspect build, canary, alias, and build-info proof. Proof: staging-deployment-$EXACT_SHA."; exit 1
          else
            outcome=deployed
          fi
          # Terminal data reconciles late completion and no-op outcomes.
          jq -n --arg repository '${{ github.repository }}' --arg sha "$EXACT_SHA" --arg outcome "$outcome" \
            --arg sourceCiRunId '${{ github.event.workflow_run.id }}' --arg sourceCiRunAttempt '${{ github.event.workflow_run.run_attempt }}' \
            --arg controllerRunId '${{ github.run_id }}' --arg controllerRunAttempt '${{ github.run_attempt }}' \
            '{schema:"jovie-staging-completion/v1", terminal:true, repository:$repository, sha:$sha, outcome:$outcome, sourceCiRunId:$sourceCiRunId, sourceCiRunAttempt:$sourceCiRunAttempt, controllerRunId:$controllerRunId, controllerRunAttempt:$controllerRunAttempt}' > "$RUNNER_TEMP/staging-completion.json"
          echo "Staging generation $EXACT_SHA finished as $outcome ($STAGING_STATE)."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "staging-completion-${{ github.run_attempt }}", path: "${{ runner.temp }}/staging-completion.json", if-no-files-found: error, retention-days: 30}
