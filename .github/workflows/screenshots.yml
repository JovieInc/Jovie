      - name: Stop production server
        if: always()
        run: |
          if [ -z "${SCREENSHOT_SERVER_PGID:-}" ]; then
            echo "::error::Screenshot server process group was not recorded."
            exit 1
          fi

          kill -- "-$SCREENSHOT_SERVER_PGID" 2>/dev/null || true
          for _attempt in $(seq 1 10); do
            if ! kill -0 -- "-$SCREENSHOT_SERVER_PGID" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          kill -KILL -- "-$SCREENSHOT_SERVER_PGID" 2>/dev/null || true
          sleep 1
          if kill -0 -- "-$SCREENSHOT_SERVER_PGID" 2>/dev/null; then
            echo "::error::Screenshot server process group is still running."
            exit 1
          fi

