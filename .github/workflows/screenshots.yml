          if-no-files-found: error
          retention-days: 3
          allow-images: true
          public-images: true
          diagnostic-paths: true

  publish:
    name: Publish Screenshot Catalog
    needs: generate
    # Captures from a dispatch on any other ref describe unmerged source.
    if: ${{ github.ref == 'refs/heads/main' && needs.generate.result == 'success' && needs.generate.outputs.catalog-changed == 'true' }}
    # Publishing generated assets is deliberately non-authoritative. The
    # repository's normal commit/push gates still block unsafe publication,
    # while a publication failure cannot retroactively invalidate the trusted
    # exact-head browser artifacts produced by `generate`.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download generated screenshot catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshot-catalog-${{ github.sha }}
          path: .

      - name: Verify downloaded screenshot catalog
        working-directory: apps/web
        run: pnpm exec tsx scripts/check-screenshot-catalog.ts

      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Create or update screenshot PR
        timeout-minutes: 90
        working-directory: .
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="screenshots/auto-update"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          # Check for existing open PR before pushing
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number \
            -q '.[0].number' 2>/dev/null || true)

          git checkout -b "$BRANCH"
          git add apps/web/public/product-screenshots/ apps/web/screenshot-catalog/current/
          git commit -m "chore: update product screenshots [auto]

          Triggered by ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"
          # Dedicated bot branch: always force-push latest generated screenshots.
          # `--force-with-lease` can fail with stale lease info when concurrent
          # screenshot runs update this branch between list + push.
          # Retry transient GitHub 500s, but gracefully skip when the branch is
          # merge-queue locked (GH006) so this workflow doesn't fail.
          PUSHED=false
          for ATTEMPT in 1 2 3; do
            set +e
            # Capture-only overrides must not leak into the repository's normal
            # pre-push tests. They intentionally alter database, dev chrome, and
            # auth behavior, so run the hook without the screenshot job env.
            PUSH_OUTPUT=$(env \
              -u DATABASE_URL \
              -u NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
              -u CLERK_SECRET_KEY \
              -u NEXT_DISABLE_TOOLBAR \
              -u NEXT_PUBLIC_CLERK_PROXY_DISABLED \
              -u E2E_USE_TEST_AUTH_BYPASS \
              -u E2E_CLERK_USER_ID \
              git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push --force origin "$BRANCH" 2>&1)
            PUSH_EXIT=$?
            set -e

            if [ "$PUSH_EXIT" -eq 0 ]; then
              PUSHED=true
              break
            fi

            if [[ "$PUSH_OUTPUT" == *"A pull request for this branch has been added to a merge queue"* ]] || [[ "$PUSH_OUTPUT" == *"cannot be updated"* ]]; then
              echo "$PUSH_OUTPUT"
              echo "Screenshot branch is queued for merge; skipping update for this run."
              exit 0
            fi

            if [[ "$PUSH_OUTPUT" == *"The requested URL returned error: 500"* ]] && [ "$ATTEMPT" -lt 3 ]; then
              echo "$PUSH_OUTPUT"
              echo "Transient GitHub 500 during push; retrying..."
              sleep $((ATTEMPT * 4))
              continue
            fi

            echo "$PUSH_OUTPUT"
            exit "$PUSH_EXIT"
          done

          if [ "$PUSHED" != "true" ]; then
            echo "Failed to push screenshot update branch after retries."
            exit 1
          fi

          hold_screenshot_merge_queue() {
            local in_progress queued listing hold
            in_progress="$(GH_TOKEN="$GH_ACTIONS_TOKEN" gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/production-controller.yml/runs?status=in_progress&per_page=100")"
            queued="$(GH_TOKEN="$GH_ACTIONS_TOKEN" gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/production-controller.yml/runs?status=queued&per_page=100")"
            listing="$(jq -n --argjson in_progress "$in_progress" --argjson queued "$queued" \
              '{total_count: (($in_progress.total_count // 0) + ($queued.total_count // 0)), workflow_runs: (($in_progress.workflow_runs // []) + ($queued.workflow_runs // []))}')"
            hold="$(printf '%s' "$listing" | node .github/scripts/hold-screenshot-mq-during-controller.mjs | jq -r '.hold')"
            if [ "$hold" = true ]; then
              echo "Holding merge-queue enrollment; Production Controller is in-flight."
              return 0
            fi
            return 1
          }

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR via force-push"
            if hold_screenshot_merge_queue; then
              exit 0
            fi
            echo "Native autoenroll owns queue mutation; the merge-queue label is retired."
          else
            PR_URL=$(gh pr create \
              --title "chore: update product screenshots" \
              --body "Auto-generated screenshot update triggered by ${GITHUB_SHA::8}.")
            if hold_screenshot_merge_queue; then
              exit 0
            fi
            echo "Opened $PR_URL. Native autoenroll owns queue mutation; the merge-queue label is retired."
          fi

  certify:
    name: Certify Screenshots
    needs: generate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Certify exact screen captures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCREEN_CERT_ARTIFACT_ID: ${{ needs.generate.outputs.marketing-artifact-id }}
          SCREEN_CERT_MARKETING_ARTIFACT: marketing-route-screenshots-${{ github.sha }}
        run: |
          mkdir -p .artifacts/screen-certification
          DIFF_BASE="${{ github.event.before }}"
          if [ -z "$DIFF_BASE" ] || [ "$DIFF_BASE" = "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$(git rev-parse HEAD^)"
          fi
          export SCREEN_CERT_DIFF_BASE="$DIFF_BASE"

          # Each screen below has its own dedicated producer artifact, so
          # certify them as independent invocations: one screen's failure
          # must not suppress the other's receipt or verdict.
          STATUS=0
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.profile-artifact-id }} \
            --screen-id=web.public-profile \
            --receipt-out=.artifacts/screen-certification/combined.json || STATUS=$?
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.artists-artifact-id }} \
            --screen-id=web.artists \
            --receipt-out=.artifacts/screen-certification/artists.json || STATUS=$?
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.smartlink-release-artifact-id }} \
            --screen-id=web.smartlink-release \
            --receipt-out=.artifacts/screen-certification/smartlink-release.json || STATUS=$?
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.smartlink-track-artifact-id }} \
            --screen-id=web.smartlink-track \
            --receipt-out=.artifacts/screen-certification/smartlink-track.json || STATUS=$?
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.hud-isolated-artifact-id }} \
            --screen-id=web.hud-isolated \
            --receipt-out=.artifacts/screen-certification/hud-isolated.json || STATUS=$?
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.tasks-artifact-id }} \
            --screen-id=web.tasks \
            --receipt-out=.artifacts/screen-certification/tasks.json || STATUS=$?
          node scripts/invariants/screen-certification.mjs \
            --artifact-id=${{ needs.generate.outputs.contacts-artifact-id }} \
            --screen-id=web.contacts \
            --receipt-out=.artifacts/screen-certification/contacts.json || STATUS=$?
          # JOV-8170: the public-screens producer emits one artifact per screen;
          # certify each independently so one screen's failure cannot suppress
          # another's receipt or verdict.
          for ENTRY in \
            "web.root-document|${{ needs.generate.outputs.root-document-artifact-id }}" \
            "web.root-layout|${{ needs.generate.outputs.root-layout-artifact-id }}" \
            "web.legal-shell|${{ needs.generate.outputs.legal-shell-artifact-id }}" \
            "web.legal-privacy|${{ needs.generate.outputs.legal-privacy-artifact-id }}" \
            "web.legal-terms|${{ needs.generate.outputs.legal-terms-artifact-id }}" \
            "web.legal-cookies|${{ needs.generate.outputs.legal-cookies-artifact-id }}" \
            "web.legal-dmca|${{ needs.generate.outputs.legal-dmca-artifact-id }}" \
            "web.playlists-index|${{ needs.generate.outputs.playlists-index-artifact-id }}" \
            "web.brand|${{ needs.generate.outputs.brand-artifact-id }}" \
            "web.report|${{ needs.generate.outputs.report-artifact-id }}" \
            "web.start|${{ needs.generate.outputs.start-artifact-id }}" \
            "web.marketing-solutions|${{ needs.generate.outputs.marketing-solutions-artifact-id }}" \
            "web.public-profile-about|${{ needs.generate.outputs.public-profile-about-artifact-id }}"; do
            SCREEN="${ENTRY%%|*}"
            ARTIFACT_ID="${ENTRY##*|}"
            node scripts/invariants/screen-certification.mjs \
              --artifact-id="$ARTIFACT_ID" \
              --screen-id="$SCREEN" \
              --receipt-out=".artifacts/screen-certification/${SCREEN#*.}.json" || STATUS=$?
          done
          exit "$STATUS"

      - name: Upload screen certification receipts
        if: always() && hashFiles('.artifacts/screen-certification/*.json') != ''
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: screen-certification-${{ github.sha }}
          path: .artifacts/screen-certification/*.json
          if-no-files-found: error
          retention-days: 14
