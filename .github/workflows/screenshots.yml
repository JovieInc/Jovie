# Auto-generate product screenshots when UI code changes on main.
# Captures demo-route screenshots (no database needed), checks if they
# differ from the committed versions, and opens/updates a single PR.
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: Immutable artifact IDs and the completed producer-job attestation exist only after Generate Screenshots finishes; the read-only downstream job verifies those bytes without receiving mutation credentials.
# removal-trigger: Collapse this hop when GitHub can expose the immutable uploaded artifact and completed producer-job attestation to a same-job certification step.
name: Product Screenshots
# clock-class: skip-if-unchanged

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/upload-safe-playwright-artifact/**'
      - '.github/scripts/guard-playwright-artifacts.mjs'
      - '.github/workflows/screenshots.yml'
      - 'apps/web/app/artists/**'
      - 'apps/web/app/hud/**'
      - 'apps/web/lib/admin/roles.ts'
      - 'apps/web/lib/auth/gate.ts'
      - 'apps/web/app/app/(shell)/tasks/**'
      - 'apps/web/app/app/(shell)/dashboard/tasks/**'
      - 'apps/web/app/app/(shell)/contacts/**'
      - 'apps/web/app/api/dashboard/contacts/**'
      - 'apps/web/lib/screen-cert/**'
      - 'apps/web/lib/tasks/**'
      - 'apps/web/lib/contacts/**'
      - 'apps/web/lib/render-fixture-policy.ts'
      - 'apps/web/lib/e2e/**'
      - 'apps/web/app/app/(shell)/dashboard/actions/**'
      - 'apps/web/components/features/dashboard/tasks/**'
      - 'apps/web/components/features/dashboard/organisms/contacts-table/**'
      - 'apps/web/app/(marketing)/**'
      - 'apps/web/app/(home)/**'
      - 'apps/web/app/(dynamic)/**'
      - 'apps/web/app/demo/**'
      - 'apps/web/app/go/**'
      - 'apps/web/app/r/**'
      - 'apps/web/app/s/**'
      - 'apps/web/app/\[username\]/**'
      - 'apps/web/components/**'
      - 'apps/web/data/artistProfilePageOrder.ts'
      - 'apps/web/data/homepageLaunchCopy.ts'
      - 'apps/web/data/marketing/**'
      - 'apps/web/features/**'
      - 'apps/web/lib/agent-os/visual-qa/**'
      - 'apps/web/lib/screenshots/**'
      - 'apps/web/scripts/check-screenshot-catalog.ts'
      - 'apps/web/scripts/png-optimization.ts'
      - 'apps/web/scripts/stage-screenshot-catalog-transfer.ts'
      - 'apps/web/scripts/sync-screenshot-public-export.ts'
      - 'apps/web/tests/product-screenshots/**'
      - 'apps/web/tests/visual-qa/**'
      - 'apps/web/tailwind.config.*'
      - 'apps/web/app/**/layout.tsx'
      - 'apps/web/app/globals.css'
      - 'packages/ui/**'
      - '!apps/web/public/product-screenshots/**'
      - '!apps/web/screenshot-catalog/current/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshots
  # GitHub already keeps only the newest pending run in a concurrency group.
  # Let the active ~20-minute capture finish instead of discarding its proof on
  # every qualifying main push; the newest pending head runs next.
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Screenshots
    runs-on: ubuntu-latest
    # The catalog currently takes ~17 minutes. Publication runs in a separate,
    # non-authoritative job so its repository gate cannot taint an otherwise
    # successful exact-head proof producer.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    outputs:
      marketing-artifact-id: ${{ steps.marketing-captures.outputs.artifact-id }}
      profile-artifact-id: ${{ steps.profile-proof.outputs.artifact-id }}
      artists-artifact-id: ${{ steps.artists-proof.outputs.artifact-id }}
      smartlink-release-artifact-id: ${{ steps.smartlink-release-proof.outputs.artifact-id }}
      smartlink-track-artifact-id: ${{ steps.smartlink-track-proof.outputs.artifact-id }}
      hud-isolated-artifact-id: ${{ steps.hud-isolated-proof.outputs.artifact-id }}
      tasks-artifact-id: ${{ steps.tasks-proof.outputs.artifact-id }}
      contacts-artifact-id: ${{ steps.contacts-proof.outputs.artifact-id }}
      root-document-artifact-id: ${{ steps.root-document-proof.outputs.artifact-id }}
      root-layout-artifact-id: ${{ steps.root-layout-proof.outputs.artifact-id }}
      legal-shell-artifact-id: ${{ steps.legal-shell-proof.outputs.artifact-id }}
      legal-privacy-artifact-id: ${{ steps.legal-privacy-proof.outputs.artifact-id }}
      legal-terms-artifact-id: ${{ steps.legal-terms-proof.outputs.artifact-id }}
      legal-cookies-artifact-id: ${{ steps.legal-cookies-proof.outputs.artifact-id }}
      legal-dmca-artifact-id: ${{ steps.legal-dmca-proof.outputs.artifact-id }}
      playlists-index-artifact-id: ${{ steps.playlists-index-proof.outputs.artifact-id }}
      brand-artifact-id: ${{ steps.brand-proof.outputs.artifact-id }}
      report-artifact-id: ${{ steps.report-proof.outputs.artifact-id }}
      start-artifact-id: ${{ steps.start-proof.outputs.artifact-id }}
      marketing-solutions-artifact-id: ${{ steps.marketing-solutions-proof.outputs.artifact-id }}
      public-profile-about-artifact-id: ${{ steps.public-profile-about-proof.outputs.artifact-id }}
      catalog-changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://localhost/noop
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock
      CLERK_SECRET_KEY: sk_test_mock
      NEXT_DISABLE_TOOLBAR: '1'
      NEXT_PUBLIC_CLERK_PROXY_DISABLED: '1'
      E2E_USE_TEST_AUTH_BYPASS: '1'
      E2E_CLERK_USER_ID: user_test
      PUBLIC_NOAUTH_SMOKE: '1'
      # JOV-7126: server-only — never inlined client-side, so it cannot
      # change the marketing catalog's rendered bytes. Read by
      # lib/admin/roles.ts and lib/auth/gate.ts; see the hud-isolated
      # capture step below for why this must be job-level env.
      E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH: '1'
      # web.tasks / web.contacts producers: server-only, read by
      # isE2EFastOnboardingEnabled() (lib/e2e/runtime.ts). This is what lets
      # createE2EDashboardCoreData's synthetic profile fallback
      # (dashboard-data.ts) activate for any bypass session, which the tasks
      # and contacts fixtures gate on — see
      # apps/web/lib/screen-cert/app-shell-fixture-gate.ts. Its only other
      # readers (releases/actions.ts, onboarding/actions/connect-spotify.ts)
      # are not on any existing producer's render path, so this cannot
      # change bytes for the marketing catalog or the five screen-proof
      # producers above.
      E2E_FAST_ONBOARDING: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production app
        run: pnpm run build

      - name: Start production server
        env:
          # JOV-7126 follow-up: unset (or 0.0.0.0), the standalone server.js
          # bind address leaks into request.nextUrl.hostname for every
          # request it serves — Next.js derives that URL from the server's
          # own configured hostname, not the incoming Host header. The
          # dev-test-auth bypass's loopback trust check
          # (isLocalDevelopmentAutomationHostname in
          # lib/security/development-only.ts) only recognizes real loopback
          # names (localhost, 127.0.0.1, ::1, *.localhost) and correctly
          # rejects "0.0.0.0" as untrustworthy, so every producer that goes
          # through that bypass — currently only hud-isolated — got a 403
          # rather than a synthetic admin session. `next start` reads the
          # same env var, so this covers both server commands below.
          HOSTNAME: localhost
        run: |
          if [ -f .next/standalone/apps/web/server.js ]; then
            SERVER_COMMAND=(node .next/standalone/apps/web/server.js)
          else
            SERVER_COMMAND=(pnpm run start)
          fi
          setsid "${SERVER_COMMAND[@]}" > "$RUNNER_TEMP/product-screenshots-server.log" 2>&1 &
          SCREENSHOT_SERVER_PGID=$!
          echo "SCREENSHOT_SERVER_PGID=$SCREENSHOT_SERVER_PGID" >> "$GITHUB_ENV"
          for _attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for the production server to start."
          cat "$RUNNER_TEMP/product-screenshots-server.log"
          exit 1

      # Build/start can dirty tracked files or leave untracked non-ignored
      # artifacts. Exact-head provenance (JOV-4731) refuses GITHUB_SHA on a
      # dirty tree, so restore source cleanliness without touching ignored
      # build output (.next) or the already-running server.
      - name: Restore clean source tree for provenance
        working-directory: .
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA:-}"
          echo "Worktree before restore:"
          git status --porcelain --untracked-files=all || true
          git checkout -- .
          git clean -fd
          REMAINING="$(git status --porcelain --untracked-files=all)"
          if [ -n "$REMAINING" ]; then
            echo "::error::Source tree is still dirty after provenance restore; exact-head screenshots require a clean checkout."
            printf '%s\n' "$REMAINING"
            exit 1
          fi
          echo "Source tree is clean for exact-head screenshot provenance."

      - name: Capture exact marketing routes
        timeout-minutes: 30
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/marketing-routes.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=4
        env:
          BASE_URL: http://localhost:3000
          SCREENSHOT_BUILD_MODE: production

      - name: Upload exact marketing route captures
        id: marketing-captures
        if: >-
          always() &&
          hashFiles('apps/web/test-results/**/marketing-route.png', 'apps/web/test-results/**/receipt.json') != ''
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: marketing-route-screenshots-${{ github.sha }}
          path: |
            apps/web/test-results/**/marketing-route.png
            apps/web/test-results/**/receipt.json
          if-no-files-found: error
          retention-days: 14
          allow-images: true
          public-images: true
          diagnostic-paths: true

      - name: Certify route DOM invariants
        timeout-minutes: 30
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/route-dom-certification.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=1
        env:
          BASE_URL: http://localhost:3000
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          ROUTE_DOM_CERTIFICATION_OUTPUT_DIR: test-results/route-dom-certification

      - name: Upload route DOM certification
        if: ${{ always() && hashFiles('apps/web/test-results/route-dom-certification/**') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: route-dom-certification-${{ github.sha }}
          path: apps/web/test-results/route-dom-certification/
          if-no-files-found: error
          retention-days: 14
          diagnostic-paths: true

      - name: Capture public-profile screen proof
        timeout-minutes: 10
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/public-profile-screen-proof.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=1
        env:
          BASE_URL: http://localhost:3000
          SCREEN_PROOF_OUTPUT_DIR: test-results/screen-browser-proof
          SCREEN_PROOF_MEASUREMENTS: test-results/screen-browser-proof-measurements.json

      - name: Bind public-profile proof to producer provenance
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCER_JOB_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Generate Screenshots") | .id' | head -n 1)"
          if ! [[ "$PRODUCER_JOB_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not resolve the current producer job ID."
            exit 1
          fi
          node scripts/invariants/screen-proof-emit.mjs \
            --screen=web.public-profile \
            --head-sha="$GITHUB_SHA" \
            --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --bundle=apps/web/test-results/screen-browser-proof \
            --measurements=apps/web/test-results/screen-browser-proof-measurements.json \
            --out=apps/web/test-results/screen-browser-proof/screen-proof.json \
            --artifact-root="$GITHUB_WORKSPACE" \
            --producer-run-id="$GITHUB_RUN_ID" \
            --producer-run-attempt="$GITHUB_RUN_ATTEMPT" \
            --producer-job-id="$PRODUCER_JOB_ID" \
            --environment=local-production-build

      - name: Upload public-profile screen proof
        id: profile-proof
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: screen-browser-proof
          path: |
            apps/web/test-results/screen-browser-proof/screen-proof.json
            apps/web/test-results/screen-browser-proof/screenshots/desktop.png
            apps/web/test-results/screen-browser-proof/screenshots/mobile.png
          if-no-files-found: error
          retention-days: 14
          allow-images: true
          public-images: true
          diagnostic-paths: true

      - name: Capture /artists screen proof
        timeout-minutes: 10
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/artists-screen-proof.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=1
        env:
          BASE_URL: http://localhost:3000
          SCREEN_PROOF_OUTPUT_DIR: test-results/screen-browser-proof-artists
          SCREEN_PROOF_MEASUREMENTS: test-results/screen-browser-proof-artists-measurements.json

      - name: Bind /artists proof to producer provenance
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCER_JOB_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Generate Screenshots") | .id' | head -n 1)"
          if ! [[ "$PRODUCER_JOB_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not resolve the current producer job ID."
            exit 1
          fi
          node scripts/invariants/screen-proof-emit.mjs \
            --screen=web.artists \
            --head-sha="$GITHUB_SHA" \
            --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --bundle=apps/web/test-results/screen-browser-proof-artists \
            --measurements=apps/web/test-results/screen-browser-proof-artists-measurements.json \
            --out=apps/web/test-results/screen-browser-proof-artists/screen-proof.json \
            --artifact-root="$GITHUB_WORKSPACE" \
            --producer-run-id="$GITHUB_RUN_ID" \
            --producer-run-attempt="$GITHUB_RUN_ATTEMPT" \
            --producer-job-id="$PRODUCER_JOB_ID" \
            --environment=local-production-build

      - name: Upload /artists screen proof
        id: artists-proof
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: screen-browser-proof-artists
          path: |
            apps/web/test-results/screen-browser-proof-artists/screen-proof.json
            apps/web/test-results/screen-browser-proof-artists/screenshots/desktop.png
            apps/web/test-results/screen-browser-proof-artists/screenshots/mobile.png
          if-no-files-found: error
          retention-days: 14
          allow-images: true
          public-images: true
          diagnostic-paths: true

      # JOV-7126: first exact-head producer for an authenticated app-shell
      # screen. E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH (job env, so the
      # already-running production server above has it too — a later
      # step's env cannot reach a server that's already started) lets the
      # dev-test-auth bypass mint a synthetic admin persona against this
      # job's noop DATABASE_URL. lib/admin/roles.ts and lib/auth/gate.ts
      # trust it only for this exact bypass session, so the spec renders
      # the real apps/web/app/hud/page.tsx source (isolated ?fs=1 chrome;
      # plain /hud rewrites onto the app-shell-wrapped web.ov-hud-shell
      # screen instead). This isolated layout never mounts
      # DashboardShellContent, so it is the one authenticated app-shell
      # screen that also does not hit the passkey/Touch ID admin step-up
      # lock (lib/admin/mfa.ts) — every other admin screen under
      # apps/web/app/app/(shell)/admin/ stays unregistered as a producer
      # until a human decides how to handle that lock for a producer job.

      # web.smartlink-release and web.smartlink-track (JOV-7127) are
      # revenue-sensitive dynamic routes with no no-DB fallback on the real
      # production path, so they capture a reserved, env-gated fixture route
      # that renders the exact registered page component — see
      # apps/web/app/[username]/[slug]/_lib/screen-cert-fixture.ts.
      - name: Capture smartlink-release screen proof
        timeout-minutes: 10
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/smartlink-release-screen-proof.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=1
        env:
          BASE_URL: http://localhost:3000
          SCREEN_PROOF_OUTPUT_DIR: test-results/screen-browser-proof-smartlink-release
          SCREEN_PROOF_MEASUREMENTS: test-results/screen-browser-proof-smartlink-release-measurements.json

      - name: Bind smartlink-release proof to producer provenance
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCER_JOB_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Generate Screenshots") | .id' | head -n 1)"
          if ! [[ "$PRODUCER_JOB_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not resolve the current producer job ID."
            exit 1
          fi
          node scripts/invariants/screen-proof-emit.mjs \
            --screen=web.smartlink-release \
            --head-sha="$GITHUB_SHA" \
            --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --bundle=apps/web/test-results/screen-browser-proof-smartlink-release \
            --measurements=apps/web/test-results/screen-browser-proof-smartlink-release-measurements.json \
            --out=apps/web/test-results/screen-browser-proof-smartlink-release/screen-proof.json \
            --artifact-root="$GITHUB_WORKSPACE" \
            --producer-run-id="$GITHUB_RUN_ID" \
            --producer-run-attempt="$GITHUB_RUN_ATTEMPT" \
            --producer-job-id="$PRODUCER_JOB_ID" \
            --environment=local-production-build

      - name: Upload smartlink-release screen proof
        id: smartlink-release-proof
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: screen-browser-proof-smartlink-release
          path: |
            apps/web/test-results/screen-browser-proof-smartlink-release/screen-proof.json
            apps/web/test-results/screen-browser-proof-smartlink-release/screenshots/desktop.png
            apps/web/test-results/screen-browser-proof-smartlink-release/screenshots/mobile.png
          if-no-files-found: error
          retention-days: 14
          allow-images: true
          public-images: true
          diagnostic-paths: true

      - name: Capture smartlink-track screen proof
        timeout-minutes: 10
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/smartlink-track-screen-proof.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=1
        env:
          BASE_URL: http://localhost:3000
          SCREEN_PROOF_OUTPUT_DIR: test-results/screen-browser-proof-smartlink-track
          SCREEN_PROOF_MEASUREMENTS: test-results/screen-browser-proof-smartlink-track-measurements.json

      - name: Bind smartlink-track proof to producer provenance
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCER_JOB_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Generate Screenshots") | .id' | head -n 1)"
          if ! [[ "$PRODUCER_JOB_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not resolve the current producer job ID."
            exit 1
          fi
          node scripts/invariants/screen-proof-emit.mjs \
            --screen=web.smartlink-track \
            --head-sha="$GITHUB_SHA" \
            --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --bundle=apps/web/test-results/screen-browser-proof-smartlink-track \
            --measurements=apps/web/test-results/screen-browser-proof-smartlink-track-measurements.json \
            --out=apps/web/test-results/screen-browser-proof-smartlink-track/screen-proof.json \
            --artifact-root="$GITHUB_WORKSPACE" \
            --producer-run-id="$GITHUB_RUN_ID" \
            --producer-run-attempt="$GITHUB_RUN_ATTEMPT" \
            --producer-job-id="$PRODUCER_JOB_ID" \
            --environment=local-production-build

      - name: Upload smartlink-track screen proof
        id: smartlink-track-proof
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: screen-browser-proof-smartlink-track
          path: |
            apps/web/test-results/screen-browser-proof-smartlink-track/screen-proof.json
            apps/web/test-results/screen-browser-proof-smartlink-track/screenshots/desktop.png
            apps/web/test-results/screen-browser-proof-smartlink-track/screenshots/mobile.png
          if-no-files-found: error
          retention-days: 14
          allow-images: true
          public-images: true
          diagnostic-paths: true
      - name: Capture hud-isolated screen proof
        timeout-minutes: 10
        run: |
          pnpm exec playwright test \
            tests/product-screenshots/hud-isolated-screen-proof.spec.ts \
            --config=playwright.config.screenshots.ts \
            --project=screenshots \
            --workers=1
        env:
          BASE_URL: http://localhost:3000
          SCREEN_PROOF_OUTPUT_DIR: test-results/screen-browser-proof-hud-isolated
          SCREEN_PROOF_MEASUREMENTS: test-results/screen-browser-proof-hud-isolated-measurements.json

      - name: Bind hud-isolated proof to producer provenance
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCER_JOB_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Generate Screenshots") | .id' | head -n 1)"
          if ! [[ "$PRODUCER_JOB_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not resolve the current producer job ID."
            exit 1
          fi
          node scripts/invariants/screen-proof-emit.mjs \
            --screen=web.hud-isolated \
            --head-sha="$GITHUB_SHA" \
            --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --bundle=apps/web/test-results/screen-browser-proof-hud-isolated \
