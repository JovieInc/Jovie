name: M2 Revenue-Path Canary
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: GitHub-hosted production-liveness clock probes signed-out claim, $199 Pro checkout, and activation on prod without Stripe credentials or session creation; Slack and Linear secrets stay in the hosted job.
# removal-trigger: Remove this hop when Production Controller or a first-party checkout monitor emits the same four-step receipt and files Linear plus Slack on red without a separate scheduled workflow.
#
# JOV-6439: daily and manually callable money-path probe.
# Distinct from Canary Health Gate (generic uptime) and the auth/public-profile
# canaries. Signed-out → claim → $199 Pro checkout → activation.
# Does not create Stripe sessions, identities, or paid subscriptions.
# Size Guard: this canary + tests exceed the 1500-line standard cap. Same
# `big-pr` opt-out as #17861; do not open a remediator PR.

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Prod or staging URL that mirrors checkout
        required: false
        default: https://jov.ie
        type: string
  workflow_call:
    inputs:
      base_url:
        description: Prod or staging URL that mirrors checkout
        required: false
        default: https://jov.ie
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      LINEAR_API_KEY:
        required: false
permissions:
  contents: read

concurrency:
  group: m2-revenue-path-canary
  cancel-in-progress: false

jobs:
  m2-revenue-path:
    name: Signed-out claim $199 checkout activation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Safety check - production-liveness only
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' && github.event_name != 'workflow_run' }}
        run: |
          echo "M2 revenue-path canary is not a pull_request or push gate."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run M2 revenue-path canary
        id: canary
        env:
          M2_CANARY_BASE_URL: ${{ inputs.base_url || 'https://jov.ie' }}
          M2_CANARY_RECEIPT_PATH: ${{ runner.temp }}/m2-revenue-path-receipt.json
        run: |
          set -euo pipefail
          pnpm --filter=@jovie/web exec tsx scripts/m2-revenue-path-canary.ts \
            --base-url "$M2_CANARY_BASE_URL" \
            --receipt "$M2_CANARY_RECEIPT_PATH"
          echo "receipt_path=$M2_CANARY_RECEIPT_PATH" >> "$GITHUB_OUTPUT"

      # JOV-6920: the canonical artist profile is part of the revenue path.
      # Read-only against production (no credentials); binds the deployed
      # release SHA. A red certificate joins the M2 receipt so the existing
      # fingerprinted Linear intake files it.
      - name: Canonical artist profile certificate
        id: profile
        if: ${{ always() && (inputs.base_url || 'https://jov.ie') == 'https://jov.ie' }}
        env:
          M2_CANARY_RECEIPT_PATH: ${{ runner.temp }}/m2-revenue-path-receipt.json
          PROFILE_CERT_DIR: ${{ runner.temp }}/canonical-profile-certificate
        run: |
          set -uo pipefail
          result="$PROFILE_CERT_DIR.json"
          pnpm --filter=@jovie/web exec tsx scripts/certify-artist-profile.ts --output "$PROFILE_CERT_DIR" > "$result"
          status=$?
          cat "$result"
          if [ "$status" -ne 0 ]; then
            node -e '
              const fs = require("node:fs");
              const [receiptPath, resultPath] = process.argv.slice(1);
              let result = {};
              try { result = JSON.parse(fs.readFileSync(resultPath, "utf8")); } catch {}
              const failing = [
                ...(result.checks ?? []).filter(c => c.status !== "pass").map(c => "check " + c.id),
                ...(result.brokenInternalLinks ?? []).map(l => "link " + l.url + " " + l.status),
              ];
              let receipt = { steps: [] };
              try { receipt = JSON.parse(fs.readFileSync(receiptPath, "utf8")); } catch {}
              receipt.steps = [...(receipt.steps ?? []), {
                name: "canonical-profile-certificate",
                ok: false,
                detail: failing.join("; ") || "certificate failed (see run log)",
              }];
              fs.writeFileSync(receiptPath, JSON.stringify(receipt));
            ' "$M2_CANARY_RECEIPT_PATH" "$result"
            exit 1
          fi

      - name: Upload receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-revenue-path-receipt
          path: |
            ${{ runner.temp }}/m2-revenue-path-receipt.json
            ${{ runner.temp }}/canonical-profile-certificate
            ${{ runner.temp }}/canonical-profile-certificate.json
          if-no-files-found: warn
          retention-days: 30

      - name: Slack alert on red
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          CANARY_TARGET: ${{ inputs.base_url || 'https://jov.ie' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node -e '
            const target = process.env.CANARY_TARGET;
            const runUrl = process.env.RUN_URL;
            const payload = {
              text: "M2 revenue-path canary failed — not generic uptime",
              attachments: [
                {
                  color: "danger",
                  fields: [
                    {
                      title: "Canary",
                      value: "signed-out to claim to 199 USD Pro checkout to activation",
                      short: false,
                    },
                    { title: "Issue", value: "JOV-6439", short: true },
                    { title: "Target", value: target, short: true },
                    {
                      title: "Repro",
                      value:
                        "pnpm --filter=@jovie/web exec tsx scripts/m2-revenue-path-canary.ts --base-url " +
                        target,
                      short: false,
                    },
                    {
                      title: "Run",
                      value: "<" + runUrl + "|View logs>",
                      short: false,
                    },
                  ],
                },
              ],
            };
            process.stdout.write(JSON.stringify(payload));
          ' | curl -sS -X POST \
            -H "Content-type: application/json" \
            --data @- \
            "$SLACK_WEBHOOK_URL"

      - name: File Linear issue on red
        if: ${{ failure() }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_ENABLED: ${{ vars.REMEDIATION_TRIGGERS_ENABLED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -f "${{ runner.temp }}/m2-revenue-path-receipt.json" ]; then
            M2_CANARY_RECEIPT_JSON="$(cat "${{ runner.temp }}/m2-revenue-path-receipt.json")"
            export M2_CANARY_RECEIPT_JSON
          fi
          node scripts/m2-revenue-path-canary-intake.mjs
