name: M2 Revenue-Path Canary
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: GitHub-hosted production-liveness clock probes signed-out claim, $199 Pro checkout, and activation on prod without Stripe credentials or session creation; Slack and Linear secrets stay in the hosted job.
# removal-trigger: Remove this hop when Production Controller or a first-party checkout monitor emits the same four-step receipt and files Linear plus Slack on red without a separate scheduled workflow.
#
# JOV-6439: daily + deploy-hook money-path probe.
# Distinct from Canary Health Gate (generic uptime) and the auth/public-profile
# canaries. Signed-out → claim → $199 Pro checkout → activation.
# Does not create Stripe sessions, identities, or paid subscriptions.
# Size Guard: this canary + tests exceed the 1500-line standard cap. Same
# `big-pr` opt-out as #17861; do not open a remediator PR.

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Prod or staging URL that mirrors checkout
        required: false
        default: https://jov.ie
        type: string
  workflow_call:
    inputs:
      base_url:
        description: Prod or staging URL that mirrors checkout
        required: false
        default: https://jov.ie
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      LINEAR_API_KEY:
        required: false
  workflow_run:
    workflows: [Production Controller]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m2-revenue-path-canary
  cancel-in-progress: false

jobs:
  m2-revenue-path:
    name: Signed-out claim $199 checkout activation
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Safety check - production-liveness only
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' && github.event_name != 'workflow_run' }}
        run: |
          echo "M2 revenue-path canary is not a pull_request or push gate."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run M2 revenue-path canary
        id: canary
        env:
          M2_CANARY_BASE_URL: ${{ inputs.base_url || 'https://jov.ie' }}
          M2_CANARY_RECEIPT_PATH: ${{ runner.temp }}/m2-revenue-path-receipt.json
        run: |
          set -euo pipefail
          pnpm --filter=@jovie/web exec tsx scripts/m2-revenue-path-canary.ts \
            --base-url "$M2_CANARY_BASE_URL" \
            --receipt "$M2_CANARY_RECEIPT_PATH"
          echo "receipt_path=$M2_CANARY_RECEIPT_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-revenue-path-receipt
          path: ${{ runner.temp }}/m2-revenue-path-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Slack alert on red
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          PAYLOAD=$(cat <<EOF)
          {
            "text": "M2 revenue-path canary failed — not generic uptime",
            "attachments": [
              {
                "color": "danger",
                "fields": [
                  { "title": "Canary", "value": "signed-out → claim → \$199 Pro checkout → activation", "short": false },
                  { "title": "Issue", "value": "JOV-6439", "short": true },
                  { "title": "Target", "value": "${{ inputs.base_url || 'https://jov.ie' }}", "short": true },
                  { "title": "Repro", "value": "pnpm --filter=@jovie/web exec tsx scripts/m2-revenue-path-canary.ts --base-url ${{ inputs.base_url || 'https://jov.ie' }}", "short": false },
                  { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": false }
                ]
              }
            ]
          }
          EOF
          )
          curl -sS -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      - name: File Linear issue on red
        if: ${{ failure() }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -f "${{ runner.temp }}/m2-revenue-path-receipt.json" ]; then
            M2_CANARY_RECEIPT_JSON="$(cat "${{ runner.temp }}/m2-revenue-path-receipt.json")"
            export M2_CANARY_RECEIPT_JSON
          fi
          node scripts/m2-revenue-path-canary-intake.mjs
