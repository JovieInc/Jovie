# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# capability-gap: GitHub merge queue has no native auto-enroll for green PRs; GITHUB_TOKEN-created merge groups start no CI, so a hosted hop with the Jovie Bot app token must enqueue.
# removal-trigger: Remove when GitHub offers native auto-enqueue of CLEAN PRs with merge-group CI, or when Summer's own enqueue tool proves 30 consecutive days of queue admission.
name: Merge Queue Green Enroll

# Tim 2026-09-26: production holds never stall merging. A held production
# promote and a red main are separate issues from source admission, so green
# PRs keep entering the native queue while promotion is held.
#
# The only writer that puts PRs into the merge queue (Auto-Merge Default's
# auto-merge arming and hourly triage were retired as duplicates of this
# workflow and of the lanes stuck-PR ladder).
# Enqueues open, non-draft, same-repo PRs into main whose required checks are
# green with no conflicts (mergeStateStatus CLEAN, HAS_HOOKS or UNSTABLE: an
# UNSTABLE head only has a non-required check pending or red, which the
# ruleset does not gate on), that carry no hold/gated/incident label. Green
# enroll clears a stale lane-fix-red once that head is required-green, then
# admits it; a red head keeps the label. GitHub
# recomputes mergeability lazily, so a read right after main moves returns
# UNKNOWN; the controller re-reads it briefly instead of dropping the wake. It runs when a required-check workflow finishes on a PR, or a PR loses
# a hold label, plus a reconciliation sweep on every push to main: a queue
# ejection while checks are already green produces no new check completion, so
# without the sweep a dequeued green head is never re-armed (JOV-7589).
# The ruleset's required checks on the merge group stay the only gate. Uses the
# Jovie Bot app token because GITHUB_TOKEN-created merge groups start no CI.
# Automatic wakes inspect only the signaled PR. The push-to-main sweep and
# manual dispatch scan the complete roster.

on:
  workflow_run:
    workflows: ['Source Validation', 'CI', 'Fork PR Gate', 'PR Size Guard']
    types: [completed]
  # ready_for_review: leaving draft emits no check completion (JOV-INV-029:
  # an unchanged head never earns a second CI flight), so this is the wake
  # that admits an already-green head. Sole ready_for_review subscriber.
  pull_request_target:
    types: [labeled, unlabeled, reopened, ready_for_review, synchronize]
  # Event-driven reconciliation (JOV-7589): every landing on main re-scans the
  # roster (re-enrolls green heads whose dequeue left no wake) and re-checks
  # hold receipts, so neither waits on a timer. Pushes coalesce into the one
  # `reconcile` concurrency slot.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log eligible PRs without enqueueing'
        required: false
        default: 'false'
      pr_number:
        description: 'Admit only this PR (per-PR path, no roster sweep); empty sweeps every open PR'
        required: false
        default: ''

permissions: {}

concurrency:
  # A global pending slot loses another PR's final wake. Coalesce only wakes
  # attributed to the same PR. An association-free receipt coalesces with the
  # same workflow on the same head, and a different workflow keeps its own slot
  # so a success cannot replace a failure hold. Receipts with no head stay on
  # their run ID.
  group: merge-queue-green-enroll-${{ ((github.event_name == 'workflow_dispatch' && inputs.pr_number == '') || github.event_name == 'push') && 'reconcile' || inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || (github.event.workflow_run.head_sha && format('{0}-{1}', github.event.workflow_run.head_sha, github.event.workflow_run.name)) || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  hold-failed-revision:
    name: Hold failed source revision
    outputs:
      failure_receipt: ${{ steps.failure-hold.outputs.failure_receipt }}
      admission_recovery_receipt: ${{ steps.failure-hold.outputs.admission_recovery_receipt }}
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.workflow_id == 178737329 &&
      github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","timed_out","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted failure policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/merge-group-failure-hold.mjs
            scripts/lib/merge-group-admission.mjs
            scripts/lib/merge-queue-guard.mjs
            scripts/lib/pre-land-changelog.mjs
            scripts/version-fanout-guard.mjs
          sparse-checkout-cone-mode: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # This job's only credential is the Jovie Bot installation token below.
      # It is minted with actions, contents, pull-requests, and statuses — not
      # merge_queues. dequeuePullRequest then returns "Resource not accessible by integration".
      # GitHub already removes a PR when its merge_group run fails, so the hold
      # script treats that denial and a "not in queue" response as a logged
      # non-fatal outcome and still writes the hold. Do not add
      # permission-merge-queues unless the installation already has it: an
      # ungranted permission fails token mint before the hold is written.
      - name: Generate Jovie Bot failure-hold token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Persist exact-head failure hold and remove merge intent
        id: failure-hold
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/merge-group-failure-hold.mjs --event-path "$GITHUB_EVENT_PATH"

  enroll:
    name: Enqueue green PRs
    needs: [hold-failed-revision]
    # QUEUE_FREEZE=1 (repo variable) admits nothing; holds and dequeues still run.
    if: >-
      always() &&
      vars.QUEUE_FREEZE != '1' &&
      github.event.action != 'labeled' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'pull_request_target')) ||
       needs.hold-failed-revision.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted failure policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/merge-group-failure-hold.mjs
            scripts/lib/merge-group-admission.mjs
            scripts/lib/merge-queue-guard.mjs
            scripts/lib/pre-land-changelog.mjs
            scripts/version-fanout-guard.mjs
            scripts/lib/admission-hold-labels.json
          sparse-checkout-cone-mode: false

      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          # A head that edits .github/workflows cannot be enqueued without it
          # ("`workflows` scope may be required"); the installation grants it.
          permission-workflows: write

      - name: Enqueue green PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          MERGE_STATE_RETRY_MS: '3000'
          FAILURE_HOLD_RECEIPT: ${{ needs.hold-failed-revision.outputs.failure_receipt || '' }}
          ADMISSION_RECOVERY_RECEIPT: ${{ needs.hold-failed-revision.outputs.admission_recovery_receipt || '' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const failurePolicy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/merge-group-failure-hold.mjs`
            ));
            // Single source: scripts/lib/admission-hold-labels.json. Stop labels
            // and queue-poison skip the sweep. lane-fix-red is a machine block:
            // it still blocks admission, but a required-green head is cleared
            // below before the eligibility check so a stale label cannot strand it.
            const holdLabels = JSON.parse(require('node:fs').readFileSync(
              `${process.env.GITHUB_WORKSPACE}/scripts/lib/admission-hold-labels.json`, 'utf8'
            ));
            const PREFILTER = new Set([...holdLabels.stopHoldLabels, holdLabels.queuePoisonLabel]);
            const BLOCKING = new Set([...PREFILTER, ...holdLabels.machineBlockLabels]);
            const BREAKER_LABEL = 'queue-breaker';
            if (BLOCKING.size < 2) throw new Error('admission hold labels are unreadable');
            // Required checks green and no conflicts. UNSTABLE only adds a
            // non-required pending/red context (e.g. lane execution receipts).
            const ADMISSIBLE = new Set(['CLEAN', 'HAS_HOOKS', 'UNSTABLE']);
            const laneFixRed = current => (current?.labels?.nodes || []).some(
              label => String(label?.name || '').toLowerCase() === 'lane-fix-red');
            const retryMs = Math.max(0, Number(process.env.MERGE_STATE_RETRY_MS ?? 3000) || 0);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const { owner, repo } = context.repo;
            // Main's SHA only resolves a base-branch failure hold, so read it
            // once, lazily, for a held candidate (most wakes never need it).
            let currentMainSha;
            const readMainSha = async () => currentMainSha ??= (await github.rest.git.getRef({
              owner, repo, ref: 'heads/main',
            })).data.object.sha;
            // Use the triggering PR for automatic wakes. Scanning every eligible PR
            // on every check completion exhausts the shared app GraphQL quota.
            const validNumber = n => Number.isSafeInteger(n) && n > 0;
            // A dispatch naming one PR takes the per-PR path; only an unnamed
            // dispatch or a landing on main sweeps the roster.
            const dispatchedPr = Number(process.env.DISPATCH_PR_NUMBER || 0);
            const sweep = context.eventName === 'push' ||
              (context.eventName === 'workflow_dispatch' && !validNumber(dispatchedPr));
            let prs;
            if (sweep) {
              // Reconciliation (a landing on main or a manual run)
              // keeps a complete paginated inventory.
              prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: 'main', per_page: 100,
              });
            } else {
              let numbers = [];
              if (context.eventName === 'workflow_dispatch') {
                numbers = [dispatchedPr];
              } else if (context.eventName === 'pull_request_target') {
                numbers = [context.payload.pull_request?.number].filter(validNumber);
              } else if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run || {};
                numbers = (run.pull_requests || []).map(pr => pr.number).filter(validNumber);
                const receipt = process.env.FAILURE_HOLD_RECEIPT;
                if (run.event === 'merge_group' && receipt) {
                  numbers = [failurePolicy.readFailureReceipt(receipt, `${owner}/${repo}`).prNumber];
                }
                const recovery = process.env.ADMISSION_RECOVERY_RECEIPT;
                if (run.event === 'merge_group' && recovery) {
                  const parsed = JSON.parse(recovery);
                  failurePolicy.admissionRecoveryReceiptStatus(recovery, {
                    repository: `${owner}/${repo}`, prNumber: parsed.prNumber, headSha: parsed.sourceHeadSha,
                  });
                  numbers = [parsed.prNumber];
                }
                // PR-target workflow receipts can omit their pull_requests association.
                // Resolve only the exact source SHA and branch, never a fallback full scan.
                // GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls is
                // repos.listPullRequestsAssociatedWithCommit. github.rest.commits
                // does not exist, so calling it throws before any enqueue.
                if (numbers.length === 0 && /^[a-f0-9]{40}$/.test(run.head_sha || '') && run.head_branch) {
                  const pages = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                    owner, repo, commit_sha: run.head_sha, per_page: 100,
                  });
                  const associated = Array.isArray(pages) ? pages : [];
                  numbers = associated.flatMap(pr => {
                    if (!pr || pr.state !== 'open' || pr.base?.ref !== 'main') return [];
                    if (pr.head?.sha !== run.head_sha || pr.head?.ref !== run.head_branch) return [];
                    if (pr.head?.repo?.full_name !== `${owner}/${repo}`) return [];
                    return validNumber(pr.number) ? [pr.number] : [];
                  });
                }
              }
              prs = [];
              for (const number of new Set(numbers)) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (data.state === 'open' && data.base.ref === 'main') prs.push(data);
              }
            }
            core.info(`scanned=${prs.length}`);
            // A reconciliation sweep reads every open PR. Each read takes ~3 s
            // and UNKNOWN re-reads slept 3 s + 6 s more, so a 45-70 PR roster
            // hit the 5-minute timeout on every push to main from 2026-10-12
            // 22:31Z and re-armed nothing. Sweeps now prefetch reads in
            // parallel (which also starts GitHub's mergeability recompute),
            // give an UNKNOWN PR one fresh read with no sleep, go
            // longest-waiting first, and stop at a time budget; the PRs left
            // over are re-read on their own events and on the next sweep.
            const startedAt = Date.now();
            const budgetMs = Math.max(1000, Number(process.env.SWEEP_BUDGET_MS ?? 200000) || 200000);
            const overBudget = () => sweep && Date.now() - startedAt > budgetMs;
            const ownCandidate = candidate =>
              !candidate.draft && candidate.head.repo?.full_name === `${owner}/${repo}` &&
              !candidate.labels.some(l => PREFILTER.has(l.name.toLowerCase()));
            // Read one current PR. The roster never authorizes enqueue.
            const readPr = async number => (await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id number state isDraft baseRefName headRefOid mergeStateStatus
                      isInMergeQueue isCrossRepository
                      autoMergeRequest { enabledAt }
                      labels(first: 100) { pageInfo { hasNextPage } nodes { name } }
                      commits(last: 1) { nodes { commit { committedDate } } }
                      timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                        nodes { ... on RemovedFromMergeQueueEvent { createdAt reason } }
                      }
                      breakerEvents: timelineItems(last: 100, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT, LABELED_EVENT]) {
                        nodes {
                          __typename
                          ... on RemovedFromMergeQueueEvent { createdAt reason }
                          ... on LabeledEvent { createdAt label { name } }
                        }
                      }
                      releases: timelineItems(last: 20, itemTypes: [UNLABELED_EVENT]) {
                        nodes { ... on UnlabeledEvent { createdAt label { name } } }
                      }
                    }
                  }
                }`, { owner, repo, number })).repository.pullRequest;
            if (sweep) {
              prs = prs.filter(ownCandidate).sort((a, b) =>
                String(a.updated_at ?? '').localeCompare(String(b.updated_at ?? '')) || a.number - b.number);
            }
            const prefetched = new Map();
            if (sweep && prs.length > 1) {
              let next = 0;
              // Prefetch spends at most half the budget so the loop keeps time to enqueue.
              const take = () =>
                next < prs.length && Date.now() - startedAt < budgetMs / 2 ? prs[next++].number : null;
              const worker = async () => {
                for (let number = take(); number !== null; number = take()) {
                  try {
                    prefetched.set(number, await readPr(number));
                  } catch (error) {
                    core.warning(`#${number} prefetch failed: ${error.message}`);
                  }
                }
              };
              const width = Math.max(1, Math.min(6, Number(process.env.SWEEP_READ_CONCURRENCY ?? 6) || 6));
              await Promise.all(Array.from({ length: Math.min(width, prs.length) }, worker));
            }
            let enqueued = 0;
            for (const [index, candidate] of prs.entries()) {
              if (overBudget()) {
                core.warning(`sweep budget spent after ${index}/${prs.length} PRs; the rest wait for their own events or the next sweep`);
                break;
              }
              if (!ownCandidate(candidate)) continue;
              const readCurrent = () => readPr(candidate.number);
              const eligible = pr => {
                if (!pr || pr.state !== 'OPEN' || pr.baseRefName !== 'main') return false;
                if (pr.isDraft || pr.isInMergeQueue || pr.isCrossRepository) return false;
                if (pr.headRefOid !== candidate.head.sha || !ADMISSIBLE.has(pr.mergeStateStatus)) return false;
                if (pr.labels.pageInfo.hasNextPage) return false;
                return !pr.labels.nodes.some(l => BLOCKING.has(l.name.toLowerCase()));
              };
              // UNKNOWN means GitHub has not recomputed mergeability since main
              // moved; the read itself starts that, so two short re-reads settle it.
              let pr = prefetched.get(candidate.number);
              if (!pr || pr.mergeStateStatus === 'UNKNOWN') pr = await readCurrent();
              for (let attempt = 1; !sweep && pr?.mergeStateStatus === 'UNKNOWN' && attempt <= 2; attempt += 1) {
                await sleep(retryMs * attempt);
                pr = await readCurrent();
              }
              // A stale lane-fix-red from an older red head must not strand a
              // head whose required checks are now green. A red (BLOCKED) head
              // keeps the label. Stop labels and queue-poison are never cleared.
              if (pr && pr.state === 'OPEN' && !pr.isDraft &&
                  pr.labels?.pageInfo?.hasNextPage === false &&
                  ADMISSIBLE.has(pr.mergeStateStatus) && laneFixRed(pr)) {
                if (process.env.DRY_RUN === 'true') {
                  core.notice(`[dry run] would clear stale lane-fix-red on #${pr.number}`);
                } else {
                  try {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: pr.number, name: 'lane-fix-red',
                    });
                    core.notice(`CLEARED stale lane-fix-red on #${pr.number}: required checks green`);
                  } catch (error) {
                    core.warning(`#${pr.number} lane-fix-red not cleared: ${error.message}`);
                  }
                }
                pr = await readCurrent();
              }
              if (!eligible(pr)) {
                if (pr && pr.state === 'OPEN' && !pr.isDraft && !pr.isInMergeQueue) {
                  core.info(`skip #${candidate.number}: mergeStateStatus=${pr.mergeStateStatus}`);
                }
                continue;
              }
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: pr.headRefOid, per_page: 100 }
              );
              // The producing job's attested receipt is immediately available,
              // even while GitHub's status read still lags its accepted write.
              const directHold = failurePolicy.failureReceiptStatus(
                process.env.FAILURE_HOLD_RECEIPT,
                { repository: `${owner}/${repo}`, prNumber: pr.number, headSha: pr.headRefOid }
              );
              if (directHold) statuses.unshift(directHold);
              const directRecovery = failurePolicy.admissionRecoveryReceiptStatus(
                process.env.ADMISSION_RECOVERY_RECEIPT,
                { repository: `${owner}/${repo}`, prNumber: pr.number, headSha: pr.headRefOid }
              );
              if (directRecovery) statuses.unshift(directRecovery);
              const sourceFailure = failurePolicy.revisionFailureDisposition({
                statuses,
                repository: `${owner}/${repo}`,
                currentMainSha: statuses.some(status => status?.context === failurePolicy.FAILURE_HOLD_CONTEXT)
                  ? await readMainSha()
                  : undefined,
              });
              let failure = sourceFailure;
              if (failure.action === 'block') {
                core.notice(`HELD #${pr.number}@${pr.headRefOid}: ${failure.reason}`);
                continue;
              }
              // Native history is revision-scoped: a commit/force-push after
              // the removal clears the old hold. Only this controller may
              // consume the one typed non-deterministic retry.
              const lastRemoval = pr.timelineItems.nodes[0]?.createdAt;
              const headCommittedAt = pr.commits.nodes[0]?.commit.committedDate;
              const removedUnchangedHead = lastRemoval &&
                (!headCommittedAt || headCommittedAt <= lastRemoval);
              // A manual removal (the dequeue-held job, or an agent pulling a
              // PR) followed by removal of a blocking label is an explicit
              // release of that same head. A failed_checks removal never is,
              // and any revision failure hold still blocks first.
              const removalReason = String(pr.timelineItems.nodes[0]?.reason || 'unknown').toLowerCase();
              // A circuit-breaker dequeue during a quota storm carries the
              // queue-breaker marker (MERGE_QUEUE.md runbook). This job only
              // runs while QUEUE_FREEZE is not 1, so a marked, still-green,
              // unheld head is re-admitted and the marker removed; a plain
              // manual dequeue without it keeps today's behavior.
              const breakerMarked = pr.labels.nodes.some(l => l.name.toLowerCase() === BREAKER_LABEL);
              const hasBreakerReceipt = currentPr => {
                const events = currentPr.breakerEvents?.nodes || [];
                const removalIndex = events.findLastIndex(
                  event => event.__typename === 'RemovedFromMergeQueueEvent'
                );
                const removal = events[removalIndex];
                if (removalIndex < 0 || removal?.createdAt !== lastRemoval ||
                    String(removal?.reason || 'unknown').toLowerCase() !== 'manual') return false;
                return events.slice(removalIndex + 1).some(event =>
                  event.__typename === 'LabeledEvent' &&
                  String(event.label?.name || '').toLowerCase() === BREAKER_LABEL
                );
              };
              // The runbook adds the marker only after dequeue succeeds. Binding
              // the ordered label event to the latest removal prevents a stale
              // marker from reversing a later unrelated manual dequeue, even
              // when GitHub gives both events the same timestamp.
              const breakerRestore = Boolean(removedUnchangedHead) &&
                failure.action === 'allow' && removalReason === 'manual' && breakerMarked &&
                hasBreakerReceipt(pr);
              const releasedAfterManualRemoval = Boolean(removedUnchangedHead) &&
                failure.action === 'allow' &&
                removalReason === 'manual' &&
                (breakerRestore || (pr.releases?.nodes || []).some(event =>
                  typeof event?.createdAt === 'string' && event.createdAt > lastRemoval &&
                  BLOCKING.has(String(event.label?.name || '').toLowerCase())));
              const ownerHoldRelease = failurePolicy.ownerHoldReleaseIntent({
                eventName: context.eventName, event: context.payload,
              });
              if (!releasedAfterManualRemoval) {
                failure = failurePolicy.reenrollmentDisposition({
                  failure, statuses, repository: `${owner}/${repo}`, prNumber: pr.number, lastRemoval, headCommittedAt,
                  autoMergeEnabled: Number.isFinite(Date.parse(pr.autoMergeRequest?.enabledAt)),
                  headSha: pr.headRefOid, lastRemovalReason: pr.timelineItems.nodes[0]?.reason,
                  ownerHoldRelease,
                });
              }
              if (failure.action === 'block' ||
                  (removedUnchangedHead && failure.action !== 'retry-once' &&
                   failure.reason !== 'owner-hold-release' && !releasedAfterManualRemoval)) {
                core.info(`skip #${pr.number}: head unchanged since queue removal (${removalReason}; ${failure.reason})`);
                continue;
              }
              if (process.env.DRY_RUN === 'true') {
                core.notice(`[dry run] would enqueue #${pr.number}`);
                continue;
              }
              const admissionRecovery = failure.reason === 'bounded-admission-recovery';
              const ownerReleaseStillCurrent = async () => {
                const observed = await readCurrent();
                if (!eligible(observed) || observed.id !== pr.id) return false;
                const freshStatuses = await github.paginate(github.rest.repos.listCommitStatusesForRef,
                  { owner, repo, ref: observed.headRefOid, per_page: 100 });
                // Fence mutations during status pagination before expected-head enqueue.
                const fresh = await readCurrent();
                if (!eligible(fresh) || fresh.id !== pr.id || fresh.number !== pr.number ||
                    fresh.headRefOid !== observed.headRefOid) return false;
                const disposition = failurePolicy.reenrollmentDisposition({
                  failure: failurePolicy.revisionFailureDisposition({ statuses: freshStatuses,
                    repository: `${owner}/${repo}`, currentMainSha }),
                  statuses: freshStatuses, repository: `${owner}/${repo}`, prNumber: fresh.number,
                  lastRemoval: fresh.timelineItems.nodes[0]?.createdAt,
                  headCommittedAt: fresh.commits.nodes[0]?.commit.committedDate,
                  autoMergeEnabled: Number.isFinite(Date.parse(fresh.autoMergeRequest?.enabledAt)),
                  headSha: fresh.headRefOid, lastRemovalReason: fresh.timelineItems.nodes[0]?.reason,
                  ownerHoldRelease,
                });
                return disposition.reason === 'owner-hold-release' && disposition.removalAt === failure.removalAt;
              };
              const breakerReleaseStillCurrent = async markerRequired => {
                const sameRemoval = currentPr => {
                  const removal = currentPr.timelineItems.nodes[0];
                  const committedAt = currentPr.commits.nodes[0]?.commit.committedDate;
                  return removal?.createdAt === lastRemoval &&
                    String(removal?.reason || 'unknown').toLowerCase() === 'manual' &&
                    (!committedAt || committedAt <= lastRemoval);
                };
                const hasMarker = currentPr => currentPr.labels.nodes.some(
                  label => label.name.toLowerCase() === BREAKER_LABEL
                );
                const observed = await readCurrent();
                if (!eligible(observed) || observed.id !== pr.id || observed.number !== pr.number ||
                    observed.headRefOid !== pr.headRefOid || !sameRemoval(observed) ||
                    !hasBreakerReceipt(observed) ||
                    (markerRequired && !hasMarker(observed))) return false;
                const freshStatuses = await github.paginate(
                  github.rest.repos.listCommitStatusesForRef,
                  { owner, repo, ref: observed.headRefOid, per_page: 100 }
                );
                const freshFailure = failurePolicy.revisionFailureDisposition({
                  statuses: freshStatuses,
                  repository: `${owner}/${repo}`,
                  currentMainSha: freshStatuses.some(
                    status => status?.context === failurePolicy.FAILURE_HOLD_CONTEXT
                  ) ? await readMainSha() : undefined,
                });
                // Fence marker/hold/removal/head changes during status pagination.
                // This is the final awaited read before the enqueue mutation.
                const fresh = await readCurrent();
                return eligible(fresh) && fresh.id === pr.id && fresh.number === pr.number &&
                  fresh.headRefOid === observed.headRefOid && sameRemoval(fresh) &&
                  hasBreakerReceipt(fresh) &&
                  (!markerRequired || hasMarker(fresh)) && freshFailure.action === 'allow';
              };
              const recoveryStillCurrent = async () => {
                const fresh = await readCurrent();
                if (!eligible(fresh) || fresh.id !== pr.id || fresh.number !== pr.number) return false;
                const currentRecovery = failurePolicy.reenrollmentDisposition({
                  failure: sourceFailure, statuses, repository: `${owner}/${repo}`, prNumber: fresh.number,
                  lastRemoval: fresh.timelineItems.nodes[0]?.createdAt,
                  headCommittedAt: fresh.commits.nodes[0]?.commit.committedDate,
                  autoMergeEnabled: Number.isFinite(Date.parse(fresh.autoMergeRequest?.enabledAt)),
                });
                return currentRecovery.action === 'retry-once' &&
                  currentRecovery.reason === 'bounded-admission-recovery' &&
                  currentRecovery.latest.runId === failure.latest.runId &&
                  currentRecovery.latest.runAttempt === failure.latest.runAttempt &&
                  currentRecovery.latest.completedAt === failure.latest.completedAt;
              };
              const writeRetry = description => github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.headRefOid, state: 'success',
                context: failurePolicy.FAILURE_RETRY_CONTEXT,
                description, target_url: failure.latest.targetUrl,
              });
              let enqueueAttempted = false;
              try {
                // A source SHA cannot attest merge intent or a later manual removal.
                // Re-read after statuses before spending a recovery reservation.
                if (admissionRecovery && !await recoveryStillCurrent()) continue;
                if (failure.action === 'retry-once') {
                  await writeRetry(failurePolicy.retrySpentDescription(failure.latest));
                  core.notice(`RESERVED bounded retry for #${pr.number}@${pr.headRefOid}`);
                }
                // The reservation write is another await. A stale recovery keeps
                // that reservation spent and never reaches enqueue or a refund.
                if (admissionRecovery && !await recoveryStillCurrent()) continue;
                if (failure.reason === 'owner-hold-release' && !await ownerReleaseStillCurrent()) continue;
                if (breakerRestore) {
                  if (!await breakerReleaseStillCurrent(true)) continue;
                  try {
                    // Consume the operator's one-shot authorization before enqueue.
                    // Failure is fail-closed so a stale marker can never authorize
                    // a later manual dequeue of this unchanged head.
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: pr.number, name: BREAKER_LABEL,
                    });
                  } catch (error) {
                    core.warning(`#${pr.number} ${BREAKER_LABEL} not consumed: ${error.message}`);
                    continue;
                  }
                  if (!await breakerReleaseStillCurrent(false)) continue;
                }
                enqueueAttempted = true;
                const r = await github.graphql(`
                  mutation($id: ID!, $oid: GitObjectID!) {
                    enqueuePullRequest(input: { pullRequestId: $id, expectedHeadOid: $oid }) {
                      mergeQueueEntry { position }
                    }
                  }`, { id: pr.id, oid: pr.headRefOid });
                enqueued += 1;
                core.notice(`ENQUEUED #${pr.number} at position ${r.enqueuePullRequest.mergeQueueEntry.position}`);
                if (breakerMarked && !breakerRestore) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pr.number, name: BREAKER_LABEL,
                  }).catch(error => core.warning(
                    `#${pr.number} stale ${BREAKER_LABEL} not removed: ${error.message}`
                  ));
                }
              } catch (error) {
                if (enqueueAttempted && failure.action === 'retry-once' && failurePolicy.enqueueWasRejected(error)) {
                  await writeRetry(failurePolicy.retryReleasedDescription(failure.latest));
                  core.notice(`RELEASED rejected enqueue reservation for #${pr.number}@${pr.headRefOid}`);
                }
                core.warning(`#${pr.number} not enqueued: ${error.message}`);
              }
            }
            core.info(`enqueued=${enqueued}`);

  # Hold contract (scripts/hold-contract.mjs, jovie-hold/v1): every stop label
  # (hold, gated, incident, do-not-merge, tim-hold variants) needs a receipt
  # comment naming an owner plus an expiry or a head-change release.
  # Ownerless holds past their grace period and expired or released receipts
  # are removed with one comment. The Jovie Bot unlabel event then wakes the
  # enroll job above; required checks still gate admission. Expiry is checked
  # on the next event after it lapses: a landing on main, a merge-group CI
  # result, or a PR label/push event.
  enforce-hold-contract:
    name: Release ownerless or expired holds
    if: >-
      contains(fromJSON('["workflow_dispatch","push","pull_request_target"]'), github.event_name) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted hold contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/hold-contract.mjs
            scripts/lib/admission-hold-labels.json
            scripts/lib/admission-hold-labels.mjs
            scripts/lib/queue-deferral-receipt.mjs
          sparse-checkout-cone-mode: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate Jovie Bot hold-contract token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Enforce the hold contract
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/hold-contract.mjs

  # A blocking label on a queued PR fails Fork PR Gate and PR Size Guard for
  # every merge group containing it, so the whole queue behind it is rebuilt
  # (2026-10-04: #20442, #20381, #20398). Remove just that PR instead. This is
  # also the documented way to push a fix to a queued PR: add `hold`, push,
  # remove `hold`; the `unlabeled` wake re-enrolls the new head once CLEAN.
  dequeue-held:
    name: Dequeue a held queued PR
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      contains(fromJSON('["hold","gated","incident","do-not-merge","tim-hold","tim:hold","hold:tim","queue-deferred","queue-poison","lane-fix-red"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Generate Jovie Bot dequeue token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Remove the held PR from the merge queue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            const sourceHead = context.payload.pull_request?.head?.sha;
            const rawLabel = context.payload.label?.name;
            const label = typeof rawLabel === 'string' ? rawLabel.toLowerCase() : null;
            const blocking = new Set(['hold', 'gated', 'incident', 'do-not-merge', 'tim-hold', 'tim:hold', 'hold:tim', 'queue-deferred', 'queue-poison', 'lane-fix-red']);
            if (!Number.isSafeInteger(number) || number <= 0 ||
                typeof sourceHead !== 'string' || !/^[a-f0-9]{40}$/.test(sourceHead) || !blocking.has(label)) {
              core.info('Ignoring an incomplete blocking-label event');
              return;
            }
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id state headRefOid isInMergeQueue labels(first:100){pageInfo{hasNextPage} nodes{name}}}}}`,
              { owner, repo, number }
            );
            const pr = repository?.pullRequest;
            // An old event cannot remove a replacement head or a PR whose hold
            // was removed while this job waited. Dequeue has no expected-head CAS.
            const labels = pr?.labels;
            if (pr?.state !== 'OPEN' || pr.headRefOid !== sourceHead ||
                pr.isInMergeQueue !== true || typeof pr.id !== 'string' || !pr.id ||
                labels?.pageInfo?.hasNextPage !== false || !Array.isArray(labels.nodes) ||
                labels.nodes.some(item => typeof item?.name !== 'string') ||
                !labels.nodes.some(item => item.name.toLowerCase() === label)) {
              core.info(`#${number} no longer matches the queued blocking-label event`);
              return;
            }
            try {
              await github.graphql(
                `mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}`,
                { id: pr.id }
              );
              core.notice(`DEQUEUED #${number}: labeled ${context.payload.label.name} while queued`);
            } catch (error) {
              // A denied dequeue leaves today's behaviour: its merge group fails the gate.
              core.warning(`dequeue of held #${number} failed: ${error.message}`);
            }

  # Runs only after the hold has dropped merge intent. A green PR dequeued by
  # another member of the group, or by the base branch, gets squash auto-merge
  # back on that same SHA. Two rearms per SHA; the enroll job is not involved.
  rearm-green-victims:
    name: Rearm green merge-group victims
    needs: [hold-failed-revision]
    if: >-
      always() &&
      vars.QUEUE_FREEZE != '1' &&
      needs.hold-failed-revision.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted rearm policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/merge-group-victim-rearm.mjs
            scripts/lib/admission-hold-labels.json
            scripts/lib/admission-hold-labels.mjs
          sparse-checkout-cone-mode: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate Jovie Bot rearm token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: write
          permission-statuses: write
          # Rearming auto-merge on a head that edits .github/workflows needs it.
          permission-workflows: write

      - name: Rearm green victims of this merge group
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILURE_HOLD_RECEIPT: ${{ needs.hold-failed-revision.outputs.failure_receipt || '' }}
        run: node scripts/merge-group-victim-rearm.mjs --event-path "$GITHUB_EVENT_PATH"
