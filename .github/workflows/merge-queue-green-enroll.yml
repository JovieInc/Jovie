# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# capability-gap: GitHub merge queue has no native auto-enroll for green PRs; GITHUB_TOKEN-created merge groups start no CI, so a hosted hop with the Jovie Bot app token must enqueue.
# removal-trigger: Remove when GitHub offers native auto-enqueue of CLEAN PRs with merge-group CI, or when Summer's own enqueue tool proves 30 consecutive days of queue admission.
name: Merge Queue Green Enroll

# Tim 2026-09-26: production holds never stall merging. A held production
# promote and a red main are separate issues from source admission, so green
# PRs keep entering the native queue while promotion is held.
#
# The only writer that puts PRs into the merge queue (Auto-Merge Default's
# auto-merge arming and hourly triage were retired as duplicates of this
# workflow and of the lanes stuck-PR ladder).
# Enqueues open, non-draft, same-repo PRs into main whose required checks are
# green with no conflicts (mergeStateStatus CLEAN, HAS_HOOKS or UNSTABLE: an
# UNSTABLE head only has a non-required check pending or red, which the
# ruleset does not gate on), that carry no hold/gated/incident label.
# lane-fix-red stays blocking until the Lane Fix Relay deletes it. That relay
# already applies the label with GITHUB_TOKEN (issues: write, pull-requests:
# write). This job's app token cannot remove labels, so enroll never calls
# removeLabel for lane-fix-red. A labeled head is not admitted; a red head
# keeps the label. GitHub
# recomputes mergeability lazily, so a read right after main moves returns
# UNKNOWN; the controller re-reads it briefly instead of dropping the wake.
# A per-PR wake can also read BLOCKED for minutes after every required check
# is already green (JOV-8788, #22618). That path re-reads like UNKNOWN and,
# while the head stays BLOCKED, dispatches this workflow again with the job
# GITHUB_TOKEN (actions: write). The Jovie Bot app token does not request
# actions: write. Roster sweeps do not dispatch.
# It runs when a required-check workflow finishes on a PR, or a PR loses
# a hold label, plus a reconciliation sweep on every push to main: a queue
# ejection while checks are already green produces no new check completion, so
# without the sweep a dequeued green head is never re-armed (JOV-7589).
# The ruleset's required checks on the merge group stay the only gate. Uses the
# Jovie Bot app token because GITHUB_TOKEN-created merge groups start no CI.
# Automatic wakes inspect only the signaled PR. The push-to-main sweep and
# manual dispatch scan the complete roster.

on:
  # Fork PR Gate is not subscribed: Source Validation completed last on 84 of 85
  # PR heads measured 2026-10-25, and a straggler is re-armed by the main-push
  # sweep (guard: scripts/lib/__tests__/wake-fanout-contract.test.mjs).
  workflow_run:
    workflows: ['Source Validation', 'CI', 'PR Size Guard']
    types: [completed]
  # ready_for_review: leaving draft emits no check completion (JOV-INV-029:
  # an unchanged head never earns a second CI flight), so this is the wake
  # that admits an already-green head. Sole ready_for_review subscriber.
  pull_request_target:
    # `synchronize` is deliberately absent (JOV-INV-029 coalescing): a new head
    # has no green verdict yet, so the push cannot change the enroll decision.
    # Its Source Validation completion (PR Ready) is the wake that can. Over 24h
    # synchronize was the bulk of ~560 pull_request_target runs, nearly all
    # no-ops. Head-change hold release rides the next label event or landing on main.
    types: [converted_to_draft, labeled, unlabeled, reopened, ready_for_review]
  # Event-driven reconciliation (JOV-7589): every landing on main re-scans the
  # roster (re-enrolls green heads whose dequeue left no wake) and re-checks
  # hold receipts, so neither waits on a timer. Pushes coalesce into the one
  # `reconcile` concurrency slot.
  push:
    branches: [main]
  # No cron here (JOV-INV-042: admission never runs from a schedule). The backstop
  # for a lost wake is the Gem lanes tick: scripts/lanes/throughput_sentinel.py
  # dispatches this workflow (an unnamed dispatch is the roster sweep) when a
  # CLEAN unqueued PR has waited 10 minutes, and alarms `queue starved` and
  # per-state supply dwell when the SLO is still missed.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log eligible PRs without enqueueing'
        required: false
        default: 'false'
      pr_number:
        description: 'Admit only this PR (per-PR path, no roster sweep); empty sweeps every open PR'
        required: false
        default: ''
      blocked_recheck:
        description: 'Follow-up attempt after a required-green head stayed BLOCKED (0-4)'
        required: false
        default: '0'

permissions: {}

concurrency:
  # A global pending slot loses another PR's final wake. Coalesce only wakes
  # attributed to the same PR. Successful pull_request completions share one
  # cancellable slot per PR (or head, when the receipt has no PR number) so
  # Source Validation, Fork PR Gate, and PR Size Guard do not each mint a
  # token. That slot is distinct from pull_request_target, so a green wake
  # cannot cancel a draft dequeue. Failure holds, merge-group receipts, and
  # association-free non-success receipts keep a per-workflow slot. A success
  # must not replace a failure hold. Receipts with no head stay on their run ID.
  group: merge-queue-green-enroll-${{ ((github.event_name == 'workflow_dispatch' && inputs.pr_number == '') || github.event_name == 'push') && 'reconcile' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'merge_group' && format('success-{0}', github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.workflow_run.id)) || inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || (github.event.workflow_run.head_sha && format('{0}-{1}', github.event.workflow_run.head_sha, github.event.workflow_run.name)) || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'merge_group' }}

jobs:
  # CI failures, plus PR Size Guard's "Require combined-head workflows to
  # load" step: a ci.yml GitHub cannot load reports no CI check at all
  # (2026-10-20, #21826), and the script ignores every other size failure.
  hold-failed-revision:
    name: Hold failed source revision
    outputs:
      failure_receipt: ${{ steps.failure-hold.outputs.failure_receipt }}
      admission_recovery_receipt: ${{ steps.failure-hold.outputs.admission_recovery_receipt }}
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.workflow_id == 178737329 || github.event.workflow_run.workflow_id == 299199506) &&
      github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","timed_out","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted failure policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            packages/api-client
            scripts/merge-group-failure-hold.mjs
            scripts/lib/merge-group-ahead-attribution.mjs
            scripts/lib/merge-group-admission.mjs
            scripts/lib/merge-queue-guard.mjs
            scripts/lib/pre-land-changelog.mjs
            scripts/version-fanout-guard.mjs
            .github/actions/prime-node-toolcache/action.yml
            .github/actions/prime-node-toolcache/prime.sh
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # This job's only credential is the Jovie Bot installation token below.
      # It is minted with actions, contents, pull-requests, and statuses — not
      # merge_queues. dequeuePullRequest then returns "Resource not accessible by integration".
      # GitHub already removes a PR when its merge_group run fails, so the hold
      # script treats that denial and a "not in queue" response as a logged
      # non-fatal outcome and still writes the hold. Do not add
      # permission-merge-queues unless the installation already has it: an
      # ungranted permission fails token mint before the hold is written.
      - name: Generate Jovie Bot failure-hold token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Persist exact-head failure hold and remove merge intent
        id: failure-hold
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/merge-group-failure-hold.mjs --event-path "$GITHUB_EVENT_PATH"

  enroll:
    name: Enqueue green PRs
    needs: [hold-failed-revision]
    # QUEUE_FREEZE=1 (repo variable) admits nothing; holds and dequeues still run.
    if: >-
      always() &&
      vars.QUEUE_FREEZE != '1' &&
      github.event.action != 'labeled' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'pull_request_target')) ||
       needs.hold-failed-revision.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Debounce repeated green wakes
        # The newer success cancels this run during the sleep, before the
        # Jovie Bot token is minted. Failure holds and merge-group receipts
        # do not sleep.
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'merge_group'
        run: sleep 20

      # The in-job re-read is a few seconds. GitHub left #22618 BLOCKED for
      # minutes after PR Ready, so the follow-up waits here, before the app
      # token is minted, and only on a dispatch this job itself requested.
      - name: Wait for a stale BLOCKED merge state to settle
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.blocked_recheck == '1' || inputs.blocked_recheck == '2' ||
           inputs.blocked_recheck == '3' || inputs.blocked_recheck == '4')
        env:
          BLOCKED_RECHECK: ${{ inputs.blocked_recheck }}
        run: |
          case "$BLOCKED_RECHECK" in
            1) sleep 60 ;;
            2) sleep 120 ;;
            3|4) sleep 180 ;;
            *) exit 0 ;;
          esac

      - name: Checkout trusted failure policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            packages/api-client
            scripts/merge-group-failure-hold.mjs
            scripts/lib/merge-group-ahead-attribution.mjs
            scripts/lib/merge-group-admission.mjs
            scripts/lib/merge-queue-guard.mjs
            scripts/lib/pre-land-changelog.mjs
            scripts/version-fanout-guard.mjs
            scripts/lib/admission-hold-labels.json
          sparse-checkout-cone-mode: false

      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          # A head that edits .github/workflows cannot be enqueued without it
          # ("`workflows` scope may be required"); the installation grants it.
          permission-workflows: write

      # JOV-8754: sample both REST buckets this fleet shares. GET /rate_limit
      # costs no quota. 2026-10-21 03:25-03:52Z the repo GITHUB_TOKEN bucket ran
      # dry and Merge Group Admission waited out the reset, so every group
      # stalled ~25 min. One notice per bucket feeds scripts/ci/api-quota-report.mjs.
      - name: Sample API quota
        continue-on-error: true
        env:
          REPO_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          for bucket in github-token jovie-bot; do
            if [[ "$bucket" == github-token ]]; then token="$REPO_TOKEN"; else token="$APP_TOKEN"; fi
            core="$(curl -fsS --max-time 10 -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.github+json' https://api.github.com/rate_limit \
              | jq -r '.resources.core | "remaining=\(.remaining) limit=\(.limit) used=\(.used) reset=\(.reset)"')" \
              || core="unavailable"
            echo "::notice title=api-quota::bucket=${bucket} ${core} at=$(date -u +%s)"
          done

      - name: Enqueue green PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          BLOCKED_RECHECK: ${{ inputs.blocked_recheck || '0' }}
          RECHECK_TOKEN: ${{ github.token }}
          MERGE_STATE_RETRY_MS: '3000'
          FAILURE_HOLD_RECEIPT: ${{ needs.hold-failed-revision.outputs.failure_receipt || '' }}
          ADMISSION_RECOVERY_RECEIPT: ${{ needs.hold-failed-revision.outputs.admission_recovery_receipt || '' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const failurePolicy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/merge-group-failure-hold.mjs`
            ));
            // Single source: scripts/lib/admission-hold-labels.json. Stop labels,
            // queue-poison, and lane-fix-red skip the sweep. The Lane Fix Relay
            // deletes a stale lane-fix-red; this token cannot remove labels.
            const holdLabels = JSON.parse(require('node:fs').readFileSync(
              `${process.env.GITHUB_WORKSPACE}/scripts/lib/admission-hold-labels.json`, 'utf8'
            ));
            const BLOCKING = new Set([
              ...holdLabels.stopHoldLabels,
              holdLabels.queuePoisonLabel,
              ...holdLabels.machineBlockLabels,
            ]);
            const BREAKER_LABEL = 'queue-breaker';
            const COMPOUNDING_LABEL = 'compounding', MAX_JUMPED = 2, JUMP_MAX_BUILD_S = 300, JUMP_BATCH_S = 1800;
            const COMPOUNDING_PATHS = [
              /^\.github\/(workflows|actions|ci-harness|scripts|runner-host|runner-image)\//,
              /^scripts\/(lanes|swarm|hermes)\//,
              /^scripts\/(ci-|merge-|pr-|fleet-|quota-)[^/]*$/,
              /^scripts\/tests\/test_[a-z_]*(lane|autoscale|sentinel|execution|codex|stage)[a-z_]*\.py$/,
            ];
            if (BLOCKING.size < 2) throw new Error('admission hold labels are unreadable');
            // Required checks green and no conflicts. UNSTABLE only adds a
            // non-required pending/red context (e.g. lane execution receipts).
            const ADMISSIBLE = new Set(['CLEAN', 'HAS_HOOKS', 'UNSTABLE']);
            const retryMs = Math.max(0, Number(process.env.MERGE_STATE_RETRY_MS ?? 3000) || 0);
            const blockedRecheckRaw = Number(process.env.BLOCKED_RECHECK ?? 0);
            const blockedRecheck =
              Number.isInteger(blockedRecheckRaw) && blockedRecheckRaw > 0
                ? blockedRecheckRaw
                : 0;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const { owner, repo } = context.repo;
            // Main's SHA only resolves a base-branch failure hold, so read it
            // once, lazily, for a held candidate (most wakes never need it).
            let currentMainSha;
            const readMainSha = async () => currentMainSha ??= (await github.rest.git.getRef({
              owner, repo, ref: 'heads/main',
            })).data.object.sha;
            // Use the triggering PR for automatic wakes. Scanning every eligible PR
            // on every check completion exhausts the shared app GraphQL quota.
            const validNumber = n => Number.isSafeInteger(n) && n > 0;
            // A dispatch naming one PR takes the per-PR path; only an unnamed
            // dispatch or a landing on main sweeps the roster.
            const dispatchedPr = Number(process.env.DISPATCH_PR_NUMBER || 0);
            const sweep = context.eventName === 'push' ||
              (context.eventName === 'workflow_dispatch' && !validNumber(dispatchedPr));
            let prs;
            if (sweep) {
              // Reconciliation (a landing on main or a manual run)
              // keeps a complete paginated inventory.
              prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: 'main', per_page: 100,
              });
            } else {
              let numbers = [];
              const associatedByNumber = new Map();
              // A merge-group head_sha is the synthetic queue commit. Keep
              // pulls.get on that path so the candidate carries the source head.
              let sourceHeadSha = '';
              if (context.eventName === 'workflow_dispatch') {
                numbers = [dispatchedPr];
              } else if (context.eventName === 'pull_request_target') {
                numbers = [context.payload.pull_request?.number].filter(validNumber);
              } else if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run || {};
                numbers = (run.pull_requests || []).map(pr => pr.number).filter(validNumber);
                const receipt = process.env.FAILURE_HOLD_RECEIPT;
                if (run.event === 'merge_group' && receipt) {
                  numbers = [failurePolicy.readFailureReceipt(receipt, `${owner}/${repo}`).prNumber];
                }
                const recovery = process.env.ADMISSION_RECOVERY_RECEIPT;
                if (run.event === 'merge_group' && recovery) {
                  const parsed = JSON.parse(recovery);
                  failurePolicy.admissionRecoveryReceiptStatus(recovery, {
                    repository: `${owner}/${repo}`, prNumber: parsed.prNumber, headSha: parsed.sourceHeadSha,
                  });
                  numbers = [parsed.prNumber];
                }
                if (run.event !== 'merge_group' && /^[a-f0-9]{40}$/.test(run.head_sha || '')) {
                  sourceHeadSha = run.head_sha;
                }
                // PR-target workflow receipts can omit their pull_requests association.
                // Resolve only the exact source SHA and branch, never a fallback full scan.
                // GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls is
                // repos.listPullRequestsAssociatedWithCommit. github.rest.commits
                // does not exist, so calling it throws before any enqueue.
                if (numbers.length === 0 && sourceHeadSha && run.head_branch) {
                  const pages = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                    owner, repo, commit_sha: sourceHeadSha, per_page: 100,
                  });
                  const associated = Array.isArray(pages) ? pages : [];
                  numbers = [];
                  for (const pr of associated) {
                    if (!pr || pr.state !== 'open' || pr.base?.ref !== 'main') continue;
                    if (pr.head?.sha !== sourceHeadSha || pr.head?.ref !== run.head_branch) continue;
                    if (pr.head?.repo?.full_name !== `${owner}/${repo}`) continue;
                    if (!validNumber(pr.number) || associatedByNumber.has(pr.number)) continue;
                    numbers.push(pr.number);
                    associatedByNumber.set(pr.number, pr);
                  }
                }
              }
              prs = [];
              for (const number of new Set(numbers)) {
                const known = associatedByNumber.get(number);
                if (known) {
                  // The association payload is already the open main candidate.
                  // pulls.get would repeat that REST read.
                  prs.push({
                    ...known,
                    draft: known.draft === true,
                    labels: Array.isArray(known.labels) ? known.labels : [],
                  });
                  continue;
                }
                if (sourceHeadSha) {
                  // GraphQL readPr is the admission proof and checks this SHA.
                  // The event already supplied it, so pulls.get is not a proof.
                  prs.push({
                    number,
                    draft: false,
                    state: 'open',
                    base: { ref: 'main' },
                    head: { sha: sourceHeadSha, repo: { full_name: `${owner}/${repo}` } },
                    labels: [],
                  });
                  continue;
                }
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (data.state === 'open' && data.base.ref === 'main') prs.push(data);
              }
            }
            core.info(`scanned=${prs.length}`);
            // A reconciliation sweep reads every open PR. Each read takes ~3 s
            // and UNKNOWN re-reads slept 3 s + 6 s more, so a 45-70 PR roster
            // hit the 5-minute timeout on every push to main from 2026-10-12
            // 22:31Z and re-armed nothing. Sweeps now prefetch reads in
            // parallel (which also starts GitHub's mergeability recompute),
            // give an UNKNOWN PR one fresh read with no sleep, go
            // longest-waiting first, and stop at a time budget; the PRs left
            // over are re-read on their own events and on the next sweep.
            const startedAt = Date.now();
            const budgetMs = Math.max(1000, Number(process.env.SWEEP_BUDGET_MS ?? 200000) || 200000);
            const overBudget = () => sweep && Date.now() - startedAt > budgetMs;
            const ownCandidate = candidate =>
              !candidate.draft && candidate.head.repo?.full_name === `${owner}/${repo}` &&
              !candidate.labels.some(l => BLOCKING.has(l.name.toLowerCase()));
            // Read one current PR. The roster never authorizes enqueue.
            const readPr = async number => (await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id number state isDraft baseRefName headRefOid mergeStateStatus
                      isInMergeQueue isCrossRepository
                      autoMergeRequest { enabledAt }
                      labels(first: 100) { pageInfo { hasNextPage } nodes { name } }
                      commits(last: 1) {
                        nodes { commit { committedDate statusCheckRollup { state } } }
                      }
                      timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                        nodes { ... on RemovedFromMergeQueueEvent { createdAt reason actor { __typename login } } }
                      }
                      breakerEvents: timelineItems(last: 100, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT, LABELED_EVENT]) {
                        nodes {
                          __typename
                          ... on RemovedFromMergeQueueEvent { createdAt reason }
                          ... on LabeledEvent { createdAt label { name } }
                        }
                      }
                      releases: timelineItems(last: 20, itemTypes: [UNLABELED_EVENT]) {
                        nodes { ... on UnlabeledEvent { createdAt label { name } } }
                      }
                    }
                  }
                }`, { owner, repo, number })).repository.pullRequest;
            if (sweep) {
              prs = prs.filter(ownCandidate).sort((a, b) =>
                String(a.updated_at ?? '').localeCompare(String(b.updated_at ?? '')) || a.number - b.number);
            }
            const prefetched = new Map();
            if (sweep && prs.length > 1) {
              let next = 0;
              // Prefetch spends at most half the budget so the loop keeps time to enqueue.
              const take = () =>
                next < prs.length && Date.now() - startedAt < budgetMs / 2 ? prs[next++].number : null;
              const worker = async () => {
                for (let number = take(); number !== null; number = take()) {
                  try {
                    prefetched.set(number, await readPr(number));
                  } catch (error) {
                    core.warning(`#${number} prefetch failed: ${error.message}`);
                  }
                }
              };
              const width = Math.max(1, Math.min(6, Number(process.env.SWEEP_READ_CONCURRENCY ?? 6) || 6));
              await Promise.all(Array.from({ length: Math.min(width, prs.length) }, worker));
            }
            let enqueued = 0;
            // Every decision on an open, ready, unqueued PR leaves a receipt (pr, head, reason) in the
            // job summary and one machine line, so a non-enroll is never silent (event-driven dwell).
            const receipts = [];
            const receipt = (pr, decision, reason) => receipts.push({ pr: pr?.number, head: String(pr?.headRefOid ?? '').slice(0, 12), decision, reason, at: new Date().toISOString() });
            const relabelJumpCandidates = [];
            const QUEUE_ENTRIES_QUERY = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  mergeQueue(branch: "main") {
                    entries(first: 50) { nodes { state position enqueuedAt pullRequest { number labels(first: 30) { nodes { name } } } } }
                  }
                }
              }`;
            const isCompoundingEntry = e => e.pullRequest.labels.nodes.some(l => l.name.toLowerCase() === COMPOUNDING_LABEL);
            // One reset-safe jump policy for a fresh enqueue and for a relabel re-route. A jump
            // invalidates every merge group already building and restarts its CI (10-20 min;
            // the 04:00Z jump of #23554 reset three groups and nothing merged for 90 min). So jump only
            // while no building group has had time to make progress: AWAITING_CHECKS entries enqueued
            // under JUMP_MAX_BUILD_S ago (enqueuedAt bounds the build start from above), at most one jump per
            // JUMP_BATCH_S, and at most MAX_JUMPED compounding entries queued.
            const jumpPolicy = entries => {
              const ageS = e => (Date.now() - Date.parse(e.enqueuedAt)) / 1000;
              const jumped = entries.filter(isCompoundingEntry).length;
              const building = entries.filter(e => e.state === 'AWAITING_CHECKS');
              const stale = building.filter(e => !(ageS(e) < JUMP_MAX_BUILD_S));
              const recent = entries.filter(e => isCompoundingEntry(e) && ageS(e) < JUMP_BATCH_S);
              let deferred = null;
              if (jumped >= MAX_JUMPED) deferred = `cap ${jumped}/${MAX_JUMPED}`;
              else if (stale.length > 0) deferred = `building groups older than ${JUMP_MAX_BUILD_S}s: ${stale.map(e => '#' + e.pullRequest.number).join(',')}`;
              else if (recent.length > 0) deferred = `batch window: ${recent.map(e => '#' + e.pullRequest.number).join(',')} jumped under ${JUMP_BATCH_S}s ago`;
              return { jumped, building, deferred };
            };
            for (const [index, candidate] of prs.entries()) {
              if (overBudget()) {
                core.warning(`sweep budget spent after ${index}/${prs.length} PRs; the rest wait for their own events or the next sweep`);
                break;
              }
              if (!ownCandidate(candidate)) continue;
              const readCurrent = () => readPr(candidate.number);
              const eligible = pr => {
                if (!pr || pr.state !== 'OPEN' || pr.baseRefName !== 'main') return false;
                if (pr.isDraft || pr.isInMergeQueue || pr.isCrossRepository) return false;
                if (pr.headRefOid !== candidate.head.sha || !ADMISSIBLE.has(pr.mergeStateStatus)) return false;
                if (pr.labels.pageInfo.hasNextPage) return false;
                return !pr.labels.nodes.some(l => BLOCKING.has(l.name.toLowerCase()));
              };
              // UNKNOWN means GitHub has not recomputed mergeability since main
              // moved; the read itself starts that, so two short re-reads settle it.
              // BLOCKED with a green rollup is the same lag lasting minutes
              // (JOV-8788). Re-read it on the per-PR path only. A head that is
              // still BLOCKED is not enrolled; one GITHUB_TOKEN dispatch looks
              // again. Sweeps never sleep or dispatch for it.
              const requiredChecksGreen = currentPr =>
                currentPr?.commits?.nodes?.[0]?.commit?.statusCheckRollup?.state === 'SUCCESS';
              const admissibleExceptState = currentPr => {
                if (!currentPr || currentPr.state !== 'OPEN' || currentPr.baseRefName !== 'main') return false;
                if (currentPr.isDraft || currentPr.isInMergeQueue || currentPr.isCrossRepository) return false;
                if (currentPr.headRefOid !== candidate.head.sha) return false;
                if (currentPr.labels.pageInfo.hasNextPage) return false;
                return !currentPr.labels.nodes.some(l => BLOCKING.has(l.name.toLowerCase()));
              };
              let pr = prefetched.get(candidate.number);
              if (!pr || pr.mergeStateStatus === 'UNKNOWN') pr = await readCurrent();
              for (let attempt = 1; !sweep && pr?.mergeStateStatus === 'UNKNOWN' && attempt <= 2; attempt += 1) {
                await sleep(retryMs * attempt);
                pr = await readCurrent();
              }
              const blockedWhileGreen = () =>
                !sweep && pr?.mergeStateStatus === 'BLOCKED' &&
                requiredChecksGreen(pr) && admissibleExceptState(pr);
              for (let attempt = 1; blockedWhileGreen() && attempt <= 2; attempt += 1) {
                await sleep(retryMs * attempt);
                pr = await readCurrent();
              }
              if (blockedWhileGreen()) {
                const prNumber = String(candidate.number);
                const next = blockedRecheck + 1;
                if (blockedRecheck >= 4) {
                  core.warning(`#${prNumber} stayed BLOCKED after required checks succeeded; blocked recheck exhausted`);
                  receipt(pr, 'skip', 'blocked-recheck-exhausted');
                } else if (!/^[1-9]\d*$/.test(prNumber) || next < 1 || next > 4 || !process.env.RECHECK_TOKEN) {
                  core.warning(`#${prNumber} blocked recheck not dispatched`);
                  receipt(pr, 'skip', 'blocked-recheck-undispatched');
                } else {
                  try {
                    const response = await fetch(
                      `https://api.github.com/repos/${owner}/${repo}/actions/workflows/merge-queue-green-enroll.yml/dispatches`,
                      {
                        method: 'POST',
                        headers: {
                          Accept: 'application/vnd.github+json',
                          Authorization: `Bearer ${process.env.RECHECK_TOKEN}`,
                          'Content-Type': 'application/json',
                          'X-GitHub-Api-Version': '2022-11-28',
                        },
                        body: JSON.stringify({
                          ref: 'main',
                          inputs: {
                            dry_run: 'false',
                            pr_number: prNumber,
                            blocked_recheck: String(next),
                          },
                        }),
                      }
                    );
                    if (!response.ok) {
                      core.warning(`#${prNumber} blocked recheck dispatch failed: ${response.status}`);
                      receipt(pr, 'error', `blocked-recheck-dispatch-${response.status}`);
                    } else {
                      core.info(`recheck #${prNumber}: blocked-recheck=${next}`);
                      receipt(pr, 'recheck', `blocked-recheck=${next}`);
                    }
                  } catch (error) {
                    core.warning(`#${prNumber} blocked recheck dispatch failed: ${error.message}`);
                    receipt(pr, 'error', 'blocked-recheck-dispatch-failed');
                  }
                }
                continue;
              }
              // Relabel-jump (2026-11-01): the jump decision used to be taken only at enroll time, so a
              // PR already queued behind others ignored a later `compounding` label (#24141 sat at
              // position 30 while main was red). A queued compounding PR with a non-compounding entry
              // ahead of it is dequeued and enqueued again with jump under the same caps. Both
              // mutations run in this step, so the bot's own dequeue never reaches the
              // manual-removal block below. Never dequeue by hand to re-prioritize; label instead.
              if (pr && pr.state === 'OPEN' && pr.isInMergeQueue && !pr.isDraft && !pr.isCrossRepository &&
                  pr.baseRefName === 'main' && pr.headRefOid === candidate.head.sha &&
                  !pr.labels.pageInfo.hasNextPage &&
                  pr.labels.nodes.some(l => l.name.toLowerCase() === COMPOUNDING_LABEL) &&
                  !pr.labels.nodes.some(l => BLOCKING.has(l.name.toLowerCase()))) {
                relabelJumpCandidates.push({ pr });
                continue;
              }
              if (!eligible(pr)) {
                if (pr && pr.state === 'OPEN' && !pr.isDraft && !pr.isInMergeQueue) {
                  // Name the real cause: a blocking label or a moved head is not a merge
                  // state, and a CLEAN reason beside a skip hid the stale lane-fix-red.
                  const blockers = pr.labels.nodes.filter(l => BLOCKING.has(l.name.toLowerCase())).map(l => l.name);
                  const why = pr.headRefOid !== candidate.head.sha ? `head-moved:${String(candidate.head.sha).slice(0, 12)}`
                    : pr.isCrossRepository ? 'cross-repository'
                    : blockers.length > 0 ? `blocking-label:${blockers.join(',')}`
                    : pr.labels.pageInfo.hasNextPage ? 'labels-truncated'
                    : `merge-state-not-admissible:${pr.mergeStateStatus}`;
                  core.info(`skip #${candidate.number}: ${why}`);
                  receipt(pr, 'skip', why);
                }
                continue;
              }
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: pr.headRefOid, per_page: 100 }
              );
              // The producing job's attested receipt is immediately available,
              // even while GitHub's status read still lags its accepted write.
              const directHold = failurePolicy.failureReceiptStatus(
                process.env.FAILURE_HOLD_RECEIPT,
                { repository: `${owner}/${repo}`, prNumber: pr.number, headSha: pr.headRefOid }
              );
              if (directHold) statuses.unshift(directHold);
              const directRecovery = failurePolicy.admissionRecoveryReceiptStatus(
                process.env.ADMISSION_RECOVERY_RECEIPT,
                { repository: `${owner}/${repo}`, prNumber: pr.number, headSha: pr.headRefOid }
              );
              if (directRecovery) statuses.unshift(directRecovery);
              const sourceFailure = failurePolicy.revisionFailureDisposition({
                statuses,
                repository: `${owner}/${repo}`,
                currentMainSha: statuses.some(status => status?.context === failurePolicy.FAILURE_HOLD_CONTEXT)
                  ? await readMainSha()
                  : undefined,
              });
              // JOV-6620: a head whose merge group failed stays out until a new
              // head or a person removes `hold`/`queue-poison` from this exact
              // head. A bot lifting the label (lanes) never releases it.
              let failure = failurePolicy.humanReleaseDisposition({
                failure: sourceFailure,
                release: failurePolicy.humanFailureReleaseIntent({
                  eventName: context.eventName, event: context.payload,
                }),
                prNumber: pr.number,
                headSha: pr.headRefOid,
              });
              if (failure.action === 'block') {
                core.notice(`HELD #${pr.number}@${pr.headRefOid}: ${failure.reason}`);
                receipt(pr, 'held', failure.reason);
                continue;
              }
              // Native history is revision-scoped: a commit/force-push after
              // the removal clears the old hold. Only this controller may
              // consume the one typed non-deterministic retry.
              const lastRemoval = pr.timelineItems.nodes[0]?.createdAt;
              const headCommittedAt = pr.commits.nodes[0]?.commit.committedDate;
              const removedUnchangedHead = lastRemoval &&
                (!headCommittedAt || headCommittedAt <= lastRemoval);
              // A manual removal (the dequeue-held job, or an agent pulling a
              // PR) followed by removal of a blocking label is an explicit
              // release of that same head. A failed_checks removal never is,
              // and any revision failure hold still blocks first.
              const removalReason = String(pr.timelineItems.nodes[0]?.reason || 'unknown').toLowerCase();
              // A circuit-breaker dequeue during a quota storm carries the
              // queue-breaker marker (MERGE_QUEUE.md runbook). This job only
              // runs while QUEUE_FREEZE is not 1, so a marked, still-green,
              // unheld head is re-admitted and the marker removed; a plain
              // manual dequeue without it keeps today's behavior.
              const breakerMarked = pr.labels.nodes.some(l => l.name.toLowerCase() === BREAKER_LABEL);
              const hasBreakerReceipt = currentPr => {
                const events = currentPr.breakerEvents?.nodes || [];
                const removalIndex = events.findLastIndex(
                  event => event.__typename === 'RemovedFromMergeQueueEvent'
                );
                const removal = events[removalIndex];
                if (removalIndex < 0 || removal?.createdAt !== lastRemoval ||
                    String(removal?.reason || 'unknown').toLowerCase() !== 'manual') return false;
                return events.slice(removalIndex + 1).some(event =>
                  event.__typename === 'LabeledEvent' &&
                  String(event.label?.name || '').toLowerCase() === BREAKER_LABEL
                );
              };
              // The runbook adds the marker only after dequeue succeeds. Binding
              // the ordered label event to the latest removal prevents a stale
              // marker from reversing a later unrelated manual dequeue, even
              // when GitHub gives both events the same timestamp.
              const breakerRestore = Boolean(removedUnchangedHead) &&
                failure.action === 'allow' && removalReason === 'manual' && breakerMarked &&
                hasBreakerReceipt(pr);
              const releasedAfterManualRemoval = Boolean(removedUnchangedHead) &&
                failure.action === 'allow' &&
                removalReason === 'manual' &&
                (breakerRestore || (pr.releases?.nodes || []).some(event =>
                  typeof event?.createdAt === 'string' && event.createdAt > lastRemoval &&
                  BLOCKING.has(String(event.label?.name || '').toLowerCase())));
              const ownerHoldRelease = failurePolicy.ownerHoldReleaseIntent({
                eventName: context.eventName, event: context.payload,
              });
              const failureBeforeReenroll = failure.action;
              if (!releasedAfterManualRemoval) {
                failure = failurePolicy.reenrollmentDisposition({
                  failure, statuses, repository: `${owner}/${repo}`, prNumber: pr.number, lastRemoval, headCommittedAt,
                  autoMergeEnabled: Number.isFinite(Date.parse(pr.autoMergeRequest?.enabledAt)),
                  headSha: pr.headRefOid, lastRemovalReason: pr.timelineItems.nodes[0]?.reason,
                  ownerHoldRelease,
                });
              }
              // A person pulling this head out of the queue also withdraws any
              // automatic retry; only their explicit release re-admits it.
              const removalActor = pr.timelineItems.nodes[0]?.actor;
              const humanDequeued = Boolean(removedUnchangedHead) && removalReason === 'manual' &&
                removalActor?.__typename === 'User' && !/\[bot\]$/i.test(String(removalActor?.login || ''));
              // Ejection re-enroll (2026-10-29): a head GitHub or a bot removed from
              // the queue with no revision-failure hold on record (failure was
              // 'allow' before the recovery-intent check) is still green and
              // CLEAN, so it is admitted again instead of waiting for a human.
              // Bounded: never a human dequeue, at most REENROLL_MAX_REMOVALS
              // removals on this head, and REENROLL_DWELL_MS after the last
              // removal. A merge-group failure at the head writes a failure
              // hold, which still blocks above (JOV-6620 is untouched).
              const REENROLL_MAX_REMOVALS = 3, REENROLL_DWELL_MS = 5 * 60 * 1000;
              const removalsOnHead = (pr.breakerEvents?.nodes || []).filter(event =>
                event.__typename === 'RemovedFromMergeQueueEvent' &&
                (!headCommittedAt || event.createdAt > headCommittedAt)).length;
              const automaticRemoval = removalReason === 'failed_checks' ||
                (removalReason === 'manual' && (removalActor?.__typename === 'Bot' || /\[bot\]$/i.test(String(removalActor?.login || ''))));
              const ejectionReenroll = Boolean(removedUnchangedHead) && automaticRemoval && !humanDequeued &&
                failureBeforeReenroll === 'allow' && failure.action === 'block' &&
                ['removed-without-recovery-intent', 'no-current-admission-recovery'].includes(failure.reason) &&
                removalsOnHead < REENROLL_MAX_REMOVALS &&
                Date.now() - Date.parse(lastRemoval) >= REENROLL_DWELL_MS;
              if (ejectionReenroll) failure = { action: 'allow', reason: 'ejection-reenroll' };
              if (failure.action === 'block' ||
                  (humanDequeued && failure.action === 'retry-once' &&
                   failure.reason !== 'human-failure-release') ||
                  (removedUnchangedHead && failure.action !== 'retry-once' &&
                   failure.reason !== 'owner-hold-release' && !releasedAfterManualRemoval && !ejectionReenroll)) {
                core.info(`skip #${pr.number}: head unchanged since queue removal (${removalReason}; ${failure.reason})`);
                receipt(pr, 'skip', `head-unchanged-since-removal:${removalReason}:${failure.reason}`);
                continue;
              }
              if (process.env.DRY_RUN === 'true') {
                core.notice(`[dry run] would enqueue #${pr.number}`);
                continue;
              }
              const admissionRecovery = failure.reason === 'bounded-admission-recovery';
              const ownerReleaseStillCurrent = async () => {
                const observed = await readCurrent();
                if (!eligible(observed) || observed.id !== pr.id) return false;
                const freshStatuses = await github.paginate(github.rest.repos.listCommitStatusesForRef,
                  { owner, repo, ref: observed.headRefOid, per_page: 100 });
                // Fence mutations during status pagination before expected-head enqueue.
                const fresh = await readCurrent();
                if (!eligible(fresh) || fresh.id !== pr.id || fresh.number !== pr.number ||
                    fresh.headRefOid !== observed.headRefOid) return false;
                const disposition = failurePolicy.reenrollmentDisposition({
                  failure: failurePolicy.revisionFailureDisposition({ statuses: freshStatuses,
                    repository: `${owner}/${repo}`, currentMainSha }),
                  statuses: freshStatuses, repository: `${owner}/${repo}`, prNumber: fresh.number,
                  lastRemoval: fresh.timelineItems.nodes[0]?.createdAt,
                  headCommittedAt: fresh.commits.nodes[0]?.commit.committedDate,
                  autoMergeEnabled: Number.isFinite(Date.parse(fresh.autoMergeRequest?.enabledAt)),
                  headSha: fresh.headRefOid, lastRemovalReason: fresh.timelineItems.nodes[0]?.reason,
                  ownerHoldRelease,
                });
                return disposition.reason === 'owner-hold-release' && disposition.removalAt === failure.removalAt;
              };
              const breakerReleaseStillCurrent = async markerRequired => {
                const sameRemoval = currentPr => {
                  const removal = currentPr.timelineItems.nodes[0];
                  const committedAt = currentPr.commits.nodes[0]?.commit.committedDate;
                  return removal?.createdAt === lastRemoval &&
                    String(removal?.reason || 'unknown').toLowerCase() === 'manual' &&
                    (!committedAt || committedAt <= lastRemoval);
                };
                const hasMarker = currentPr => currentPr.labels.nodes.some(
                  label => label.name.toLowerCase() === BREAKER_LABEL
                );
                const observed = await readCurrent();
                if (!eligible(observed) || observed.id !== pr.id || observed.number !== pr.number ||
                    observed.headRefOid !== pr.headRefOid || !sameRemoval(observed) ||
                    !hasBreakerReceipt(observed) ||
                    (markerRequired && !hasMarker(observed))) return false;
                const freshStatuses = await github.paginate(
                  github.rest.repos.listCommitStatusesForRef,
                  { owner, repo, ref: observed.headRefOid, per_page: 100 }
                );
                const freshFailure = failurePolicy.revisionFailureDisposition({
                  statuses: freshStatuses,
                  repository: `${owner}/${repo}`,
                  currentMainSha: freshStatuses.some(
                    status => status?.context === failurePolicy.FAILURE_HOLD_CONTEXT
                  ) ? await readMainSha() : undefined,
                });
                // Fence marker/hold/removal/head changes during status pagination.
                // This is the final awaited read before the enqueue mutation.
                const fresh = await readCurrent();
                return eligible(fresh) && fresh.id === pr.id && fresh.number === pr.number &&
                  fresh.headRefOid === observed.headRefOid && sameRemoval(fresh) &&
                  hasBreakerReceipt(fresh) &&
                  (!markerRequired || hasMarker(fresh)) && freshFailure.action === 'allow';
              };
              const recoveryStillCurrent = async () => {
                const fresh = await readCurrent();
                if (!eligible(fresh) || fresh.id !== pr.id || fresh.number !== pr.number) return false;
                const currentRecovery = failurePolicy.reenrollmentDisposition({
                  failure: sourceFailure, statuses, repository: `${owner}/${repo}`, prNumber: fresh.number,
                  lastRemoval: fresh.timelineItems.nodes[0]?.createdAt,
                  headCommittedAt: fresh.commits.nodes[0]?.commit.committedDate,
                  autoMergeEnabled: Number.isFinite(Date.parse(fresh.autoMergeRequest?.enabledAt)),
                });
                return currentRecovery.action === 'retry-once' &&
                  currentRecovery.reason === 'bounded-admission-recovery' &&
                  currentRecovery.latest.runId === failure.latest.runId &&
                  currentRecovery.latest.runAttempt === failure.latest.runAttempt &&
                  currentRecovery.latest.completedAt === failure.latest.completedAt;
              };
              const writeRetry = description => github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.headRefOid, state: 'success',
                context: failurePolicy.FAILURE_RETRY_CONTEXT,
                description, target_url: failure.latest.targetUrl,
              });
              let enqueueAttempted = false;
              try {
                // A source SHA cannot attest merge intent or a later manual removal.
                // Re-read after statuses before spending a recovery reservation.
                if (admissionRecovery && !await recoveryStillCurrent()) continue;
                if (failure.action === 'retry-once') {
                  await writeRetry(failurePolicy.retrySpentDescription(failure.latest));
                  core.notice(`RESERVED bounded retry for #${pr.number}@${pr.headRefOid}`);
                }
                // The reservation write is another await. A stale recovery keeps
                // that reservation spent and never reaches enqueue or a refund.
                if (admissionRecovery && !await recoveryStillCurrent()) continue;
                if (failure.reason === 'owner-hold-release' && !await ownerReleaseStillCurrent()) continue;
                if (breakerRestore) {
                  if (!await breakerReleaseStillCurrent(true)) continue;
                  try {
                    // Consume the operator's one-shot authorization before enqueue.
                    // Failure is fail-closed so a stale marker can never authorize
                    // a later manual dequeue of this unchanged head.
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: pr.number, name: BREAKER_LABEL,
                    });
                  } catch (error) {
                    core.warning(`#${pr.number} ${BREAKER_LABEL} not consumed: ${error.message}`);
                    continue;
                  }
                  if (!await breakerReleaseStillCurrent(false)) continue;
                }
                // Tim 2026-10-28: compounding work (infra that speeds up all other work) jumps
                // the queue, at most MAX_JUMPED entries at once. A PR is compounding when it carries the
                // label or every touched file is lanes/swarm/CI/controller infrastructure. Every decision
                // is logged as a receipt. Any failure here falls back to a plain enqueue.
                let jump = false;
                try {
                  let compounding = pr.labels.nodes.some(l => l.name.toLowerCase() === COMPOUNDING_LABEL);
                  let basis = 'label';
                  if (!compounding) {
                    const files = await github.paginate(github.rest.pulls.listFiles, {
                      owner, repo, pull_number: pr.number, per_page: 100,
                    });
                    compounding = files.length > 0 && files.length <= 100 &&
                      files.every(f => COMPOUNDING_PATHS.some(re => re.test(f.filename)));
                    basis = 'paths';
                  }
                  if (compounding) {
                    const queue = await github.graphql(QUEUE_ENTRIES_QUERY, { owner, repo });
                    const entries = (queue.repository.mergeQueue?.entries?.nodes ?? []).filter(e => e.pullRequest.number !== pr.number);
                    const { jumped, building, deferred } = jumpPolicy(entries);
                    jump = deferred === null;
                    receipt(pr, jump ? 'jump' : 'jump-deferred', `compounding(${basis}) ${deferred ?? `queued=${jumped}/${MAX_JUMPED}`}`);
                    core.notice(`COMPOUNDING #${pr.number} ${jump ? 'jumps' : 'deferred'} (${basis}; ${deferred ?? 'clear'})`);
                    if (jump && building.length > 0) {
                      // Every reset a jump causes is logged with the groups it restarts.
                      receipt(pr, 'jump-reset', `restarts building groups ${building.map(e => '#' + e.pullRequest.number).join(',')}`);
                      core.warning(`JUMP RESET by #${pr.number}: restarts building merge groups ${building.map(e => '#' + e.pullRequest.number).join(',')}`);
                    }
                  }
                } catch (error) {
                  core.warning(`#${pr.number} compounding check failed, plain enqueue: ${error.message}`);
                }
                enqueueAttempted = true;
                const enqueue = withJump => github.graphql(`
                  mutation($id: ID!, $oid: GitObjectID!) {
                    enqueuePullRequest(input: { pullRequestId: $id, expectedHeadOid: $oid${withJump ? ', jump: true' : ''} }) {
                      mergeQueueEntry { position }
                    }
                  }`, { id: pr.id, oid: pr.headRefOid });
                let r;
                try {
                  r = await enqueue(jump);
                } catch (error) {
                  // A token without maintain/admin cannot jump; a plain enqueue still lands the PR.
                  if (!jump || /head|stale|changed/i.test(String(error.message))) throw error;
                  core.warning(`#${pr.number} jump rejected (${error.message}); plain enqueue`);
                  receipt(pr, 'jump-rejected', String(error.message).slice(0, 120));
                  jump = false;
                  r = await enqueue(false);
                }
                enqueued += 1;
                core.notice(`ENQUEUED #${pr.number} at position ${r.enqueuePullRequest.mergeQueueEntry.position}`);
                receipt(pr, jump ? 'enqueued-jump' : 'enqueued', `position=${r.enqueuePullRequest.mergeQueueEntry.position};basis=${failure.reason}`);
                if (breakerMarked && !breakerRestore) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pr.number, name: BREAKER_LABEL,
                  }).catch(error => core.warning(
                    `#${pr.number} stale ${BREAKER_LABEL} not removed: ${error.message}`
                  ));
                }
              } catch (error) {
                if (enqueueAttempted && failure.action === 'retry-once' && failurePolicy.enqueueWasRejected(error)) {
                  await writeRetry(failurePolicy.retryReleasedDescription(failure.latest));
                  core.notice(`RELEASED rejected enqueue reservation for #${pr.number}@${pr.headRefOid}`);
                }
                core.warning(`#${pr.number} not enqueued: ${error.message}`);
                receipt(pr, 'error', String(error.message).slice(0, 200));
              }
            }
            // Relabel-jump pass (2026-11-01). Runs after the enrollment loop so the exact-head
            // failure hold is always evaluated first: a head whose merge group failed is never
            // dequeued and re-enqueued here, and the hold receipt below is read before any mutation.
            for (const { pr } of relabelJumpCandidates) {
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: pr.headRefOid, per_page: 100 }
              );
              const directHold = failurePolicy.failureReceiptStatus(
                process.env.FAILURE_HOLD_RECEIPT,
                { repository: `${owner}/${repo}`, prNumber: pr.number, headSha: pr.headRefOid }
              );
              if (directHold) statuses.unshift(directHold);
              const sourceFailure = failurePolicy.revisionFailureDisposition({
                statuses,
                repository: `${owner}/${repo}`,
                currentMainSha: statuses.some(status => status?.context === failurePolicy.FAILURE_HOLD_CONTEXT)
                  ? await readMainSha()
                  : undefined,
              });
              if (sourceFailure.action !== 'allow') {
                receipt(pr, 'held', `relabel-jump:${sourceFailure.reason ?? sourceFailure.action}`);
                continue;
              }
              try {
                const queue = await github.graphql(QUEUE_ENTRIES_QUERY, { owner, repo });
                const all = queue.repository.mergeQueue?.entries?.nodes ?? [];
                const self = all.find(e => e.pullRequest.number === pr.number);
                if (!self) {
                  receipt(pr, 'skip', 'relabel-jump:entry-not-in-first-50');
                } else if (all.filter(e => e.position < self.position).every(isCompoundingEntry)) {
                  receipt(pr, 'skip', `relabel-jump:already-ahead position=${self.position}`);
                } else {
                  const others = all.filter(e => e.pullRequest.number !== pr.number);
                  const { jumped, building, deferred } = jumpPolicy(others);
                  if (deferred !== null) {
                    receipt(pr, 'jump-deferred', `relabel-jump ${deferred}`);
                    core.notice(`RELABEL-JUMP #${pr.number} deferred (${deferred})`);
                  } else if (process.env.DRY_RUN === 'true') {
                    core.notice(`[dry run] would relabel-jump #${pr.number}`);
                  } else {
                    await github.graphql(
                      `mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }`,
                      { id: pr.id }
                    );
                    const reenqueue = withJump => github.graphql(`
                      mutation($id: ID!, $oid: GitObjectID!) {
                        enqueuePullRequest(input: { pullRequestId: $id, expectedHeadOid: $oid${withJump ? ', jump: true' : ''} }) {
                          mergeQueueEntry { position }
                        }
                      }`, { id: pr.id, oid: pr.headRefOid });
                    let jumpedAgain = true, r;
                    try {
                      r = await reenqueue(true);
                    } catch (error) {
                      // The dequeue already happened: land the PR plainly rather than leave it out.
                      if (/head|stale|changed/i.test(String(error.message))) throw error;
                      core.warning(`#${pr.number} relabel jump rejected (${error.message}); plain enqueue`);
                      receipt(pr, 'jump-rejected', String(error.message).slice(0, 120));
                      jumpedAgain = false;
                      r = await reenqueue(false);
                    }
                    enqueued += 1;
                    core.notice(`RELABEL-JUMP #${pr.number} from position ${self.position} to ${r.enqueuePullRequest.mergeQueueEntry.position}`);
                    receipt(pr, 'relabel-jump', `from=${self.position};to=${r.enqueuePullRequest.mergeQueueEntry.position};jump=${jumpedAgain};queued=${jumped}/${MAX_JUMPED}`);
                    if (building.length > 0) {
                      receipt(pr, 'jump-reset', `restarts building groups ${building.map(e => '#' + e.pullRequest.number).join(',')}`);
                      core.warning(`JUMP RESET by #${pr.number}: restarts building merge groups ${building.map(e => '#' + e.pullRequest.number).join(',')}`);
                    }
                  }
                }
              } catch (error) {
                core.warning(`#${pr.number} relabel-jump failed: ${error.message}`);
                receipt(pr, 'error', `relabel-jump:${String(error.message).slice(0, 180)}`);
              }
            }
            core.info(`enqueued=${enqueued}`);
            core.info(`enroll-receipts ${JSON.stringify(receipts)}`);
            if (receipts.length > 0 && core.summary) {
              await core.summary
                .addHeading('Enroll decisions', 3)
                .addTable([
                  [{ data: 'PR', header: true }, { data: 'Head', header: true }, { data: 'Decision', header: true }, { data: 'Reason', header: true }],
                  ...receipts.map(row => [`#${row.pr}`, row.head, row.decision, row.reason]),
                ])
                .write()
                .catch(error => core.warning(`enroll receipt summary not written: ${error.message}`));
            }

  # Conversion to draft does not remove GitHub's native queue entry. Reuse the
  # existing exact-head/entry guard under the same admission owner, even during
  # a queue freeze. Never run PR code or grant new installation permissions.
  dequeue-draft:
    name: Dequeue an exact draft head
    if: github.event_name == 'pull_request_target' && github.event.action == 'converted_to_draft'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout trusted queue policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/merge-queue-backend.mjs
            scripts/lib/merge-queue-guard.mjs
            scripts/lib/pre-land-changelog.mjs
            scripts/version-fanout-guard.mjs
            .github/actions/prime-node-toolcache/action.yml
            .github/actions/prime-node-toolcache/prime.sh
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate Jovie Bot dequeue token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile only the event's current draft queue entry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { reconcileDraftQueueEntry } from './scripts/merge-queue-backend.mjs';
          console.log(JSON.stringify(await reconcileDraftQueueEntry({
            event: JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')),
            repository: process.env.GITHUB_REPOSITORY,
          })));
          NODE

  # No stop label is human-owned (tim-hold, tim:hold, hold:tim and do-not-merge
  # are retired, 2026-10-28). Every stop label uses the hold contract
  # (scripts/hold-contract.mjs, jovie-hold/v1): a receipt names an owner and an
  # expiry or head-change release.
  # Ownerless machine holds past their grace period and expired receipts
  # are removed with one comment. The Jovie Bot unlabel event then wakes the
  # enroll job above; required checks still gate admission. Expiry is checked
  # on the next event after it lapses: a landing on main, a merge-group CI
  # result, or a PR label/push event.
  enforce-hold-contract:
    name: Release ownerless or expired holds
    if: >-
      contains(fromJSON('["workflow_dispatch","push","pull_request_target"]'), github.event_name) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted hold contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/hold-contract.mjs
            scripts/lib/github-rate-limit.mjs
            scripts/lib/admission-hold-labels.json
            scripts/lib/admission-hold-labels.mjs
            scripts/lib/queue-deferral-receipt.mjs
            .github/actions/prime-node-toolcache/action.yml
            .github/actions/prime-node-toolcache/prime.sh
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate Jovie Bot hold-contract token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Enforce the hold contract
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/hold-contract.mjs

  # A blocking label on a queued PR fails Fork PR Gate and PR Size Guard for
  # every merge group containing it, so the whole queue behind it is rebuilt
  # (2026-10-04: #20442, #20381, #20398). Remove just that PR instead. This is
  # also the documented way to push a fix to a queued PR: add `hold`, push,
  # remove `hold`; the `unlabeled` wake re-enrolls the new head once CLEAN.
  dequeue-held:
    name: Dequeue a held queued PR
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      contains(fromJSON('["hold","gated","incident","queue-deferred","queue-poison","lane-fix-red"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Generate Jovie Bot dequeue token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Remove the held PR from the merge queue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            const sourceHead = context.payload.pull_request?.head?.sha;
            const rawLabel = context.payload.label?.name;
            const label = typeof rawLabel === 'string' ? rawLabel.toLowerCase() : null;
            const blocking = new Set(['hold', 'gated', 'incident', 'queue-deferred', 'queue-poison', 'lane-fix-red']);
            if (!Number.isSafeInteger(number) || number <= 0 ||
                typeof sourceHead !== 'string' || !/^[a-f0-9]{40}$/.test(sourceHead) || !blocking.has(label)) {
              core.info('Ignoring an incomplete blocking-label event');
              return;
            }
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id state headRefOid isInMergeQueue labels(first:100){pageInfo{hasNextPage} nodes{name}}}}}`,
              { owner, repo, number }
            );
            const pr = repository?.pullRequest;
            // An old event cannot remove a replacement head or a PR whose hold
            // was removed while this job waited. Dequeue has no expected-head CAS.
            const labels = pr?.labels;
            if (pr?.state !== 'OPEN' || pr.headRefOid !== sourceHead ||
                pr.isInMergeQueue !== true || typeof pr.id !== 'string' || !pr.id ||
                labels?.pageInfo?.hasNextPage !== false || !Array.isArray(labels.nodes) ||
                labels.nodes.some(item => typeof item?.name !== 'string') ||
                !labels.nodes.some(item => item.name.toLowerCase() === label)) {
              core.info(`#${number} no longer matches the queued blocking-label event`);
              return;
            }
            try {
              await github.graphql(
                `mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}`,
                { id: pr.id }
              );
              core.notice(`DEQUEUED #${number}: labeled ${context.payload.label.name} while queued`);
              // The queue timeline records only "manual" for this removal, so say why on the PR
              // (24h to 2026-10-26: 14 bot dequeues with no recorded reason). The marker is
              // machine-readable; scripts/queue-dequeue.mjs writes the same shape for agents.
              const record = { code: 'hold', by: 'merge-queue-green-enroll/dequeue-held', label: context.payload.label.name, labeledBy: context.payload.sender?.login ?? null };
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `Dequeued from the merge queue (hold): \`${context.payload.label.name}\` was added by @${context.payload.sender?.login ?? 'unknown'} while it was queued. Remove the label to re-enroll once CLEAN.\n<!-- queue-dequeue ${JSON.stringify(record)} -->`,
                });
              } catch (commentError) {
                core.warning(`could not record the dequeue reason on #${number}: ${commentError.message}`);
              }
            } catch (error) {
              // A denied dequeue leaves today's behaviour: its merge group fails the gate.
              core.warning(`dequeue of held #${number} failed: ${error.message}`);
            }

  # Runs only after the hold has dropped merge intent. A green PR dequeued by
  # another member of the group, or by the base branch, is enqueued again on
  # that same SHA via enqueuePullRequest (no --auto, no --squash). A token
  # that still cannot enqueue names the PR with ::error:: and the step
  # summary. Two rearms per SHA; the enroll job is not involved. A failure with
  # no implicated path (a flake) re-enqueues a green head that github-merge-queue[bot]
  # removed within 30 minutes, tagged why=unattributed in the receipt (#23562: 24 min lag).
  rearm-green-victims:
    name: Rearm green merge-group victims
    needs: [hold-failed-revision]
    if: >-
      always() &&
      vars.QUEUE_FREEZE != '1' &&
      needs.hold-failed-revision.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted rearm policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/merge-group-victim-rearm.mjs
            scripts/lib/merge-group-ahead-attribution.mjs
            scripts/lib/admission-hold-labels.json
            scripts/lib/admission-hold-labels.mjs
            .github/actions/prime-node-toolcache/action.yml
            .github/actions/prime-node-toolcache/prime.sh
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate Jovie Bot rearm token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-actions: read
          # enqueuePullRequest needs the same contents grant as the enroll job.
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          # Enqueueing a head that edits .github/workflows needs it.
          permission-workflows: write

      - name: Rearm green victims of this merge group
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILURE_HOLD_RECEIPT: ${{ needs.hold-failed-revision.outputs.failure_receipt || '' }}
        run: node scripts/merge-group-victim-rearm.mjs --event-path "$GITHUB_EVENT_PATH"
