name: Quarantine Recovery
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: Exhaustive verified quarantine history is too heavy for the
# per-run flakiness report hop; a daily sweep collects evidence and drafts
# ledger-only recovery proposals without touching the hot path.
# removal-trigger: Collapse this sweep when each test producer emits complete
# quarantine execution evidence in-band from the same exact artifacts.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: quarantine-recovery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  propose-quarantine-recovery:
    name: Propose Quarantine Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect verified quarantine execution history
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/collect-quarantine-evidence.mjs

      - name: Analyze test results from recent runs
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh run download reads Unit Tests unit-flaky-* artifacts.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/analyze-test-flakiness.js

      # Commission only after the producer/collector/writer receipts are
      # accepted. A ratchet failure permits remediation, never fake cleanliness.
      - name: File verified failure clusters in Linear
        id: intake
        if: ${{ vars.QUARANTINE_AUTO_HEAL_ENABLED == 'true' && steps.collect.outcome == 'success' && steps.analyze.outcome == 'success' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/file-quarantine-clusters.mjs

      - name: Generate guarded proposal token
        id: proposal-token
        if: ${{ vars.QUARANTINE_AUTO_HEAL_ENABLED == 'true' && steps.intake.outcome == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose guarded quarantine ledger reconciliation
        if: ${{ vars.QUARANTINE_AUTO_HEAL_ENABLED == 'true' && steps.intake.outcome == 'success' && steps.proposal-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.proposal-token.outputs.token }}
        run: node scripts/propose-quarantine-ledger.mjs
