name: Delivery Control Receipts

# This workflow is evidence and repair-task ingress only. It is deliberately
# separate from the native queue mutex so a cancelled/competing queue workflow
# still leaves a durable next-owner receipt instead of silently stalling.
on:
  repository_dispatch:
    types: [delivery-control-failure]
  workflow_run:
    workflows: ['Merge Queue Auto-Enroll']
    types: [completed]
  schedule:
    # Missed-event reconciliation only; it does not select or admit work.
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: jovie-delivery-receipt-ingress
  cancel-in-progress: false

jobs:
  receipt:
    # Successful queue runs already carry their own exact-head receipt. Every
    # non-success terminal run must become a repair task. Repository dispatch
    # and reconciliation are explicit ingress paths.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Persist a classified terminal receipt and repair task
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'schedule' ]]; then
            node scripts/backlog-orchestrator/delivery-state-machine.mjs \
              --reconcile \
              --heartbeat-file="$GEM_WORKSPACE/state/symphony-event-admission-heartbeat.json"
          else
            node scripts/backlog-orchestrator/delivery-state-machine.mjs \
              --event-file="$GITHUB_EVENT_PATH"
          fi
