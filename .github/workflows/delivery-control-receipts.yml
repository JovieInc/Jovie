name: Delivery Control Receipts

# This workflow is evidence and repair-task ingress only. It is deliberately
# separate from the native queue mutex so a cancelled/competing queue workflow
# still leaves a durable next-owner receipt instead of silently stalling.
# JOV-INV-017: event-trigger classification is immediate. Missed-event recovery
# is the next causal CI/queue/production completion or dispatch, not a clock.
on:
  repository_dispatch:
    types: [delivery-control-failure]
  workflow_run:
    workflows: [Production Controller]
    types: [completed]

permissions:
  contents: read

# No workflow concurrency group: GitHub keeps only one pending run per group
# and cancels the older pending one, so a burst of terminal controller events
# can silently drop receipts. The delivery-state-machine writer lock serializes
# the durable write; each receipt holds it for about a second.

jobs:
  receipt:
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Persist a classified terminal receipt and repair task
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backlog-orchestrator/delivery-state-machine.mjs \
            --event-file="$GITHUB_EVENT_PATH" | \
            jq -e '{status, receipt, task, loop: (.loop | {loopKey, state, owner, action, dispatchState, outcome}), queuePath}'
