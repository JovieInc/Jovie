name: Delivery Control Receipts

# This workflow is evidence and repair-task ingress only. It is deliberately
# separate from the native queue mutex so a cancelled/competing queue workflow
# still leaves a durable next-owner receipt instead of silently stalling.
# JOV-INV-017: event-trigger classification is immediate. Missed-event recovery
# is the next causal CI/queue/production completion or dispatch, not a clock.
on:
  repository_dispatch:
    types: [delivery-control-failure]
  workflow_run:
    workflows:
      - Merge Queue Auto-Enroll
      - PR Size Guard
      - CI
      - Production Controller
    types: [completed]

permissions:
  contents: read

concurrency:
  group: jovie-delivery-receipt-ingress
  cancel-in-progress: false

jobs:
  receipt:
    # Successful queue runs already carry their own exact-head receipt. Every
    # non-success terminal run must become a repair task. Repository dispatch
    # and repository dispatch are explicit ingress paths.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Persist a classified terminal receipt and repair task
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backlog-orchestrator/delivery-state-machine.mjs \
            --event-file="$GITHUB_EVENT_PATH"
