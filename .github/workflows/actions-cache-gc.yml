# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: GitHub evicts Actions caches only by 7-day LRU, and over the 10 GB budget that LRU drops live main caches; this hop holds only actions:write to evict closed-ref, duplicate, and surplus caches first.
# removal-trigger: Remove when each cache writer deletes its predecessor after saving and closed PRs drop their own caches.
name: Actions Cache GC

# The one Actions cache eviction controller. It also prunes superseded main
# generations (scripts/lib/actions-cache-supersede.mjs), which used to be a
# second workflow listing the same caches on the same push.
# Ongoing eviction for stale/duplicate Actions caches. Does not smash live
# pnpm/node/playwright caches on main or open PR refs unless they are unused
# and the repo is over the cache budget.
#
# No clock: the cache only grows when workflows save, and main pushes are
# where the large caches are written, so each main push re-plans eviction.
# Caches of PRs closed since the last push go on the next one. One run goes
# at a time and the newest push waits behind it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete selected caches (false keeps this a dry-run)'
        required: false
        default: 'true'

permissions: {}

concurrency:
  group: actions-cache-gc
  cancel-in-progress: false

jobs:
  gc:
    name: Evict stale and duplicate Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted cache GC policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/lib/actions-cache-gc.mjs
            scripts/lib/actions-cache-supersede.mjs
            scripts/lib/github-installation-quota.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Plan and evict caches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLY: ${{ github.event.inputs.apply || 'true' }}
        run: node scripts/lib/actions-cache-gc.mjs
