# Changed paths come from the pull_request merge commit: HEAD^1 is the base
# tip, so the diff is this PR. The pulls files endpoint returns HTTP 403 once
# the Actions installation REST budget is exhausted, which failed this check
# before the brief ran. This job reads the checkout instead.
name: Design gate

# Warns when a PR touches a marketing or landing surface without a completed
# design brief (JOV-7541). Warn-only unless the repo variable
# DESIGN_GATE_ENFORCE is truthy. Default off: a warning still exits 0.
# The path list is design_gate.GATED_PATH_PREFIXES; the globs below only
# skip unrelated PRs and must keep those prefixes:
#   apps/web/app/(marketing)/
#   apps/web/app/(home)/
#   apps/web/components/marketing/
#   apps/web/data/marketing/
# Not a merge-queue required check. Unreadable briefs stay warnings.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'apps/web/app/(marketing)/**'
      - 'apps/web/app/(home)/**'
      - 'apps/web/components/marketing/**'
      - 'apps/web/data/marketing/**'
      - 'docs/design/**'
      - 'scripts/lanes/design_gate.py'
      - 'scripts/lanes/design_gate_check.py'
      - 'scripts/lanes/certified-capabilities.gen.json'
      - '.github/workflows/design-gate.yml'

permissions:
  contents: read

concurrency:
  group: design-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  brief:
    name: Design gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default pull_request ref is the synthetic merge. Depth 2 includes
          # that commit and its first parent (the base tip).
          fetch-depth: 2
          persist-credentials: false

      - name: Changed files
        run: |
          set -euo pipefail
          git rev-parse --verify HEAD^1 >/dev/null
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/design-gate-files.txt"

      - name: Check the design brief
        env:
          DESIGN_GATE_ENFORCE: ${{ vars.DESIGN_GATE_ENFORCE }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          python3 scripts/lanes/design_gate_check.py \
            --event "$GITHUB_EVENT_PATH" \
            --files-from "$RUNNER_TEMP/design-gate-files.txt" \
            --repo .
