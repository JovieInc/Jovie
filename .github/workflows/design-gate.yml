name: Design gate

# Warns when a PR touches a marketing or landing surface without a completed
# design brief (JOV-7541). Warn-only unless the repo variable
# DESIGN_GATE_ENFORCE is truthy. Default off: a warning still exits 0.
# The path list is design_gate.GATED_PATH_PREFIXES; the globs below only
# skip unrelated PRs and must keep those prefixes:
#   apps/web/app/(marketing)/
#   apps/web/app/(home)/
#   apps/web/components/marketing/
#   apps/web/data/marketing/
# Not a merge-queue required check. Unreadable briefs stay warnings.
#
# Changed paths come from the pull_request merge commit, not the pulls files
# API. On 2026-10-11 the installation REST budget hit zero and PR Size Guard
# failed closed on that API; on 2026-10-21 this job did too (HTTP 403 before
# the brief check). Depth 2 includes that merge commit's first parent, the
# base tip GitHub merged into. Diffing that parent is the PR's path list.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'apps/web/app/(marketing)/**'
      - 'apps/web/app/(home)/**'
      - 'apps/web/components/marketing/**'
      - 'apps/web/data/marketing/**'
      - 'docs/design/**'
      - 'scripts/lanes/design_gate.py'
      - 'scripts/lanes/design_gate_check.py'
      - 'scripts/lanes/certified-capabilities.gen.json'
      - '.github/workflows/design-gate.yml'

permissions:
  contents: read

concurrency:
  group: design-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  brief:
    name: Design gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request checks out refs/pull/<n>/merge. Depth 2 includes its
          # first parent, so the path list does not need the files API.
          fetch-depth: 2

      - name: Changed files
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet 'HEAD^1' >/dev/null; then
            echo "::error::Design gate checkout has no merge parent. fetch-depth must include the pull_request merge commit."
            exit 1
          fi
          git diff --name-only --diff-filter=ACDMRTUXB 'HEAD^1' HEAD > "$RUNNER_TEMP/design-gate-files.txt"

      - name: Check the design brief
        env:
          DESIGN_GATE_ENFORCE: ${{ vars.DESIGN_GATE_ENFORCE }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          python3 scripts/lanes/design_gate_check.py \
            --event "$GITHUB_EVENT_PATH" \
            --files-from "$RUNNER_TEMP/design-gate-files.txt" \
            --repo .
