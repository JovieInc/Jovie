name: Fleet Gate Refresh

# Event-driven one-writer refresh and Symphony admission. Every event that can
# change green-ready depth or clear a queue/area hold refreshes the canonical
# Gem receipt, then admits at most one issue from that fresh evidence. There is
# no timer fallback: quiet periods have no new capacity signal to consume.
#
# The concurrency group serializes event bursts, gate-next's verified lease
# reread prevents duplicate dispatch, and the absolute timeout bounds a stuck
# event. An always-run heartbeat records every event outcome without granting
# admission authority.

on:
  pull_request:
    types: [closed, labeled, unlabeled, ready_for_review, reopened]
  workflow_run:
    # Queue-Deferred Release is downstream of this gate. Listening to it here
    # formed a reciprocal workflow_run loop that could retrigger both
    # controllers without a new upstream capacity signal.
    workflows: [CI, Production Controller]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-gate-event-admission
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh persisted fleet gate receipt
    # Skip cancelled workflow_run so a superseded CI does not occupy a
    # 5-minute jovie-fixed slot. A merged PR also emits push(main); skip
    # its redundant closed event so one landing cannot enqueue two
    # admission attempts. Unmerged closure still frees green-ready
    # capacity. Labeled/unlabeled only run when the label can change
    # green-ready depth or a queue/area hold.
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled') &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged != true) &&
      (
        github.event_name != 'pull_request' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'hold' ||
        github.event.label.name == 'gated' ||
        github.event.label.name == 'queue-deferred' ||
        github.event.label.name == 'needs-human'
      )
    # The canonical receipt lives on the Gem host; exact-main gate code only.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 5
    steps:
      - name: Generate read-only Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Checkout exact main gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Refresh canonical receipt
        id: refresh
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: 'false'

      - name: Reconcile Symphony pressure-driven concurrency
        if: always() && steps.refresh.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hermes/symphony-concurrency-controller.py

      - name: Admit one issue from the fresh event
        id: admit
        if: steps.refresh.outputs.work_allowed == 'true'
        env:
          JOVIE_AGENT_PROFILE: no_agent
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s scripts/backlog-orchestrator/run-backlog.sh reconcile
          timeout 60s scripts/backlog-orchestrator/run-backlog.sh gate-next

      - name: Record event admission heartbeat
        if: always()
        env:
          ADMIT_OUTCOME: ${{ steps.admit.outcome || 'skipped' }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GATE_RC: ${{ steps.refresh.outputs.gate_rc || 'unavailable' }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome || 'skipped' }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          heartbeat_dir="${GEM_WORKSPACE:-/home/timwhite/gem-workspace}/state"
          heartbeat="${heartbeat_dir}/symphony-event-admission-heartbeat.json"
          mkdir -p "$heartbeat_dir"
          python3 - "$heartbeat" <<'PY'
          import json
          import os
          import pathlib
          import sys
          from datetime import datetime, timezone

          destination = pathlib.Path(sys.argv[1])
          temporary = destination.with_suffix(".json.tmp")
          receipt = {
              "schema": "symphony-event-admission-heartbeat/v1",
              "observedAt": datetime.now(timezone.utc).isoformat(),
              "event": os.environ["EVENT_NAME"],
              "action": os.environ["EVENT_ACTION"] or None,
              "sha": os.environ["EVENT_SHA"],
              "runId": int(os.environ["RUN_ID"]),
              "gateExitCode": os.environ["GATE_RC"],
              "refreshOutcome": os.environ["REFRESH_OUTCOME"],
              "admitOutcome": os.environ["ADMIT_OUTCOME"],
          }
          temporary.write_text(json.dumps(receipt, sort_keys=True) + "\n", encoding="utf-8")
          temporary.replace(destination)
          PY
