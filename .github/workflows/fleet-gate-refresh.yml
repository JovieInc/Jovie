name: Fleet Gate Refresh
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: Protected Gem reads live state and checks out exact main, excluding candidate code.
# revisit-trigger: Remove when Symphony emits this atomic receipt natively.
# clock-class: production-liveness

# One-writer refresh for the canonical Gem receipt (JOV-5467: the sole
# automatic issue-admission writer). Work pickup is owned by upstream OpenAI Symphony polling Linear directly.
# The assess job below only rereads the exact signed Linear event, applies the existing reconciler's
# Triage -> Todo/Backlog disposition, and wakes the already-running picker.
#
# pull_request_target / check_run / check_suite / status / workflow_run are
# not consumed. PR activity was a dry run (it must not persist latest.json)
# and a 2026-10-02 hour spawned 209 of those runs, cancelling every main
# push before the receipt writer started. The gate rereads live main, so a
# push to main persists immediately and the */5 clock rewrites observedAt
# inside the 10-minute stale window. Path filters do not apply: any main
# commit can change required checks. Runner Heartbeat remains the
# workflow_dispatch backup.
#
# Rollback: one revert restores linear-triage-assessment.yml and removes its
# repository_dispatch event from this file. Never run both writers.

on:
  repository_dispatch:
    # Signed JOV Triage events bridged by /api/webhooks/linear.
    types: [linear_triage_assess]
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The catch-up and exact-event path share one writer fence. Never cancel a
  # paid assessment or a status mutation midway through its readback.
  group: fleet-gate-receipt
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh persisted fleet gate receipt
    # Linear dispatch events are owned by the assess job below.
    if: github.event_name != 'repository_dispatch'
    # The canonical receipt lives on the Gem host; exact-main gate code only.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 8
    steps:
      - name: Skip a schedule tick that just refreshed
        id: debounce
        env:
          EVENT_NAME: ${{ github.event_name }}
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          skip="$(python3 - << 'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          if os.environ.get("EVENT_NAME") != "schedule":
              print("false")
              raise SystemExit
          workspace = os.environ.get("GEM_WORKSPACE", "/home/timwhite/gem-workspace")
          receipt = Path(workspace, "state", "gem-priority-gate", "latest.json")
          try:
              data = json.loads(receipt.read_text(encoding="utf-8"))
              observed = datetime.fromisoformat(
                  str(data.get("observedAt", "")).replace("Z", "+00:00")
              )
              sha = data.get("signals", {}).get("main", {}).get("sha")
              age = (datetime.now(timezone.utc) - observed).total_seconds()
              fresh = (
                  data.get("schema") == "jovie-fleet-gate/v1"
                  and isinstance(sha, str)
                  and len(sha) == 40
                  and 0 <= age < 120
              )
          except (OSError, ValueError, TypeError):
              fresh = False
          print("true" if fresh else "false")
          PY
          )"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "true" ]]; then
            echo "Canonical receipt is under 120s old; schedule tick is a no-op."
          fi
      - name: Generate read-only Jovie Bot token
        id: app-token
        if: steps.debounce.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Checkout exact main gate code
        id: main-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        id: main-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Refresh canonical receipt
        id: refresh
        if: steps.debounce.outputs.skip != 'true'
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # pull_request_target must not write live latest.json (clobbers Gem capacity
          # when main gate is unfenced). Push, schedule, and dispatch persist.
          dry-run: ${{ github.event_name == 'pull_request_target' && 'true' || 'false' }}

      # Source PR/fork workflow definitions never execute their code here.
      # Consume actions only after the reviewed CLI is present on main.
      - name: Persist stack policy repair actions (JOV-INV-020)
        id: stack-actions
        if: steps.refresh.outcome == 'success'
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "arg.startsWith('--closure-health-file=')" \
            scripts/backlog-orchestrator/delivery-state-machine.mjs || {
            echo "::error::JOV-INV-020 ingress is missing from trusted main"
            exit 1
          }
          node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/delivery-state-machine.mjs" \
            --closure-health-file="${{ steps.refresh.outputs.receipt_path }}"

      - name: Remediate JOV backlog after fleet gate refresh
        if: >-
          steps.refresh.outcome == 'success' &&
          steps.stack-actions.outcome == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'))
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          linear_env="${HOME}/.config/jovie-lanes/linear.env"
          [[ -r "$linear_env" ]] || linear_env="${HOME}/.config/symphony/linear.env"
          if [[ -z "${LINEAR_API_KEY:-}" && -r "$linear_env" ]]; then
            LINEAR_API_KEY="$(tr -d '\r\n' < "$linear_env")"
            export LINEAR_API_KEY="${LINEAR_API_KEY#LINEAR_API_KEY=}"
          fi
          timeout 90s node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/backlog-orchestrator.mjs" remediate

      - name: Recover missed Linear Triage events
        # Independent of the receipt debounce and new-work admission. A missed
        # webhook must not wait for another issue edit or a main push.
        # Preserve upstream failures while recovering after their bounded timeout.
        # Candidate or incomplete checkout/setup must never execute this writer.
        if: >-
          always() &&
          steps.main-checkout.outcome == 'success' &&
          steps.main-node.outcome == 'success'
        env:
          RECEIPT_FILE: ${{ runner.temp }}/linear-triage-catch-up.json
        shell: bash
        run: |
          set -euo pipefail
          linear_env="${HOME}/.config/jovie-lanes/linear.env"
          [[ -r "$linear_env" ]] || linear_env="${HOME}/.config/symphony/linear.env"
          if [[ -z "${LINEAR_API_KEY:-}" && -r "$linear_env" ]]; then
            LINEAR_API_KEY="$(tr -d '\r\n' < "$linear_env")"
            export LINEAR_API_KEY="${LINEAR_API_KEY#LINEAR_API_KEY=}"
          fi
          test -n "${LINEAR_API_KEY:-}"
          set -a
          source "${HOME}/.config/symphony/summer-bottleneck.env"
          source "${HOME}/.config/symphony/summer-bottleneck-signing.env"
          set +a
          timeout 90s node scripts/backlog-orchestrator/triage-event-assess.mjs \
            --sweep > "$RECEIPT_FILE"

      - name: Wake existing picker after catch-up Todo transitions
        if: always()
        env:
          RECEIPT_FILE: ${{ runner.temp }}/linear-triage-catch-up.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$RECEIPT_FILE" ]] && jq -e '.wakeSymphony == true' "$RECEIPT_FILE" >/dev/null; then
            curl --fail --silent --show-error --max-time 5 \
              -H 'content-type: application/json' -d '{}' \
              http://127.0.0.1:4041/api/v1/refresh
          fi

      - name: Preserve Triage catch-up receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linear-triage-catch-up-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linear-triage-catch-up.json
          if-no-files-found: warn
          retention-days: 14

  # Retired linear-triage-assessment.yml; signed Linear Issue events are bridged
  # by /api/webhooks/linear. This job rereads the exact current issue on Gem,
  # records its disposition, and wakes the lanes picker only after the existing
  # reconciler moves it to Todo. It does not select workers or bypass
  # Summer/fleet gates. Events and catch-up share the same mutation fence.
  assess:
    name: Assess exact Linear Triage event
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 5
    steps:
      - name: Checkout exact main assessment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Assess latest Linear Triage issue
        shell: bash
        env:
          RECEIPT_FILE: ${{ runner.temp }}/linear-triage-assessment.json
        run: |
          set -euo pipefail
          linear_env="${HOME}/.config/jovie-lanes/linear.env"
          [[ -r "$linear_env" ]] || linear_env="${HOME}/.config/symphony/linear.env"
          if [[ -z "${LINEAR_API_KEY:-}" && -r "$linear_env" ]]; then
            LINEAR_API_KEY="$(tr -d '\r\n' < "$linear_env")"
            export LINEAR_API_KEY="${LINEAR_API_KEY#LINEAR_API_KEY=}"
          fi
          test -n "${LINEAR_API_KEY:-}"
          summer_env="${HOME}/.config/symphony/summer-bottleneck.env"
          signing_env="${HOME}/.config/symphony/summer-bottleneck-signing.env"
          test -r "$summer_env" && test -r "$signing_env"
          set -a
          # Host-owned files already used by the Gem service; no new credential.
          # shellcheck disable=SC1090
          source "$summer_env"
          # shellcheck disable=SC1090
          source "$signing_env"
          set +a
          timeout 60s node scripts/backlog-orchestrator/triage-event-assess.mjs \
            --event-file="$GITHUB_EVENT_PATH" > "$RECEIPT_FILE"
          jq -e '.schema == "linear-triage-assessment/v1"' "$RECEIPT_FILE"
      - name: Wake the lanes picker after Todo transition
        shell: bash
        env:
          RECEIPT_FILE: ${{ runner.temp }}/linear-triage-assessment.json
        run: |
          set -euo pipefail
          if jq -e '.wakeSymphony == true' "$RECEIPT_FILE" >/dev/null; then
            curl --fail --silent --show-error --max-time 5 \
              -H 'content-type: application/json' -d '{}' \
              http://127.0.0.1:4041/api/v1/refresh
          fi
      - name: Preserve exact assessment receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linear-triage-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linear-triage-assessment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Escalate urgent unowned intake
        shell: bash
        env:
          RECEIPT_FILE: ${{ runner.temp }}/linear-triage-assessment.json
        run: |
          set -euo pipefail
          if jq -e '.requiresImmediateInvestigation == true' "$RECEIPT_FILE" >/dev/null; then
            echo "::error::Urgent Triage issue still needs an acknowledged investigation: $(jq -r '.issue' "$RECEIPT_FILE")"
            exit 1
          fi
