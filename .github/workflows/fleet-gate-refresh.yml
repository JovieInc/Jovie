name: Fleet Gate Refresh
# upstream OpenAI Symphony polling Linear directly

on:
  pull_request:
    types: [opened, edited, synchronize, converted_to_draft, closed, labeled, unlabeled, reopened]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows: [CI, Production Controller]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-gate-event-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh persisted fleet gate receipt
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled') &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged != true) &&
      (
        github.event_name != 'pull_request' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'hold' ||
        github.event.label.name == 'gated' ||
        github.event.label.name == 'queue-deferred' ||
        github.event.label.name == 'needs-human' ||
        github.event.label.name == 'duplicate'
      )
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'ubuntu-latest' || 'jovie-fixed' }}
    timeout-minutes: 8
    steps:
      - name: Generate read-only Jovie Bot token
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Checkout exact candidate or main gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.sha || 'main' }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate exact candidate fleet policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          python3 scripts/hermes/tests/gem-priority-gate.test.py
          python3 scripts/hermes/tests/test_fleet_admission_receipt.py
      - name: Refresh canonical receipt
        id: refresh
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: 'false'

      - name: Persist stack policy repair actions (JOV-INV-020)
        id: stack-actions
        if: steps.refresh.outcome == 'success'
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "arg.startsWith('--closure-health-file=')" \
            scripts/backlog-orchestrator/delivery-state-machine.mjs || {
            echo "::error::JOV-INV-020 ingress is missing from trusted main"
            exit 1
          }
          node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/delivery-state-machine.mjs" \
            --closure-health-file="${{ steps.refresh.outputs.receipt_path }}"

      - name: Remediate JOV backlog through official Symphony
        if: >-
          steps.refresh.outcome == 'success' &&
          steps.stack-actions.outcome == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'))
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          linear_env="${HOME}/.config/symphony/linear.env"
          if [[ -z "${LINEAR_API_KEY:-}" && -r "$linear_env" ]]; then
            LINEAR_API_KEY="$(tr -d '\r\n' < "$linear_env")"
            export LINEAR_API_KEY="${LINEAR_API_KEY#LINEAR_API_KEY=}"
          fi
          timeout 90s node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/backlog-orchestrator.mjs" remediate
