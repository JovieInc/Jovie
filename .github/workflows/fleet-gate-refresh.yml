name: Fleet Gate Refresh

# Event-driven one-writer refresh for the canonical Gem receipt. Work pickup is
# owned by upstream OpenAI Symphony polling Linear directly; this workflow has
# no issue admission or worker-dispatch path.

on:
  pull_request:
    types: [opened, edited, synchronize, closed, labeled, unlabeled, reopened]
  workflow_run:
    # Queue-Deferred Release is downstream of this gate. Listening to it here
    # formed a reciprocal workflow_run loop that could retrigger both
    # controllers without a new upstream capacity signal. Marker Recovery is
    # upstream evidence. Marker Recovery starts a fresh workflow_dispatch after
    # durable bytes so Queue-Deferred Release stays within GitHub's three-level
    # workflow_run chain ceiling.
    workflows: [CI, Production Controller]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-gate-event-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh persisted fleet gate receipt
    # Skip cancelled workflow_run so a superseded CI does not occupy a
    # 8-minute jovie-fixed slot. A merged PR also emits push(main); skip
    # its redundant closed event so one landing cannot enqueue two
    # admission attempts. Unmerged closure still frees green-ready
    # capacity. Labeled/unlabeled only run when the label can change
    # green-ready depth or a queue/area hold.
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled') &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged != true) &&
      (
        github.event_name != 'pull_request' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'hold' ||
        github.event.label.name == 'gated' ||
        github.event.label.name == 'queue-deferred' ||
        github.event.label.name == 'needs-human' ||
        github.event.label.name == 'duplicate'
      )
    # The canonical receipt lives on the Gem host; exact-main gate code only.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 8
    steps:
      - name: Generate read-only Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Checkout exact main gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Refresh canonical receipt
        id: refresh
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: 'false'

      # Source PR/fork workflow definitions never execute their code here.
      # Consume actions only after the reviewed CLI is present on main.
      - name: Persist stack policy repair actions (JOV-INV-020)
        if: >-
          steps.refresh.outcome == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'))
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/delivery-state-machine.mjs" \
            --closure-health-file="$GEM_WORKSPACE/state/gem-priority-gate/latest.json"
          linear_env="${HOME}/.config/symphony/linear.env"
          if [[ -z "${LINEAR_API_KEY:-}" && -r "$linear_env" ]]; then
            LINEAR_API_KEY="$(tr -d '\r\n' < "$linear_env")"
            export LINEAR_API_KEY="${LINEAR_API_KEY#LINEAR_API_KEY=}"
          fi
          timeout 90s node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/backlog-orchestrator.mjs" remediate
