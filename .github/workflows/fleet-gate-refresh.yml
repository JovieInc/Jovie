name: Fleet Gate Refresh
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: Protected Gem reads live state; pull_request_target checks out exact main, excluding candidate code.
# revisit-trigger: Remove when Symphony emits this atomic receipt natively.

# Event-driven one-writer refresh for the canonical Gem receipt. Work pickup is
# owned by upstream OpenAI Symphony polling Linear directly; this workflow has
# no issue admission or worker-dispatch path.

on:
  pull_request_target:
    types: [opened, edited, synchronize, converted_to_draft, closed, labeled, unlabeled, reopened]
  workflow_run:
    # Do not listen to downstream Queue-Deferred Release: that creates a loop.
    # Marker Recovery dispatches after durable bytes to stay within GitHub's
    # three-level workflow_run chain ceiling.
    workflows: [CI, Production Controller]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-gate-event-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh persisted fleet gate receipt
    # Skip cancelled runs and merged-close duplicates. Label events matter only
    # when they change green-ready depth or a queue/area hold.
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled') &&
      (github.event_name != 'pull_request_target' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged != true) &&
      (
        github.event_name != 'pull_request_target' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'hold' ||
        github.event.label.name == 'gated' ||
        github.event.label.name == 'queue-deferred' ||
        github.event.label.name == 'duplicate'
      )
    # The canonical receipt lives on the Gem host; exact-main gate code only.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 8
    steps:
      - name: Generate read-only Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Checkout exact main gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Refresh canonical receipt
        id: refresh
        uses: ./.github/actions/evaluate-fleet-gate
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: 'false'

      # Source PR/fork workflow definitions never execute their code here.
      # Consume actions only after the reviewed CLI is present on main.
      - name: Persist stack policy repair actions (JOV-INV-020)
        id: stack-actions
        if: steps.refresh.outcome == 'success'
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "arg.startsWith('--closure-health-file=')" \
            scripts/backlog-orchestrator/delivery-state-machine.mjs || {
            echo "::error::JOV-INV-020 ingress is missing from trusted main"
            exit 1
          }
          node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/delivery-state-machine.mjs" \
            --closure-health-file="${{ steps.refresh.outputs.receipt_path }}"

      - name: Remediate JOV backlog through official Symphony
        if: >-
          steps.refresh.outcome == 'success' &&
          steps.stack-actions.outcome == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'))
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        shell: bash
        run: |
          set -euo pipefail
          linear_env="${HOME}/.config/symphony/linear.env"
          if [[ -z "${LINEAR_API_KEY:-}" && -r "$linear_env" ]]; then
            LINEAR_API_KEY="$(tr -d '\r\n' < "$linear_env")"
            export LINEAR_API_KEY="${LINEAR_API_KEY#LINEAR_API_KEY=}"
          fi
          timeout 90s node "$GITHUB_WORKSPACE/scripts/backlog-orchestrator/backlog-orchestrator.mjs" remediate
