name: Delivery Flow Summary

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jovie-delivery-flow-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 3
    steps:
      - name: Checkout exact main controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - name: Generate receipt-derived flow summary
        env:
          GEM_WORKSPACE: /home/timwhite/gem-workspace
        run: |
          set -euo pipefail
          node scripts/backlog-orchestrator/delivery-flow-metrics.mjs
          cat "$GEM_WORKSPACE/state/jovie-delivery-controller/flow-metrics/latest.md" >> "$GITHUB_STEP_SUMMARY"
