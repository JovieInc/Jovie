# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# necessary-trust-boundary: Trusted main records terminal metadata for failed pull-request runs without model credentials, source execution, repair or repository writes.
# removal-trigger: Remove this receipt-only hop when JOV-10359 commissions the existing Lane Fix Relay with attributable fx/Workers AI pilot evidence.
name: Cheap Fixer
# Dormant source foundation. Default off; no paid-model route or repair activation.
# Explicit shadow mode emits terminal metadata only until fx/Workers AI commissioning.

# Lane Fix Relay already wakes on every Source Validation, CI and
# Changed-Evidence Test Suites completion; it calls this workflow only for a
# failed pull_request run while CHEAP_FIXER_MODE is shadow. Its own
# workflow_run trigger started 2,500+ runs a week that all skipped
# (2026-11-11 audit). The github context is the relay's workflow_run event.
on:
  workflow_call:

permissions: {}

concurrency:
  group: cheap-fixer-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  fix:
    name: Cheap fix attempt
    if: >-
      vars.CHEAP_FIXER_MODE == 'shadow' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout trusted fixer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/actions/prime-node-toolcache
            scripts/cheap-fixer
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        uses: ./.github/actions/prime-node-toolcache

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Record dormant fixer outcome
        env:
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          MODE: shadow
          OUT_DIR: ${{ runner.temp }}/cheap-fixer-out
        run: node scripts/cheap-fixer/cheap-fixer.mjs

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheap-fixer-receipt
          path: ${{ runner.temp }}/cheap-fixer-out/receipt.json
          if-no-files-found: ignore
          retention-days: 30
