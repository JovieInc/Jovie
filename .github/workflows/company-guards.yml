# Shared company guard suite from JovieInc/ci (canon/COMPANY.md).
# Pin is bumped by a bot PR; a pin more than 72h behind the newest canon/guard
# commit fails this check. The bot rewrites these two lines only:
# company-guards.yml@da878c8965355cd5a08db7bd0cee0d5527cf7dcb
# ci-ref: da878c8965355cd5a08db7bd0cee0d5527cf7dcb
# Latest canon/guard revision: daf34326 changes only the certification kit and
# is absent from drift's path-filtered history. Certification keeps that tip.
# Source Validation classifies with the trusted base, which has no
# .company-guards/ rule. The baseline is committed under scripts/company-guards/
# and this job copies it to the path guards/size.mjs reads.
name: Company Guards
# Required check: it must also report on merge_group, or queue entries wait
# forever. The size guard compares the checked-out tree with the committed
# baseline. size-500 is diff-scoped on pull_request and merge_group (only files
# changed against the base fail; other growth warns) and repo-wide on push.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  company-guards:
    name: Company guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read pin
        id: pin
        run: |
          set -euo pipefail
          sha=$(sed -n 's/^# ci-ref: \([0-9a-f]\{40\}\)$/\1/p' .github/workflows/company-guards.yml)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned guard suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JovieInc/ci
          ref: ${{ steps.pin.outputs.sha }}
          path: .company-ci
          persist-credentials: false
      - name: Materialize size baseline
        run: |
          set -euo pipefail
          mkdir -p .company-guards
          cp scripts/company-guards/size-baseline.json .company-guards/size-baseline.json
      - name: Fetch diff base for size-500
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Fail closed: if the base cannot be fetched the guard runs repo-wide.
          if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "SIZE_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "::warning::could not fetch $BASE_SHA; size-500 runs repo-wide"
          fi
      # Budgets only shrink: a PR that raises or adds an entry is growth. A PR
      # that keeps or shrinks a file leaves the baseline alone.
      - name: Size budgets never rise
        if: env.SIZE_BASE_SHA != ''
        run: node scripts/company-guards/size-ratchet.mjs --no-raise "$SIZE_BASE_SHA"
      - name: Run guards
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .company-ci/guards/run.mjs
      # github-token-budget: 3 calls/run - pin drift lists commits on canon, guards, and this workflow
      - name: Pin drift
        env:
          CI_PIN: ${{ steps.pin.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .company-ci/guards/drift.mjs
