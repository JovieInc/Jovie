# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: No existing controller reads build logs for deprecation warnings; this only files deduped Linear intake for the devin lane and writes no code, branches, or deploys.
# removal-trigger: Remove when Summer or the build pipeline emits deprecation findings into Linear intake natively.
name: Deprecation Intake (Linear devin lane)

# clock-class: skip-if-unchanged
# Daily: read the latest successful merge-queue build log (main push runs
# skip the Build jobs; the queue exercises the exact head that lands), file
# one deduped Linear issue per distinct deprecation warning (Todo + label
# devin) so the autonomous lane fixes deprecations without a human.

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deprecation-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Fetch latest main build log
        id: log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's server-side `status=success` filter can return stale runs;
          # list recent queue runs first, then filter their conclusions locally.
          run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event merge_group --limit 50 --json databaseId,conclusion --jq 'map(select(.conclusion == "success"))[:10][].databaseId')"
          if [ -z "$run_ids" ]; then
            echo "::error::No successful merge-queue CI run found."
            exit 1
          fi
          : > build.log
          for run_id in $run_ids; do
            : > build.log
            job_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select((.name | test("^Build")) and (.conclusion == "success")) | .id')"
            # Skipped jobs have no log blob — the logs endpoint 404s on them.
            for job in $job_ids; do
              if chunk="$(gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs")"; then
                printf '%s\n' "$chunk" >> build.log
              else
                echo "::error::Incomplete build log for job $job (run $run_id); no clearance may be inferred."
                exit 1
              fi
            done
            if [ -s build.log ]; then
              echo "Collected build logs from run $run_id"
              break
            fi
            echo "::notice::Run $run_id ran no Build jobs; trying an older run."
          done
          if [ ! -s build.log ]; then
            echo "::error::No successful merge-queue CI run with Build logs found."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > build-run.json
          export OBSERVED_BUILD_JOB_IDS="$job_ids"
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; import {createHash} from "node:crypto"; const run=JSON.parse(readFileSync("build-run.json","utf8")); writeFileSync("build-observation.json",JSON.stringify({schema:"jovie.build-log-observation/v1",complete:true,runUrl:run.html_url,headSha:run.head_sha,jobIds:process.env.OBSERVED_BUILD_JOB_IDS.trim().split(/\s+/).map(Number),logSha256:createHash("sha256").update(readFileSync("build.log")).digest("hex")}));'
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"

      - name: File deduped deprecation issues
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/deprecation-intake.mjs build.log "${{ steps.log.outputs.url }}"

      - name: Record bounded warning check observations
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: timeout 90s node scripts/deprecation-clearance.mjs build.log build-observation.json
