name: Wins Ledger
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Devin
# necessary-trust-boundary: Runs from the trusted base checkout on a merged PR event, reads only that PR's "## Win" section through the GitHub API, and writes one canon/wins/wins.jsonl line through a Jovie Bot PR. It never merges, deploys, publishes or records founder decisions.
# removal-trigger: Remove when the Symphony control plane records wins natively from merged-PR events and the ledger PR hop becomes redundant.

# Every merged PR with a measurable before/after becomes one ledger record
# (canon/wins/wins.jsonl). Event-driven: the merge is the trigger, so there is
# no clock and no backstop to register. The same run then checks whether a theme
# reached the draft threshold (scripts/wins-posts.mjs, PR b of this stack).

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Merged PR number to ingest'
        required: true

permissions: {}

concurrency:
  group: wins-ledger
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest merged PR win
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.body, 'Win')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      # github-token-budget: 7 calls/run - one pulls read for the merged PR body, up to five list pages for the 8-week merged-PR rollup
      - name: Ingest the Win section
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail
          node scripts/wins-ledger.mjs ingest --pr "$PR_NUMBER"
          node scripts/wins-ledger.mjs validate
          # Derived timestamps must not turn a no-op ingest into another bot PR.
          if git diff --quiet -- canon/wins/wins.jsonl; then
            echo "No new ledger entry; retaining derived metrics."
            exit 0
          fi
          node scripts/wins-ledger.mjs summary --write > /dev/null
          node scripts/wins-ledger.mjs rollup --write > /dev/null
          node scripts/wins-ledger.mjs notify

      # github-token-budget: 6 calls/run - one pulls read, branch push, PR create and automation emit
      - name: Open ledger PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail
          if git diff --quiet -- canon/wins/wins.jsonl docs/metrics/wins-latest.json docs/metrics/wins-weekly.json; then
            echo "No ledger change (no Win section or already recorded)."
            exit 0
          fi
          BRANCH="bot/wins-ledger-${PR_NUMBER}-${{ github.run_id }}"
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git switch -c "$BRANCH"
          git add canon/wins/wins.jsonl docs/metrics/wins-latest.json docs/metrics/wins-weekly.json
          git commit -m "chore(wins): record win from #${PR_NUMBER}" \
            -m "Generated by .github/workflows/wins-ledger.yml."
          git push -u origin "$BRANCH"
          node packages/api-client/cli.ts gh --priority default -- pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "chore(wins): record win from #${PR_NUMBER}" \
            --body "Refs JOV-6783.

          Appends the Win section of #${PR_NUMBER} to canon/wins/wins.jsonl. Status starts as claimed; it becomes verified only when a post-deploy receipt keeps the gain."
          python3 scripts/shipping_origin.py emit-automation \
            --pr "$(node packages/api-client/cli.ts gh --priority default -- pr view "$BRANCH" --json number --jq .number)" \
            --head-sha "$(git rev-parse HEAD)" --linear-issue JOV-6783
