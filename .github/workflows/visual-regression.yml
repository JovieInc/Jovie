# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: A failed scheduled run has no PR or reviewer to surface it, so one job with only issues:write opens or updates a single standing issue per lane (GOVERNANCE.md: nothing fails silently).
# removal-trigger: Remove the report-scheduled-failure job when a shared scheduled-failure reporter covers every scheduled workflow.
# Visual regression for public marketing/auth surfaces + admin chrome (JOV-4060/4062).
# Also covers the previously orphaned visual specs (JOV-4039): auth modal/pages,
# chat composer, and the public profile surface audit.
#
# Scheduled/manual baseline refresh. This workflow is the only --update-snapshots
# path and must not run on pull_request or merge_group (merge groups do not
# provision Neon). JOV-5459 fail-closed missing-baseline/ENOENT compare lives in
# ci.yml `ci-visual-snapshot-compare` and feeds merge-group PR Ready. Refresh
# still self-heals stale/missing baselines via a single auto-PR (same JOVIE_BOT
# + merge-queue pattern as screenshots.yml).
#
# Functional assertions in the spec (horizontal scroll, CTA clipping) still fail the
# refresh run — a broken layout never silently becomes the new baseline.
name: Visual Regression
# clock-class: skip-if-unchanged

on:
  schedule:
    # Daily catch-up so baselines never drift more than a day behind main.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      approved_homepage_baselines:
        description: >-
          Render only the homepage baselines on the dispatched branch and commit
          them there. Needs a founder approval receipt
          (docs/design-system/approvals/homepage-visual-approval.json) whose sources
          digest matches the branch. Never runs on main.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: visual-regression-baseline-refresh
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Visual Regression (baseline refresh)
    if: ${{ !inputs.approved_homepage_baselines }}
    environment: Preview – jovie
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      REFRESH_MODE: 'true'
      SNAPSHOT_DIR: apps/web/tests/e2e/__snapshots__
      PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_IMAGES: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Playwright (Chromium)
        uses: ./.github/actions/setup-playwright

      - name: Create ephemeral Neon database branch
        id: neon-branch
        uses: ./.github/actions/neon-create-branch-with-retry
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: visual-regression-${{ github.run_id }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_in_hours: '3'

      - name: Resolve DATABASE_URL from Neon branch (early)
        id: resolve-visual-neon-db-url-early
        uses: ./.github/actions/resolve-neon-database-url
        with:
          candidate_url: ${{ steps.neon-branch.outputs.db_url }}
          fallback_candidate_url: ${{ steps.neon-branch.outputs.db_url_pooled }}
          connection_file: ${{ steps.neon-branch.outputs.connection_file }}
          candidate_json_key: db_url
          fallback_json_key: db_url_pooled
          credential_source_url: ${{ secrets.DATABASE_URL_MAIN }}
          credential_fallback_url: ${{ secrets.DATABASE_URL }}

      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=${{ steps.resolve-visual-neon-db-url-early.outputs.database_url }}" >> "$GITHUB_ENV"

      - name: Fail if Neon DB URL is missing
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "No Neon ephemeral DATABASE_URL available."
            exit 1
          fi

      - name: Run migrations (ephemeral Neon)
        run: pnpm --filter=@jovie/web run drizzle:migrate:ci
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          GIT_BRANCH: visual-regression-${{ github.run_id }}
          ALLOW_PROD_MIGRATIONS: 'true'

      - name: Seed public QA fixtures
        run: pnpm --filter=@jovie/web run seed:test-data
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Build app (public routes)
        run: pnpm turbo build --filter=@jovie/web
        env:
          NEXT_IGNORE_ESLINT: '1'
          NEXT_IGNORE_TYPECHECK: '1'
          NEXT_PRIVATE_SKIP_SIZE_CHECK: 'true'

      - name: Run visual regression suite
        id: visual
        # Scheduled/manual deep evidence only; source PRs and merge groups never
        # provision this secret-bound Neon + Playwright lane.
        run: |
          cd apps/web

          # Empty auth state so Playwright's auth-setup project doesn't crash.
          # The public suite tests anonymous visitor routes only.
          mkdir -p tests/.auth
          echo '{"cookies":[],"origins":[]}' > tests/.auth/user.json

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if [ ! -f .next/standalone/apps/web/server.js ]; then
            echo "::error::Standalone server not found — visual regression cannot start."
            exit 1
          fi

          # GitHub sets HOSTNAME to the runner machine name. Pin the standalone
          # server to loopback so the existing test-auth gate can verify it.
          export HOSTNAME=localhost

          PORT=3100 node .next/standalone/apps/web/server.js &
          SERVER_PID=$!

          SERVER_READY=false
          for _attempt in $(seq 1 30); do
            if curl -sf http://localhost:3100 > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done

          if [ "$SERVER_READY" = "false" ]; then
            echo "::error::Standalone server failed to start within 30s."
            exit 1
          fi

          UPDATE_FLAG=""
          if [ "$REFRESH_MODE" = "true" ]; then
            UPDATE_FLAG="--update-snapshots"
          fi

          # Public marketing/auth baselines (JOV-4060)
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/visual-regression.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line $UPDATE_FLAG

          # Auth modal + auth pages (JOV-4039) — anonymous surfaces; missing or
          # stale baselines self-heal through the same refresh auto-PR below.
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/auth-visual.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line $UPDATE_FLAG

          # Public profile surfaces (JOV-4039) — capture audit across themes and
          # breakpoints; ready-selector and layout assertions gate (this spec has
          # no snapshot compare). Captures stay run-local: the artifact guard
          # omits images from staged uploads by design.
          PROFILE_AUDIT_CYCLE=run-${{ github.run_id }} \
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/profile-visual-audit.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line

          # Chat composer surface (JOV-4039) — authenticated via the dev
          # test-auth bypass, the same mechanism the admin lane below uses.
          E2E_USE_TEST_AUTH_BYPASS=1 E2E_TEST_AUTH_PERSONA=creator \
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/chat-visual.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line $UPDATE_FLAG

          # Electron titlebar/shell geometry (JOV-7713). Browser-emulated
          # desktop runtime over seeded personas; it needs this lane's Neon
          # seed, so it lives here rather than in the noop-DB PR lanes.
          E2E_USE_TEST_AUTH_BYPASS=1 \
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/electron-titlebar-geometry.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line

          # Admin surfaces (JOV-4062) — the same refresh server heals stale
          # admin baselines only after functional assertions pass.
          E2E_USE_TEST_AUTH_BYPASS=1 E2E_TEST_AUTH_PERSONA=admin \
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/admin-visual-regression.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line $UPDATE_FLAG

        env:
          BASE_URL: http://localhost:3100
          SMOKE_ONLY: '1'
          CI: true
          DATABASE_URL: ${{ env.DATABASE_URL }}
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_TEST_AUTH_PERSONA: admin
          URL_ENCRYPTION_KEY: visual-regression-ci-url-encryption-key
          AI_GATEWAY_API_KEY: visual-regression-ci

      - name: Run Storybook visual specs
        id: storybook
        # Storybook iframe screenshots need no app server or database, so they
        # run in their own step: a red app spec above must not stop component
        # baselines from refreshing. Functional assertions still fail this step.
        if: ${{ !cancelled() && steps.visual.outcome != 'skipped' }}
        run: |
          cd apps/web
          UPDATE_FLAG=""
          if [ "$REFRESH_MODE" = "true" ]; then
            UPDATE_FLAG="--update-snapshots"
          fi

          # Surface elevation matrix (JOV-2156) — Storybook iframe screenshots,
          # independent of the app server. Banned-combination baselines are the
          # intentional "should look BROKEN" sanity check; functional
          # assertions in the spec still fail the refresh run.
          pnpm exec storybook dev -p 6006 --no-open &
          STORYBOOK_PID=$!

          STORYBOOK_READY=false
          for _attempt in $(seq 1 150); do
            if curl -sf http://localhost:6006/iframe.html > /dev/null 2>&1; then
              STORYBOOK_READY=true
              break
            fi
            sleep 2
          done

          if [ "$STORYBOOK_READY" = "false" ]; then
            echo "::error::Storybook dev server failed to start within 300s."
            exit 1
          fi

          STORYBOOK_BASE_URL=http://localhost:6006 \
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test tests/e2e/storybook-elevation.spec.ts \
            tests/e2e/storybook-chat-history-switcher.spec.ts \
            --config=playwright.config.storybook.ts --project=chromium --reporter=line $UPDATE_FLAG

          kill "$STORYBOOK_PID" 2>/dev/null || true
        env:
          CI: true

      - name: Upload Playwright results on failure
        if: ${{ always() && (steps.visual.outcome == 'failure' || steps.storybook.outcome == 'failure') && hashFiles('apps/web/test-results/**') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: visual-regression-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          allow-images: 'true'
          allow-markdown: 'true'
          retention-days: 7

      - name: Check for baseline changes (refresh only)
        id: diff
        # Only main may publish baselines: a dispatch on any other ref would
        # commit that ref's unreviewed source into the bot PR with auto-merge.
        if: ${{ !cancelled() && env.REFRESH_MODE == 'true' && (steps.visual.outcome == 'success' || steps.storybook.outcome == 'success') && github.ref == 'refs/heads/main' }}
        env:
          APP_OUTCOME: ${{ steps.visual.outcome }}
          STORYBOOK_OUTCOME: ${{ steps.storybook.outcome }}
        run: |
          # Publish only the suites that passed. A red app suite still lets the
          # Storybook baselines through, and the reverse, so one broken spec
          # never blocks every other baseline from refreshing.
          if [ "$APP_OUTCOME" != "success" ]; then
            git ls-files -z -m -- "$SNAPSHOT_DIR" | grep -zv '/storybook-' \
              | xargs -0 -r git checkout -q -- || true
            git ls-files -z -o --exclude-standard -- "$SNAPSHOT_DIR" \
              | grep -zv '/storybook-' | xargs -0 -r rm -f -- || true
          fi
          if [ "$STORYBOOK_OUTCOME" != "success" ]; then
            git ls-files -z -m -- "$SNAPSHOT_DIR" | grep -z '/storybook-' \
              | xargs -0 -r git checkout -q -- || true
            git ls-files -z -o --exclude-standard -- "$SNAPSHOT_DIR" \
              | grep -z '/storybook-' | xargs -0 -r rm -f -- || true
          fi
          if [ -z "$(git status --porcelain "$SNAPSHOT_DIR")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No baseline changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Baselines changed:"
            git status --short "$SNAPSHOT_DIR"
          fi

      - name: Generate Jovie Bot token (refresh only)
        id: app-token
        if: ${{ !cancelled() && env.REFRESH_MODE == 'true' && steps.diff.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Create or update baseline PR (refresh only)
        if: ${{ !cancelled() && env.REFRESH_MODE == 'true' && steps.diff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="visual-baselines/auto-update"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number \
            -q '.[0].number' 2>/dev/null || true)

          git checkout -b "$BRANCH"
          git add "$SNAPSHOT_DIR"
          git commit -m "chore: refresh visual regression baselines [auto]

          Triggered by ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"

          # Dedicated bot branch: always force-push the latest generated baselines.
          # Gracefully skip when the branch is merge-queue locked; retry transient 500s.
          PUSHED=false
          for ATTEMPT in 1 2 3; do
            set +e
            PUSH_OUTPUT=$(git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push --force origin "$BRANCH" 2>&1)
            PUSH_EXIT=$?
            set -e

            if [ "$PUSH_EXIT" -eq 0 ]; then
              PUSHED=true
              break
            fi

            if [[ "$PUSH_OUTPUT" == *"A pull request for this branch has been added to a merge queue"* ]] || [[ "$PUSH_OUTPUT" == *"cannot be updated"* ]]; then
              echo "$PUSH_OUTPUT"
              echo "Baseline branch is queued for merge; skipping update for this run."
              exit 0
            fi

            if [[ "$PUSH_OUTPUT" == *"The requested URL returned error: 500"* ]] && [ "$ATTEMPT" -lt 3 ]; then
              echo "$PUSH_OUTPUT"
              echo "Transient GitHub 500 during push; retrying..."
              sleep $((ATTEMPT * 4))
              continue
            fi

            echo "$PUSH_OUTPUT"
            exit "$PUSH_EXIT"
          done

          if [ "$PUSHED" != "true" ]; then
            echo "Failed to push baseline update branch after retries."
            exit 1
          fi

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR via force-push"
            echo "Native autoenroll owns queue mutation; the merge-queue label is retired."
          else
            PR_URL=$(gh pr create \
              --title "chore: refresh visual regression baselines" \
              --body "Auto-generated scheduled/manual baseline refresh triggered by ${GITHUB_SHA::8}. Generated on ubuntu-latest + Chromium (pinned via pnpm).")
            echo "Opened $PR_URL. Native autoenroll owns queue mutation; the merge-queue label is retired."
          fi

      - name: Cleanup Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_NAME: visual-regression-${{ github.run_id }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "Neon credentials missing; skipping branch cleanup." >&2
            exit 0
          fi

          echo "Deleting Neon branch '$BRANCH_NAME' for run ${{ github.run_id }}..."
          pnpm dlx neonctl branches delete "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" || {
            echo "Branch '$BRANCH_NAME' not found or already deleted; ignoring." >&2
          }

  approved-homepage-baselines:
    # The homepage is bound to Pen stills, so a new homepage design cannot be
    # adopted from a local render (scripts/visual-baseline-adopt.mjs refuses
    # homepage-*). When the founder approves a new homepage from screenshots,
    # the receipt pins that approval to the homepage sources that were reviewed. This job
    # renders exactly what ci.yml `ci-visual-snapshot-compare` renders, with
    # the same build env, and commits only homepage-*.png to the dispatched
    # branch. It refuses main and refuses a receipt that no longer matches.
    name: Approved homepage baselines (branch)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_homepage_baselines && github.ref != 'refs/heads/main' }}
    environment: Preview – jovie
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REFRESH_MODE: 'true'
      SNAPSHOT_DIR: apps/web/tests/e2e/__snapshots__/visual-regression.spec.ts
      PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_IMAGES: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_PUBLIC_IMAGES: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify founder approval receipt matches the branch
        run: node scripts/homepage-baseline-approval.mjs verify

      - name: Setup Playwright (Chromium)
        uses: ./.github/actions/setup-playwright

      - name: Build homepage (same env as Visual Snapshot Compare)
        run: pnpm turbo build --filter=@jovie/web
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3230
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3230
          NEXT_PUBLIC_AUTH_MOCK: '1'
          NEXT_PUBLIC_AUTH_PROXY_DISABLED: '1'
          NEXT_PUBLIC_E2E_MODE: '1'
          NEXT_IGNORE_ESLINT: '1'
          NEXT_IGNORE_TYPECHECK: '1'
          NEXT_PRIVATE_SKIP_SIZE_CHECK: 'true'
          NEXT_DISABLE_TOOLBAR: '1'
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH: '1'
          E2E_TEST_AUTH_PERSONA: creator-ready
          E2E_CLERK_USER_ID: user_test

      - name: Render approved homepage baselines
        run: |
          set -euo pipefail
          cd apps/web
          mkdir -p tests/.auth
          echo '{"cookies":[],"origins":[]}' > tests/.auth/user.json

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          export HOSTNAME=localhost
          PORT=3230 node .next/standalone/apps/web/server.js > "$RUNNER_TEMP/homepage-baseline-server.log" 2>&1 &
          SERVER_PID=$!
          SERVER_READY=false
          for _attempt in $(seq 1 30); do
            if curl -sf http://localhost:3230 > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" = "false" ]; then
            cat "$RUNNER_TEMP/homepage-baseline-server.log"
            exit 1
          fi

          UPDATE_FLAG=""
          if [ "$REFRESH_MODE" = "true" ]; then
            UPDATE_FLAG="--update-snapshots"
          fi
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- \
            pnpm exec playwright test tests/e2e/visual-regression.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line --grep homepage \
            $UPDATE_FLAG
        env:
          BASE_URL: http://localhost:3230
          CI: 'true'
          E2E_SKIP_WEB_SERVER: '1'
          DATABASE_URL: postgresql://localhost/noop
          NEXT_PUBLIC_APP_URL: http://localhost:3230
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3230
          NEXT_DISABLE_TOOLBAR: '1'
          NEXT_PUBLIC_AUTH_PROXY_DISABLED: '1'
          NEXT_PUBLIC_AUTH_MOCK: '1'
          NEXT_PUBLIC_E2E_MODE: '1'
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH: '1'
          E2E_TEST_AUTH_PERSONA: creator-ready
          E2E_CLERK_USER_ID: user_test

      - name: Keep only homepage baselines
        id: diff
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR" | awk '{print $2}')
          echo "$CHANGED"
          if echo "$CHANGED" | grep -v -E '/homepage-[a-z0-9]+\.png$' | grep -q .; then
            echo "::error::The approved refresh touched snapshots other than homepage-*.png."
            exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -v -F "$SNAPSHOT_DIR/homepage-" | grep -q .; then
            echo "::error::The approved refresh changed files outside the homepage baselines."
            git status --porcelain --untracked-files=all
            exit 1
          fi
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Jovie Bot token (approved homepage baselines)
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Commit approved homepage baselines to the branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RECEIPT_MESSAGE=$(node -e "console.log(require('./docs/design-system/approvals/homepage-visual-approval.json').approvalMessage)")
          git add "$SNAPSHOT_DIR"/homepage-*.png
          git commit -m "chore(visual): adopt founder-approved homepage baselines [auto]

          Rendered by run ${GITHUB_RUN_ID} from ${GITHUB_SHA::8}.
          Approval: ${RECEIPT_MESSAGE}"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # Plain fast-forward push: never force, so a newer branch commit wins.
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

  report-scheduled-failure:
    # Nothing fails silently (docs/design-system/GOVERNANCE.md): a red scheduled
    # run opens or updates one standing issue, deduped by title. Not required.
    name: Report scheduled failure
    needs: [visual-regression]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Visual regression lane red"
          BODY=$(cat <<EOF
          The scheduled $GITHUB_WORKFLOW run failed on ${GITHUB_SHA::8}.

          Run: $RUN_URL

          Spec: \`apps/web/tests/e2e/visual-regression.spec.ts\` (Playwright report is attached to the run).
          EOF
          )
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == "Visual regression lane red") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated standing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "design-governance" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
