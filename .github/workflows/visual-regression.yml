# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: A failed scheduled run has no PR or reviewer to surface it, so one job with only issues:write opens or updates a single standing issue per lane (GOVERNANCE.md: nothing fails silently).
# removal-trigger: Remove the report-scheduled-failure job when a shared scheduled-failure reporter covers every scheduled workflow.
# Visual regression for public marketing/auth surfaces + admin chrome (JOV-4060/4062).
# Also covers the previously orphaned visual specs (JOV-4039): auth modal/pages,
# chat composer, and the public profile surface audit.
#
# Scheduled/manual baseline refresh. This workflow is the only --update-snapshots
# path and must not run on pull_request or merge_group (merge groups do not
# provision Neon). JOV-5459 fail-closed missing-baseline/ENOENT compare lives in
# ci.yml `ci-visual-snapshot-compare` and feeds merge-group PR Ready. Refresh
# still self-heals stale/missing baselines via a single auto-PR (same JOVIE_BOT
# + merge-queue pattern as screenshots.yml).
#
# JOV-12638: every spec is its own matrix entry (fail-fast: false), so one red
# spec no longer hides the rest. One setup job owns the Neon branch, seed and
# build; one publish job opens a single PR with the baselines of every suite
# that passed and lists the suites that did not. Functional assertions still
# fail their suite, so a broken layout never silently becomes the new baseline.
name: Visual Regression
# clock-class: skip-if-unchanged

on:
  schedule:
    # Daily catch-up so baselines never drift more than a day behind main.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      approved_homepage_baselines:
        description: >-
          Render only the homepage baselines on the dispatched branch and commit
          them there. Needs a founder approval receipt
          (docs/design-system/approvals/homepage-visual-approval.json) whose sources
          digest matches the branch. Never runs on main.
        type: boolean
        default: false
      commit_branch_baselines:
        description: >-
          Commit the baselines this run rewrites to the dispatched branch, so a
          PR that tightens tolerance or changes a surface gets CI renders without
          downloading artifacts. Never runs on main. Homepage baselines are
          left out: they change only through approved_homepage_baselines.
        type: boolean
        default: false
      lfs_upload_glob:
        description: >-
          Upload the files on main that match this glob (for example
          apps/web/tests/e2e/__snapshots__/**/*.png) as Git LFS objects, and
          render nothing. Run it before pushing a forward LFS conversion from a
          host that cannot reach the LFS upload API: GitHub refuses a push whose
          pointers name objects it lacks.
        type: string
        default: ''
      baseline_specs:
        description: >-
          With commit_branch_baselines: the specs whose baselines to commit,
          comma-separated (for example storybook-elevation.spec.ts). Required,
          because a refresh adopts whatever renders, loading and error states
          included, so every adopted baseline must be one somebody looked at.
        type: string
        default: ''

permissions: {}

# Branch dispatches render on a per-run Neon branch and commit only to their
# own branch, so each branch gets its own lane and two design PRs no longer
# cancel each other's baseline runs. Main refresh and the schedule open the
# shared baseline PR, so they keep the one global lane.
concurrency:
  # An lfs_upload_glob dispatch only uploads objects, so it gets its own group
  # and never cancels a baseline refresh that is running for another branch.
  group: ${{ inputs.lfs_upload_glob != '' && format('visual-regression-lfs-upload-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('visual-regression-branch-{0}', github.ref) || 'visual-regression-baseline-refresh' }}
  cancel-in-progress: true

jobs:
  visual-baseline-setup:
    name: Visual Regression (Neon seed + build)
    if: ${{ !inputs.approved_homepage_baselines && inputs.lfs_upload_glob == '' }}
    environment: Preview – jovie
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Create ephemeral Neon database branch
        id: neon-branch
        uses: ./.github/actions/neon-create-branch-with-retry
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: visual-regression-${{ github.run_id }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_in_hours: '3'

      - name: Resolve DATABASE_URL from Neon branch (early)
        id: resolve-visual-neon-db-url-early
        uses: ./.github/actions/resolve-neon-database-url
        with:
          candidate_url: ${{ steps.neon-branch.outputs.db_url }}
          fallback_candidate_url: ${{ steps.neon-branch.outputs.db_url_pooled }}
          connection_file: ${{ steps.neon-branch.outputs.connection_file }}
          candidate_json_key: db_url
          fallback_json_key: db_url_pooled
          credential_source_url: ${{ secrets.DATABASE_URL_MAIN }}
          credential_fallback_url: ${{ secrets.DATABASE_URL }}

      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=${{ steps.resolve-visual-neon-db-url-early.outputs.database_url }}" >> "$GITHUB_ENV"

      - name: Fail if Neon DB URL is missing
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "No Neon ephemeral DATABASE_URL available."
            exit 1
          fi

      - name: Run migrations (ephemeral Neon)
        run: pnpm --filter=@jovie/web run drizzle:migrate:ci
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          GIT_BRANCH: visual-regression-${{ github.run_id }}
          ALLOW_PROD_MIGRATIONS: 'true'

      - name: Seed public QA fixtures
        run: pnpm --filter=@jovie/web run seed:test-data
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      # The product screenshot catalog is in Git LFS; sync-standalone-assets
      # refuses to copy its pointers into the standalone public/ tree.
      - name: Pull product screenshots (Git LFS)
        uses: ./.github/actions/lfs-pull
        with:
          include: 'apps/web/screenshot-catalog/current/*.png,apps/web/public/demo/jovie-demo.mp4'
          cache: 'restore'
      - name: Build app (public routes)
        run: pnpm turbo build --filter=@jovie/web
        env:
          NEXT_IGNORE_ESLINT: '1'
          NEXT_IGNORE_TYPECHECK: '1'
          NEXT_PRIVATE_SKIP_SIZE_CHECK: 'true'

      - name: Package build and Neon connection for the suites
        # Same shared-Neon + build-artifact hand-off as ci.yml's mobile
        # overflow and Full E2E shards: one branch, one seed, one build.
        run: |
          set -euo pipefail
          if [ ! -f apps/web/.next/standalone/apps/web/server.js ]; then
            echo "::error::Standalone server not found — visual regression cannot start."
            exit 1
          fi
          tar -cf "$RUNNER_TEMP/nextjs-build.tar" -C apps/web .next
          mkdir -p "$RUNNER_TEMP/visual-neon"
          jq -n --arg url "$DATABASE_URL" '{db_url: $url, db_url_pooled: $url}' \
            > "$RUNNER_TEMP/visual-neon/connection.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextjs-build.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload Neon DB connection artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-neon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-neon/connection.json
          retention-days: 1
          if-no-files-found: error

  visual-regression:
    name: Visual Regression (${{ matrix.suite }})
    needs: [visual-baseline-setup]
    # Storybook suites need neither the seed nor the build, so they still
    # run (and refresh) when setup fails; app suites then fail at download.
    if: ${{ !cancelled() && !inputs.approved_homepage_baselines && inputs.lfs_upload_glob == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Public marketing/auth baselines (JOV-4060)
          - { suite: visual-regression, spec: visual-regression.spec.ts, server: app, update: 'true', persona: admin }
          # Auth modal + auth pages (JOV-4039)
          - { suite: auth-visual, spec: auth-visual.spec.ts, server: app, update: 'true', persona: admin }
          # Public profile capture audit (JOV-4039): ready-selector and layout
          # assertions gate; no snapshot compare, captures stay run-local.
          - { suite: profile-visual-audit, spec: profile-visual-audit.spec.ts, server: app, update: 'false', persona: admin }
          # Chat composer (JOV-4039), authenticated via the dev test-auth bypass
          - { suite: chat-visual, spec: chat-visual.spec.ts, server: app, update: 'true', persona: creator }
          # Electron titlebar/shell geometry (JOV-7713) over seeded personas
          - { suite: electron-titlebar-geometry, spec: electron-titlebar-geometry.spec.ts, server: app, update: 'false', persona: admin }
          # Rendered OV shell guard at 1512 expanded/collapsed (JOV-12642)
          - { suite: desktop-shell-certification, spec: desktop-shell-certification.spec.ts, server: app, update: 'true', persona: admin }
          # Admin surfaces (JOV-4062)
          - { suite: admin-visual-regression, spec: admin-visual-regression.spec.ts, server: app, update: 'true', persona: admin }
          # Surface elevation matrix (JOV-2156) and chat history switcher,
          # Storybook iframe screenshots independent of the app server.
          - { suite: storybook-elevation, spec: storybook-elevation.spec.ts, server: storybook, update: 'true', persona: admin }
          - { suite: storybook-chat-history-switcher, spec: storybook-chat-history-switcher.spec.ts, server: storybook, update: 'true', persona: admin }
    env:
      REFRESH_MODE: 'true'
      SNAPSHOT_DIR: apps/web/tests/e2e/__snapshots__
      SUITE_SPEC: ${{ matrix.spec }}
      SUITE_SERVER: ${{ matrix.server }}
      SUITE_UPDATES: ${{ matrix.update }}
      PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_IMAGES: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Playwright (Chromium)
        uses: ./.github/actions/setup-playwright

      - name: Download Neon DB connection artifact
        if: ${{ matrix.server == 'app' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-regression-neon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-neon

      - name: Resolve DATABASE_URL from Neon artifact
        if: ${{ matrix.server == 'app' }}
        id: resolve-suite-db-url
        uses: ./.github/actions/resolve-neon-database-url
        with:
          connection_file: ${{ runner.temp }}/visual-neon/connection.json
          candidate_json_key: db_url
          fallback_json_key: db_url_pooled

      - name: Download build artifact
        if: ${{ matrix.server == 'app' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-regression-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextjs-build-download

      - name: Run visual suite
        id: suite
        # Scheduled/manual deep evidence only; source PRs and merge groups never
        # provision this secret-bound Neon + Playwright lane.
        run: |
          cd apps/web
          # Empty auth state so Playwright's auth-setup project doesn't crash.
          mkdir -p tests/.auth
          echo '{"cookies":[],"origins":[]}' > tests/.auth/user.json

          cleanup() {
            kill "${SERVER_PID:-}" 2>/dev/null || true
            wait "${SERVER_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          if [ "$SUITE_SERVER" = "storybook" ]; then
            pnpm exec storybook dev -p 6006 --no-open &
            SERVER_PID=$!
            READY_URL=http://localhost:6006/iframe.html READY_TRIES=150 READY_WAIT=2
            CONFIG=playwright.config.storybook.ts
            export STORYBOOK_BASE_URL=http://localhost:6006
          else
            tar -xf "$RUNNER_TEMP/nextjs-build-download/nextjs-build.tar" -C .
            if [ ! -f .next/standalone/apps/web/server.js ]; then
              echo "::error::Standalone server not found — visual regression cannot start."
              exit 1
            fi
            # GitHub sets HOSTNAME to the runner machine name. Pin the standalone
            # server to loopback so the existing test-auth gate can verify it.
            export HOSTNAME=localhost
            PORT=3100 node .next/standalone/apps/web/server.js &
            SERVER_PID=$!
            READY_URL=http://localhost:3100 READY_TRIES=30 READY_WAIT=1
            CONFIG=playwright.config.ts
          fi

          SERVER_READY=false
          for _attempt in $(seq 1 "$READY_TRIES"); do
            if curl -sf "$READY_URL" > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            sleep "$READY_WAIT"
          done
          if [ "$SERVER_READY" = "false" ]; then
            echo "::error::$SUITE_SERVER server failed to start ($READY_URL)."
            exit 1
          fi

          UPDATE_FLAG=""
          if [ "$REFRESH_MODE" = "true" ] && [ "$SUITE_UPDATES" = "true" ]; then
            UPDATE_FLAG="--update-snapshots"
          fi
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm exec playwright test "tests/e2e/$SUITE_SPEC" \
            --config="$CONFIG" --project=chromium --reporter=line $UPDATE_FLAG
        env:
          BASE_URL: http://localhost:3100
          SMOKE_ONLY: '1'
          CI: true
          DATABASE_URL: ${{ steps.resolve-suite-db-url.outputs.database_url }}
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_TEST_AUTH_PERSONA: ${{ matrix.persona }}
          PROFILE_AUDIT_CYCLE: run-${{ github.run_id }}
          URL_ENCRYPTION_KEY: visual-regression-ci-url-encryption-key
          AI_GATEWAY_API_KEY: visual-regression-ci

      - name: Upload Playwright results on failure
        if: ${{ always() && steps.suite.outcome == 'failure' && hashFiles('apps/web/test-results/**') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: visual-regression-report-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          allow-images: 'true'
          allow-markdown: 'true'
          retention-days: 7

      - name: Record suite result and stage refreshed baselines
        # A suite publishes only its own spec's snapshots, and only when green.
        if: ${{ always() }}
        env:
          SUITE_NAME: ${{ matrix.suite }}
          SUITE_OUTCOME: ${{ steps.suite.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/visual-suite"
          mkdir -p "$OUT/baselines"
          if [ "$SUITE_OUTCOME" = "success" ] && [ "$REFRESH_MODE" = "true" ] && [ "$SUITE_UPDATES" = "true" ] \
            && [ -d "$SNAPSHOT_DIR/$SUITE_SPEC" ]; then
            (cd "$SNAPSHOT_DIR/$SUITE_SPEC" && git ls-files -z -m -o --exclude-standard -- . \
              | xargs -0 -r cp --parents -t "$OUT/baselines")
          fi
          BASELINES=false
          if [ -n "$(find "$OUT/baselines" -type f -print -quit)" ]; then BASELINES=true; fi
          jq -n --arg suite "$SUITE_NAME" --arg spec "$SUITE_SPEC" --arg outcome "$SUITE_OUTCOME" \
            --argjson baselines "$BASELINES" '{suite: $suite, spec: $spec, outcome: $outcome, baselines: $baselines}' \
            > "$OUT/receipt.json"
          cat "$OUT/receipt.json"

      - name: Upload suite result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-suite-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-suite/
          retention-days: 1
          if-no-files-found: error

  publish-baselines:
    name: Visual Regression (baseline refresh PR)
    needs: [visual-regression]
    # Only main may publish baselines: a dispatch on any other ref would
    # commit that ref's unreviewed source into the bot PR with auto-merge.
    if: ${{ !cancelled() && !inputs.approved_homepage_baselines && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      REFRESH_MODE: 'true'
      SNAPSHOT_DIR: apps/web/tests/e2e/__snapshots__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prime Node toolcache
        uses: ./.github/actions/prime-node-toolcache
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Every matrix entry uploads its receipt with if: always(), and the
      # refresh script treats a missing directory as no suites.
      - name: Download suite results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-suite-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-suites

      - name: Check for baseline changes (refresh only)
        id: diff
        if: ${{ env.REFRESH_MODE == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          # Baselines are Git LFS files: the clean filter turns a refreshed
          # png into a pointer, so git status sees only real changes.
          git lfs install --local --skip-smudge --skip-repo
          # One PR for the whole run: baselines of every suite that passed,
          # and a list of the suites that did not (scripts/lib/visual-baseline-refresh.mjs).
          node scripts/lib/visual-baseline-refresh.mjs --suites-dir "$RUNNER_TEMP/visual-suites" \
            --snapshot-dir "$SNAPSHOT_DIR" --body-file "$RUNNER_TEMP/visual-baseline-pr-body.md"
          if git status --porcelain --untracked-files=all | grep -v -F " $SNAPSHOT_DIR/" | grep -q .; then
            echo "::error::Baseline refresh changed files outside $SNAPSHOT_DIR."
            git status --porcelain --untracked-files=all
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No baseline changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Baselines changed:"
            git status --short --untracked-files=all "$SNAPSHOT_DIR"
          fi

      - name: Generate Jovie Bot token (refresh only)
        id: app-token
        if: ${{ !cancelled() && env.REFRESH_MODE == 'true' && steps.diff.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Create or update baseline PR (refresh only)
        if: ${{ !cancelled() && env.REFRESH_MODE == 'true' && steps.diff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="visual-baselines/auto-update"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number \
            -q '.[0].number' 2>/dev/null || true)

          git checkout -b "$BRANCH"
          git add "$SNAPSHOT_DIR"
          git commit -m "chore: refresh visual regression baselines [auto]

          Triggered by ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"

          # Dedicated bot branch: always force-push the latest generated baselines.
          # Gracefully skip when the branch is merge-queue locked; retry transient 500s.
          PUSHED=false
          for ATTEMPT in 1 2 3; do
            set +e
            # Upload the refreshed images before the pointers that name them.
            PUSH_OUTPUT=$(git -c "http.https://github.com/.extraheader=$AUTH_HEADER" lfs push origin "$BRANCH" 2>&1 &&
              git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push --force origin "$BRANCH" 2>&1)
            PUSH_EXIT=$?
            set -e

            if [ "$PUSH_EXIT" -eq 0 ]; then
              PUSHED=true
              break
            fi

            if [[ "$PUSH_OUTPUT" == *"A pull request for this branch has been added to a merge queue"* ]] || [[ "$PUSH_OUTPUT" == *"cannot be updated"* ]]; then
              echo "$PUSH_OUTPUT"
              echo "Baseline branch is queued for merge; skipping update for this run."
              exit 0
            fi

            if [[ "$PUSH_OUTPUT" == *"The requested URL returned error: 500"* ]] && [ "$ATTEMPT" -lt 3 ]; then
              echo "$PUSH_OUTPUT"
              echo "Transient GitHub 500 during push; retrying..."
              sleep $((ATTEMPT * 4))
              continue
            fi

            echo "$PUSH_OUTPUT"
            exit "$PUSH_EXIT"
          done

          if [ "$PUSHED" != "true" ]; then
            echo "Failed to push baseline update branch after retries."
            exit 1
          fi

          if [ -n "$EXISTING_PR" ]; then
            # Refresh the body too, so its failing-suite list matches this run.
            node packages/api-client/cli.ts gh --priority default -- pr edit "$EXISTING_PR" \
              --body-file "$RUNNER_TEMP/visual-baseline-pr-body.md" \
              || echo "::warning::Could not refresh the body of PR #$EXISTING_PR."
            echo "Updated existing PR #$EXISTING_PR via force-push"
            echo "Native autoenroll owns queue mutation; the merge-queue label is retired."
          else
            PR_URL=$(gh pr create \
              --title "chore: refresh visual regression baselines" \
              --body-file "$RUNNER_TEMP/visual-baseline-pr-body.md")
            echo "Opened $PR_URL. Native autoenroll owns queue mutation; the merge-queue label is retired."
          fi

  commit-branch-baselines:
    # The branch counterpart of publish-baselines. The baselines go into the
    # dispatched branch's own PR, where its usual checks and review apply, not
    # into the auto-merging bot PR. Homepage baselines never ride along.
    name: Visual Regression (commit branch baselines)
    needs: [visual-regression]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.commit_branch_baselines && !inputs.approved_homepage_baselines && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SNAPSHOT_DIR: apps/web/tests/e2e/__snapshots__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prime Node toolcache
        uses: ./.github/actions/prime-node-toolcache
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download suite results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-suite-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-suites

      - name: Apply refreshed baselines (named specs only, homepage excluded)
        id: diff
        env:
          BASELINE_SPECS: ${{ inputs.baseline_specs }}
        run: |
          set -euo pipefail
          # Baselines are Git LFS files: the clean filter turns a refreshed
          # png into a pointer, so git status sees only real changes.
          git lfs install --local --skip-smudge --skip-repo
          if ! [[ "$BASELINE_SPECS" =~ ^[a-z0-9-]+\.spec\.ts(,[a-z0-9-]+\.spec\.ts)*$ ]]; then
            echo "::error::baseline_specs must name the specs to commit, comma-separated (got '$BASELINE_SPECS')."
            exit 1
          fi
          node scripts/lib/visual-baseline-refresh.mjs --suites-dir "$RUNNER_TEMP/visual-suites" \
            --snapshot-dir "$SNAPSHOT_DIR" --body-file "$RUNNER_TEMP/visual-baseline-body.md"
          # Keep only the named specs' baselines.
          IFS=',' read -ra KEEP <<< "$BASELINE_SPECS"
          for dir in "$SNAPSHOT_DIR"/*/; do
            spec=$(basename "$dir")
            if [[ " ${KEEP[*]} " != *" $spec "* ]]; then
              git checkout -- "$dir" 2>/dev/null || true
              git clean -fdq -- "$dir"
            fi
          done
          # Founder-approved homepage stills change only through a receipt.
          git checkout -- "$SNAPSHOT_DIR"/visual-regression.spec.ts/homepage-*.png 2>/dev/null || true
          git clean -fq -- "$SNAPSHOT_DIR"/visual-regression.spec.ts/homepage-*.png 2>/dev/null || true
          if git status --porcelain --untracked-files=all | grep -v -F " $SNAPSHOT_DIR/" | grep -q .; then
            echo "::error::Baseline refresh changed files outside $SNAPSHOT_DIR."
            git status --porcelain --untracked-files=all
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No baseline changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short --untracked-files=all "$SNAPSHOT_DIR"
          fi
          cat "$RUNNER_TEMP/visual-baseline-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Jovie Bot token (branch baselines)
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Commit refreshed baselines to the branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASELINE_SPECS: ${{ inputs.baseline_specs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_DIR"
          git commit -m "chore(visual): refresh branch baselines [auto]

          Specs: ${BASELINE_SPECS}. Rendered by run ${GITHUB_RUN_ID} from ${GITHUB_SHA::8}."
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # Upload the refreshed images (Git LFS) before the pointers that name them.
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" lfs push origin HEAD
          # Plain fast-forward push: never force, so a newer branch commit wins.
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

  cleanup-neon:
    name: Visual Regression (Neon cleanup)
    needs: [visual-baseline-setup, visual-regression]
    if: ${{ always() && !inputs.approved_homepage_baselines && inputs.lfs_upload_glob == '' }}
    environment: Preview – jovie
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cleanup Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_NAME: visual-regression-${{ github.run_id }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "Neon credentials missing; skipping branch cleanup." >&2
            exit 0
          fi

          echo "Deleting Neon branch '$BRANCH_NAME' for run ${{ github.run_id }}..."
          pnpm dlx neonctl branches delete "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" || {
            echo "Branch '$BRANCH_NAME' not found or already deleted; ignoring." >&2
          }

  approved-homepage-baselines:
    # The homepage is bound to Pen stills, so a new homepage design cannot be
    # adopted from a local render (scripts/visual-baseline-adopt.mjs refuses
    # homepage-*). When the founder approves a new homepage from screenshots,
    # the receipt pins that approval to the homepage sources that were reviewed. This job
    # renders exactly what ci.yml `ci-visual-snapshot-compare` renders, with
    # the same build env, and commits only homepage-*.png to the dispatched
    # branch. It refuses main and refuses a receipt that no longer matches.
    name: Approved homepage baselines (branch)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_homepage_baselines && github.ref != 'refs/heads/main' }}
    environment: Preview – jovie
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REFRESH_MODE: 'true'
      SNAPSHOT_DIR: apps/web/tests/e2e/__snapshots__/visual-regression.spec.ts
      PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_IMAGES: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_PUBLIC_IMAGES: 'true'
      PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify founder approval receipt matches the branch
        run: node scripts/homepage-baseline-approval.mjs verify

      - name: Setup Playwright (Chromium)
        uses: ./.github/actions/setup-playwright

      - name: Build homepage (same env as Visual Snapshot Compare)
        run: pnpm turbo build --filter=@jovie/web
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3230
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3230
          NEXT_PUBLIC_AUTH_MOCK: '1'
          NEXT_PUBLIC_AUTH_PROXY_DISABLED: '1'
          NEXT_PUBLIC_E2E_MODE: '1'
          NEXT_IGNORE_ESLINT: '1'
          NEXT_IGNORE_TYPECHECK: '1'
          NEXT_PRIVATE_SKIP_SIZE_CHECK: 'true'
          NEXT_DISABLE_TOOLBAR: '1'
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH: '1'
          E2E_TEST_AUTH_PERSONA: creator-ready
          E2E_CLERK_USER_ID: user_test

      - name: Render approved homepage baselines
        run: |
          set -euo pipefail
          cd apps/web
          mkdir -p tests/.auth
          echo '{"cookies":[],"origins":[]}' > tests/.auth/user.json

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          export HOSTNAME=localhost
          PORT=3230 node .next/standalone/apps/web/server.js > "$RUNNER_TEMP/homepage-baseline-server.log" 2>&1 &
          SERVER_PID=$!
          SERVER_READY=false
          for _attempt in $(seq 1 30); do
            if curl -sf http://localhost:3230 > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" = "false" ]; then
            cat "$RUNNER_TEMP/homepage-baseline-server.log"
            exit 1
          fi

          UPDATE_FLAG=""
          if [ "$REFRESH_MODE" = "true" ]; then
            UPDATE_FLAG="--update-snapshots"
          fi
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- \
            pnpm exec playwright test tests/e2e/visual-regression.spec.ts \
            --config=playwright.config.ts --project=chromium --reporter=line --grep homepage \
            $UPDATE_FLAG
        env:
          BASE_URL: http://localhost:3230
          CI: 'true'
          E2E_SKIP_WEB_SERVER: '1'
          DATABASE_URL: postgresql://localhost/noop
          NEXT_PUBLIC_APP_URL: http://localhost:3230
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3230
          NEXT_DISABLE_TOOLBAR: '1'
          NEXT_PUBLIC_AUTH_PROXY_DISABLED: '1'
          NEXT_PUBLIC_AUTH_MOCK: '1'
          NEXT_PUBLIC_E2E_MODE: '1'
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH: '1'
          E2E_TEST_AUTH_PERSONA: creator-ready
          E2E_CLERK_USER_ID: user_test

      - name: Keep only homepage baselines
        id: diff
        run: |
          set -euo pipefail
          # Baselines are Git LFS files: the clean filter turns a refreshed
          # png into a pointer, so git status sees only real changes.
          git lfs install --local --skip-smudge --skip-repo
          CHANGED=$(git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR" | awk '{print $2}')
          echo "$CHANGED"
          if echo "$CHANGED" | grep -v -E '/homepage-[a-z0-9]+\.png$' | grep -q .; then
            echo "::error::The approved refresh touched snapshots other than homepage-*.png."
            exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -v -F "$SNAPSHOT_DIR/homepage-" | grep -q .; then
            echo "::error::The approved refresh changed files outside the homepage baselines."
            git status --porcelain --untracked-files=all
            exit 1
          fi
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Jovie Bot token (approved homepage baselines)
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Commit approved homepage baselines to the branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RECEIPT_MESSAGE=$(node -e "console.log(require('./docs/design-system/approvals/homepage-visual-approval.json').approvalMessage)")
          git add "$SNAPSHOT_DIR"/homepage-*.png
          git commit -m "chore(visual): adopt founder-approved homepage baselines [auto]

          Rendered by run ${GITHUB_RUN_ID} from ${GITHUB_SHA::8}.
          Approval: ${RECEIPT_MESSAGE}"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # Upload the refreshed images (Git LFS) before the pointers that name them.
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" lfs push origin HEAD
          # Plain fast-forward push: never force, so a newer branch commit wins.
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"


  upload-lfs-objects:
    # A forward conversion to Git LFS (git add --renormalize) changes no file
    # bytes, so each object is main's plain blob of the same path. This job
    # uploads those blobs, so a host that cannot reach the LFS upload API can
    # still push the pointers. It writes nothing to the repository.
    name: Visual Regression (upload Git LFS objects)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lfs_upload_glob != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Upload main's matching files as Git LFS objects
        env:
          GH_TOKEN: ${{ github.token }}
          LFS_GLOB: ${{ inputs.lfs_upload_glob }}
        run: |
          set -euo pipefail
          if ! [[ "$LFS_GLOB" =~ ^[A-Za-z0-9_.*/-]+$ ]] || [[ "$LFS_GLOB" == *..* ]]; then
            echo "::error::lfs_upload_glob must be a repository path glob (got '$LFS_GLOB')."
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git lfs install --local --skip-smudge --skip-repo
          objects="$(git rev-parse --git-common-dir)/lfs/objects"
          oids=()
          while IFS= read -r -d '' entry; do
            path="${entry#*$'\t'}"
            # [[ == ]] lets * match /, so ** spans directories.
            # shellcheck disable=SC2053
            [[ "$path" == $LFS_GLOB ]] || continue
            tmp="$RUNNER_TEMP/lfs-object"
            git cat-file blob "origin/main:$path" > "$tmp"
            oid="$(sha256sum "$tmp" | cut -d' ' -f1)"
            object="$objects/${oid:0:2}/${oid:2:2}/$oid"
            mkdir -p "$(dirname "$object")"
            mv "$tmp" "$object"
            oids+=("$oid")
          done < <(git ls-tree -r -z origin/main)
          echo "${#oids[@]} files on main match $LFS_GLOB."
          if (( ${#oids[@]} == 0 )); then
            echo "::error::No file on main matches $LFS_GLOB."
            exit 1
          fi
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" lfs push --object-id origin "${oids[@]}"
          {
            echo "### Git LFS upload"
            echo "Uploaded ${#oids[@]} objects for files on main matching \`$LFS_GLOB\`."
          } >> "$GITHUB_STEP_SUMMARY"

  report-outcome:
    # Nothing fails without a repair or a success (Tim 2026-11-22): a red run
    # opens or updates one remediation issue that the lanes remediation loop
    # picks up, and the next green resolves it. Branch and manual runs report
    # nothing.
    name: Report outcome
    needs: [visual-baseline-setup, visual-regression, publish-baselines]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            .nvmrc
            packages/api-client
            scripts/lib
            scripts/remediation-signal-intake.mjs
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/report-outcome
        with:
          results: ${{ toJSON(needs) }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}

  report-scheduled-failure:
    # Nothing fails silently (docs/design-system/GOVERNANCE.md): a red scheduled
    # run opens or updates one standing issue, deduped by title. Not required.
    name: Report scheduled failure
    needs: [visual-baseline-setup, visual-regression, publish-baselines]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Visual regression lane red"
          BODY=$(cat <<EOF
          The scheduled $GITHUB_WORKFLOW run failed on ${GITHUB_SHA::8}.

          Run: $RUN_URL

          Each spec is its own \`Visual Regression (<suite>)\` job; the red ones carry a Playwright report. Suites that passed still refreshed their baselines.
          EOF
          )
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == "Visual regression lane red") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated standing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "design-governance" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
