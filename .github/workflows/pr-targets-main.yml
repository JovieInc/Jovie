name: PR targets main

# JOV-INV-023: stacked/feature bases are a factory failure.
# Fail-closed: every Jovie PR targets main. Stacked/feature bases are a
# repeat factory failure (Graphite is dead; integration/loop-* is dormant).
# This job is a required context on main and also runs on every other PR
# base so agents cannot "succeed" by targeting a side branch.
#
# Read the current PR base: a queued synchronize event can still name a parent
# branch after the PR has been retargeted to main. Bind that read to this event's
# exact source head so an older run cannot validate a newer revision.

# Merge groups are not re-checked here: the required `PR Size Guard` and
# `Fork PR Gate` producers already fail closed unless merge_group.base_ref is
# refs/heads/main (validateMergeGroupEvent), so a runner per group re-proving
# the same payload fact only spent queue capacity (JOV-7744).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-targets-main-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-targets-main:
    name: PR targets main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse any base other than main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            if (repository !== 'JovieInc/Jovie') {
              throw new Error('Base guard requires the canonical Jovie repository');
            }
            if (context.eventName === 'merge_group') {
              const group = context.payload.merge_group;
              if (group?.base_ref !== 'refs/heads/main' || !sha(group.base_sha) || !sha(group.head_sha)) {
                throw new Error('Merge group must target main with exact base and head SHAs');
              }
              core.info('Merge group targets main');
              return;
            }
            const eventPR = context.payload.pull_request;
            if (context.eventName !== 'pull_request' || !Number.isSafeInteger(eventPR?.number) || eventPR.number <= 0 || !sha(eventPR.head?.sha)) {
              throw new Error('Expected a pull_request event with an exact source head');
            }
            const { data: live } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPR.number,
              headers: { 'Cache-Control': 'no-cache' },
            });
            if (live.number !== eventPR.number || live.state !== 'open' || live.base?.repo?.full_name !== repository || !eventPR.head.repo?.full_name || live.head?.repo?.full_name !== eventPR.head.repo.full_name || live.head?.sha !== eventPR.head.sha) {
              throw new Error('PR source identity changed or current metadata is incomplete');
            }
            if (live.base.ref !== 'main') {
              throw new Error('PRs must target main. Retarget the pull request base to main, fetch origin/main, and rebase.');
            }
            core.info(`PR #${live.number} targets main at ${live.head.sha}`);
