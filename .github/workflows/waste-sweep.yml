# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: Nothing recomputes repository waste (dead files/exports, unused dependencies, always-loaded agent context, CI minutes on always-red or cancelled workflows) or turns it into owned deletion work; knip runs only on dispatch and reports dependencies. This measures, opens a metrics snapshot PR, tightens the dead-code baseline and files deduped Linear candidates. It deletes nothing and never merges.
# removal-trigger: Remove when Summer computes the waste score natively from repository events and files its own deletion work.
name: Waste Sweep

# Weekly waste inventory (scripts/waste-sweep.mjs, policy scripts/lib/waste-sweep.mjs).
# Events: a landed change to knip config, manifests or agent context re-measures
# cheaply (no CI sampling). The Gem lanes clock fires repository_dispatch
# clock_waste_sweep weekly for the full sweep with CI history (JOV-INV-042
# freezes GitHub crons). Publishes docs/metrics/waste-latest.gen.json through a bot
# PR; the lanes status feed embeds it for Summer (scripts/lanes/doctor.py `waste`).

on:
  push:
    branches: [main]
    paths:
      - 'knip.json'
      - '**/package.json'
      - 'CLAUDE.md'
      - 'canon/OPERATING_SYSTEM.md'
      - '.claude/rules/**'
      - '.claude/skills/**'
      - 'scripts/waste-sweep.mjs'
      - 'scripts/lib/waste-sweep.mjs'
      - '.github/workflows/waste-sweep.yml'
  repository_dispatch:
    types: [clock_waste_sweep]
  workflow_dispatch:
    inputs:
      ci:
        description: 'Sample Actions run history (one REST call per workflow)'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: waste-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Measure waste and publish the score
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Weekly clock and manual runs sample CI history; push re-measures only.
      SAMPLE_CI: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.ci) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm

      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Measure
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=(--write-latest --json "$RUNNER_TEMP/waste.json")
          if [ "$SAMPLE_CI" = 'true' ]; then flags+=(--ci --ci-days 30); fi
          node scripts/waste-sweep.mjs measure "${flags[@]}"
          node scripts/waste-sweep.mjs tighten --report "$RUNNER_TEMP/waste.json"
          jq -r '"## Waste score \(.score)\n\n| Metric | Value |\n|---|---|\n| Unused files | \(.knip.unusedFiles) (\(.knip.unusedFileBytes) bytes) |\n| Unused exports + types | \(.knip.unusedExports) + \(.knip.unusedTypes) |\n| Unused / unlisted deps | \(.knip.unusedDependencies) / \(.knip.unlistedDependencies) |\n| Always-loaded agent context | \(.agentContext.alwaysLoadedBytes) bytes |\n| CI wall minutes (30d) | \(.ci.wallMinutes // "not sampled") |\n| Always-red CI minutes (30d) | \(.ci.alwaysRedMinutes // "not sampled") |"' \
            "$RUNNER_TEMP/waste.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Open snapshot PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="bot/waste-sweep-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git switch -c "$BRANCH"
          git add docs/metrics/waste-latest.gen.json docs/metrics/waste-baseline.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "chore(metrics): refresh waste sweep snapshot" \
            -m "Generated by .github/workflows/waste-sweep.yml. Baseline only tightens."
          git push -u origin "$BRANCH"
          node packages/api-client/cli.ts gh --priority report -- pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "chore(metrics): refresh waste sweep snapshot" \
            --label compounding \
            --body "Refreshes docs/metrics/waste-latest.gen.json (and lowers any improved dead-code baseline) from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || node packages/api-client/cli.ts gh --priority report -- pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "chore(metrics): refresh waste sweep snapshot" \
              --body "Refreshes docs/metrics/waste-latest.gen.json from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: File top deletion candidates
        if: ${{ env.SAMPLE_CI == 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/waste-sweep.mjs file-candidates --report "$RUNNER_TEMP/waste.json" --limit 5 \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | tee "$RUNNER_TEMP/waste-intake.json"

      - name: Preserve waste report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waste-sweep-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/waste.json
            ${{ runner.temp }}/waste-intake.json
          if-no-files-found: ignore
          retention-days: 30
