# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Codex
# necessary-trust-boundary: The existing audit publishes only generated reports through the existing Jovie Bot installation token after coverage; its read-only checkout token cannot trigger normal PR checks. No merge, deploy, or founder-decision authority is added.
# revisit-trigger: Remove the report publication hop if the canonical coverage baseline becomes artifact-backed and no longer requires committed report files.
# Test Coverage Audit
#
# PURPOSE: Regenerate docs/TEST_COVERAGE_HEATMAP.md when source, tests, or the
# hand-curated docs/TEST_RISK_REGISTER.md changes.
#
# Output: opens a draft report PR when values change and uploads resulting
# unit coverage to Codecov. Normal CI and the native queue govern publication.
# Includes apps/web/reports/test-coverage-snapshot.json (machine-readable
# baseline) so `pnpm run test:coverage:diff` (and local
# `test:coverage:diff`) can compare to the canonical baseline from main.
# Failures notify Slack. GitHub Issues are not a backlog destination.
#
# Strategy spec: docs/TEST_RISK_REGISTER.md
# Generator:    scripts/audit-test-coverage.ts

name: Test Coverage Audit

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '!apps/web/reports/test-coverage-snapshot.json'
      - 'packages/**'
      - 'docs/TEST_RISK_REGISTER.md'
      - 'scripts/audit-test-coverage.ts'
      - 'scripts/lib/publish-coverage-report.mjs'
      - 'sonar-project.properties'
      - '.github/workflows/sonarcloud.yml'
      - '.github/workflows/test-coverage-audit.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Open a draft PR for the regenerated heatmap if it changed'
        type: boolean
        default: true

permissions: {}

concurrency:
  # GitHub replaces an older pending member when a newer main push arrives.
  # cancel-in-progress: false protects the active coverage producer.
  group: test-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Regenerate coverage heatmap
    runs-on: ubuntu-latest
    # Run 36656398589 exhausted 60 minutes while the full suite was still
    # emitting passing tests. Reserve time for its tail and publication steps.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run coverage
        # Unit tests are auth-mocked at the SDK boundary — they do not need
        # production Clerk keys. Per .claude/rules/auth.md, unprefixed CLERK_*
        # secrets are the production keypair. Inject test-mode literals so
        # CI never has prod-Clerk material in scope.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXktdGVzdC1jb3ZlcmFnZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_dummy_secret_for_coverage_run_only
        run: pnpm --filter @jovie/web test:coverage

      - name: Check RED-surface coverage drift
        # Compare the just-collected coverage against the committed snapshot
        # before rewriting it. Exits 1 on RED-surface drops ≥3pp.
        # Standard merge-queue unit shards stay coverage-off; the separate
        # Exact-head Coverage gate owns promotion evidence on PR/queue heads.
        run: pnpm run test:coverage:diff

      - name: Generate heatmap
        run: pnpm exec tsx scripts/audit-test-coverage.ts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: nightly-unittests
          fail_ci_if_error: false
          verbose: true

      # Mint after the long coverage run so the installation token is fresh.
      # App-authored pushes trigger normal PR checks; GITHUB_TOKEN pushes do not.
      - name: Generate report publication token
        if: ${{ github.event_name == 'push' || inputs.commit }}
        id: report-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open coverage report PR
        if: ${{ github.event_name == 'push' || inputs.commit }}
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          node --input-type=module -e "import { publishCoverageReport } from './scripts/lib/publish-coverage-report.mjs'; console.log(publishCoverageReport());"

      - name: Slack alert on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          PAYLOAD=$(cat <<EOF
          {
            "text": "Changed-evidence test coverage audit failed",
            "attachments": [
              {
                "color": "danger",
                "fields": [
                  { "title": "Workflow", "value": "Test Coverage Audit", "short": true },
                  { "title": "Status", "value": "Failed", "short": true },
                  { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": false }
                ]
              }
            ]
          }
          EOF
          )
          curl -sS -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-audit-${{ github.run_id }}
          path: |
            apps/web/coverage/coverage-final.json
            apps/web/coverage/lcov.info
            docs/TEST_COVERAGE_HEATMAP.md
            apps/web/reports/test-coverage-snapshot.json
          retention-days: 14
          if-no-files-found: warn
