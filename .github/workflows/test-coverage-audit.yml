# Test Coverage Audit
#
# PURPOSE: Regenerate docs/TEST_COVERAGE_HEATMAP.md daily from main HEAD
# (source, tests and the hand-curated docs/TEST_RISK_REGISTER.md).
#
# Output: writes generated reports to the existing Actions artifact store and uploads
# unit coverage to Codecov. Report data never opens a PR.
# Includes apps/web/reports/test-coverage-snapshot.json (machine-readable
# baseline). The audit restores the latest successful main-run artifact baseline before drift checks;
# the committed snapshot remains the bootstrap/local baseline.
# Failures notify Slack. GitHub Issues are not a backlog destination.
#
# Strategy spec: docs/TEST_RISK_REGISTER.md
# Generator:    scripts/audit-test-coverage.ts

name: Test Coverage Audit

on:
  # Daily via the Gem lanes clock (repository_dispatch clock_test_coverage_audit;
  # JOV-INV-042 freezes GitHub crons). Regenerating the heatmap on every
  # apps/web push ran ~1,500 times and ~17k runner-minutes a month; exact-head
  # coverage gates PRs separately, so the report only needs daily freshness.
  repository_dispatch:
    types: [clock_test_coverage_audit]
  workflow_dispatch:

permissions: {}

concurrency:
  # GitHub replaces an older pending member when a newer run arrives.
  # cancel-in-progress: false protects the active coverage producer.
  group: test-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Regenerate coverage heatmap
    runs-on: ubuntu-latest
    # Run 36656398589 exhausted 60 minutes while the full suite was still
    # emitting passing tests. Reserve time for its tail and publication steps.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Restore artifact coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import { restoreCoverageBaseline } from './scripts/lib/publish-coverage-report.mjs'; console.log(restoreCoverageBaseline());"

      - name: Run coverage
        run: pnpm --filter @jovie/web test:coverage

      - name: Check RED-surface coverage drift
        # Compare the just-collected coverage against the restored artifact snapshot
        # before rewriting it. Exits 1 on RED-surface drops ≥3pp.
        # Standard merge-queue unit shards stay coverage-off; the separate
        # Exact-head Coverage gate owns promotion evidence on PR/queue heads.
        run: pnpm run test:coverage:diff

      - name: Generate heatmap
        run: pnpm exec tsx scripts/audit-test-coverage.ts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: nightly-unittests
          fail_ci_if_error: false
          verbose: true

      - name: Slack alert on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          PAYLOAD=$(cat <<EOF
          {
            "text": "Changed-evidence test coverage audit failed",
            "attachments": [
              {
                "color": "danger",
                "fields": [
                  { "title": "Workflow", "value": "Test Coverage Audit", "short": true },
                  { "title": "Status", "value": "Failed", "short": true },
                  { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": false }
                ]
              }
            ]
          }
          EOF
          )
          curl -sS -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-audit-${{ github.run_id }}
          path: |
            apps/web/coverage/coverage-final.json
            apps/web/coverage/lcov.info
            docs/TEST_COVERAGE_HEATMAP.md
            apps/web/reports/test-coverage-snapshot.json
          retention-days: 14
          if-no-files-found: warn
