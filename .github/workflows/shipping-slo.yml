name: Shipping SLO Ratchet
# clock-class: upstream-advisory
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Devin
# necessary-trust-boundary: A hosted clock measures repo-local GitHub signals (workflow runs, PR timelines, deployments) and writes only committed metric snapshots, baseline ratchet PRs, and slo-regression issues under the Jovie Bot app token; it never merges, deploys, or records founder decisions.
# removal-trigger: Remove the schedule when the Symphony control plane emits these SLO measurements natively and the daily GitHub-Actions sweep becomes redundant.

# JOV-6783: deterministic, zero-token shipping-SLO ratchet.
# Daily: measure rolling 7d p50/p95 (CI wall time per required workflow event,
# merge-queue wait/ejection, PR lead time by branch lane, red→green remediation,
# production lag) plus merges/day throughput with the +8% WoW growth line and
# its second-order trend. Compares against docs/metrics/shipping-slo-baseline.json:
#   >10% p95 improvement held 3 days → bot PR tightens the baseline
#   >20% regression / >20% throughput drop / flat growth → one deduped
#     `slo-regression` issue per metric (top offenders + measurement diff)
# Also publishes docs/metrics/shipping-slo-latest.json through a bot PR so the
# Symphony lanes status gist (scripts/lanes/doctor.py) can embed the `slo` block
# for Summer without bypassing protected-main admission.

on:
  schedule:
    - cron: '13 7 * * *' # daily, offset from the other nightly measurements
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window for collection (default: 21)'
        required: false
        default: '21'
      workflows:
        description: 'Comma-separated required workflow files'
        required: false
        default: 'ci.yml'

permissions: {}

concurrency:
  group: shipping-slo
  cancel-in-progress: false

jobs:
  measure:
    name: Measure shipping SLOs and evaluate ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Measure and evaluate
        id: slo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DAYS: ${{ github.event.inputs.days || '21' }}
          WORKFLOWS: ${{ github.event.inputs.workflows || 'ci.yml' }}
        run: |
          set -euo pipefail
          node scripts/shipping-slo-report.mjs validate
          node scripts/shipping-slo-report.mjs report \
            --workflows "$WORKFLOWS" --days "$DAYS" \
            --write-latest --json "$RUNNER_TEMP/shipping-slo.json" \
            >> "$GITHUB_STEP_SUMMARY"
          REGRESSIONS=$(jq '[.evaluation.regressions[]] | length' "$RUNNER_TEMP/shipping-slo.json")
          TIGHTEN=$(jq '[.evaluation.tightenCandidates[]] | length' "$RUNNER_TEMP/shipping-slo.json")
          FLAT_STALL=$(jq '.evaluation.flatStall' "$RUNNER_TEMP/shipping-slo.json")
          SAMPLES=$(jq '.sampled.ciRuns + .sampled.mergedPrs' "$RUNNER_TEMP/shipping-slo.json")
          {
            echo "regressions=$REGRESSIONS"
            echo "tighten=$TIGHTEN"
            echo "flat_stall=$FLAT_STALL"
            echo "samples=$SAMPLES"
          } >> "$GITHUB_OUTPUT"

      - name: Open latest snapshot PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="bot/shipping-slo-snapshot-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git switch -c "$BRANCH"
          git add docs/metrics/shipping-slo-latest.json docs/metrics/blog-publish-latency-latest.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(metrics): refresh shipping-slo snapshot" \
            -m "Generated by .github/workflows/shipping-slo.yml (JOV-6783)."
          git push -u origin "$BRANCH"
          gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "chore(metrics): refresh shipping SLO snapshot" \
            --body "Refs JOV-6783.

          Refreshes the committed shipping-SLO and blog-publish-latency snapshots from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: File deduped slo-regression issues
        # Only file when the run actually collected data — an empty sample
        # (API outage, auth failure) is a collection bug, not a regression.
        if: ${{ (steps.slo.outputs.regressions != '0' || steps.slo.outputs.flat_stall == 'true') && steps.slo.outputs.samples != '0' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPORT: ${{ runner.temp }}/shipping-slo.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/shipping-slo-intake.mjs \
            --report "$REPORT" --repo "${{ github.repository }}" \
            --run-url "$RUN_URL" \
            --receipt "$RUNNER_TEMP/shipping-slo-intake.json"

      - name: Preserve shipping SLO delivery receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipping-slo-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shipping-slo-intake.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Open baseline ratchet PR
        if: ${{ steps.slo.outputs.tighten != '0' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPORT: ${{ runner.temp }}/shipping-slo.json
        run: |
          set -euo pipefail
          BRANCH="bot/slo-ratchet-$(date -u +%Y%m%d)"
          if gh pr list --repo "${{ github.repository }}" --state open \
              --search "head:bot/slo-ratchet label:slo-ratchet" --json number --jq 'length' | grep -qv '^0$'; then
            echo "An open slo-ratchet PR already exists — skipping."
            exit 0
          fi
          git fetch origin main
          git checkout -b "$BRANCH" origin/main
          node scripts/shipping-slo-report.mjs ratchet --report "$REPORT"
          git add docs/metrics/shipping-slo-baseline.json
          if git diff --staged --quiet; then
            echo "Ratchet produced no diff — skipping."
            exit 0
          fi
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metrics): tighten shipping-slo baseline (held improvement)" \
            -m "Rolling 7d p95 improved >10% and held the configured hold window. JOV-6783."
          git push -u origin "$BRANCH"
          SUMMARY=$(jq -r '[.evaluation.tightenCandidates[] | "- `\(.key)`: \(.baseline) → \(.observed) (held \(.heldDays)d)"] | join("\n")' "$REPORT")
          gh pr create --draft --repo "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "chore(metrics): ratchet shipping SLO baseline" \
            --label slo-ratchet \
            --body "## Summary
          Automated shipping-SLO ratchet (JOV-6783): these metrics improved >10% versus the committed baseline and held for the configured hold window.

          ${SUMMARY}

          Source: docs/metrics/shipping-slo-baseline.json + .github/workflows/shipping-slo.yml" \
            || gh pr create --draft --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "chore(metrics): ratchet shipping SLO baseline" \
              --body "Automated shipping-SLO ratchet (JOV-6783)."

      - name: Slack alert on regressions
        if: ${{ steps.slo.outputs.regressions != '0' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          COUNT: ${{ steps.slo.outputs.regressions }}
        run: |
          set -euo pipefail
          jq -n --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg count "$COUNT" \
            '{text: ("Shipping SLO regression: " + $count + " metric(s) >20% over baseline. <" + $run + "|View run>")}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
