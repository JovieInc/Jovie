# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: Actions Cache GC keeps two main generations; superseded GB-scale main caches must go at once or LRU evicts the live ones.
# removal-trigger: Remove when each cache writer deletes its predecessor after saving.
name: Actions Cache Supersede
on:
  # No clock: superseded main caches only appear when a main push saves a new
  # generation, so each main push prunes. The push dry-runs logged since
  # 2026-09 match the scheduled deletions, so push runs now apply.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete (false = dry-run)'
        type: boolean
        default: false

permissions:
  actions: write

concurrency:
  group: actions-cache-supersede-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  prune:
    if: github.repository == 'JovieInc/Jovie' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/lib
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        run: node scripts/lib/actions-cache-supersede.mjs
