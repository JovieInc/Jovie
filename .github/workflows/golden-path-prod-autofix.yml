name: Golden Path Prod Autofix

# JOV-5085: event-driven live-path probe + Cursor-direct autofix.
# Separate from Post-Deploy Probes, which are read-only and must not mutate.
# Detect without a ship lock is a hole.
#
# Does not read signup-account secrets. Missing CURSOR_API_KEY fails closed.

on:
  workflow_run:
    workflows: [Production Controller]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: golden-path-prod-autofix
  cancel-in-progress: false

jobs:
  probe-and-autofix:
    name: Probe live golden path
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/production-controller.yml'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Probe https://jov.ie without signup secrets
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/golden-path-lock
          node scripts/golden-path-lock.mjs prod-probe \
            --origin https://jov.ie \
            --receipt /tmp/golden-path-lock/receipt.json

      - name: Classify the prod probe before any autofix
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/golden-path-lock/receipt.json ]]; then
            echo "::error::Golden-path prod probe wrote no receipt; refusing to skip."
            exit 1
          fi
          if [[ "$PROBE_OUTCOME" == "success" ]]; then
            if jq -e '.ok == true and .inconclusive != true' /tmp/golden-path-lock/receipt.json >/dev/null; then
              echo "Live golden-path probe passed; the first-message stream reached a clean finish event. Cursor-direct not launched."
              exit 0
            fi
            echo "::error::Probe command succeeded without an all-pass production receipt; refusing to claim success or autofix."
            exit 1
          fi
          if jq -e '.inconclusive == true and ([.checks[] | select(.ok == false and .inconclusive != true)] | length == 0)' /tmp/golden-path-lock/receipt.json >/dev/null; then
            # Inconclusive is not a product failure: every other check passed and
            # the anonymous probe intentionally carries no Turnstile token. Warn
            # (visible annotation + summary) and exit 0 so the job does not go
            # red on every Production Controller run. Any actionable failed
            # check falls through to the autofix path below and still fails.
            echo "::warning title=Golden path unverified::The chat request reached Turnstile, but no valid token was supplied. The post-challenge first-message path was not exercised; no autofix was attempted."
            echo "Golden path status: inconclusive (warning, not a failure). Turnstile was reached, but the first-message path was not tested. All other checks passed. No autofix was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if jq -e '.ok == true and .inconclusive != true' /tmp/golden-path-lock/receipt.json >/dev/null; then
            echo "::error::Probe command failed despite an all-pass production receipt; refusing autofix."
            exit 1
          fi
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "::error::CURSOR_API_KEY is missing. Detect without a ship lock is a hole."
            exit 1
          fi
          node scripts/golden-path-lock.mjs autofix \
            --receipt /tmp/golden-path-lock/receipt.json
