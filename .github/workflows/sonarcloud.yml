name: SonarCloud
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: The coverage producer stays Sonar-token-free; this downstream consumer receives SONAR_TOKEN only after an exact successful run artifact exists.
# removal-trigger: Collapse this hop when Test Coverage Audit can pass the exact lcov artifact to a same-run Sonar job without expanding the producer's credential scope.

# Native analysis consumes exact successful Test Coverage Audit evidence instead
# of regenerating web coverage. Deterministic local detectors remain the PR gate.
on:
  workflow_run:
    workflows: [Test Coverage Audit]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_SCAN_ENABLED: ${{ secrets.SONAR_TOKEN != '' }} # trufflehog:ignore (secret reference, not a value)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # trufflehog:ignore (secret reference, not a value)

    steps:
      - name: Fail when SonarCloud scan credentials are unavailable
        if: ${{ env.SONAR_SCAN_ENABLED != 'true' }}
        run: |
          echo "SONAR_TOKEN is not configured; SonarCloud analysis did not run." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}

      - name: Download exact changed-evidence web coverage
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' && github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.0.0
        with:
          name: coverage-audit-${{ github.event.workflow_run.id }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run apps/web coverage for manual diagnostics
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' && github.event_name == 'workflow_dispatch' }}
        run: pnpm --filter=@jovie/web run test:ci -- --config=vitest.config.ci.mts --coverage

      - name: Verify apps/web coverage artifact
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: test -f apps/web/coverage/lcov.info

      - name: Run packages/ui coverage
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: pnpm --filter=@jovie/ui exec vitest run --coverage

      - name: Verify packages/ui coverage artifact
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: test -f packages/ui/coverage/lcov.info

      - name: Bind LCOV sources to their producing packages
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: node scripts/normalize-sonar-lcov.mjs

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Disable SonarCloud automatic analysis
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: |
          # CI analysis is authoritative. SonarQube Cloud refuses a scanner run
          # while project-level Automatic Analysis is toggled on, which someone
          # can flip back on in the UI. Disable it the same way the UI does so a
          # stale toggle cannot fail main again. The endpoint is undocumented,
          # so warn-and-continue if the request itself fails — the scan below
          # remains the real signal.
          if ! curl -sS -f -X POST \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/autoscan/activation" \
            -d "enable=false&projectKey=JovieInc_Jovie"; then
            echo "::warning::Could not disable SonarCloud automatic analysis; the scan will fail if it is still enabled."
          fi

      - name: SonarQube Scan
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.2.1 trufflehog:ignore (pinned action SHA is a git commit, not a credential)
        with:
          # workflow_run's GITHUB_SHA belongs to this wrapper, not the analyzed checkout.
          args: -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
