name: SonarCloud
# clock-class: skip-if-unchanged

# Native analysis runs nightly against main, not as a per-PR gate. Deterministic
# local detectors block known failure classes in ci-fast; this fresh analysis
# confirms merged repairs and catches dataflow/security rules not faithfully
# expressible locally. Missing scan credentials fail visibly.
# Hygiene (#10463): no pull_request trigger (path-filter would still burn runners
# on large source diffs); nightly + manual only.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC nightly (~midnight PT)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unchanged:
    name: Skip if no new SHA
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/skip-if-unchanged
      - id: gate
        uses: ./.github/actions/skip-if-unchanged
        with:
          workflow: sonarcloud.yml

  sonarcloud:
    name: SonarCloud
    needs: unchanged
    if: needs.unchanged.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_SCAN_ENABLED: ${{ secrets.SONAR_TOKEN != '' }} # trufflehog:ignore (secret reference, not a value)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # trufflehog:ignore (secret reference, not a value)

    steps:
      - name: Fail when SonarCloud scan credentials are unavailable
        if: ${{ env.SONAR_SCAN_ENABLED != 'true' }}
        run: |
          echo "SONAR_TOKEN is not configured; SonarCloud analysis did not run." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}

      - name: Run apps/web coverage
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: pnpm --filter=@jovie/web run test:ci -- --config=vitest.config.ci.mts --coverage

      - name: Verify apps/web coverage artifact
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: test -f apps/web/coverage/lcov.info

      - name: Run packages/ui coverage
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: pnpm --filter=@jovie/ui exec vitest run --coverage

      - name: Verify packages/ui coverage artifact
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        run: test -f packages/ui/coverage/lcov.info

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        if: ${{ env.SONAR_SCAN_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.1 trufflehog:ignore (pinned action SHA is a git commit, not a credential)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
