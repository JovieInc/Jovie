name: Production Synthetic Monitoring
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: The deployed app keeps production Gateway OIDC while the GitHub-hosted observer receives only cron, Slack, and Linear credentials needed to trigger the redacted probe and route a failure signal.
# removal-trigger: Remove this hosted signal hop when a first-party production monitor schedules the same five-surface Gateway receipt and proves Slack plus Linear delivery for 30 consecutive days.

permissions:
  contents: read

on:
  schedule:
    # Deep production coverage runs independently of the disabled Agent Tick
    # monolith and is intentionally outside the deploy-blocking path.
    - cron: '17 */6 * * *'
    # JOV-6938: exactly five tiny production Gateway turns once per day.
    - cron: '47 7 * * *'
  workflow_dispatch:

concurrency:
  group: production-synthetic-monitoring
  cancel-in-progress: false

jobs:
  synthetic-test:
    name: Production Synthetic Tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env: { PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true', PLAYWRIGHT_ARTIFACT_ALLOW_IMAGES: 'true' }

    steps:
      - name: Safety check - only run on schedule or manual dispatch
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: |
          echo "❌ Synthetic monitoring should only run on schedule or manual dispatch, not on '${{ github.event_name }}'"
          echo "This workflow was incorrectly triggered. Exiting to prevent unnecessary resource usage."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'playwright.config*.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers (chromium only)
        run: pnpm --filter=@jovie/web exec playwright install --with-deps chromium

      - name: Install Doppler CLI
        run: |
          sudo apt-get update && sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" 'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main" | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update && sudo apt-get install -y doppler
          doppler --version

      - name: Check production signup readiness
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          doppler run -- pnpm --filter=@jovie/web exec tsx scripts/check-signup-readiness.ts --target=prd --source=env

      - name: SEO/AEO ratchet — live robots.txt + sitemap.xml (JOV-11044)
        env:
          BASE_URL: https://jov.ie
        run: pnpm --filter=@jovie/web run seo:ratchet:live

      - name: Run Layer A Auth UI Canary (JOV-2446)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          BASE_URL: https://jov.ie
          PLAYWRIGHT_TEST_BASE_URL: https://jov.ie
          E2E_SKIP_WEB_SERVER: '1'
          E2E_SYNTHETIC_MODE: 'true'
          E2E_ENVIRONMENT: production
          SYNTHETIC_PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/synthetic-auth-ui-results.json
        run: |
          doppler run -- node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/synthetic-auth-ui.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/synthetic-auth-ui
        continue-on-error: true

      - name: Run Golden Path Health + Performance
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          BASE_URL: https://jov.ie
          PLAYWRIGHT_TEST_BASE_URL: https://jov.ie
          E2E_SKIP_WEB_SERVER: '1'
          E2E_SYNTHETIC_MODE: 'true'
          E2E_ENVIRONMENT: production
          SYNTHETIC_PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/synthetic-golden-path-results.json
        run: |
          doppler run -- node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/synthetic-golden-path.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/synthetic-golden-path
        continue-on-error: true

      - name: Run Onboarding Robot Full Synthetic (JOV-2681)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          BASE_URL: https://jov.ie
          PLAYWRIGHT_TEST_BASE_URL: https://jov.ie
          E2E_SKIP_WEB_SERVER: '1'
          E2E_SYNTHETIC_MODE: 'true'
          E2E_ENVIRONMENT: production
          SYNTHETIC_PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/onboarding-robot-full-results.json
        run: |
          doppler run -- node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/onboarding-robot.full.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/onboarding-robot-full
        continue-on-error: true

      - name: Run Legacy OTP Signup Canary (gated, JOV-2446 cutover)
        # Skip this step entirely once Layer A is proven green and the Clerk
        # dashboard has flipped to SSO-only — set repo variable
        # `E2E_PROD_LEGACY_CANARY=0` to disable. Default is to run during the
        # cutover window so monitoring does not go dark between merge and
        # dashboard flip.
        if: ${{ vars.E2E_PROD_LEGACY_CANARY != '0' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          BASE_URL: https://jov.ie
          PLAYWRIGHT_TEST_BASE_URL: https://jov.ie
          E2E_SKIP_WEB_SERVER: '1'
          E2E_SYNTHETIC_MODE: 'true'
          E2E_ENVIRONMENT: production
          SYNTHETIC_PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/synthetic-legacy-otp-results.json
        run: |
          doppler run -- node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/synthetic-legacy-otp.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/synthetic-legacy-otp
        continue-on-error: true

      - name: Run Production Waitlist Canary
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          BASE_URL: https://jov.ie
          PLAYWRIGHT_TEST_BASE_URL: https://jov.ie
          E2E_SKIP_WEB_SERVER: '1'
          E2E_SYNTHETIC_MODE: 'true'
          E2E_PROD_WAITLIST_CANARY_ENABLED: 'true'
          E2E_ENVIRONMENT: production
          SYNTHETIC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SYNTHETIC_PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/synthetic-production-waitlist-results.json
        run: |
          WAITLIST_SECRETS='E2E_PROD_SIGNUP_EMAIL_BASE,E2E_PROD_MAILBOX_PROVIDER,E2E_PROD_OTP_CHECK_ORIGIN,E2E_PROD_OTP_CHECK_TOKEN,E2E_PROD_OTP_CHECK_URL,PRODUCTION_WAITLIST_CANARY_READ_TOKEN'
          if doppler run --project jovie-web --config prd --only-secrets="$WAITLIST_SECRETS" --no-fallback -- env >/dev/null 2>&1; then
            doppler run --project jovie-web --config prd --only-secrets="$WAITLIST_SECRETS" --no-fallback -- env -u DOPPLER_TOKEN node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/synthetic-production-waitlist.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/synthetic-production-waitlist
          else
            echo "::warning::waitlist canary secrets missing from jovie-web/prd; running the spec without secret injection so the failure is reported in-band with a results file"
            env -u DOPPLER_TOKEN node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/synthetic-production-waitlist.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/synthetic-production-waitlist
          fi
        continue-on-error: true

      - name: Run Public Profile Smoke Test (JOV-1653)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          BASE_URL: https://jov.ie
          PLAYWRIGHT_TEST_BASE_URL: https://jov.ie
          E2E_SKIP_WEB_SERVER: '1'
          E2E_SYNTHETIC_MODE: 'true'
          E2E_ENVIRONMENT: production
          SYNTHETIC_PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/public-profile-smoke-results.json
        run: |
          doppler run -- node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web exec playwright test tests/e2e/public-profile-smoke.spec.ts --config=playwright.synthetic.config.ts --project=chromium-synthetic --output=test-results/public-profile-smoke
        continue-on-error: true

      - name: Confirm synthetic identity policy
        if: always()
        run: |
          echo "The production waitlist canary reuses one exact reserved identity and never deletes it."
          echo "Onboarding robot cleanup is scoped by exact robot email, Clerk user id, run id, and generated handle."
          echo "No broad production Clerk cleanup script is run from this workflow."

      - name: Parse test results
        id: test-results
        if: ${{ always() }}
        env:
          LEGACY_CANARY_ENABLED: ${{ vars.E2E_PROD_LEGACY_CANARY != '0' && '1' || '0' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {
            DEFAULT_RESULT_FILES,
            formatGithubOutput,
            parseSyntheticTestResults,
          } = require('./.github/scripts/parse-synthetic-test-results.js');

          const legacyCanaryEnabled = process.env.LEGACY_CANARY_ENABLED === '1';
          const result = parseSyntheticTestResults({
            resultFiles: DEFAULT_RESULT_FILES(legacyCanaryEnabled),
          });

          for (const warning of result.testWarnings) {
            console.log(`::warning::${warning}`);
          }

          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            fs.appendFileSync(outputFile, formatGithubOutput(result));
          } else {
            process.stdout.write(formatGithubOutput(result));
          }
          NODE

      - name: Upload test results
        uses: ./.github/actions/upload-safe-playwright-artifact
        if: ${{ always() && hashFiles('apps/web/test-results/*-results.json') != '' }}
        with:
          name: synthetic-test-results
          path: |
            apps/web/test-results/
            !apps/web/test-results/public-profile-smoke-*.png
          retention-days: 30

      - name: Send Slack Alert on Failure
        if: ${{ always() && (failure() || steps.test-results.outputs.test_status != 'passed') }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: '#alerts-production'
          author_name: 'Synthetic Monitoring'
          custom_payload: |
            {
              "text": "Production Synthetic Monitoring Failed - jov.ie",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {
                      "title": "URL",
                      "value": "https://jov.ie",
                      "short": true
                    },
                    {
                      "title": "Failed Tests",
                      "value": ${{ toJSON(format('```{0}```', steps.test-results.outputs.failed_tests)) }},
                      "short": false
                    },
                    {
                      "title": "Artifacts",
                      "value": "Sanitized JSON failure packets are attached under synthetic-test-results; CI intentionally omits trace, video, HTML, and screenshots.",
                      "short": false
                    },
                    {
                      "title": "Action",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Warn when the synthetic Slack channel is unconfigured
        if: ${{ always() && (failure() || steps.test-results.outputs.test_status != 'passed') }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::warning::synthetic alert channel unconfigured"
          fi

      - name: File or resolve the synthetic Linear issue
        if: ${{ always() }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          FAILED_TESTS: ${{ steps.test-results.outputs.failed_tests }}
          TEST_STATUS: ${{ steps.test-results.outputs.test_status }}
          FLAKY_TESTS: ${{ steps.test-results.outputs.flaky_tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/synthetic-monitoring.yml/runs?event=schedule&status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})][0].conclusion // \"\"" || true)"
          PREVIOUS_CONCLUSION="$previous" node scripts/synthetic-monitoring-intake.mjs

      - name: Send Slack Success Notification (Scheduled Summary)
        if: ${{ always() && !failure() && steps.test-results.outputs.test_status == 'passed' && github.event_name == 'schedule' }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: '#monitoring'
          author_name: 'Synthetic Monitoring'
          custom_payload: |
            {
              "text": "Production Synthetic Monitoring Passed - jov.ie",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {
                      "title": "URL",
                      "value": "https://jov.ie",
                      "short": true
                    },
                    {
                      "title": "Status",
                      "value": "Production auth UI, onboarding robot, signup health, and public-profile synthetic checks passing",
                      "short": false
                    },
                    {
                      "title": "Tests Passed",
                      "value": "${{ steps.test-results.outputs.passed_tests }}/${{ steps.test-results.outputs.total_tests }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # Preserve the red signal only after the failure alert has had a chance to
      # run. `always()` also covers setup/checkout/parser failures that produced
      # no structured test result.
      - name: Fail job if tests failed
        if: ${{ always() && (failure() || steps.test-results.outputs.test_status != 'passed') }}
        run: |
          echo "Marking job as failed because synthetic status is '${{ steps.test-results.outputs.test_status }}'"
          exit 1

  web-ai-health:
    name: Web AI Health (Daily)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 7 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Doppler CLI
        uses: ./.github/actions/setup-doppler

      - name: Run production Web AI health probe
        id: health
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          set +e
          doppler run --project jovie-web --config prd --only-secrets=CRON_SECRET --no-fallback -- \
            env -u DOPPLER_TOKEN node .github/scripts/run-web-ai-health.mjs \
              --url https://jov.ie/api/cron/web-ai-health \
              --receipt "$RUNNER_TEMP/web-ai-health/receipt.json"
          probe_exit=$?
          set -e
          if [ ! -f "$RUNNER_TEMP/web-ai-health/receipt.json" ]; then
            env -u CRON_SECRET node .github/scripts/run-web-ai-health.mjs \
              --url https://jov.ie/api/cron/web-ai-health \
              --receipt "$RUNNER_TEMP/web-ai-health/receipt.json" || true
          fi
          exit "$probe_exit"

      - name: Upload Web AI health receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ai-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-ai-health/receipt.json
          retention-days: 30
          if-no-files-found: error

      - name: Send Slack alert on Web AI failure
        if: ${{ always() && (steps.health.outcome != 'success' || steps.health.outputs.health_status != 'passed') }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: '#alerts-production'
          author_name: 'Web AI Health'
          custom_payload: |
            {
              "text": "High: production Web AI health failed",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {
                      "title": "Route",
                      "value": "bug",
                      "short": true
                    },
                    {
                      "title": "Gateway allowlist",
                      "value": ${{ toJSON(steps.health.outputs.allowlist_name) }},
                      "short": true
                    },
                    {
                      "title": "Failures",
                      "value": ${{ toJSON(format('```{0}```', steps.health.outputs.failure_summary)) }},
                      "short": false
                    },
                    {
                      "title": "Action",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View receipt>",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: File high-priority Linear bug signal
        if: ${{ always() && (steps.health.outcome != 'success' || steps.health.outputs.health_status != 'passed') }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEB_AI_HEALTH_RECEIPT_PATH: ${{ runner.temp }}/web-ai-health/receipt.json
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/web-ai-health-intake.mjs

      - name: Resolve Linear issue when Web AI health is green
        if: ${{ steps.health.outcome == 'success' && steps.health.outputs.health_status == 'passed' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          WEB_AI_HEALTH_STATUS: passed
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/web-ai-health-intake.mjs

      - name: Record green Web AI health summary
        if: ${{ steps.health.outcome == 'success' && steps.health.outputs.health_status == 'passed' }}
        env:
          ALLOWLIST_NAME: ${{ steps.health.outputs.allowlist_name }}
        run: |
          {
            echo '## Web AI health'
            echo
            echo "All five production AI surfaces passed under \`${ALLOWLIST_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Web AI health is red
        if: ${{ always() && (steps.health.outcome != 'success' || steps.health.outputs.health_status != 'passed') }}
        run: |
          echo "Web AI health status is '${{ steps.health.outputs.health_status }}'."
          exit 1

  # JOV-6870: /api/health stays 200 while every requireRedis limiter fails
  # closed (hid the 09-24 quota outage for 3 days). Probe the limiter store.
  limiter-store-health:
    name: Limiter Store Health
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Doppler CLI
        uses: ./.github/actions/setup-doppler

      - name: Probe production limiter store
        id: probe
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # expanded by the inner sh, after doppler injects CRON_SECRET
          doppler run --project jovie-web --config prd --only-secrets=CRON_SECRET --no-fallback -- \
            env -u DOPPLER_TOKEN sh -c 'curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -o "$RUNNER_TEMP/redis-health.json" -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" https://jov.ie/api/health/redis' > "$RUNNER_TEMP/redis-code"
          code=$(cat "$RUNNER_TEMP/redis-code")
          body=$(jq -c '{status, failureKind}' "$RUNNER_TEMP/redis-health.json" 2>/dev/null || echo '{}')
          echo "Limiter store: HTTP $code $body" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "summary=HTTP $code $body" >> "$GITHUB_OUTPUT"
          test "$code" = 200

      - name: Send Slack alert on limiter store failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$SLACK_WEBHOOK_URL" || exit 0
          curl --fail --silent --show-error --max-time 20 -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg s "$SUMMARY" --arg r "$RUN_URL" \
              '{text: ("High: production rate-limit store unhealthy; requireRedis limiters fail closed (onboarding chat, /api/v1). " + $s + " <" + $r + "|run>")}')"

  billing-health-public:
    name: Billing health public probe
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 7 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe anonymous billing health
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/billing-health-public.json"
          rm -f "$response_file"
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --max-filesize 32768 -o "$response_file" -w '%{http_code}' https://jov.ie/api/billing/health || true)"
          echo "anonymous billing health HTTP ${code}" | tee -a "$GITHUB_STEP_SUMMARY"
          BILLING_HEALTH_STATUS="$code" BILLING_HEALTH_RESPONSE_FILE="$response_file" \
            node scripts/billing-health-public-intake.mjs

  billing-sync-stale:
    name: Billing sync stale probe
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 7 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Doppler CLI
        uses: ./.github/actions/setup-doppler
      - name: Read authenticated billing health
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          doppler run --project jovie-web --config prd --only-secrets=CRON_SECRET --no-fallback -- \
            env -u DOPPLER_TOKEN sh -c 'curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer $CRON_SECRET" https://jov.ie/api/billing/health' > "$RUNNER_TEMP/billing-health.json"
          BILLING_HEALTH_JSON="$(cat "$RUNNER_TEMP/billing-health.json")" \
            node scripts/billing-sync-intake.mjs

  docs-deploy-jovie:
    name: jovie-docs deploy signal
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 7 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or resolve a failed jovie-docs production deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
        run: node scripts/docs-deploy-intake.mjs
