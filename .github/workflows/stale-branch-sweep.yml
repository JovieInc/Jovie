# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: TimWhite
# capability-gap: GitHub auto-deletes only merged PR heads; agent branches without a PR, closed-unmerged heads and squash-merged heads with later commits accumulate (7,752 remote branches on 2026-10-20). This hop holds only contents:write to archive idle unique work to refs/archive/* and delete swept branches with a lease.
# removal-trigger: Remove when every branch writer (lanes, Symphony, Codex, Devin, Cursor, bots) deletes its own branch on PR close or abandonment and the remote branch count stays under 500 for 30 days.
name: Stale Branch Sweep

# Archives then deletes stale remote branches; policy in
# scripts/lib/stale-branch-sweep.mjs and docs/ci/repository-health.md.
# No clock here (JOV-INV-042 freezes GitHub crons): the Gem lanes clock fires
# repository_dispatch clock_stale_branch_sweep on the cadence the automation
# registry records (the bot token cannot send workflow_dispatch). A clock event
# applies unless client_payload.apply is false; manual dispatch is a dry-run
# unless apply=true.

on:
  repository_dispatch:
    types: [clock_stale_branch_sweep]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Archive and delete (false keeps this a dry-run)'
        required: false
        default: 'false'

permissions: {}

concurrency:
  group: stale-branch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Archive and delete stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted sweep policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/stale-branch-sweep.mjs
            scripts/lib/stale-branch-sweep.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Plan and sweep
        env:
          APPLY: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.apply != false && 'true' || 'false') || inputs.apply }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --bare --filter=tree:0 "https://github.com/${GH_REPO}.git" "$RUNNER_TEMP/sweep.git"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C "$RUNNER_TEMP/sweep.git" config http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"
          flags=()
          if [ "$APPLY" = 'true' ]; then flags+=(--apply); fi
          node scripts/stale-branch-sweep.mjs --git-dir "$RUNNER_TEMP/sweep.git" \
            --receipt stale-branch-sweep-receipt.json "${flags[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stale-branch-sweep-receipt
          path: stale-branch-sweep-receipt.json
          retention-days: 90
