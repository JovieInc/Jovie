name: Production Dogfood
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: A hosted observer reads public production pages (GET only, Tim's public profile and public marketing/auth surfaces, no credentials) and signs in only as the sanctioned seeded creator-ready identity through the same Doppler jovie-web/prd secrets as the post-deploy auth smoke (READ-ONLY journeys, no messages sent), holds the Linear key to file or close its own fingerprinted dogfood issues, the AI Gateway key for a cheap vision review, and CRON_SECRET to post its roll-up to the internal Ovie evidence route. It never mutates production and never writes a Production Verified marker.
# removal-trigger: Remove when the Production Controller dispatches the same mission run on each landed deploy and the 15-minute deploy-detection poll below is redundant.
#
# Continuous dogfooding (Tim, 2026-10-25): agents use production like a user,
# find defects before Tim does, file them with evidence, and certify missions
# with receipts bound to the deployed SHA. The 15-minute poll is a deploy
# detector with a 15-minute dwell SLO, not a test clock: the run itself only
# starts when the served commit changed or the hourly bucket rolled over
# (published links can break without a deploy, e.g. a YouTube description edit).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if this SHA was already dogfooded this hour'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: production-dogfood
  cancel-in-progress: false

jobs:
  gate:
    name: Read served build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      key: ${{ steps.decide.outputs.key }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Read the served build
        id: decide
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 3 --max-time 20 https://jov.ie/api/health/build-info || true)"
          sha="$(printf '%s' "$body" | jq -r '.commitSha // empty')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            # Cannot bind to a build: still run so the failure is filed.
            echo "key=dogfood-unbound-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "key=dogfood-$sha-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

  dogfood:
    name: Dogfood production
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Skip when already dogfooded
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ needs.gate.outputs.sha != '' && inputs.force != 'true' }}
        with:
          path: .dogfood-seen
          key: ${{ needs.gate.outputs.key }}
          lookup-only: true

      - name: Checkout code
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node and pnpm
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Playwright (Chromium)
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-playwright

      - uses: ./.github/actions/setup-doppler
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}

      # Vision review costs money: once per deployed SHA, not once per hour.
      - name: Check whether this SHA was already vision-reviewed
        id: vision-seen
        if: ${{ steps.seen.outputs.cache-hit != 'true' && needs.gate.outputs.sha != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dogfood-vision-seen
          key: dogfood-vision-${{ needs.gate.outputs.sha }}
          lookup-only: true

      - name: Resolve CRON_SECRET for the Ovie ingest
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node .github/scripts/resolve-synthetic-secrets.mjs --name CRON_SECRET

      # Authenticated journeys: the sanctioned seeded creator-ready identity and
      # production OTP source the post-deploy auth smoke already uses (same
      # Doppler jovie-web/prd secrets; values are never printed). READ-ONLY.
      - name: Authenticated dashboard and chat journeys
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        continue-on-error: true
        working-directory: apps/web
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          PLAYWRIGHT_ARTIFACT_ALLOW_IMAGES: 'true'
          PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
        run: |
          set -euo pipefail
          mkdir -p tests/.auth
          echo '{"cookies":[],"origins":[]}' > tests/.auth/user.json
          doppler run --project jovie-web --config prd \
            --only-secrets=E2E_PROD_USER_EMAIL,DATABASE_URL \
            --no-fallback -- env -u DOPPLER_TOKEN \
              CI=true \
              BASE_URL=https://jov.ie \
              PLAYWRIGHT_TEST_BASE_URL=https://jov.ie \
              E2E_SKIP_WEB_SERVER=1 \
              DOGFOOD_OUT_DIR="$GITHUB_WORKSPACE/out/prod-dogfood" \
              PLAYWRIGHT_DYNAMIC_SECRETS_FILE="$RUNNER_TEMP/playwright-dynamic-cookie-values" \
                node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- \
                  pnpm exec playwright test tests/e2e/prod-dogfood-auth.spec.ts --project=chromium --reporter=line

      - name: Run the dogfood missions
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        id: run
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Cheapest passing vision provider wins (see prod-dogfood-vision.mjs): Workers AI
          # credits when the token exists, else the allowlisted Gateway model.
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          DOGFOOD_VISION: ${{ steps.vision-seen.outputs.cache-hit == 'true' && '0' || '1' }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exit 2 means defects were found and filed; that is a successful
          # observation, not a broken observer.
          set +e
          auth_flag=""
          [ -f out/prod-dogfood/auth-checks.json ] && auth_flag="--auth-checks out/prod-dogfood/auth-checks.json"
          node scripts/prod-dogfood.mjs --out out/prod-dogfood $auth_flag \
            --ingest https://jov.ie/api/internal/ovie/dogfood-evidence
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Upload receipts, certification and screenshots
        if: ${{ always() && steps.seen.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-dogfood
          path: out/prod-dogfood
          retention-days: 30
          if-no-files-found: warn

      - name: Remember this SHA for the hour
        if: ${{ success() && needs.gate.outputs.sha != '' && steps.seen.outputs.cache-hit != 'true' }}
        run: mkdir -p .dogfood-seen .dogfood-vision-seen && date -u +%FT%TZ | tee .dogfood-seen/at .dogfood-vision-seen/at
      - name: Save seen marker
        if: ${{ success() && needs.gate.outputs.sha != '' && steps.seen.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dogfood-seen
          key: ${{ needs.gate.outputs.key }}
      - name: Save vision-reviewed marker
        if: ${{ success() && needs.gate.outputs.sha != '' && steps.seen.outputs.cache-hit != 'true' && steps.vision-seen.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dogfood-vision-seen
          key: dogfood-vision-${{ needs.gate.outputs.sha }}
