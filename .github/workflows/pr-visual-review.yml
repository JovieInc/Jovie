name: PR Visual Review

# Bounded UI evidence lane. Capture runs on PR code without secrets;
# JOV-6232: automatic paid model review is retired. Keep capture and uploads.
# JOV-5459: missing capture evidence (ENOENT) fails the capture job.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/features/**'
      - 'apps/web/lib/**'
      - 'apps/web/data/homepage*.ts'
      - 'apps/web/public/**'
      - 'apps/web/styles/**'
      - 'apps/console/**'
      - 'apps/ios/**'
      - 'packages/ui/**'
      - '**/*.css'
      - '**/*.scss'
      - 'DESIGN.md'
      - 'canon/DESIGN.md'

permissions: {}

concurrency:
  group: pr-visual-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_VISUAL_OUT: pr-visual-artifacts

jobs:
  capture:
    # Capture evidence remains fail-closed (JOV-5459).
    name: Capture changed UI (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout PR code (no secrets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright Chromium
        run: pnpm --filter @jovie/web exec playwright install --with-deps chromium

      - name: Resolve PR base branch tip
        id: base-tip
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        # The event's pull_request base SHA is not refreshed when the PR head
        # is pushed; once the PR merges main, routing from it captures main's
        # UI changes too. Use the base branch tip the full-history checkout
        # fetched (a base-repository commit, never PR content).
        run: |
          set -euo pipefail
          [[ "$PR_BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          base_tip="$(git rev-parse --verify "refs/remotes/origin/$PR_BASE_REF^{commit}")"
          [[ "$base_tip" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$base_tip" >> "$GITHUB_OUTPUT"

      - name: Route changed files
        id: route
        env:
          BASE_SHA: ${{ steps.base-tip.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base_available=true
          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt" 2> "$RUNNER_TEMP/merge-base-error.txt"; then
            merge_base_available=false
            # Divergent/stacked history is unavailable evidence, not a UI defect.
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt" || :
          fi
          export MERGE_BASE_AVAILABLE="$merge_base_available"
          mkdir -p "$PR_VISUAL_OUT"
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { routeChangedFiles } from './.github/scripts/pr-visual-review.mjs';
          const files = (await readFile(process.env.RUNNER_TEMP + '/changed-files.txt', 'utf8')).split('\n').filter(Boolean);
          const route = routeChangedFiles(files);
          const output = {
            ...route,
            review_status: route.shouldReview
              ? process.env.MERGE_BASE_AVAILABLE === 'true'
                ? route.review_status
                : 'unavailable'
              : 'skipped',
            merge_base_available: process.env.MERGE_BASE_AVAILABLE === 'true',
            files,
          };
          await writeFile(process.env.PR_VISUAL_OUT + '/routing.json', JSON.stringify(output, null, 2));
          await writeFile(process.env.GITHUB_OUTPUT, `should_review=${route.shouldReview}\nreview_status=${output.review_status}\nroutes<<ROUTES\n${JSON.stringify(route.routes)}\nROUTES\n`, { flag: 'a' });
          console.log(JSON.stringify(output));
          NODE

      - name: Build web app for deterministic capture
        id: build
        if: steps.route.outputs.should_review == 'true'
        continue-on-error: true
        run: pnpm turbo build --filter=@jovie/web
        env:
          DATABASE_URL: postgresql://localhost/noop
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock
          CLERK_SECRET_KEY: sk_test_mock
          NEXT_DISABLE_TOOLBAR: '1'
          NEXT_PUBLIC_CLERK_PROXY_DISABLED: '1'
          NEXT_PUBLIC_CLERK_MOCK: '1'
          NEXT_PUBLIC_E2E_MODE: '1'
          VERCEL_ENV: development
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH: '1'
          E2E_TEST_AUTH_PERSONA: creator-ready
          E2E_CLERK_USER_ID: user_test

      - name: Start production server
        id: server
        if: steps.route.outputs.should_review == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          (cd apps/web && PORT=3100 DATABASE_URL=postgresql://localhost/noop NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_mock CLERK_SECRET_KEY=sk_test_mock NEXT_DISABLE_TOOLBAR=1 NEXT_PUBLIC_CLERK_PROXY_DISABLED=1 NEXT_PUBLIC_CLERK_MOCK=1 NEXT_PUBLIC_E2E_MODE=1 VERCEL_ENV=development E2E_USE_TEST_AUTH_BYPASS=1 E2E_VISUAL_CAPTURE_SYNTHETIC_AUTH=1 E2E_TEST_AUTH_PERSONA=creator-ready E2E_CLERK_USER_ID=user_test HOSTNAME=localhost NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 BETTER_AUTH_URL=http://127.0.0.1:3100 NEXT_PUBLIC_BETTER_AUTH_URL=http://127.0.0.1:3100 pnpm run start) > "$RUNNER_TEMP/pr-visual-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pr-visual-server.pid"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3100 >/dev/null 2>&1 && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/pr-visual-server.log"
          exit 1

      - name: Capture routed surfaces
        id: routed_capture
        if: steps.route.outputs.should_review == 'true' && steps.build.outcome == 'success' && steps.server.outcome == 'success'
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:3100
          PR_VISUAL_ROUTES: ${{ steps.route.outputs.routes }}
        run: |
          set -euo pipefail
          PR_VISUAL_ROUTES="$(node -p "JSON.stringify(require('./pr-visual-artifacts/routing.json').routes)")" node .github/scripts/pr-visual-review-capture.mjs
          test -f pr-visual-artifacts/manifest.json

      - name: Stop server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/pr-visual-server.pid" 2>/dev/null)" 2>/dev/null || true

      - name: Enforce visual evidence (fail-closed)
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CAPTURE_OUTCOME: ${{ steps.routed_capture.outcome }}
        run: node .github/scripts/pr-visual-evidence-gate.mjs

      - name: Upload visual evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-visual-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: pr-visual-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Fail on missing evidence upload
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" = failure ]; then
            echo "::error::Visual evidence upload failed. Visual ENOENT is FAIL, not advisory (JOV-5459)."
            exit 1
          fi
