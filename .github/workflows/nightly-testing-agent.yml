# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Codex
# necessary-trust-boundary: Existing Jovie Bot credentials publish only generated nightly evidence through draft PRs that trigger normal checks; the read-only checkout token cannot do this. No merge, deploy, or founder-decision authority is added.
# revisit-trigger: Remove this publication hop when canonical nightly evidence no longer requires committed report files.
name: Nightly Testing Agent

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/nightly-test-agent/**'
      - '.github/workflows/nightly-testing-agent.yml'
      - 'apps/web/**/*.test.*'
      - 'apps/web/**/*.spec.*'
      - 'apps/web/scripts/nightly-test-agent.ts'
      - 'apps/web/stryker.config.mjs'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      run_unit:
        description: Run the deterministic Vitest telemetry lane
        type: boolean
        default: true
      run_mutation:
        description: Run the Stryker mutation hotspot lane
        type: boolean
        default: true
      validate_candidates:
        description: Validate candidate tests committed under the skill candidates directory
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-testing-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Build Agent Context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build compact context
        run: >-
          pnpm --filter=@jovie/web run test:nightly-agent:context --
          --out apps/web/test-results/nightly-agent/context

      - name: Select risk-ranked targets
        run: >-
          pnpm --filter=@jovie/web run test:nightly-agent:select --
          --out apps/web/test-results/nightly-agent/context

      - name: Upload agent context
        if: ${{ always() && hashFiles('apps/web/test-results/nightly-agent/context/context.json') != '' && hashFiles('apps/web/test-results/nightly-agent/context/selected-targets.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-agent-context-${{ github.run_id }}
          path: |
            apps/web/test-results/nightly-agent/context/context.json
            apps/web/test-results/nightly-agent/context/selected-targets.json
          retention-days: 30

  deterministic:
    name: Deterministic Unit Telemetry (${{ matrix.shard }}/4)
    needs: [context]
    if: ${{ github.event_name == 'push' || inputs.run_unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env: { PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run unit suite
        id: unit
        continue-on-error: true
        run: pnpm --filter=@jovie/web run test --shard ${{ matrix.shard }}/4
        env:
          CI: 'true'
          VITEST_JUNIT_OUTPUT_FILE: test-results/nightly-agent/unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.junit.xml

      - name: Normalize unit telemetry
        if: always()
        env:
          PLAYWRIGHT_ARTIFACT_PATHS: apps/web/test-results/nightly-agent/deterministic/normalized-results.json
        run: |
          test -s apps/web/test-results/nightly-agent/unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.junit.xml
          node .github/scripts/guard-playwright-artifacts.mjs --run -- \
          pnpm --filter=@jovie/web run test:nightly-agent:normalize -- \
          --junit apps/web/test-results/nightly-agent/unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.junit.xml \
          --out apps/web/test-results/nightly-agent/deterministic \
          --name normalized-results.json

      - name: Upload deterministic telemetry
        if: ${{ always() && hashFiles('apps/web/test-results/nightly-agent/deterministic/normalized-results.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-agent-deterministic-${{ matrix.shard }}-${{ github.run_id }}
          path: apps/web/test-results/nightly-agent/deterministic/
          retention-days: 30

      - name: Preserve unit failure signal
        if: steps.unit.outcome == 'failure'
        run: exit 1

  mutation-hotspots:
    name: Mutation Hotspots
    needs: [context, deterministic]
    if: >-
      always() &&
      needs.context.result == 'success' &&
      (github.event_name == 'push' || inputs.run_mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run Stryker hotspot mutation lane
        id: mutation
        continue-on-error: true
        run: pnpm --filter=@jovie/web run test:mutation:hotspots
        env:
          CI: 'true'

      - name: Normalize mutation telemetry
        if: always()
        run: >-
          pnpm --filter=@jovie/web run test:nightly-agent:normalize --
          --mutation apps/web/reports/mutation/mutation.json
          --out apps/web/test-results/nightly-agent/mutation
          --name normalized-results.json

      - name: Upload mutation telemetry
        if: ${{ always() && hashFiles('apps/web/test-results/nightly-agent/mutation/normalized-results.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-agent-mutation-${{ github.run_id }}
          path: apps/web/test-results/nightly-agent/mutation/
          retention-days: 30

      - name: Preserve mutation setup failure signal
        if: steps.mutation.outcome == 'failure'
        run: exit 1

  candidate-validation:
    name: Candidate Test Validation
    needs: [context]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_candidates }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Validate candidate metadata and focused commands
        run: >-
          pnpm --filter=@jovie/web run test:nightly-agent:validate-candidate --
          --out apps/web/test-results/nightly-agent/candidate-validation
          --execute true

      - name: Upload candidate validation report
        if: ${{ always() && hashFiles('apps/web/test-results/nightly-agent/candidate-validation/candidate-validation.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-agent-candidate-validation-${{ github.run_id }}
          path: apps/web/test-results/nightly-agent/candidate-validation/candidate-validation.json
          retention-days: 30

  report:
    name: Emit Agent Report
    needs: [context, deterministic, mutation-hotspots, candidate-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download agent artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.0.0
        with:
          pattern: nightly-agent-*-${{ github.run_id }}
          path: apps/web/test-results/nightly-agent/incoming
          merge-multiple: false

      - name: Resolve workflow conclusion
        id: conclusion
        run: |
          results=("${{ needs.context.result }}" "${{ needs.deterministic.result }}" "${{ needs.mutation-hotspots.result }}" "${{ needs.candidate-validation.result }}")
          for result in "${results[@]}"; do
            if [ "$result" = "failure" ]; then
              echo "value=failure" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          for result in "${results[@]}"; do
            if [ "$result" = "cancelled" ]; then
              echo "value=cancelled" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if [ "${{ needs.context.result }}" != "success" ]; then
            echo "value=failure" >> "$GITHUB_OUTPUT"
          else
            echo "value=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Emit compact report and skill delta
        env:
          WORKFLOW_CONCLUSION: ${{ steps.conclusion.outputs.value }}
        run: >-
          pnpm --filter=@jovie/web run test:nightly-agent:emit-delta --
          --input-dir apps/web/test-results/nightly-agent/incoming
          --workflow-conclusion "$WORKFLOW_CONCLUSION"

      - name: Publish evidence report and ops status
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_CONCLUSION: ${{ steps.conclusion.outputs.value }}
          PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
          PLAYWRIGHT_ARTIFACT_PATHS: |
            apps/web/test-results/nightly-agent/nightly-report.md
            apps/web/test-results/nightly-agent/skill-delta.json
            docs/NIGHTLY_TESTING_AGENT_REPORT.md
            apps/web/reports/nightly-agent/last-run.json
        run: >-
          node .github/scripts/guard-playwright-artifacts.mjs --run -- pnpm --filter=@jovie/web run test:nightly-agent:publish-status --
          --input-dir apps/web/test-results/nightly-agent/incoming
          --workflow-run-url "$WORKFLOW_RUN_URL"
          --workflow-conclusion "$WORKFLOW_CONCLUSION"

      - name: Add report to job summary
        run: cat apps/web/test-results/nightly-agent/nightly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final report
        if: ${{ always() && hashFiles('apps/web/test-results/nightly-agent/nightly-report.md') != '' && hashFiles('apps/web/test-results/nightly-agent/skill-delta.json') != '' && hashFiles('docs/NIGHTLY_TESTING_AGENT_REPORT.md') != '' && hashFiles('apps/web/reports/nightly-agent/last-run.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-agent-report-${{ github.run_id }}
          path: |
            apps/web/test-results/nightly-agent/nightly-report.md
            apps/web/test-results/nightly-agent/skill-delta.json
            docs/NIGHTLY_TESTING_AGENT_REPORT.md
            apps/web/reports/nightly-agent/last-run.json
          allow-markdown: 'true'
          retention-days: 90

      - name: Generate report publication token
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: report-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open nightly evidence PR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          node --input-type=module -e "import { publishNightlyReport } from './scripts/lib/publish-coverage-report.mjs'; console.log(publishNightlyReport());"
