name: Dependabot Pin Sync
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Jovie-Bot
# necessary-trust-boundary: Dependabot-triggered runs get no secrets, so a workflow_run hop runs trusted main code and commits with the App token; PR code is never executed.
# removal-trigger: Remove when Dependabot updates root pnpm.overrides and the isolated apps/eve-pilot lockfile itself.

# Dependabot npm groups bump workspace manifests but leave the duplicate root
# pnpm.overrides pins (react, vite, jsdom, postcss, ...) and the isolated
# apps/eve-pilot lockfile behind, so every group PR needed a hand commit
# (#21426, #21427, #21498, #21533). After Source Validation runs on a
# Dependabot npm PR, this workflow:
#   1. verifies the PR (author, branch, same repo, exact head, dependency-only
#      files) from trusted main with a read-only token;
#   2. raises any exact root override that duplicates a workspace pin
#      (scripts/dependabot-pin-sync.mjs; never lowers, never touches security
#      or range overrides) and regenerates the root and isolated lockfiles
#      with scripts and pnpmfile disabled;
#   3. commits only the changed allowlisted files through the App token with
#      an atomic expectedHeadOid write.
# Never runs in merge_group. Native green-enroll remains the only queue writer.

on:
  workflow_run:
    workflows: ['Source Validation']
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-pin-sync-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Sync pins without write credentials
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/') &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.guard.outputs.branch }}
      files: ${{ steps.diff.outputs.files }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Verify the exact Dependabot head
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node policy/scripts/dependabot-pin-sync.mjs guard \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head "$HEAD_SHA"
      - name: Checkout exact candidate head without credentials
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Setup pnpm
        if: steps.guard.outputs.eligible == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - name: Setup Node.js 24
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Raise duplicate root override pins
        id: sync
        if: steps.guard.outputs.eligible == 'true'
        run: node policy/scripts/dependabot-pin-sync.mjs sync --root candidate
      - name: Regenerate the root lockfile when an override moved
        if: steps.sync.outputs.overrides_changed == 'true'
        working-directory: candidate
        run: |
          pnpm install --lockfile-only --ignore-scripts --ignore-pnpmfile --no-frozen-lockfile
          pnpm install --frozen-lockfile --lockfile-only --ignore-scripts --ignore-pnpmfile
      - name: Regenerate the isolated Eve pilot lockfile when stale
        if: steps.guard.outputs.eligible == 'true'
        working-directory: candidate/apps/eve-pilot
        run: |
          if ! pnpm install --ignore-workspace --frozen-lockfile --lockfile-only --ignore-scripts; then
            pnpm install --ignore-workspace --lockfile-only --ignore-scripts --no-frozen-lockfile
            pnpm install --ignore-workspace --frozen-lockfile --lockfile-only --ignore-scripts
          fi
      - name: Collect changed allowlisted files
        id: diff
        if: steps.guard.outputs.eligible == 'true'
        working-directory: candidate
        run: |
          files="$(git diff --name-only -- package.json pnpm-lock.yaml apps/eve-pilot/pnpm-lock.yaml | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed: ${files:-none}"
          mkdir -p "$RUNNER_TEMP/pin-sync"
          for file in ${files//,/ }; do
            mkdir -p "$RUNNER_TEMP/pin-sync/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/pin-sync/$file"
          done
      - name: Upload the synced files
        id: upload
        if: steps.diff.outputs.files != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-pin-sync-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/pin-sync
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Atomic expected-head commit
    needs: prepare
    if: needs.prepare.outputs.files != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted main writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Download the synced files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/pin-sync
      - name: Generate short-lived Jovie App writer token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit the synced files at the exact head
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          FILES: ${{ needs.prepare.outputs.files }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node policy/scripts/dependabot-pin-sync.mjs commit \
            --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --head "$HEAD_SHA" \
            --root "$RUNNER_TEMP/pin-sync" --files "$FILES"

      - name: Emit origin for the published pin-sync head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          python3 policy/scripts/lanes/shipping_origin.py emit-automation \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"

      - name: Retain immutable origin payload
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipping-origin-v1
          path: ${{ runner.temp }}/shipping-origin/*.json
          if-no-files-found: ignore
          retention-days: 30
