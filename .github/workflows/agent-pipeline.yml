# Agent Pipeline
# JOV-INV-028: bounded failures remain in autonomous remediation.
#
# PURPOSE: Unified automation pipeline for agent-generated PRs. Handles both
# failure remediation (CI failures, CodeRabbit blocking reviews) and success
# auto-approval in a single workflow.
#
# REPLACES: agent-remediation.yml, auto-approve-agent-prs.yml, coderabbit-autofix.yml
#
# TRIGGERS:
# 1. CI failure on agent branches → fix job (Claude Code fixes)
# 2. CI PR Ready succeeds → approve job (auto-approve + queue handoff)
#
# NOTE: CodeRabbit blocking review trigger (pull_request_review) was removed
# because bot-submitted reviews create action_required runs that clog the
# CI queue. CodeRabbit fixes are now handled via issue_comment trigger
# when @claude is mentioned in a CodeRabbit review thread.
#
# SAFETY:
# - Runs only on the agent-branch allowlist in scripts/lib/agent-branch-pattern.mjs
# - Max 5 fix attempts per SHA to prevent infinite loops
# - Records bounded exhaustion to Slack/Linear while leaving the PR open for
#   the next automated remediation lease.
# - High-risk paths get stricter CI, not a human unattended-merge block
# - Uses least-privilege credentials
# - Does NOT execute untrusted PR code
# - Scope Judge was deleted in #14484; do not advertise or trigger on it
# - GStack comment artifacts are AgentOS telemetry, not auto-approve evidence

name: Agent Pipeline

on:
  # Trigger when CI completes. Scope Judge is retired and is not a producer.
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # NOTE: pull_request_review trigger removed — bot-submitted reviews
  # (CodeRabbit, Copilot) create action_required runs that block the CI
  # queue and consume runner slots. See comment at top of file.

permissions: {}

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: agent-pipeline-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # GUARD: Determine trigger type and validate all conditions
  # Routes to either the fix job or the approve job
  # ==========================================================================
  guard:
    name: Trigger Guard
    if: >-
      github.actor != 'copilot-swe-agent[bot]' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_fix: ${{ steps.evaluate.outputs.should_fix }}
      should_approve: ${{ steps.evaluate.outputs.should_approve }}
      trigger_type: ${{ steps.evaluate.outputs.trigger_type }}
      pr_number: ${{ steps.evaluate.outputs.pr_number }}
      pr_head_ref: ${{ steps.evaluate.outputs.pr_head_ref }}
      pr_head_sha: ${{ steps.evaluate.outputs.pr_head_sha }}
      attempt_number: ${{ steps.retry-guard.outputs.attempt_number }}
      error_context: ${{ steps.error-context.outputs.error_context }}
      is_systemic: ${{ steps.systemic-check.outputs.is_systemic }}
      systemic_checks: ${{ steps.systemic-check.outputs.systemic_checks }}
      retries_exhausted: ${{ steps.evaluate.outputs.retries_exhausted }}
    steps:
      - name: Determine trigger type and PR context
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          PR_REVIEW_USER: ${{ github.event.review.user.login }}
          PR_REVIEW_STATE: ${{ github.event.review.state }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          PR_HEAD_REF_EVENT: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA_EVENT: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT_EVENT: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          write_output() {
            printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          EVENT="$EVENT_NAME"

          if [[ "$EVENT" == "workflow_run" ]]; then
            if [[ "$CONCLUSION" == "failure" ]]; then
              echo "CI failed — routing to fix path"
              write_output "trigger_type=ci_failure"
            elif [[ "$CONCLUSION" == "success" ]]; then
              echo "$WORKFLOW_NAME succeeded — routing to approve path"
              write_output "trigger_type=approval_candidate"
            else
              echo "Workflow conclusion: $CONCLUSION. Skipping."
              write_output "should_continue=false"
              exit 0
            fi

            if [[ -z "$PR_NUMBER_RUN" ]]; then
              echo "Completed workflow is not associated with an open pull request. Skipping."
              write_output "should_continue=false"
              exit 0
            fi

            # Resolve the exact PR associated with this workflow run, then
            # compare its live head before authorizing any later mutation.
            PR_DATA=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER_RUN" \
              --jq '{number: .number, state: .state, head_ref: .head.ref, head_sha: .head.sha, draft: .draft, labels: [(.labels // [])[]?.name]}')

            if [[ -z "$PR_DATA" || "$PR_DATA" == "null" || "$(echo "$PR_DATA" | jq -r '.state')" != "open" ]]; then
              echo "No open PR found for workflow run. Skipping."
              write_output "should_continue=false"
              exit 0
            fi

            PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
            PR_HEAD_REF=$(echo "$PR_DATA" | jq -r '.head_ref')
            PR_HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head_sha')
            IS_DRAFT=$(echo "$PR_DATA" | jq -r '.draft')

            if [[ "$PR_HEAD_SHA" != "$HEAD_SHA" ]]; then
              echo "Workflow run head $HEAD_SHA is stale; live PR head is $PR_HEAD_SHA. Skipping."
              write_output "should_continue=false"
              exit 0
            fi

            write_output "pr_number=$PR_NUMBER"
            write_output "pr_head_ref=$PR_HEAD_REF"
            write_output "pr_head_sha=$PR_HEAD_SHA"
            write_output "is_draft=$IS_DRAFT"
            write_output "should_continue=true"

          elif [[ "$EVENT" == "pull_request_review" ]]; then
            REVIEWER="$PR_REVIEW_USER"
            STATE="$PR_REVIEW_STATE"

            if [[ "$REVIEWER" != "coderabbitai[bot]" ]]; then
              echo "Reviewer is not CodeRabbit (got: $REVIEWER). Skipping."
              write_output "should_continue=false"
              exit 0
            fi

            if [[ "$STATE" != "changes_requested" ]]; then
              echo "Review state is not blocking (got: $STATE). Skipping."
              write_output "should_continue=false"
              exit 0
            fi

            write_output "trigger_type=coderabbit_review"
            write_output "pr_number=$PR_NUMBER_EVENT"
            write_output "pr_head_ref=$PR_HEAD_REF_EVENT"
            write_output "pr_head_sha=$PR_HEAD_SHA_EVENT"
            write_output "is_draft=$PR_IS_DRAFT_EVENT"
            write_output "should_continue=true"
          fi

      - name: Checkout agent branch classifier
        if: steps.trigger.outputs.should_continue == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .nvmrc
            scripts/lib/agent-branch-pattern.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node for branch classifier
        if: steps.trigger.outputs.should_continue == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check agent branch pattern
        id: branch-check
        if: steps.trigger.outputs.should_continue == 'true'
        env:
          BRANCH: ${{ steps.trigger.outputs.pr_head_ref }}
        run: |
          echo "Branch: $BRANCH"

          # Allowlist is scripts/lib/agent-branch-pattern.mjs --match
          # (^(codex|codegen-bot|linear|claude)/ or ^[^/]+/jov-[0-9]+([_-].+)?$).
          # Concrete non-agent inputs that the old denylist misclassified:
          # hotfix/prod-outage, feat/billing-copy, fix/quality-agent-qc.
          if node scripts/lib/agent-branch-pattern.mjs --match "$BRANCH"; then
            echo "Agent branch detected"
            echo "is_agent_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not an allowlisted agent branch. Skipping."
            echo "is_agent_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check not draft
        id: draft-check
        if: steps.trigger.outputs.should_continue == 'true'
        run: |
          IS_DRAFT="${{ steps.trigger.outputs.is_draft }}"
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "PR is a draft. Skipping."
            echo "is_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout systemic detector
        if: >-
          steps.trigger.outputs.should_continue == 'true' &&
          steps.branch-check.outputs.is_agent_branch == 'true' &&
          steps.trigger.outputs.trigger_type == 'ci_failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .nvmrc
            .github/ci-harness/manifest.json
            .github/rulesets/branch-protection.yml
            scripts/lib/merge-queue-guard.mjs
            scripts/lib/pre-land-changelog.mjs
            scripts/lib/pr-check-failures.mjs
            scripts/lib/detect-systemic-failures.mjs
            scripts/version-fanout-guard.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        if: >-
          steps.trigger.outputs.should_continue == 'true' &&
          steps.branch-check.outputs.is_agent_branch == 'true' &&
          steps.trigger.outputs.trigger_type == 'ci_failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Detect systemic failures (fix path only)
        id: systemic-check
        if: >-
          steps.trigger.outputs.should_continue == 'true' &&
          steps.branch-check.outputs.is_agent_branch == 'true' &&
          (steps.trigger.outputs.trigger_type == 'ci_failure' || steps.trigger.outputs.trigger_type == 'coderabbit_review')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TRIGGER_TYPE="${{ steps.trigger.outputs.trigger_type }}"

          # Only check for systemic failures on CI failures (not CodeRabbit reviews)
          if [[ "$TRIGGER_TYPE" != "ci_failure" ]]; then
            echo "is_systemic=false" >> "$GITHUB_OUTPUT"
            echo "systemic_checks=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/lib/detect-systemic-failures.mjs \
            --repo "$REPO" \
            --pr "${{ steps.trigger.outputs.pr_number }}" \
            --threshold 3

      - name: Retry guard (fix path only, max 5 attempts per SHA)
        id: retry-guard
        if: >-
          steps.trigger.outputs.should_continue == 'true' &&
          steps.branch-check.outputs.is_agent_branch == 'true' &&
          steps.systemic-check.outputs.is_systemic != 'true' &&
          (steps.trigger.outputs.trigger_type == 'ci_failure' || steps.trigger.outputs.trigger_type == 'coderabbit_review')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.trigger.outputs.pr_number }}"
          HEAD_SHA="${{ steps.trigger.outputs.pr_head_sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          TRIGGER_TYPE="${{ steps.trigger.outputs.trigger_type }}"
          PREFIX="agent-fix-${TRIGGER_TYPE}-${SHORT_SHA}"

          LABELS=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/labels --jq '.[].name')

          HAS_5=$(echo "$LABELS" | grep -c "^${PREFIX}-5$" || true)
          HAS_4=$(echo "$LABELS" | grep -c "^${PREFIX}-4$" || true)
          HAS_3=$(echo "$LABELS" | grep -c "^${PREFIX}-3$" || true)
          HAS_2=$(echo "$LABELS" | grep -c "^${PREFIX}-2$" || true)
          HAS_1=$(echo "$LABELS" | grep -c "^${PREFIX}-1$" || true)

          if [[ "$HAS_5" -gt 0 ]]; then
            echo "SHA $SHORT_SHA has exhausted retries (5/5) for $TRIGGER_TYPE"
            echo "retries_available=false" >> "$GITHUB_OUTPUT"
            echo "attempt_number=0" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_4" -gt 0 ]]; then
            echo "SHA $SHORT_SHA on attempt 5/5 (final) for $TRIGGER_TYPE"
            echo "retries_available=true" >> "$GITHUB_OUTPUT"
            echo "attempt_number=5" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_3" -gt 0 ]]; then
            echo "SHA $SHORT_SHA on attempt 4/5 for $TRIGGER_TYPE"
            echo "retries_available=true" >> "$GITHUB_OUTPUT"
            echo "attempt_number=4" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_2" -gt 0 ]]; then
            echo "SHA $SHORT_SHA on attempt 3/5 for $TRIGGER_TYPE"
            echo "retries_available=true" >> "$GITHUB_OUTPUT"
            echo "attempt_number=3" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_1" -gt 0 ]]; then
            echo "SHA $SHORT_SHA on attempt 2/5 for $TRIGGER_TYPE"
            echo "retries_available=true" >> "$GITHUB_OUTPUT"
            echo "attempt_number=2" >> "$GITHUB_OUTPUT"
          else
            echo "SHA $SHORT_SHA on attempt 1/5 for $TRIGGER_TYPE"
            echo "retries_available=true" >> "$GITHUB_OUTPUT"
            echo "attempt_number=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract error context (fix path only)
        id: error-context
        if: >-
          steps.trigger.outputs.should_continue == 'true' &&
          steps.branch-check.outputs.is_agent_branch == 'true' &&
          steps.systemic-check.outputs.is_systemic != 'true' &&
          steps.retry-guard.outputs.retries_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRIGGER_TYPE="${{ steps.trigger.outputs.trigger_type }}"
          PR_NUMBER="${{ steps.trigger.outputs.pr_number }}"

          if [[ "$TRIGGER_TYPE" == "ci_failure" ]]; then
            # Extract failed job names and annotations from the CI run
            RUN_ID="${{ github.event.workflow_run.id }}"

            FAILED_JOBS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs \
              --jq '[.jobs[] | select(.conclusion == "failure") | {name: .name, steps: [.steps[] | select(.conclusion == "failure") | .name]}] | tostring')

            # Get annotations (error messages) from the failed run
            ANNOTATIONS=$(gh api repos/${{ github.repository }}/check-runs \
              --method GET \
              -f "check_suite_id=${{ github.event.workflow_run.check_suite_id }}" \
              --jq '[.check_runs[] | select(.conclusion == "failure") | {name: .name, output: .output.summary}] | .[0:5] | tostring' 2>/dev/null || echo "[]")

            ERROR_CONTEXT=$(cat <<ERREOF
          ## CI Failure Context

          **Failed Jobs:** $FAILED_JOBS

          **Error Annotations:** $ANNOTATIONS

          Fix the CI failures above. Focus on:
          1. TypeScript type errors (run pnpm turbo typecheck)
          2. Biome lint/format errors (run pnpm biome check . --write then pnpm biome check .)
          3. Unit test failures (run pnpm --filter=@jovie/web vitest run --config=vitest.config.mts)
          4. ESLint server boundary violations (run pnpm --filter=@jovie/web lint:server-boundaries)
          5. Knip dead code detection (run pnpm knip)
          ERREOF
          )

          elif [[ "$TRIGGER_TYPE" == "coderabbit_review" ]]; then
            REVIEW_ID="${{ github.event.review.id }}"
            REVIEW_BODY=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews/$REVIEW_ID --jq '.body // ""')
            INLINE_COMMENTS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments \
              --jq '[.[] | {path: .path, line: .line, body: .body}]')

            ERROR_CONTEXT=$(cat <<ERREOF
          ## CodeRabbit Review Feedback

          **Review Summary:**
          $REVIEW_BODY

          **Inline Comments:**
          $(echo "$INLINE_COMMENTS" | jq -r '.[] | "- **\(.path):\(.line)**: \(.body)"')

          Fix ONLY the issues described above. Do not make any other changes.
          ERREOF
          )
          fi

          # Base64 encode to handle multiline safely
          echo "error_context=$(echo "$ERROR_CONTEXT" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Evaluate all guards
        id: evaluate
        env:
          SHOULD_CONTINUE: ${{ steps.trigger.outputs.should_continue }}
          IS_AGENT: ${{ steps.branch-check.outputs.is_agent_branch }}
          IS_READY: ${{ steps.draft-check.outputs.is_ready }}
          RETRIES: ${{ steps.retry-guard.outputs.retries_available }}
          IS_SYSTEMIC: ${{ steps.systemic-check.outputs.is_systemic }}
          TRIGGER_TYPE: ${{ steps.trigger.outputs.trigger_type }}
          PR_NUMBER: ${{ steps.trigger.outputs.pr_number }}
          PR_HEAD_REF: ${{ steps.trigger.outputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ steps.trigger.outputs.pr_head_sha }}
        run: |
          write_output() {
            printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          echo "=== Guard Summary ==="
          echo "Should continue: $SHOULD_CONTINUE"
          echo "Is agent branch: $IS_AGENT"
          echo "Is ready (not draft): $IS_READY"
          echo "Is systemic blocker: $IS_SYSTEMIC"
          echo "Trigger type: $TRIGGER_TYPE"

          SHOULD_FIX="false"
          SHOULD_APPROVE="false"
          RETRIES_EXHAUSTED="false"

          if [[ "$SHOULD_CONTINUE" != "true" || "$IS_AGENT" != "true" || "$IS_READY" != "true" ]]; then
            echo "Basic guards failed"
          elif [[ "$IS_SYSTEMIC" == "true" ]]; then
            echo "Systemic blocker detected. Skipping individual fix — merge-queue-autoenroll will rebase stale PRs."
          elif [[ "$TRIGGER_TYPE" == "ci_failure" || "$TRIGGER_TYPE" == "coderabbit_review" ]]; then
            if [[ "$RETRIES" == "true" ]]; then
              SHOULD_FIX="true"
              echo "Routing to fix path"
            else
              echo "Retries exhausted for fix path"
              RETRIES_EXHAUSTED="true"
            fi
          elif [[ "$TRIGGER_TYPE" == "approval_candidate" ]]; then
            SHOULD_APPROVE="true"
            echo "Routing to approve path"
          fi

          write_output "should_fix=$SHOULD_FIX"
          write_output "should_approve=$SHOULD_APPROVE"
          write_output "retries_exhausted=$RETRIES_EXHAUSTED"
          write_output "trigger_type=$TRIGGER_TYPE"
          write_output "pr_number=$PR_NUMBER"
          write_output "pr_head_ref=$PR_HEAD_REF"
          write_output "pr_head_sha=$PR_HEAD_SHA"

  # ==========================================================================
  # SYSTEMIC REPORT: Label and comment on PRs blocked by systemic failures
  # Separate job with write permissions (guard job is read-only)
  # ==========================================================================
  systemic-report:
    name: Label Systemic Blocker
    needs: guard
    if: needs.guard.outputs.is_systemic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/lib/upsert-pr-comment.sh
          sparse-checkout-cone-mode: false

      - name: Label and comment systemic blocker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          SYSTEMIC: ${{ needs.guard.outputs.systemic_checks }}
        run: |
          gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" \
            --method POST \
            --field "labels[]=systemic-blocker" || true

          bash scripts/lib/upsert-pr-comment.sh "$PR_NUMBER" "systemic-ci-blocker" "## Systemic CI Blocker Detected

          This PR's CI failures appear to be systemic (same required checks failing on 3+ open agent PRs):

          \`\`\`
          $SYSTEMIC
          \`\`\`

          **Skipping individual code-fix attempts.** These failures likely originated on \`main\`.

          **Automated remediation:** Event-driven \`merge-queue-autoenroll\` re-evaluates mergeable agent PRs and can rebase them onto latest \`main\` (\`scripts/drain-pr-remediate.mjs\`) to re-trigger CI. If checks stay red after that rebase, fix \`main\` first or address branch-specific failures manually."

  # ==========================================================================
  # FIX: Apply fixes using Claude agent (CI failure or CodeRabbit review)
  # ==========================================================================
  fix:
    name: Apply Fixes (${{ needs.guard.outputs.trigger_type }})
    needs: guard
    if: needs.guard.outputs.should_fix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-remediation-${{ github.repository }}-${{ needs.guard.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Validate PR is not from a fork
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER="${{ needs.guard.outputs.pr_number }}"
          IS_FORK=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.head.repo.fork // false')
          SAME_REPO=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.head.repo.full_name == .base.repo.full_name')

          if [[ "$IS_FORK" == "true" || "$SAME_REPO" != "true" ]]; then
            echo "PR is from a fork or different repo. Refusing to run remediation."
            exit 1
          fi
          echo "PR is from the same repository. Proceeding."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/lib/upsert-pr-comment.sh
          sparse-checkout-cone-mode: false

      - name: Record bounded remediation attempt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          TRIGGER_TYPE: ${{ needs.guard.outputs.trigger_type }}
          ATTEMPT: ${{ needs.guard.outputs.attempt_number }}
          HEAD_SHA: ${{ needs.guard.outputs.pr_head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          ATTEMPT_LABEL="agent-fix-${TRIGGER_TYPE}-${SHORT_SHA}-${ATTEMPT}"
          gh label create "$ATTEMPT_LABEL" --repo "$REPOSITORY" \
            --color D4C5F9 \
            --description "Bounded Agent Pipeline remediation attempt" 2>/dev/null || true
          gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" \
            --method POST \
            --field "labels[]=$ATTEMPT_LABEL" >/dev/null

      - name: Queue automated stale-CI remediation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          TRIGGER_TYPE: ${{ needs.guard.outputs.trigger_type }}
          ATTEMPT: ${{ needs.guard.outputs.attempt_number }}
        run: |
          bash scripts/lib/upsert-pr-comment.sh "$PR_NUMBER" "agent-remediation-queued" "## Stale CI Remediation Queued

          Privileged workflow execution is intentionally restricted for security — this job does not check out or execute PR branch code.

          **Automated next step:** Event-driven \`merge-queue-autoenroll\` can mechanically rebase mergeable agent branches onto latest \`main\` via \`scripts/drain-pr-remediate.mjs\`, then re-evaluate native queue enrollment. That re-triggers CI when failures were fixed on \`main\`.

          **Attempt:** $ATTEMPT/5 (**trigger:** $TRIGGER_TYPE). If checks remain red after the auto-rebase, branch-specific code fixes are still required (coder agent or human)."
      - name: Clean up stale attempt labels
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUMBER="${{ needs.guard.outputs.pr_number }}"
          HEAD_SHA="${{ needs.guard.outputs.pr_head_sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"

          LABELS=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' 2>/dev/null || echo "")

          echo "$LABELS" | grep "^agent-fix-" | while read -r label; do
            if [[ ! "$label" =~ $SHORT_SHA ]]; then
              echo "Removing stale label: $label"
              gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels/$label" --method DELETE || true
            fi
          done

  # ==========================================================================
  # APPROVE: Auto-approve and hand passing agent PRs to the queue controller
  # ==========================================================================
  # Successful CI does not manufacture review or merge intent. The owning agent
  # completes review/qualification and runs pnpm ship:merge with its exact SHA.
  # Native GitHub stores intent; this workflow retains bounded failure repair.
  exhaust:
    name: Escalate Exhausted Agent PR
    needs: guard
    if: needs.guard.outputs.retries_exhausted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Generate Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Record exhaustion and notify durable channels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          BRANCH: ${{ needs.guard.outputs.pr_head_ref }}
        run: |
          set -euo pipefail
          TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title // ""')
          PR_URL="https://github.com/$GH_REPO/pull/$PR_NUMBER"
          REASON="Agent pipeline exhausted this bounded 5-attempt lease. The failing machine gate remains authoritative and Symphony may start a fresh remediation lease."

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            PAYLOAD=$(jq -n --arg pr "$PR_URL" --arg branch "$BRANCH" --arg title "$TITLE" --arg reason "$REASON" '{
              text: "Agent PR retry budget exhausted",
              attachments: [{
                color: "warning",
                fields: [
                  { title: "PR", value: $pr, short: false },
                  { title: "Branch", value: $branch, short: true },
                  { title: "Title", value: $title, short: false },
                  { title: "Reason", value: $reason, short: false }
                ]
              }]
            }')
            curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
          fi

          LINEAR_ID=$(printf '%s\n%s\n' "$BRANCH" "$TITLE" | grep -oiE 'jov-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -n "${LINEAR_API_KEY:-}" ] && [ -n "$LINEAR_ID" ]; then
            ISSUE_ID=$(curl -sS https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg issueId "$LINEAR_ID" '{
                query: "query($issueId: String!) { issue(id: $issueId) { id identifier } }",
                variables: { issueId: $issueId }
              }')" | jq -r '.data.issue.id // empty')
            if [ -n "$ISSUE_ID" ]; then
              BODY="Agent pipeline exhausted one bounded retry lease on [$TITLE]($PR_URL) (\`$BRANCH\`). The failing machine gate remains authoritative; Symphony may start a fresh remediation lease."
              curl -sS https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg issueId "$ISSUE_ID" --arg body "$BODY" '{
                  query: "mutation($issueId: String!, $body: String!) { commentCreate(input: { issueId: $issueId, body: $body }) { success } }",
                  variables: { issueId: $issueId, body: $body }
                }')" >/dev/null || true
            fi
          fi

          gh pr comment "$PR_NUMBER" --body "## Agent pipeline exhausted retries

          $REASON

          Durable routing: Slack (if configured) and Linear \`$LINEAR_ID\` (if found). The PR stays open for the next automated remediation lease." || true
