name: Controller Quota Replay
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Shipping-Control
# necessary-trust-boundary: GitHub Actions cannot retry a workflow_run-triggered controller after a transient failure; this hop reruns only the failed jobs of the newest failed Staging/Production Controller run, so the controllers' own lineage, lease and authorization gates decide again against current main.
# removal-trigger: Remove when the controllers retry their own GitHub reads across a quota reset, or GitHub offers native retry for workflow_run consumers.

# 2026-10-21 08:05-09:23Z: GitHub App installation quota ran out. A Production
# Controller recorded a false supersession and the successor's Staging
# Controller failed authorize-staging ("API rate limit exceeded for
# installation"). Nothing replayed either run (production-controller-health
# only runs daily), so jov.ie stayed on 51dad18 until the next merge.
#
# This reacts to the controller's completion event, no clock. It reruns only
# a transient failure (quota, GitHub 5xx, network, runner loss) of the newest
# run of that controller, while production lags main, at most until the
# controller reaches attempt 3. It waits once for the token's quota reset (or
# 2^(attempt-1) x 120s backoff, whichever is longer), the same bounded hold
# as .github/scripts/gh-api-hold.sh, and never polls. Each decision is a
# jovie-stage-event/v1 row (entity release-replay) in the run's artifact.
on:
  workflow_run:
    workflows: ['Staging Controller', 'Production Controller']
    types: [completed]

permissions:
  contents: read

jobs:
  replay:
    name: Replay transient controller failure
    # Cheap filter before a runner is used: failures on main below the cap.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    concurrency:
      group: controller-quota-replay-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/controller-quota-replay.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with: {node-version: 24.22.1}
      - name: Decide and replay
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_EVENTS_PATH: ${{ runner.temp }}/release-replay-receipts/stage-events.ndjson
        run: node .github/scripts/controller-quota-replay.mjs
      - name: Upload release-replay stage events
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-replay-receipts
          path: ${{ runner.temp }}/release-replay-receipts/
          if-no-files-found: warn
          retention-days: 30
