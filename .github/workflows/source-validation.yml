name: Source Validation
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: GitHub re-runs pull_request workflows on PR body/title edits and offers no native reuse of the same head's checks; one read-only run lookup per job reuses the exact-head proof.
# removal-trigger: Remove the lookup when body-dependent decisions leave Source Validation or GitHub stops re-running pull_request workflows on metadata-only edits.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, 'integration/**']
permissions:
  contents: read
concurrency:
  # A synchronize and body/base edit can arrive together on the same head.
  # Canceling the newer suite leaves admission blocked even if its peer passes.
  # Retain every validation receipt; a new source head has its own queue.
  group: source-validation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
  queue: max
jobs:
  deterministic:
    name: Source Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # A PR body/title edit re-runs this workflow at an unchanged head and
      # base. 262 of 303 same-head reruns on 2026-10-03 were body edits. When
      # the newest completed earlier run for this exact head and branch
      # succeeded, its proof still holds: only body-dependent decisions (the
      # customer changelog guard) are re-proven. A base retarget, a failed or
      # cancelled predecessor, or an unreadable run list runs everything.
      - &proof-reuse
        name: Reuse exact-head proof for a metadata-only edit
        id: reuse
        if: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          reuse=false proof=''
          if [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[1-9][0-9]*$ ]] &&
            runs="$(gh api "repos/$REPOSITORY/actions/workflows/source-validation.yml/runs?head_sha=$HEAD_SHA&event=pull_request&status=completed&per_page=100")"; then
            proof="$(jq -r --arg sha "$HEAD_SHA" --arg ref "$HEAD_REF" --argjson run "$RUN_ID" '
              [.workflow_runs[]
                | select(.id < $run and .head_sha == $sha and .head_branch == $ref
                  and .path == ".github/workflows/source-validation.yml")]
              | sort_by(.id) | last
              | select(.conclusion == "success") | .id' <<<"$runs" 2>/dev/null || true)"
          fi
          if [[ "$proof" =~ ^[1-9][0-9]*$ ]]; then
            reuse=true
            echo "::notice::Metadata-only edit at $HEAD_SHA reuses Source Validation run $proof."
          fi
          printf 'reuse=%s\nproof_run=%s\n' "$reuse" "$proof" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Merge bases need full commit history, not every historical blob:
          # with 7,477 branches the full fetch was this job's slowest setup
          # step (p50 47s, p90 57s). Blobless history is ~34 MB for main;
          # the head's blobs arrive with the checkout and the few trusted-base
          # blobs a guard reads are fetched on demand from the public origin.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Validate performance policy source bindings
        run: node scripts/invariants/performance-factory.mjs
      - name: Measure actual installed source dependency graph
        env:
          DEPENDENCY_PARITY_RECEIPT_DIR: ${{ runner.temp }}/jovie-dependency-parity
        run: node .github/scripts/dependency-parity-evidence.mjs write
      - name: Preserve exact source dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/jovie-dependency-parity/dep-digest.json
          if-no-files-found: error
          retention-days: 14
      # component-ship-gate's live-storybook-cert launches Chromium when the
      # diff touches in-scope UI components; without browsers the gate fails
      # closed before any story is measured. The disk-read source contracts
      # below also run on a metadata-only edit, and their script-contracts
      # guard selects every PR and can run Chromium tests
      # (component-rendered-evaluator). Gating this step on reuse failed those
      # edits with "Executable doesn't exist" (#21956, #21946, #21774, #21725),
      # so it carries the same (absent) condition as that step.
      - name: Setup Playwright (Chromium)
        uses: ./.github/actions/setup-playwright
      - name: Validate customer changelog decision from trusted base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          trusted_ref="$(git rev-parse 'origin/${{ github.base_ref }}^{commit}')"
          guard_root="$(mktemp -d "$RUNNER_TEMP/changelog-source-guard.XXXXXX")"
          trap 'rm -rf "$guard_root"' EXIT
          git archive "$trusted_ref" scripts | tar -x -C "$guard_root"
          node "$guard_root/scripts/changelog-source-guard.mjs"
      - name: Validate disk-read source contracts from trusted base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          trusted_ref="$(git rev-parse 'origin/${{ github.base_ref }}^{commit}')"
          guard_root="$(mktemp -d "$RUNNER_TEMP/source-read-guard.XXXXXX")"
          trap 'rm -rf "$guard_root"' EXIT
          git archive "$trusted_ref" scripts | tar -x -C "$guard_root"
          export SOURCE_GUARD_MODULE="$guard_root/scripts/ci-fast-lanes.mjs"
          node --input-type=module -e '
            import { spawnSync } from "node:child_process";
            const { selectSourceGuards, listAllChangedFiles } = await import(process.env.SOURCE_GUARD_MODULE);
            const guards = selectSourceGuards(process.env.GITHUB_EVENT_NAME, listAllChangedFiles(process.cwd()));
            let exitCode = 0;
            for (const guard of guards) {
              const result = spawnSync(guard.command, { shell: true, cwd: process.cwd(), stdio: "inherit" });
              const code = result.status ?? 1;
              console.log(`[source-guards] ${guard.id}: exit ${code}`);
              if (code !== 0 && exitCode === 0) exitCode = code;
            }
            process.exitCode = exitCode;
          '
      - name: Check agent-context size after merge onto base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          trusted_ref="$(git rev-parse 'origin/${{ github.base_ref }}^{commit}')"
          guard_root="$(mktemp -d "$RUNNER_TEMP/agent-context-guard.XXXXXX")"
          trap 'rm -rf "$guard_root"' EXIT
          git archive "$trusted_ref" scripts/agent-context | tar -x -C "$guard_root"
          node "$guard_root/scripts/agent-context/merge-budget.mjs" --base "$trusted_ref" --head "$EXPECTED_HEAD"
      # CI Risk Classifier runs these only on merge_group (ci.yml has no
      # pull_request trigger). #21997 was green here and red in the queue:
      # check.test.mjs design extraction. The suite is about a second and
      # dependency-free, so it runs on every pull_request instead of a path
      # filter that can miss a file the test reads. This job already checked
      # out the full tree and installed Node; a sparse list omitted an import
      # before (ERR_MODULE_NOT_FOUND) and a second pnpm install spends the
      # installation quota. The merge-group step stays unconditional.
      - name: Evaluate repository instruction contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --run agent-context:check
          node --run agent-context:test
      - name: Validate UI interaction source from trusted base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$BASE_BRANCH"
          trusted_ref="$(git rev-parse --verify "refs/remotes/origin/$BASE_BRANCH^{commit}")"
          guard_root="$(mktemp -d "$RUNNER_TEMP/ui-interaction-guard.XXXXXX")"
          trap 'rm -rf "$guard_root"' EXIT
          git archive "$trusted_ref" scripts/design-frontend-skill-check.mjs | tar -x -C "$guard_root"
          node "$guard_root/scripts/design-frontend-skill-check.mjs" --diff-base "$trusted_ref"
      # The merge group's Path Changes job runs this trusted classifier and
      # fails PR Ready on any path no lane rule maps, ejecting the whole group.
      # Run the same classifier here so the PR fails before enqueue instead.
      - name: Classify product lanes with the trusted base classifier
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$BASE_BRANCH"
          trusted_ref="$(git rev-parse --verify "refs/remotes/origin/$BASE_BRANCH^{commit}")"
          base_sha="$(git merge-base "$trusted_ref" HEAD)"
          lane_dir="$(mktemp -d "$RUNNER_TEMP/product-lane-classification.XXXXXX")"
          trap 'rm -rf "$lane_dir"' EXIT
          git diff --name-only "$base_sha" HEAD > "$lane_dir/changed-paths.txt"
          git show "$trusted_ref:scripts/lib/product-lane-classifier.mjs" \
            > "$lane_dir/product-lane-classifier.mjs"
          node "$lane_dir/product-lane-classifier.mjs" \
            --files-from "$lane_dir/changed-paths.txt" \
            --base-ref "$base_sha" \
            --head-ref HEAD \
            --json-out "$lane_dir/receipt.json"
          # The classifier only runs when invoked as its own entry point; a
          # missing receipt means it never ran, which must not read as a pass.
          test -s "$lane_dir/receipt.json"
      - name: Run deterministic source contract
        if: steps.reuse.outputs.reuse != 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/verify-workflow-references.mjs
          node scripts/workflow-token-scope.mjs
          node --test scripts/workflow-token-scope.test.mjs
          node scripts/lockfile-specifier-preflight.mjs
          node scripts/ci-release-incident-contract.mjs
          pnpm ci:harness:check
          # The web test and story tsc programs (100s + 66s) ran after the
          # workspace typecheck (112s), serially, in this step (PR p50 7.6m).
          # They share no tsbuildinfo, so they run alongside it under their
          # own singleflight lock; any failure still fails this step.
          web_types_log="$(mktemp)"
          (
            TYPECHECK_SINGLEFLIGHT_DIR="$(mktemp -d)"
            export TYPECHECK_SINGLEFLIGHT_DIR
            pnpm --filter @jovie/web run typecheck:tests
            pnpm --filter @jovie/web run typecheck:stories
          ) > "$web_types_log" 2>&1 &
          web_types_pid=$!
          pnpm typecheck
          pnpm run typecheck:scripts
          web_types_status=0
          wait "$web_types_pid" || web_types_status=$?
          cat "$web_types_log"
          test "$web_types_status" -eq 0 || exit "$web_types_status"
          pnpm biome:check
          ESLINT_CHANGED_BASE="origin/${{ github.base_ref }}" pnpm --filter @jovie/web run lint:eslint:changed
          pnpm --filter @jovie/web run lint:motion-css
          pnpm component-ship-gate
          pnpm screen-registration-gate
          pnpm --filter @jovie/web exec vitest run --config=vitest.config.mts tests/unit/design-system/mac-header-two-lines-v1.test.ts tests/unit/marketing/marketing-headline-line-clamp-guard.test.ts
          pnpm ci:control:test
      # The merge group's ci-fast runs the same path-aware shadcn baseline
      # probe; Source Validation previously skipped it, so a restyle that fit
      # a PR's diff still ejected the whole merge group (group 36902907269,
      # shadcn/no-restyle 65 > baseline 63). Run it here against the pinned
      # event head and merge base so the regression fails before enqueue.
      # Non-web diffs exit before the ESLint module load.
      - name: Lint changed web files against the shadcn baseline
        if: steps.reuse.outputs.reuse != 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" "$EXPECTED_HEAD")"
          SHADCN_LINT_DIFF_BASE="$base_sha" \
            pnpm --filter @jovie/web exec node eslint-rules/__tests__/shadcn-lint-changed.mjs
      - name: Verify changed CLI publication behavior
        if: steps.reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base 'origin/${{ github.base_ref }}' HEAD)"
          # The CLI and every public API route it calls (JOV-7714): a route
          # change can break the CLI's error contract as surely as a CLI edit.
          changed_cli="$(git diff --name-only "$base_sha" HEAD -- \
            packages/jovie-cli \
            .github/workflows/npm-publish.yml \
            .github/workflows/cli-chaos-nightly.yml \
            .github/workflows/source-validation.yml \
            ':(literal)apps/web/app/api/v1/[username]' \
            apps/web/app/api/v1/openapi.json \
            apps/web/app/api/v1/actions \
            apps/web/app/api/agents \
            apps/web/app/llms.txt \
            apps/web/app/llms-full.txt \
            ':(literal)apps/web/app/[username]/llms.txt' \
            apps/web/lib/api/v1)"
          if [ -n "$changed_cli" ]; then
            pnpm --filter @jovie/cli run test:coverage
            pnpm --filter @jovie/cli run typecheck
            pnpm --filter @jovie/cli run build
            pnpm --filter @jovie/cli run pack:dry
            pnpm --filter @jovie/cli run chaos:gate
          fi
  security:
    name: Security Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - *proof-reuse
      # TruffleHog reads the object store directly and cannot use a partial
      # clone (#13994), so this job keeps the full-blob history fetch.
      - if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &reused-setup
        if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/setup-node-pnpm
      - name: Scan the exact source diff
        if: steps.reuse.outputs.reuse != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SECURITY_GATE_ENABLED: ${{ vars.SECURITY_GATE_ENABLED }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          ./scripts/security/scan-secrets.sh ci-pr "$base_sha"
          ./scripts/security/verify-gitleaks-coverage.sh
          node scripts/golden-path-lock.mjs merge-gate
          git diff --name-only "$base_sha" HEAD > "$RUNNER_TEMP/security-gate-files.txt"
          node scripts/security/security-gate.mjs --changed-files "$RUNNER_TEMP/security-gate-files.txt"
  migration:
    name: Migration Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - *proof-reuse
      - &reused-checkout
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - *reused-setup
      - name: Validate changed migration surfaces
        if: steps.reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          if git diff --quiet "$base_sha"...HEAD -- apps/web/drizzle apps/web/scripts/check-migrations.sh apps/web/scripts/validate-migrations.sh apps/web/scripts/online-index-migrate.ts; then
            echo 'No migration surface changed; non-applicable receipt recorded.'
            exit 0
          fi
          cd apps/web
          ./scripts/check-migrations.sh
          ./scripts/validate-migrations.sh
          pnpm exec tsx scripts/online-index-migrate.ts --validate-only
  coverage:
    name: Exact-head Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - *proof-reuse
      - *reused-checkout
      - *reused-setup
      - name: Run changed-behavior coverage ratchet
        if: steps.reuse.outputs.reuse != 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          plan="$(node scripts/check-changed-test-coverage.mjs --base "$base_sha" --head "$EXPECTED_HEAD" --plan)"
          if [ "$(jq -r '.applicable' <<<"$plan")" != true ]; then
            echo 'No coverable web product source; non-applicable receipt recorded.'
            exit 0
          fi
          JOVIE_COVERAGE_INCLUDE="$(jq -r '.coverageInclude // [] | .[]' <<<"$plan")"
          JOVIE_COVERAGE_RELATED_TESTS="$(jq -r '.relatedTests[]?' <<<"$plan")"
          export JOVIE_COVERAGE_INCLUDE JOVIE_COVERAGE_RELATED_TESTS
          pnpm --filter @jovie/web test:coverage --changed "$base_sha" --bail 1
          node scripts/check-changed-test-coverage.mjs --base "$base_sha" --head "$EXPECTED_HEAD" --coverage apps/web/coverage/coverage-final.json
      # Route JS budgets and SEO certification read a finished `next build`,
      # so until now only the merge group's Build + Layout ran them. They were
      # the top merge-group-only ejection: 61 group runs across 22 PRs in the
      # 7 days to 2026-10-12 (/app/admin/* a few KB over), plus 6 from
      # seo:certify. Run the same build and checks here when the diff can
      # change build output, so the PR fails before enqueue; the merge-group
      # job stays. Coverage plus this build still finishes inside Source
      # Validation's wall time, so it adds no PR latency and no check record.
      - name: Select build-affecting diff
        id: scope
        if: steps.reuse.outputs.reuse != 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          if git diff --quiet "$base_sha" HEAD -- \
            apps/web packages pnpm-lock.yaml package.json turbo.json \
            ':(exclude,glob)apps/web/tests/**' \
            ':(exclude,glob)**/__tests__/**' \
            ':(exclude,glob)**/*.test.*' \
            ':(exclude,glob)**/*.spec.*' \
            ':(exclude,glob)**/*.stories.*'; then
            echo 'No build-affecting source changed; non-applicable receipt recorded.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Next build cache hour
        id: next-build-cache-hour
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.build == 'true'
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      # Same read-only restore of next-build-cache-warm.yml's main entry as
      # the merge group's Build + Layout; PR code never writes it.
      - name: Restore Next build cache (read-only)
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache/turbopack
          key: ${{ runner.os }}-next-build-web-v1-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json', 'apps/web/next.config.js') }}-${{ steps.next-build-cache-hour.outputs.hour }}
          restore-keys: |
            ${{ runner.os }}-next-build-web-v1-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json', 'apps/web/next.config.js') }}-
            ${{ runner.os }}-next-build-web-v1-
      - name: Build exact PR head
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.build == 'true'
        run: pnpm turbo build --filter=@jovie/web
        env:
          TURBO_ENGINE_READ_ONLY: '1'
          TURBO_CACHE: local:r
          # Same public mock environment as the merge group's Build + Layout,
          # so both measure identical bundles without secrets.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXktdGVzdC1jb3ZlcmFnZS5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_APP_URL: http://localhost:3230
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3230
          NEXT_PUBLIC_CLERK_MOCK: '1'
          NEXT_PUBLIC_CLERK_PROXY_DISABLED: '1'
          NEXT_PUBLIC_E2E_MODE: '1'
          NEXT_IGNORE_ESLINT: '1'
          NEXT_IGNORE_TYPECHECK: '1'
          NEXT_PRIVATE_SKIP_SIZE_CHECK: 'true'
      - name: Enforce authed route initial JS budgets
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.build == 'true'
        run: node apps/web/scripts/route-js-budget.mjs --next-dir apps/web/.next
      - name: Certify marketing SEO against prerendered HTML
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.build == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm --filter @jovie/web seo:certify --sha "$EXPECTED_HEAD" --run-ref "pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
  # Shift-left (JOV-6834). Unit tests ran only on the merge-group head, so a
  # PR-local defect was first caught in the queue: 168 of 307 merge-group
  # failures in the 7 days to 2026-10-20 were fixed by a later PR commit, 44
  # of them in Unit Tests (71 ejections across 27 of the 45 PRs merged in
  # 48 h). This runs the merge-group shard command against the exact PR head,
  # limited by `--changed` to tests whose module graph reaches the diff. The
  # merge-group Unit Tests job stays: it validates the combined head, which
  # differed from the PR head for 92 of 103 sampled merges.
  unit:
    name: Affected Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      # Every shard is a required source proof; the first red one suffices.
      fail-fast: true
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - *proof-reuse
      - *reused-checkout
      - name: Select unit-affecting diff
        id: scope
        if: steps.reuse.outputs.reuse != 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          changed() { ! git diff --quiet "$base_sha" HEAD -- "$@"; }
          web=false; ui=false; ovie=false; ci=false
          # Web unit tests also import scripts/ and .github/ modules, so
          # those paths select their related tests too.
          if changed apps/web packages pnpm-lock.yaml package.json turbo.json scripts .github; then web=true; fi
          if changed packages/ui; then ui=true; fi
          if changed apps/ovie; then ovie=true; fi
          # tests/unit/ci read workflow YAML and scripts from disk, outside
          # the module graph `--changed` follows: run that suite whole.
          if changed scripts .github; then ci=true; fi
          printf 'web=%s\nui=%s\novie=%s\nci=%s\n' "$web" "$ui" "$ovie" "$ci" >> "$GITHUB_OUTPUT"
          if [[ "$web$ui$ovie" == 'falsefalsefalse' ]]; then
            echo 'No unit-affecting source changed; non-applicable receipt recorded.'
          fi
      - name: Setup Node.js and pnpm
        if: steps.reuse.outputs.reuse != 'true' && (steps.scope.outputs.web == 'true' || steps.scope.outputs.ui == 'true' || steps.scope.outputs.ovie == 'true')
        uses: ./.github/actions/setup-node-pnpm
      - name: Setup Playwright warm path
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.web == 'true'
        uses: ./.github/actions/setup-playwright
      - name: Load quarantined unit tests
        id: quarantine
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.web == 'true'
        run: node .github/scripts/quarantine-ledger.mjs emit-github-output
      - name: Run web unit tests related to the exact PR diff
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.web == 'true'
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          BASE_SHA: ${{ steps.scope.outputs.base }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=3072"
          # Same fast config, pool and quarantine as the merge-group shards;
          # `--changed` keeps only tests whose module graph reaches the diff.
          pnpm --filter @jovie/web test:fast -- \
            --pool=forks --maxWorkers="$(nproc)" --fileParallelism \
            --retry=${{ steps.quarantine.outputs.unit_default_retries }} \
            --changed "$BASE_SHA" --passWithNoTests \
            --shard=${{ matrix.shard }} ${{ steps.quarantine.outputs.unit_excludes }}
      - name: Run CI contract tests read from disk
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.ci == 'true' && matrix.shard == '3/4'
        run: |
          set -euo pipefail
          # Same command and quarantine as the merge group's structural web lane.
          command="$(node -e "import('./scripts/ci-fast-lanes.mjs').then(m => process.stdout.write(m.webCiContractTestsCommand()))")"
          bash -c "$command"
      - name: Run packages/ui unit tests
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.ui == 'true' && matrix.shard == '1/4'
        run: pnpm turbo test --filter=@jovie/ui
      - name: Run Ovie route and private-boundary coverage
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.ovie == 'true' && matrix.shard == '2/4'
        run: pnpm --filter @jovie/ovie test
  ready:
    name: PR Ready
    if: ${{ always() }}
    needs: [deterministic, security, migration, coverage, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every source proof
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success,success'
