# Deterministic slop check for AI-generated copy (JOV-#11098).
#
# Post-merge informational only. Autonomous shipping + taste classifier
# keep copy/UX taste off the required PR path (humans review production).
# This job is schedule/dispatch on main, never pull_request, and must not
# be added to ci-harness/manifest.json or PR Ready.
#
# Weekly window: last 7 days of .md/.mdx on main (a one-commit window
# missed every commit except the tip). continue-on-error stays on so a
# smell never reds a scheduled Actions run.
#
# Zero cost: pure Python, no API keys, no network calls.
name: Slop Gate

on:
  schedule:
    - cron: '37 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slop-gate-advisory
  cancel-in-progress: true

jobs:
  slopcheck:
    name: Slop Gate (advisory)
    runs-on: ubuntu-latest
    # Informational post-merge lane — do not remove continue-on-error to
    # invent a merge blocker. Taste ships; this is a weekly smell report.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Get changed copy files
        id: changed
        run: |
          # Files changed vs. base branch that match copy patterns.
          # --diff-filter=d excludes deleted files (can't slopcheck a removed file).
          # CHANGELOG.md is excluded: it is append-only and /ship-generated, so the
          # whole-file slop score only ever grows and always fails regardless of the
          # new entry's quality. Changelog copy quality is governed by the changelog
          # format rules in .claude/rules/release.md, not this marketing-copy gate.
          BASE=$(git rev-list -n 1 --before='7 days ago' HEAD || true)
          if [ -z "$BASE" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "Diffing copy files since $BASE"
          echo "diff_base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=d "$BASE" HEAD \
            | grep -E '\.(md|mdx)$' \
            | grep -v -E '^(node_modules|\.cache|drizzle/migrations|DESIGN\.md)' \
            | grep -v -E '(^|/)CHANGELOG\.md$' \
            > /tmp/changed_copy_files.txt || true

          if [ -s /tmp/changed_copy_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Changed copy files:"
            cat /tmp/changed_copy_files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No copy files changed."
          fi

      - name: Run slopcheck on changed files
        if: steps.changed.outputs.has_files == 'true'
        run: |
          mapfile -t files < /tmp/changed_copy_files.txt
          python3 scripts/slopcheck.py --max 3.0 --diff-base "${{ steps.changed.outputs.diff_base }}" "${files[@]}"

      - name: No copy files changed — skip
        if: steps.changed.outputs.has_files == 'false'
        run: echo "No .md/.mdx files changed — slop gate skipped."

  slopcheck-unit-tests:
    name: slopcheck.py unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --quiet --require-hashes -r .github/requirements/pytest.txt

      - name: Run slopcheck unit tests
        run: pytest scripts/tests/test_slopcheck.py -v
