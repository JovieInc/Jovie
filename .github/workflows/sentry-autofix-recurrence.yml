name: Sentry Autofix Recurrence
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Ops
# necessary-trust-boundary: A main-only job evaluates registered Sentry validation observations against the verified production artifact with a read-only Jovie Bot token; source PRs never reach it.
# revisit-trigger: Remove the clock dispatch and schedule when Sentry emits a regression-resolved webhook Jovie can consume.
# clock-class: production-liveness

# Runs the registered Sentry validation observations: Linear issues in
# Validating that carry a `sentry-observation:v1` registration are checked
# against Sentry history for the verified production artifact.
# Scheduled (Gem clock + cron backstop) / manual only — never a source-PR or
# merge-queue gate, and never a member of the production-mutation FIFO.
# The legacy resolve/reopen loop over "Sentry autofix" PRs was removed with
# sentry-autofix.yml (JOV-12619).

on:
  # The Gem lanes tick fires this on the designed cadence
  # (scripts/lanes/continuity_clock.py): GitHub delivered the cron below only
  # about every 6 h, so the schedule is now the backstop.
  repository_dispatch:
    types: [clock_sentry_autofix_recurrence]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sentry-autofix-recurrence
  cancel-in-progress: false

jobs:
  recurrence:
    name: Evaluate registered Sentry validation observations
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production – jovie
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-doppler

      - name: Generate read-only Jovie Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read

      - name: Run registered Sentry validation observations
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sentry-recurrence-source-revision.txt"
          doppler run --project jovie-web --config prd \
            --only-secrets=LINEAR_API_KEY --no-fallback -- \
            env -u DOPPLER_TOKEN node scripts/sentry-autofix-recurrence.mjs | tee "$RUNNER_TEMP/sentry-recurrence-observation.json"

      - name: Preserve the bounded observation receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentry-recurrence-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sentry-recurrence-observation.json
            ${{ runner.temp }}/sentry-recurrence-source-revision.txt
          retention-days: 14
          if-no-files-found: warn
