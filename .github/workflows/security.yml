# Security scanning workflow for secret detection, vulnerability scanning, and supply chain security
#
# This workflow complements CodeQL by adding:
# - Gitleaks: Secret detection in git history
# - osv-scanner: Open-source dependency vulnerability scanning
# - Semgrep CE: Static application security scanning
# - TruffleHog: Defense-in-depth secret scanning (JOV-3215)
# - Trivy: Vulnerability scanning for dependencies and filesystem (added in subtask-1-4)
# - OSSF Scorecard: Supply chain security scoring (added in subtask-1-5)
#
name: Security Scanning
# clock-class: upstream-advisory
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Devin
# necessary-trust-boundary: A hosted weekly schedule runs Semgrep CE and osv-scanner against the default branch and uploads SARIF with only the built-in read-contents/security-events token; no merge, deploy, or credential authority is added.
# revisit-trigger: Remove the scheduled hop if Semgrep/osv findings are ingested by a hosted scanner and this workflow no longer needs to run inside Actions.

on:
  # PR and merge-group diff scans are required through ci.yml / PR Ready.
  # This workflow owns changed post-merge, weekly baseline, and explicit scans.
  push:
    branches: ['main']
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

# Default permissions - each job specifies its own required permissions
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    # Secret scanning requires an authoritative Git object store. Persistent
    # self-hosted workspaces can retain shallow/promisor state that survives
    # checkout cleanup and makes intermediate PR commits unreadable.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Reset workspace git state (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .git ]]; then exit 0; fi
          git sparse-checkout disable 2>/dev/null || true
          git config --local --unset-all core.sparseCheckout 2>/dev/null || true
          git config --local --unset-all core.sparseCheckoutCone 2>/dev/null || true
          rm -f .git/info/sparse-checkout
          git config --local --unset-all extensions.partialClone 2>/dev/null || true
          git config --local --unset-all remote.origin.promisorRemote 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: true

      - name: Materialize full tree (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout disable 2>/dev/null || true
          git reset --hard HEAD
          git checkout-index -a -f

      - name: Verify checkout sentinel
        shell: bash
        run: |
          set -euo pipefail
          sentinel="scripts/security/scan-secrets.sh"
          if [[ ! -f "$sentinel" ]]; then
            echo "::error::Incomplete checkout — missing ${sentinel}"
            exit 1
          fi

      - name: Run secret scan (gitleaks + trufflehog)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            ./scripts/security/scan-secrets.sh ci-pr "origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              git fetch origin main --depth=1
              ./scripts/security/scan-secrets.sh ci-pr "origin/main"
            else
              ./scripts/security/scan-secrets.sh ci-pr "${{ github.event.before }}"
            fi
          else
            # Worktree-sweep snapshots live under refs/jovie-preserved/* in this
            # public repo; checkout fetches only branches and tags, so map them
            # into local heads for the full-history scan.
            git fetch --no-tags origin '+refs/jovie-preserved/*:refs/heads/jovie-preserved/*'
            ./scripts/security/scan-secrets.sh full
          fi

      - name: Verify gitleaks detects Neon/Clerk leak shapes and backup files
        run: ./scripts/security/verify-gitleaks-coverage.sh

  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan lockfiles with osv-scanner
        run: |
          set -euo pipefail
          version=v2.5.1
          sha=f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${version}/osv-scanner_linux_amd64"
          echo "${sha}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --format sarif --output-file osv.sarif .
          code=$?
          set -e
          if [[ "$code" -gt 1 ]]; then
            exit "$code"
          fi
      - name: Upload osv SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: osv.sarif
          category: osv

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Scan with Semgrep CE
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check semgrep==1.179.0
          set +e
          semgrep scan --config p/default --sarif -o semgrep.sarif --metrics=off
          code=$?
          set -e
          if [[ "$code" -gt 1 ]]; then
            exit "$code"
          fi
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trufflehog:
    name: TruffleHog Secret Scanning
    # TruffleHog clones the checkout internally, so it must start from a clean
    # hosted object store rather than a reused partial-clone workspace.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reset workspace git state (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .git ]]; then exit 0; fi
          git sparse-checkout disable 2>/dev/null || true
          git config --local --unset-all core.sparseCheckout 2>/dev/null || true
          git config --local --unset-all core.sparseCheckoutCone 2>/dev/null || true
          rm -f .git/info/sparse-checkout
          git config --local --unset-all extensions.partialClone 2>/dev/null || true
          git config --local --unset-all remote.origin.promisorRemote 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: true

      - name: Materialize full tree (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout disable 2>/dev/null || true
          git reset --hard HEAD
          git checkout-index -a -f

      - name: Verify checkout sentinel
        shell: bash
        run: |
          set -euo pipefail
          sentinel="scripts/security/scan-secrets.sh"
          if [[ ! -f "$sentinel" ]]; then
            echo "::error::Incomplete checkout — missing ${sentinel}"
            exit 1
          fi

      - name: Run TruffleHog (full history on main/schedule, PR diff on pull_request)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            ./scripts/security/scan-secrets.sh ci-pr-trufflehog "origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              git fetch origin main --depth=1
              ./scripts/security/scan-secrets.sh ci-pr-trufflehog "origin/main"
            else
              ./scripts/security/scan-secrets.sh ci-pr-trufflehog "${{ github.event.before }}"
            fi
          else
            git fetch --no-tags origin '+refs/jovie-preserved/*:refs/heads/jovie-preserved/*'
            ./scripts/security/scan-secrets.sh full-trufflehog
          fi

      - name: Test secret scan regressions with installed TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          trufflehog_bin="$(command -v trufflehog || true)"
          if [[ -z "$trufflehog_bin" ]]; then
            version="${TRUFFLEHOG_VERSION:-3.95.5}"
            trufflehog_bin="${TMPDIR:-/tmp}/trufflehog-${version}/trufflehog"
          fi
          if [[ ! -x "$trufflehog_bin" ]]; then
            echo "::error::Installed TruffleHog binary is unavailable to regression tests"
            exit 1
          fi
          TRUFFLEHOG_BIN="$trufflehog_bin" ./scripts/security/scan-secrets.test.sh
          node --test scripts/security/prepare-ci-secret-scan-range.test.mjs

  trivy:
    name: Trivy Vulnerability Scanning
    runs-on: ubuntu-latest
    # Heavy full-tree scan stays off the PR path (post-merge on main + nightly).
    # Only the fast diff-scoped secret scans (gitleaks/trufflehog) gate PRs.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'

  scorecard:
    name: OSSF Scorecard Supply Chain Security
    runs-on: ubuntu-latest
    # Scorecard only runs on main branch push and schedule to avoid token issues on PRs.
    # 50 minutes stays under the one-hour installation token. Scorecard sleeps
    # until x-ratelimit-reset, then retries the same request. That retry adds a
    # second Authorization header and GitHub answers 401 while the token is
    # still valid. The guard waits on the job token and stops that retry.
    # A GitHub GraphQL "Something went wrong" or HTTP 5xx on that query is
    # retried inside the guard (three attempts, short backoff, same token
    # margin). Any other Scorecard error fails the job. The scan is not skipped.
    timeout-minutes: 50
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write # Required for OIDC token authentication
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Action pin: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e (v2.5.0)
      # Image: ghcr.io/ossf/scorecard-action@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
      # publish_results stays false. The guard passes the job github.token as
      # both repo_token and internal_default_token, which is the action default.
      - name: Run OSSF Scorecard under the token lifetime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/scorecard-credential-guard.mjs

      - name: Upload Scorecard results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: 'scorecard-results.sarif'
          category: 'ossf-scorecard'

  commit-signature-check:
    name: Commit Signature Verification
    runs-on: ubuntu-latest
    # Run on every push to main so unsigned agent-authored merges are surfaced immediately.
    # This is observability only — blocking unsigned commits requires enabling
    # "Require signed commits" in branch protection settings (human/admin action).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify commit is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          hold_script=".github/scripts/gh-api-hold.sh"
          if [[ ! -f "$hold_script" ]]; then
            echo "::error::Missing ${hold_script} — cannot run signature verification"
            exit 1
          fi

          # The job is warn-only by design, so a transient GitHub API outage
          # (installation rate-limit 403, 429, 5xx) must not turn main red.
          # Route the read through gh-api-hold.sh (rate-limit hold + one retry,
          # bounded to 90s per attempt here instead of the full 3900s
          # installation window; ~285s worst case across all attempts)
          # and add two further backoff attempts for 5xx. If the API
          # is still unavailable after that budget, degrade to a visible
          # warning plus a step summary and exit 0. Real verdicts are
          # unchanged: verified=true still prints success, verified=false
          # still emits the Unsigned commit warning, and non-transient errors
          # (404, malformed JSON, permission) still fail the step.
          export GH_API_HOLD_BUDGET_SECONDS=90
          export GH_API_HOLD_TOKEN_CAP_SECONDS=90

          err_file="$(mktemp)"
          trap 'rm -f "$err_file"' EXIT
          response=""
          last_error=""
          fetched=0
          for attempt in 1 2 3; do
            if response="$(bash "$hold_script" api "repos/${REPO}/commits/${COMMIT_SHA}" \
              --jq '{verified: .commit.verification.verified, reason: .commit.verification.reason}' \
              2>"$err_file")"; then
              fetched=1
              break
            fi
            last_error="$(cat "$err_file")"
            if ! printf '%s' "$last_error" | grep -qiE 'API rate limit|secondary rate limit|HTTP 429|HTTP 5[0-9][0-9]'; then
              printf '%s\n' "$last_error" >&2
              exit 1
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          if [[ "$fetched" -ne 1 ]]; then
            summary_reason="$(printf '%s' "$last_error" | grep -v '^[[:space:]]*$' | tail -n 3 | tr '\n' ' ' | tr -s ' ' | cut -c1-300)"
            printf '::warning title=Signature verification unavailable::signature verification unavailable: GitHub API did not answer after retries — %s\n' "$summary_reason"
            {
              echo '### Commit Signature Verification'
              echo ''
              echo '- **status:** skipped (GitHub API unavailable after retries)'
              echo "- **commit:** ${COMMIT_SHA}"
              echo "- **detail:** ${summary_reason}"
            } >>"${GITHUB_STEP_SUMMARY:-/dev/stdout}"
            exit 0
          fi
          if [[ -s "$err_file" ]]; then
            cat "$err_file" >&2
          fi
          verified=$(echo "$response" | jq -r '.verified')
          reason=$(echo "$response" | jq -r '.reason')
          echo "commit=${COMMIT_SHA}: verified=${verified}, reason=${reason}"
          if [ "$verified" = "true" ]; then
            echo "✅ Commit is cryptographically signed and verified."
          else
            printf '⚠️ Unsigned commit merged to main (reason: %s)\n' "$reason"
            echo "::warning title=Unsigned commit::SHA ${COMMIT_SHA} reached main without a cryptographic signature (reason: ${reason}). Enable branch-protection \"Require signed commits\" to block unsigned merges — see https://github.com/${REPO}/settings/branches"
          fi

  workflow-execution-posture:
    name: Workflow Execution Trust-Boundary Audit
    # Keep this report post-merge/nightly and advisory so it cannot slow source
    # PRs or the queue. Configure GitHub Actions policy in Evaluate mode before enforcement.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report privileged workflow trust boundaries
        run: node scripts/security/audit-workflow-execution.mjs
