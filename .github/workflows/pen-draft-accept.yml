# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# necessary-trust-boundary: Pen drafts are private Actions artifacts and the canonical Pen file URL is a CI-only secret, so only a job can read both; it copies the drafted frame Tim approved into docs/design-system/pen-accepted and opens one jovie-bot PR that merges through the normal required checks and never deploys.
# removal-trigger: Remove when accepted Pen drafts are written into the canonical Pen file itself by the design loop that holds the Pen key.

name: Pen draft accept

# Tim approves a Pen draft from its picture on Linear. Certification exports
# Golden Path stills from the canonical Pen file, which CI can only read, so an
# approved draft would never count. This copies the draft's frame into
# docs/design-system/pen-accepted/<frame>.json and points its Golden Path
# manifest entry at the frame's still node; pen-golden-path.mjs splices it in
# at export, and the canonical file wins wherever it already has that node.
# Dispatch it only for a draft Tim approved.

on:
  workflow_dispatch:
    inputs:
      frame:
        description: 'Brief frame name, e.g. claim'
        required: true
        type: string
      section:
        description: 'Golden Path manifest section, e.g. claim/claim'
        required: true
        type: string
      run_id:
        description: 'Pen draft run id that drew the approved picture'
        required: true
        type: string

permissions: {}

concurrency:
  group: pen-draft-accept
  cancel-in-progress: false
  queue: max

jobs:
  accept:
    name: Accept a Pen draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check the inputs
        env:
          FRAME: ${{ inputs.frame }}
          SECTION: ${{ inputs.section }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$FRAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "frame must be kebab-case" >&2; exit 1; }
          [[ "$SECTION" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]] || { echo "section must look like claim/claim" >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be a number" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # github-token-budget: 3 calls/run - download the approved frame's draft
      - name: Download the approved draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pen-draft-${{ inputs.frame }}
          path: ${{ runner.temp }}/draft
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Copy the approved frame into pen-accepted
        id: promote
        env:
          PEN_GOLDEN_PATH_FILE_URL: ${{ secrets.PEN_GOLDEN_PATH_FILE_URL }}
          FRAME: ${{ inputs.frame }}
          SECTION: ${{ inputs.section }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
        run: |
          set -euo pipefail
          canonical=$(node --input-type=module -e '
            import { writeCanonical } from "./scripts/design/pen-draft.mjs";
            const res = await fetch(process.env.PEN_GOLDEN_PATH_FILE_URL);
            if (!res.ok) throw new Error(`canonical download: HTTP ${res.status}`);
            const pen = writeCanonical(Buffer.from(await res.arrayBuffer()), process.env.RUNNER_TEMP + "/canonical", "Jovie Design Studio — canonical.lib.pen");
            process.stdout.write(pen);')
          node scripts/design/pen-accepted.mjs --promote --frame "$FRAME" \
            --draft "$RUNNER_TEMP/draft/${FRAME}.pen" --canonical "$canonical" \
            --section "$SECTION" --source "$SOURCE"
          if git diff --quiet && [ -z "$(git status --porcelain docs/design-system/pen-accepted)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Jovie Bot token
        id: app-token
        if: steps.promote.outputs.changed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Open the accept PR
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FRAME: ${{ inputs.frame }}
          SECTION: ${{ inputs.section }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="automation/pen-accept-${FRAME}-${RUN_ID}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/${branch}" >/dev/null; then
            echo "${branch} already carries this draft."
            exit 0
          fi
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "$remote"
          git switch -c "$branch"
          git add docs/design-system/pen-accepted docs/pen-stills/golden-path/manifest.json
          git commit -m "docs(pen): accept the ${FRAME} draft for ${SECTION}" \
            -m "Tim approved the picture from Pen draft run ${RUN_ID}. Generated by pen-draft-accept.yml (${RUN_URL})."
          git push -u origin "$branch"
          printf 'Before: %s had no Pen design, so certification failed pen.design-exists.\n\nAfter: the %s draft Tim approved (Pen draft run %s) is in docs/design-system/pen-accepted and the manifest points at its still node; the canonical Pen file wins wherever it already has that node.\n\nGenerated by %s.\n' \
            "$SECTION" "$FRAME" "$RUN_ID" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          node packages/api-client/cli.ts gh --priority repair -- pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "docs(pen): accept the ${FRAME} draft for ${SECTION}" \
            --body-file "$RUNNER_TEMP/body.md"
