name: Interaction latency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/scripts/run-interaction-latency-audit.ts'
      - 'apps/web/scripts/performance-interaction-manifest.ts'
      - 'apps/web/scripts/performance-interaction-report.ts'
      - 'apps/web/tests/e2e/utils/interaction-latency-utils.ts'
      - 'docs/performance/receipts/interaction-latency-*'
      - 'docs/performance/generated/interaction-latency-*'
      - '.github/workflows/interaction-latency-audit.yml'

permissions:
  contents: read

concurrency:
  group: interaction-latency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Interaction latency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-playwright
      - name: Measure declared interaction budgets
        env:
          PLAYWRIGHT_ARTIFACT_PATHS: apps/web/test-results/interaction-latency-receipt/*.json
        run: >-
          node .github/scripts/guard-playwright-artifacts.mjs --run --
          pnpm --filter @jovie/web exec tsx scripts/run-interaction-latency-audit.ts --check
      - name: Upload receipt
        if: ${{ always() && hashFiles('apps/web/test-results/interaction-latency-receipt/*.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: interaction-latency-receipt
          path: apps/web/test-results/interaction-latency-receipt/*.json
          if-no-files-found: error

  # Nothing fails without a repair or a success (JOV-14467): a red main run opens or updates this
  # workflow's repair issue and the next green resolves it.
  report-outcome:
    name: Report outcome
    needs: [measure]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions
            .nvmrc
            packages/api-client
            scripts/lib
            scripts/remediation-signal-intake.mjs
      - uses: ./.github/actions/report-outcome
        with:
          results: ${{ toJSON(needs) }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          intake-disabled: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
