# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: Sentry intake has no commissioned authenticated source-to-board adapter for the approved fx/WorkersAI and subscription Codex repair ladder. Preserve a red, bounded hold receipt until that boundary is qualified.
# removal-trigger: Replace the held intake only after source validation, durable task, approved route and lease readback pass through the existing Lane Fix Relay and board.
name: Sentry Autofix

on:
  repository_dispatch:
    types: [sentry-issue]

permissions: {}

concurrency:
  # Never let untrusted payload text control workflow identity or cancel evidence.
  group: sentry-autofix-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout trusted intake policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/actions/prime-node-toolcache
            scripts/sentry-autofix-intake.mjs
          sparse-checkout-cone-mode: false

      - name: Prime Node toolcache
        uses: ./.github/actions/prime-node-toolcache

      - name: Setup pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Record uncommissioned Sentry intake
        run: node scripts/sentry-autofix-intake.mjs

      - name: Preserve bounded hold receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentry-autofix-hold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentry-autofix-hold.json
          if-no-files-found: error
          retention-days: 14
