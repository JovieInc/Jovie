name: Lane Fix Relay
# github-token-budget: 1 calls/run - one same-repository repair dispatch per failed workflow completion, through the shared client.
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# capability-gap: The shipping lanes on Gem have no inbound webhook, so this hop records a PR's failed CI, merge-queue removal, conflict, review feedback or green lane draft as a lane-fix-<kind> label that the lane runner reads each pass; it never pushes, readies, merges or enqueues.
# removal-trigger: Remove when the lanes receive GitHub webhooks directly (an org webhook to the lane host) or the shipping lanes are retired.

# JOV-6672: no PR needs Tim. Every signal that a PR needs repair is pushed to
# the lanes as a label on that exact PR (scripts/lanes/pr_events.py), instead of
# the lanes scanning every PR. The lane runner owns every mutation after that:
# the fix, marking a green lane draft ready with its merge intent, and closing
# or adopting drafts left by disabled lanes.

on:
  workflow_run:
    workflows:
      - Source Validation
      - Fork PR Gate
      - PR Size Guard
      - PR Fleet Rules
      - CI
      - Golden Path Nightly
      - Golden Path Prod Autofix
      - Production Controller
      - Changed-Evidence Test Suites
    # No relay path handles a merge-group ref (PR events or main only); those wakes
    # were ~1/3 of all relay wakes and all skipped.
    branches-ignore: ['gh-readonly-queue/**']
    types: [completed]
  deployment_status:
  repository_dispatch:
    types: [sentry-issue]
  pull_request_target:
    types: [dequeued]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  push:
    branches: [main]
  # Manual backfill: label open PRs already conflicting, green lane drafts and
  # drafts orphaned by disabled lanes, which predate the relay.
  workflow_dispatch:

permissions: {}

concurrency:
  # Pushes to main supersede each other. Successful completions of every
  # required workflow for one PR share one slot, so a burst keeps a single
  # pending run and the newer one cancels the waiter before a Jovie Bot token
  # is minted. Every other wake (failures, deployment_status, reviews) shares ONE
  # slot per PR: GitHub keeps one running and one pending run per group, so a
  # branch-update storm queues at most two relay runs per PR instead of one per
  # (event, workflow). 2026-10-28: 117 branch updates queued 166 relay runs ahead
  # of required checks. The success slot stays separate, so a green wake never
  # cancels a red one. Repair wakes leave the running event intact; only green
  # completions and main pushes cancel in progress. Unscoped backfills also
  # share one stable slot.
  # workflow_dispatch declares no inputs. event.inputs.pr_number is an
  # actionlint error (object type {}) and ejected the merge group.
  group: ${{ github.event_name == 'push' && 'lane-fix-relay-push-main' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && format('lane-fix-relay-success-{0}', github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.workflow_run.id)) || format('lane-fix-relay-{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.deployment.sha || 'unscoped') }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

jobs:
  # A pull_request job GitHub never handed to a hosted runner is cancelled after
  # ~15 minutes and pins its required context CANCELLED/FAILED at an unchanged
  # head (#20767, #20786 stuck six days after the 2026-10-05 acquisition
  # incident). Re-request that exact run instead of sending infra to a model
  # lane; the rerun's completion relays again. Capped per run attempt. GitHub
  # reports such runs as failure (observed for every 2026-10-05 casualty).
  rerun-unacquired:
    name: Rerun jobs no hosted runner acquired
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ${{ fromJSON(vars.RUNNER_CONTROL_PLANE || '"ubuntu-latest"') }}
    timeout-minutes: 3
    permissions:
      actions: write
      checks: read
      contents: read
    outputs:
      requested: ${{ steps.rerun.outputs.requested }}
    steps:
      - name: Checkout trusted rerun policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/lib/github-rate-limit.mjs
            scripts/pr-unacquired-runner-rerun.mjs
          sparse-checkout-cone-mode: false

      - name: Re-request a run with hosted-acquisition failures
        id: rerun
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node scripts/pr-unacquired-runner-rerun.mjs

  # Success wakes of this heavy job come only from Source Validation (2026-10-26).
  # Waking it on every other workflow's success started ~3 extra runs per head, each
  # paying a debounce, a checkout, an App mint and several reads. A CI success, which
  # can be the check that settles the rollup after Source Validation, is the separate
  # clear-settled-red job: no debounce. Failures still wake from every listed workflow
  # and do not sleep. `green` is still applied only to a lane draft
  # (pr_events.in_scope). A stale lane-fix-red is deleted when the rollup is settled
  # success, including while merge state still says BLOCKED.
  # Red path (Tim 2026-11-12, scripts/lanes/red_repair.py): drafts get lane-fix-red too,
  # whatever their branch prefix, unless an active worker holds the head (an unexpired
  # exact-head lane claim, or a commit under an hour old). No label while Main Health is
  # red on main, and none for a check failing on more than 5 PRs in 30 min (one intake).
  relay:
    name: Queue lane repair
    needs: rerun-unacquired
    if: >-
      always() && needs.rerun-unacquired.outputs.requested != 'true' && (
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'failure') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'sentry-issue') ||
      (github.event_name == 'pull_request_target' &&
       !contains(github.event.reason, 'merged') && !contains(github.event.reason, 'branch')) ||
      (github.event_name == 'pull_request_review' &&
       (github.event.review.state == 'changes_requested' ||
        (github.event.review.state == 'commented' && github.event.review.user.type == 'User'))) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type == 'User') ||
      contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) ||
      (github.event.workflow_run.event == 'pull_request' &&
       (contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Source Validation'))) ||
      (github.event.workflow_run.head_branch == 'main' &&
       contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
       contains(fromJSON('["failure","timed_out","startup_failure","cancelled"]'), github.event.workflow_run.conclusion)))
    runs-on: ${{ fromJSON(vars.RUNNER_CONTROL_PLANE || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      # actions: read for a red run's failed job logs; write to re-run a run that failed only
      # on GitHub's API quota (scripts/lib/github-rate-limit.mjs) instead of queueing repair.
      actions: write
      contents: write # Same-repository repository_dispatch uses GITHUB_TOKEN.
      issues: write
      pull-requests: write
      # A hand dequeue counts only with the failure hold's receipt on the head (pr_events.failure_held).
      statuses: read
    steps:
      - name: Debounce repeated workflow completions
        # Successful completions cancel older green wakes before the app token
        # is minted. A red check does not sleep: cancel-in-progress is false for
        # failures, so a debounce only delayed the repair.
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: sleep 20

      - name: Checkout trusted lane policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/lanes
            scripts/apiclient
            packages/api-client/providers.json
            scripts/lib/github-rate-limit.mjs
          sparse-checkout-cone-mode: false

      # 2026-10-13: the relay was the shared GITHUB_TOKEN bucket's top caller
      # (75 executed runs in 55 minutes) in three quota storms. Reads move to
      # the Jovie Bot installation's own quota, read-only scopes; writes stay
      # on GITHUB_TOKEN so labels start no label-triggered workflows. This
      # workflow is never merge_group-reachable: workflow_run, push and the
      # pull_request_target/review events run the default branch's file.
      - name: Generate Jovie Bot read token
        id: read-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYMPHONY_APP_ID }}
          private-key: ${{ secrets.SYMPHONY_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Label the PR for the lanes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'backfill' || 'relay' }}
        run: python3 scripts/lanes/pr_events.py "$MODE"

      # 2026-10-29: this relay is the one topology-approved remediation dispatcher, but nothing
      # ever sent `swarm-remediate`, so the swarm only ran when a person dispatched it (last
      # automatic-era run 05:35Z). The first failed workflow on a same-repo PR head now wakes
      # the swarm for that PR, in the same event, without waiting for a label or a sweep. The
      # swarm's prepare gate dedupes per head (handled, in flight, sensitive, budget).
      - name: Wake the PR Remediation Swarm for the failed head
        if: >-
          (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.pull_requests[0].number != null)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          PYTHONPATH=scripts python3 -m apiclient gh --priority repair -- api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=swarm-remediate \
            -f "client_payload[pr]=$PR" -f "client_payload[sha]=$SHA"
          echo "swarm-remediate pr=$PR sha=$SHA first_failed=$WORKFLOW at=$(date -u +%FT%TZ)"

  # CI can finish after Source Validation. That completion is the event that
  # settles the rollup. This job does not sleep and does not run for the fast
  # producers. A head with no lane-fix-red returns after one read.
  clear-settled-red:
    name: Clear lane-fix-red when CI succeeded
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'CI'
    # A new job cannot float. The control-plane expression stays on the two
    # jobs already listed in the runner-pin allowlist.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/lanes
            scripts/apiclient
            packages/api-client/providers.json
            scripts/lib/github-rate-limit.mjs
          sparse-checkout-cone-mode: false

      - name: Generate Jovie Bot read token
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYMPHONY_APP_ID }}
          private-key: ${{ secrets.SYMPHONY_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Clear a settled lane-fix-red
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          MODE: relay
        run: python3 scripts/lanes/pr_events.py relay

  # Hosted here, not on their own triggers: this relay already wakes on the
  # same events, so these calls start no extra run. Their own triggers started
  # ~3,100 always-skipped runs a week (2026-11-11 audit, JOV finding 4).
  cheap-fix:
    name: Cheap Fixer
    if: >-
      vars.CHEAP_FIXER_MODE == 'shadow' &&
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["Source Validation","CI","Changed-Evidence Test Suites"]'), github.event.workflow_run.name) &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    permissions:
      contents: read
    uses: ./.github/workflows/cheap-fixer.yml

  security-suppression-audit:
    name: Security Suppression Audit
    # The bot-reviewer filter stays in the called workflow (one copy).
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-suppression-audit.yml

  # JOV-8931: the lane host has no inbound webhook. This job runs on the gem
  # host and drops a wake file; jovie-lanes-wake.path runs fix-now the moment
  # the file appears. The 5-minute lanes timer is only the fallback.
  wake-red:
    name: Wake the lane host for the failed head
    needs: rerun-unacquired
    if: >-
      always() && needs.rerun-unacquired.outputs.requested != 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Reset workspace git state (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          if [[ -d .git ]]; then
            git sparse-checkout disable 2>/dev/null || true
            git config --local --unset-all core.sparseCheckout 2>/dev/null || true
            git config --local --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi

      - name: Checkout the wake writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/lanes
          sparse-checkout-cone-mode: false

      - name: Drop the red wake file
        run: python3 scripts/lanes/pr_events.py wake

      - name: Release the shared sparse checkout
        if: always()
        run: |
          git sparse-checkout disable 2>/dev/null || true
          rm -f .git/info/sparse-checkout
