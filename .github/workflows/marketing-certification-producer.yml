name: Marketing Certification Producer
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: Main pushes run read-only evidence checks and post machine certification evidence to the production ledger with CRON_SECRET only; it never records founder decisions, merges, deploys or writes to GitHub.
# removal-trigger: Remove when Production Controller emits the marketing evidence packets after each deploy.
# JOV-6928 Canary A: event-driven machine evidence for the marketing
# certification ledger. A push to main that changes a registry entry's
# canonical source re-evaluates exactly those entries and posts one
# jovie.certification/v1 packet each to /api/internal/ovie/certification-evidence.
# Evidence only: founder decisions never pass through this workflow.
# workflow_dispatch with all=true reconciles every source-backed entry
# (discovery of entries the ledger has never evaluated).
#
# No clock: each run evaluates everything since the last successful run, not
# just its own push. The single concurrency slot replaces a waiting run when a
# newer push arrives, so the newer run's range also covers the pushes whose
# runs were replaced, and a failed run's range is retried by the next one.

on:
  push:
    branches: [main]
    # Keep in parity with CERTIFICATION_INPUT_GLOBS (producer regression test).
    paths:
      - 'apps/web/components/**'
      - 'apps/web/data/**'
      - 'apps/web/styles/**'
      - 'apps/web/lib/**'
      - 'apps/web/hooks/**'
      - 'apps/web/constants/**'
      - 'apps/web/public/**'
      - 'apps/web/app/(home)/**'
      - 'apps/web/app/(marketing)/**'
      - 'apps/web/app/*.*'
      - 'apps/web/tests/**'
      - 'apps/web/scripts/marketing-certification-producer*'
      - 'apps/web/*.config.*'
      - 'apps/web/tsconfig*.json'
      - 'apps/web/package.json'
      - 'apps/web/.storybook/**'
      - 'packages/ui/**'
      - 'packages/copy/**'
      - 'canon/invariants.jsonl'
      - 'docs/marketing/**'
      - 'docs/design-system/molecule-ownership-receipt.json'
      - 'scripts/agent/pen-workspace-locks.json'
      - '.github/actions/setup-node-pnpm/**'
      - '.nvmrc'
      - '.node-version'
      - 'scripts/invariants/**'
      - 'design.tokens.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/marketing-certification-producer.yml'
  workflow_dispatch:
    inputs:
      all:
        description: Evaluate every source-backed marketing registry entry
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Reads this workflow's own run history to find the last successful range.
  actions: read

concurrency:
  group: marketing-certification-producer
  cancel-in-progress: false

jobs:
  produce:
    name: Marketing certification evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # The whole range since the last successful run, from the compare API:
      # merge-queue pushes batch several PRs, a shallow checkout cannot diff
      # back that far (2026-09-28: #19204's tests were never evaluated), and
      # replaced or failed runs leave their pushes to this one.
      - name: Changed files since the last successful run
        id: changed
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/changed.txt"
          all=false
          : > "$out"
          workflow_file="${WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          # GitHub's server-side status filter can return stale runs; filter
          # completed main push runs locally instead.
          BEFORE="$(gh api "repos/$REPO/actions/workflows/$workflow_file/runs?branch=main&event=push&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // empty' || true)"
          BEFORE="${BEFORE:-$PUSH_BEFORE}"
          echo "Evaluating changes from ${BEFORE:-<none>} to $GITHUB_SHA"
          if [[ "${BEFORE:-}" =~ ^[0-9a-f]{40}$ && "$BEFORE" != "0000000000000000000000000000000000000000" && "$BEFORE" != "$GITHUB_SHA" ]]; then
            if ! gh api "repos/$REPO/compare/$BEFORE...$GITHUB_SHA" --jq '.files[] | .filename, .previous_filename // empty' > "$out"; then
              all=true
              : > "$out"
            fi
          else
            all=true
          fi
          # Include both names of renames so the former dependency is invalidated.
          # The compare API lists at most 300 files; a larger push could hide an
          # affected entry, so evaluate everything instead of guessing.
          if [ "$all" = true ] || [ "$(wc -l < "$out")" -ge 300 ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"
          wc -l < "$out"

      - name: Install Playwright Chromium for Storybook render proof
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" 'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main" | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update && sudo apt-get install -y doppler

      - name: Produce and post evidence
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          # Real defects (failed evidence) upsert one fingerprinted Linear issue.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CHANGED: ${{ steps.changed.outputs.path }}
          ALL: ${{ (inputs.all || steps.changed.outputs.all == 'true') && '--all' || '' }}
          RUN_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$ALL" ]; then extra+=(--all); fi
          doppler run --project jovie-web --config prd --only-secrets=CRON_SECRET --no-fallback -- \
            env -u DOPPLER_TOKEN pnpm --filter=@jovie/web exec tsx scripts/marketing-certification-producer.ts \
              --sha "$GITHUB_SHA" --changed "$CHANGED" --run-ref "$RUN_REF" "${extra[@]}"
