name: Marketing Certification Producer
# clock-class: temporal-resource
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: A hosted clock and main pushes run read-only evidence checks and post machine certification evidence to the production ledger with CRON_SECRET only; it never records founder decisions, merges, deploys or writes to GitHub.
# removal-trigger: Remove the schedule when Production Controller emits the marketing evidence packets after each deploy, making the daily missed-event heartbeat redundant.
# JOV-6928 Canary A: event-driven machine evidence for the marketing
# certification ledger. A push to main that changes a registry entry's
# canonical source re-evaluates exactly those entries and posts one
# jovie.certification/v1 packet each to /api/internal/ovie/certification-evidence.
# Evidence only: founder decisions never pass through this workflow.
# workflow_dispatch with all=true reconciles every source-backed entry
# (discovery of entries the ledger has never evaluated). The daily schedule is
# the missed-event heartbeat: it re-evaluates everything once, so a dropped push
# event cannot leave a certificate stale for more than a day.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/components/**'
      - 'apps/web/data/marketing/**'
      # @coverage-via targets: a declared test changing invalidates its entry.
      - 'apps/web/tests/unit/marketing/**'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: Evaluate every source-backed marketing registry entry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketing-certification-producer
  cancel-in-progress: false

jobs:
  produce:
    name: Marketing certification evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # The whole push range, from the compare API: merge-queue pushes batch
      # several PRs, and a shallow checkout cannot diff back to `before`, so
      # the old git fallback saw only the last commit and silently dropped
      # the rest (2026-09-28: #19204's tests were never evaluated).
      - name: Changed files in this push
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/changed.txt"
          all=false
          if [[ "${BEFORE:-}" =~ ^[0-9a-f]{40}$ && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if ! gh api "repos/$REPO/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' > "$out"; then
              all=true
            fi
          else
            all=true
          fi
          # The compare API lists at most 300 files; a larger push could hide an
          # affected entry, so evaluate everything instead of guessing.
          if [ "$all" = true ] || [ "$(wc -l < "$out")" -ge 300 ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            : > "$out"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"
          wc -l < "$out"

      - name: Install Playwright Chromium for Storybook render proof
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" 'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main" | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update && sudo apt-get install -y doppler

      - name: Produce and post evidence
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          # Real defects (failed evidence) upsert one fingerprinted Linear issue.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CHANGED: ${{ steps.changed.outputs.path }}
          ALL: ${{ (github.event_name == 'schedule' || inputs.all || steps.changed.outputs.all == 'true') && '--all' || '' }}
          RUN_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$ALL" ]; then extra+=(--all); fi
          doppler run --project jovie-web --config prd --only-secrets=CRON_SECRET --no-fallback -- \
            env -u DOPPLER_TOKEN pnpm --filter=@jovie/web exec tsx scripts/marketing-certification-producer.ts \
              --sha "$GITHUB_SHA" --changed "$CHANGED" --run-ref "$RUN_REF" "${extra[@]}"
