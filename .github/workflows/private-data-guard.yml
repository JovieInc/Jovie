name: Private Data Guard

# Blocks re-adding investor, fundraising, strategy and internal security-map
# material to this public repo (moved to JovieInc/Ops jovie-private/ on
# 2026-10-28). Shared guard: JovieInc/ci private-data-guard.yml. Path
# exceptions go in .private-data-allowlist.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: private-data-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Private data guard
    permissions:
      contents: read
    uses: JovieInc/ci/.github/workflows/private-data-guard.yml@315c327e822e328e01c0e8f50d4e6b14db86af2c
    with:
      extra-path-patterns: |
        ^STRATEGY\.md$
        ^content/investors/
        ^docs/fundraising/
        ^docs/company/CAPITAL-STRATEGY\.md$
        ^canon/strategy/theses
        ^ops/registry/third-party-grants\.jsonl$
        ^docs/marcdoc/investor-memo
        ^docs/screenshots/pitch-v1/
      extra-content-patterns: |
        "senderId"\s*:
        "tokenBinding"\s*:
