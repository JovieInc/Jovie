# Real-Model Eval Lane (JOV-3659)
#
# PURPOSE: Changed-input + manual regression checks against the live chat model via
# Helicone observability. Runs golden-case sampling (N=5) and the adversarial
# input battery sequentially (batch size 1) with a hard BUDGET_CAP_USD.
#
# TRIGGER:
# - Relevant model, prompt, tool, dataset, evaluator, or policy changes on main
# - Manual workflow_dispatch

name: Real-Model Eval Lane

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/lib/ai/**'
      - 'apps/web/lib/chat/**'
      - 'apps/web/lib/constants/ai-models.ts'
      - 'apps/web/lib/eval/**'
      - 'apps/web/prompts/**'
      - 'apps/web/promptfooconfig*.yaml'
      - 'apps/web/tests/eval/**'
      - 'apps/web/tests/unit/chat/**'
      - 'apps/web/tests/unit/lib/ai/**'
      - '.github/workflows/eval-real-model.yml'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      budget_cap_usd:
        description: 'Maximum estimated spend for this run (USD)'
        required: false
        default: '2.00'
        type: string
      cost_eligibility_account:
        description: 'Explicitly authorized billing account for this manual live run'
        required: false
        default: ''
        type: string
      cost_eligibility_provider:
        description: 'Explicitly authorized provider for this manual live run'
        required: false
        default: ''
        type: string
      sample_size:
        description: 'Golden-case sample size (N)'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: eval-real-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JOVIE_RUN_REAL_MODEL_EVALS: ''
  REAL_EVAL_SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '5' }}
  REAL_EVAL_MIN_PASS: '3'
  REAL_EVAL_ADVERSARIAL_MIN_PASS: '6'
  BUDGET_CAP_USD: ${{ github.event.inputs.budget_cap_usd || '2.00' }}

jobs:
  real-model-eval:
    name: Golden + Adversarial (Helicone)
    # Live-model work stays outside source-PR and merge-queue fixed CI slots.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Construct explicit live-model eligibility
        env:
          ELIGIBILITY_ACCOUNT: ${{ github.event.inputs.cost_eligibility_account }}
          ELIGIBILITY_PROVIDER: ${{ github.event.inputs.cost_eligibility_provider }}
          ELIGIBILITY_CAP_USD: ${{ github.event.inputs.budget_cap_usd }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const account = (process.env.ELIGIBILITY_ACCOUNT ?? '').trim();
          const provider = (process.env.ELIGIBILITY_PROVIDER ?? '').trim();
          const capUsd = Number(process.env.ELIGIBILITY_CAP_USD);
          const eligible = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch'
            && account.length > 0 && provider.length > 0
            && Number.isFinite(capUsd) && capUsd > 0 && capUsd <= 25;
          const token = eligible ? JSON.stringify({ account, provider, capUsd }) : '';
          appendFileSync(process.env.GITHUB_ENV,
            `JOVIE_RUN_REAL_MODEL_EVALS=${eligible ? '1' : ''}\n`
            + `REAL_EVAL_ELIGIBILITY=${token}\n`
            + (eligible ? `BUDGET_CAP_USD=${capUsd}\n` : ''));
          NODE

      - name: Run real-model eval lane (batch size 1)
        working-directory: apps/web
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          HELICONE_API_KEY: ${{ secrets.HELICONE_API_KEY }}
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Without both gateway keys the live suites skip, and the
          # disabled-guard test then requires the flag to be unset.
          if [ -z "$AI_GATEWAY_API_KEY" ] || [ -z "$HELICONE_API_KEY" ]; then
            echo "::warning::real-model eval keys missing; running disabled-guard mode"
            JOVIE_RUN_REAL_MODEL_EVALS='' pnpm exec vitest run \
              --config lib/eval/adversarial/vitest.config.real-eval.mts \
              --maxWorkers 1 \
              --maxConcurrency 1
          else
            pnpm exec vitest run \
              --config lib/eval/adversarial/vitest.config.real-eval.mts \
              --maxWorkers 1 \
              --maxConcurrency 1
          fi
