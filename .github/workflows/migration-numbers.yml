name: Migration numbers

# Fails when a migration is numbered at or below main's latest, or when another
# open PR adds a migration with the same number.

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migration-numbers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  numbers:
    name: Migration numbers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check migration numbers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: node scripts/check-migration-numbers.mjs --base "origin/$BASE_REF"
