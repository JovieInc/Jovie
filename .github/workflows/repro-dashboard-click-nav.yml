name: Repro Dashboard Click Nav
# Temporary incident repro (2026-11-08). Lives only on the repro branch and is
# never merged. Read-only: signs in as the production smoke identity and
# clicks sidebar links on the landed production deployment.
on:
  push:
    branches: [repro/dashboard-click-nav]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: { PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-doppler
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-playwright
      - name: Click dashboard sidebar on landed production
        env:
          PRODUCTION_BASE_URL: https://jovie-2ezpfot2p-jovie.vercel.app
          EXPECTED_COMMIT_SHA: 028d34780640d6da0333b4a9e4674208d8ef98d4
          PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'
          PLAYWRIGHT_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          set -euo pipefail
          cd apps/web
          mkdir -p tests/.auth
          echo '{"cookies":[],"origins":[]}' > tests/.auth/user.json
          doppler run --project jovie-web --config prd \
            --only-secrets=E2E_PROD_USER_EMAIL,DATABASE_URL \
            --no-fallback -- env -u DOPPLER_TOKEN \
              CI=true \
              BASE_URL="$PRODUCTION_BASE_URL" \
              EXPECTED_VERCEL_DEPLOYMENT_ORIGIN="$PRODUCTION_BASE_URL" \
              EXPECTED_VERCEL_ENVIRONMENT=production \
              PLAYWRIGHT_DYNAMIC_SECRETS_FILE="$RUNNER_TEMP/playwright-dynamic-cookie-values" \
                node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- \
                  pnpm exec playwright test tests/e2e/smoke-prod-auth.spec.ts --project=chromium --reporter=line \
                  --grep "sign-in works and dashboard loads" --max-failures=1
