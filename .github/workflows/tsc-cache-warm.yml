name: TSC Cache Warm

# Seeds the tsc state ci-fast (typecheck) restores in merge_group: main
# pushes skip that job and merge_group cannot read PR caches. Main only, no
# secrets or tokens. tsc re-hashes every input, so stale state is safe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsc-cache-warm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    name: Warm web tsc cache
    if: >-
      github.repository == 'JovieInc/Jovie' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve tsc cache hour
        id: hour
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - name: Restore web tsc incremental state
        id: web-tsbuildinfo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.cache/tsbuildinfo*
          key: jovie-web-tsbuildinfo-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'apps/web/tsconfig.json', 'apps/web/tsconfig.typecheck.json', 'apps/web/tsconfig.test.json', 'apps/web/tsconfig.stories.json') }}-h${{ steps.hour.outputs.hour }}
          restore-keys: |
            jovie-web-tsbuildinfo-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'apps/web/tsconfig.json', 'apps/web/tsconfig.typecheck.json', 'apps/web/tsconfig.test.json', 'apps/web/tsconfig.stories.json') }}-
            jovie-web-tsbuildinfo-v2-${{ runner.os }}-
      # Unconditional (JOV-6835): queue-proven main pushes skip every ci.yml
      # lane, so this is the only main-scoped writer of the exact node_modules
      # cache. On a hit it only restores; on a manifest change it installs and
      # saves under main, which merge groups and PRs can read. Gating it on the
      # tsc key left main stale and made every merge group save its own
      # unreadable 575 MB copy (six at once on 2026-09-27, 10 GB cap full).
      - uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck web for cache
        if: ${{ steps.web-tsbuildinfo.outputs.cache-hit != 'true' }}
        run: |
          pnpm --filter @jovie/web run typecheck
          pnpm --filter @jovie/web run typecheck:tests
          pnpm --filter @jovie/web run typecheck:stories
      - name: Save web tsc incremental state
        if: ${{ success() && steps.web-tsbuildinfo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.cache/tsbuildinfo*
          key: ${{ steps.web-tsbuildinfo.outputs.cache-primary-key }}
      # Only main-scoped writer of the pinned actionlint downloads (source,
      # patch, shellcheck, pyflakes) that ci.yml, source-validation.yml and
      # actionlint.yml restore read-only: merge_group and PR runs can read a
      # main cache, not each other's. A hit costs one restore. On a new key the
      # script runs once to fill the content-addressed directory. Runs after
      # the tsc warm and whatever its result; a failed fill saves nothing.
      - name: Restore pinned actionlint downloads
        id: pinned-downloads
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jovie-pinned-downloads
          key: pinned-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/run-actionlint.sh') }}
          restore-keys: |
            pinned-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Go for source-pinned actionlint
        if: ${{ !cancelled() && steps.pinned-downloads.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Fill pinned actionlint downloads
        id: pinned-fill
        if: ${{ !cancelled() && steps.pinned-downloads.outputs.cache-hit != 'true' }}
        env:
          PINNED_DOWNLOAD_CACHE_DIR: /tmp/jovie-pinned-downloads
        run: |
          if bash .github/scripts/run-actionlint.sh -version; then
            echo "filled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Pinned download cache::fill failed; the next main push retries"
          fi
      - name: Save pinned actionlint downloads
        if: ${{ !cancelled() && steps.pinned-downloads.outputs.cache-hit != 'true' && steps.pinned-fill.outputs.filled == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jovie-pinned-downloads
          key: ${{ steps.pinned-downloads.outputs.cache-primary-key }}
