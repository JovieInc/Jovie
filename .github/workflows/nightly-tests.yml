# Changed-Evidence Test Suites
#
# PURPOSE: Full unit, dead-code, and E2E evidence after relevant main inputs
# change. Manual dispatch remains available for bounded diagnostics.
#
# REPLACES: nightly-unit-tests.yml, nightly-e2e-tests.yml
#
name: Changed-Evidence Test Suites

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '!apps/web/reports/**'
      - '!apps/web/test-results/**'
      - 'packages/**'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/actions/setup-playwright/**'
      - '.github/workflows/nightly-tests.yml'
      - '.node-version'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        type: choice
        options:
          - all
          - unit
          - e2e
          - design-v1
        default: all
      coverage:
        description: 'Enable unit test coverage report'
        required: false
        default: false
        type: boolean
      test_filter:
        description: 'E2E test file pattern (leave empty for full suite)'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Knip Dead Code Audit
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'unit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run Knip
        run: pnpm knip

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  unit-tests:
    name: Full Unit Test Suite
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'unit'
    runs-on: ubuntu-latest
    # The unsharded suite was still making steady progress when the 30m cap
    # cancelled it repeatedly (Jul 15-20, JOV-4326). 60m fits the current
    # suite with headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The web unit suite includes Storybook provenance guards that verify
          # historical sourceSha receipts are ancestors of HEAD.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      # playwright-artifact-secrets.test.ts launches Chromium (JOV-5101).
      - uses: ./.github/actions/setup-playwright

      - name: Run full unit test suite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.coverage }}" = "true" ]; then
            pnpm --filter=@jovie/web run test -- --coverage
          else
            pnpm --filter=@jovie/web run test
          fi

      - name: Upload coverage report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-coverage
          path: apps/web/coverage/
          retention-days: 7

  # ==========================================================================
  # E2E Tests
  # ==========================================================================
  e2e-tests:
    name: Changed-Evidence E2E Suite
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'e2e' ||
      github.event.inputs.suite == 'design-v1'
    environment: Preview – jovie
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { PLAYWRIGHT_ARTIFACT_REQUIRE_PRODUCER_STAGE: 'true' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Create ephemeral Neon database branch
        id: neon-branch
        uses: ./.github/actions/neon-create-branch-with-retry
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: nightly-e2e-${{ github.run_id }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_in_hours: '3'

      - name: Run database migrations
        run: pnpm --filter=@jovie/web run drizzle:migrate:ci
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          NODE_ENV: test
          GIT_BRANCH: nightly
          ALLOW_PROD_MIGRATIONS: 'true'

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml', 'playwright.config*.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright (Chromium only)
        run: pnpm --filter=@jovie/web exec playwright install chromium --with-deps

      - name: Seed nightly QA data
        if: ${{ github.event_name == 'push' || github.event.inputs.test_filter == '' || github.event.inputs.suite == 'design-v1' }}
        run: |
          cd apps/web
          pnpm run seed:test-data
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          NODE_ENV: test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}

      - name: Build nightly QA standalone server
        run: pnpm turbo build --filter=@jovie/web
        env:
          # NEXT_PUBLIC_* is compiled into the standalone server. A dev-server
          # warmup does not compile /app client modules, so auth setup still
          # waits out the first navigation.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_E2E_MODE: '1'
          NEXT_PUBLIC_CLERK_MOCK: '1'
          NEXT_PUBLIC_CLERK_PROXY_DISABLED: '1'
          NEXT_IGNORE_ESLINT: '1'
          NEXT_IGNORE_TYPECHECK: '1'
          NEXT_PRIVATE_SKIP_SIZE_CHECK: 'true'

      - name: Start route QA bypass server
        run: |
          cd apps/web
          if [ ! -f .next/standalone/apps/web/server.js ]; then
            echo "::error::Standalone server not found — nightly QA cannot start."
            exit 1
          fi
          rm -rf .next/standalone/apps/web/.next/static .next/standalone/apps/web/public
          mkdir -p .next/standalone/apps/web/.next
          cp -r .next/static .next/standalone/apps/web/.next/static
          cp -r public .next/standalone/apps/web/public
          # Background the production server the way the dev server used to be
          # so chaos and the nightly suite share one process. HOSTNAME must be
          # loopback: GitHub sets it to the runner name, and the test-auth
          # gate rejects that host.
          PORT=3100 node .next/standalone/apps/web/server.js > "$RUNNER_TEMP/nightly-qa-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nightly-qa-web.pid"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/dev/test-auth/session >/dev/null; then
              echo "Nightly QA bypass server is ready."
              for persona in creator creator-ready; do
                for attempt in 1 2 3; do
                  if curl -fsS -X POST http://127.0.0.1:3100/api/dev/test-auth/session \
                    -H 'content-type: application/json' \
                    --data "{\"persona\":\"$persona\"}" >/dev/null; then
                    break
                  fi
                  if [ "$attempt" = "3" ]; then
                    echo "Failed to prepare $persona bypass persona." >&2
                    cat "$RUNNER_TEMP/nightly-qa-web.log"
                    exit 1
                  fi
                  sleep 5
                done
              done
              echo "Nightly QA bypass personas are ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Standalone server failed to start within 30s." >&2
          cat "$RUNNER_TEMP/nightly-qa-web.log"
          exit 1
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          NODE_ENV: test
          VERCEL_ENV: development
          HOSTNAME: localhost
          PORT: '3100'
          BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_FAST_ONBOARDING: '1'
          E2E_TEST_AUTH_PERSONA: creator
          NEXT_PUBLIC_E2E_MODE: '1'
          NEXT_PUBLIC_CLERK_MOCK: '1'
          NEXT_PUBLIC_CLERK_PROXY_DISABLED: '1'
          NEXT_DISABLE_TOOLBAR: '1'
          E2E_ALLOW_DEV_CSP: '1'
          FLAGS_SECRET: ${{ secrets.FLAGS_SECRET }}

      - name: Run nightly route QA breadth pass
        # Temporarily keep this flaky breadth pass out of scheduled runs.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_filter == '' && github.event.inputs.suite != 'design-v1' }}
        run: |
          cd apps/web
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm run qa:routes
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          NODE_ENV: test
          ROUTE_QA_BASE_URL: http://127.0.0.1:3100
          ROUTE_QA_OUTPUT_DIR: nightly-route-qa
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}

      - name: Run full surface chaos sweep
        if: ${{ github.event_name == 'push' || (github.event.inputs.test_filter == '' && github.event.inputs.suite != 'design-v1') }}
        continue-on-error: true
        run: |
          cd apps/web
          node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- bash -c "
            pnpm playwright test tests/e2e/nightly/full-surface-chaos.spec.ts --config=playwright.config.nightly.ts --project=chromium
            status=\$?
            if [ -f test-results/nightly-results.json ]; then
              cp test-results/nightly-results.json test-results/full-surface-chaos-report.json || exit \$?
            fi
            exit \"\$status\"
          "
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          NODE_ENV: test
          BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_USE_TEST_AUTH_BYPASS: '1'
          E2E_FAST_ONBOARDING: '1'
          E2E_TEST_AUTH_PERSONA: creator
          E2E_SKIP_SEED: '1'
          E2E_SKIP_WARMUP: '1'
          FLAGS_SECRET: ${{ secrets.FLAGS_SECRET }}
          # Retry error-context.md is scanned and redacted. Without this the
          # producer treats those files as unknown-binary and poisons the stage.
          PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'

      - name: Run nightly E2E tests
        id: nightly-e2e
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite != 'design-v1' }}
        run: |
          cd apps/web
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm playwright test "${{ github.event.inputs.test_filter }}" --config=playwright.config.nightly.ts --project=chromium
          else
            node "$GITHUB_WORKSPACE/.github/scripts/guard-playwright-artifacts.mjs" --run -- pnpm playwright test --config=playwright.config.nightly.ts --project=chromium --grep-invert=@full-surface-chaos
          fi
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          NODE_ENV: test
          BASE_URL: http://127.0.0.1:3100
          E2E_SKIP_WARMUP: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          FLAGS_SECRET: ${{ secrets.FLAGS_SECRET }}
          PLAYWRIGHT_ARTIFACT_ALLOW_MARKDOWN: 'true'

      - name: Stop route QA bypass server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nightly-qa-web.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/nightly-qa-web.pid")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi

      - name: Upload Test Results on Failure
        if: ${{ always() && steps.nightly-e2e.outcome == 'failure' && hashFiles('apps/web/test-results/nightly-results.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-e2e-results-${{ github.run_id }}
          path: apps/web/test-results/nightly-results.json
          retention-days: 7

      - name: Upload route QA ledger
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.test_filter == '' && github.event.inputs.suite != 'design-v1' && hashFiles('apps/web/test-results/route-qa/nightly-route-qa/route-matrix.json') != '' && hashFiles('apps/web/test-results/route-qa/nightly-route-qa/findings-ledger.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: nightly-route-qa-${{ github.run_id }}
          path: |
            apps/web/test-results/route-qa/nightly-route-qa/route-matrix.json
            apps/web/test-results/route-qa/nightly-route-qa/findings-ledger.json
          retention-days: 7

      - name: Upload full surface chaos report
        if: ${{ always() && (github.event_name == 'push' || (github.event.inputs.test_filter == '' && github.event.inputs.suite != 'design-v1')) && hashFiles('apps/web/test-results/full-surface-chaos-report.json') != '' }}
        uses: ./.github/actions/upload-safe-playwright-artifact
        with:
          name: full-surface-chaos-${{ github.run_id }}
          path: apps/web/test-results/full-surface-chaos-report.json
          retention-days: 7

      - name: Cleanup Clerk E2E test users
        if: always()
        continue-on-error: true
        run: |
          cd apps/web
          if [[ "${CLERK_SECRET_KEY:-}" != sk_test_* ]]; then
            echo "Skipping Clerk E2E cleanup because CLERK_SECRET_KEY is not a Clerk test secret."
            exit 0
          fi
          pnpm tsx scripts/cleanup-e2e-users.ts --force
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}

      - name: Cleanup Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_NAME: nightly-e2e-${{ github.run_id }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "Neon credentials missing; skipping branch cleanup." >&2
            exit 0
          fi

          echo "Deleting Neon branch '$BRANCH_NAME' for nightly run ${{ github.run_id }}..."
          pnpm dlx neonctl branches delete "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" || {
            echo "Branch '$BRANCH_NAME' not found or already deleted; ignoring." >&2
          }

  # ==========================================================================
  # Notifications
  # ==========================================================================
  notify:
    name: Notify Results
    needs: [knip, unit-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CI_CHANNEL_ID: ${{ vars.SLACK_CI_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Skip Slack when bot token or channel is unset
        if: ${{ (needs.knip.result == 'failure' || needs.unit-tests.result == 'failure') && (env.SLACK_BOT_TOKEN == '' || env.SLACK_CI_CHANNEL_ID == '') }}
        run: |
          echo "::notice::SLACK_BOT_TOKEN or SLACK_CI_CHANNEL_ID is unset. Skipping Slack. Tim sets these later."
          exit 0

      - name: Slack notification on Knip failure
        if: ${{ needs.knip.result == 'failure' && env.SLACK_BOT_TOKEN != '' && env.SLACK_CI_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CI_CHANNEL_ID }}",
              "text": "Nightly Knip audit failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Nightly Knip Audit Failed*\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }

      - name: Slack notification on unit test failure
        if: ${{ needs.unit-tests.result == 'failure' && env.SLACK_BOT_TOKEN != '' && env.SLACK_CI_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CI_CHANNEL_ID }}",
              "text": "Nightly unit tests failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Nightly Unit Tests Failed*\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }

      - name: Slack notification on E2E failure
        if: ${{ needs.e2e-tests.result == 'failure' && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: '#alerts-critical'
          author_name: 'Nightly Tests'
          custom_payload: |
            {
              "text": "Nightly E2E tests failed",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Workflow", "value": "Nightly E2E Tests", "short": true },
                    { "title": "Status", "value": "Failed", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": false }
                  ]
                }
              ]
            }

      - name: Slack notification on all success
        if: >-
          needs.knip.result == 'success' &&
          needs.unit-tests.result == 'success' &&
          needs.e2e-tests.result == 'success' &&
          env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: '#monitoring'
          author_name: 'Nightly Tests'
          custom_payload: |
            {
              "text": "Nightly tests passed",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    { "title": "Workflow", "value": "Nightly Tests", "short": true },
                    { "title": "Status", "value": "All Passed", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": false }
                  ]
                }
              ]
            }
