name: Automation Liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: A hosted dead-man reads every registered automation's run receipt (GitHub runs, the public lanes status gist, Summer and production health) outside the hosts that run those loops, so a silent host cannot hide its own silence; it only files or resolves fingerprinted Linear issues.
# removal-trigger: Remove when the lanes doctor and an independent hosted deadman both read canon/automation-registry.jsonl and alert on silence for 30 consecutive days.

# Dead-man check for canon/automation-registry.jsonl (Tim 2026-10-20: every
# automation registered, measured and auditable; silence is an alert). No new
# clock (JOV-INV-042): it follows Production Continuity Guard, which the Gem
# lanes tick fires every 5 minutes and GitHub's cron backstops when Gem is down.
# Runner Health Monitor is a telemetry node, and the workflow topology contract
# forbids workflow_run edges out of telemetry (observer recursion). The job runs
# when no check ran in the last 20 minutes (a time gate, see the gate job) to keep its ~40 GitHub API reads
# per run inside the shared GITHUB_TOKEN budget; the lanes doctor alerts when no
# run lands for 60 minutes.

on:
  workflow_run:
    workflows: [Production Continuity Guard]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      file:
        description: File or resolve Linear issues for critical loops
        type: boolean
        default: true

concurrency:
  group: automation-liveness
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # 2026-10-26: the old gate ran the check on guard run numbers ending in 0 or 5, which assumed the lanes tick
  # fires the guard every 5 minutes. With the tick slow, guard runs arrived every 10-20 minutes and the check
  # ran once in 70 minutes, so a stale lanes status went unreported. The gate is now time based: the check is
  # due when no check ran in the last 20 minutes (a few cheap reads), however irregular the guard runs are.
  gate:
    name: Liveness check due
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            packages/api-client
            .nvmrc
          persist-credentials: false
      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # github-token-budget: 7 calls/run - time-gate reads up to 6 recent runs of this workflow (one run list plus per-run views)
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(date -u +%s)
          due=true
          for id in $(node packages/api-client/cli.ts gh --priority poll -- run list --repo "$GITHUB_REPOSITORY" --workflow automation-liveness.yml --limit 6 \
              --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            at=$(node packages/api-client/cli.ts gh --priority poll -- api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '.jobs[] | select(.name == "Check automation heartbeats" and .conclusion == "success") | .completed_at' 2>/dev/null | head -1)
            if [ -n "$at" ]; then
              age=$(( now - $(date -u -d "$at" +%s) ))
              [ "$age" -lt 1200 ] && due=false
              break
            fi
          done
          echo "due=$due" >> "$GITHUB_OUTPUT"

  # Budget diagnostics share the existing due gate. A failed token mint must
  # not fail Check automation heartbeats or defeat its 20-minute throttle.
  installation-budget:
    name: Sample installation REST budgets
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # 2026-10-24: the shared installation REST budget ran dry and a dozen PRs
      # went red until a manual rerun. GET /rate_limit is free; each sample is a
      # point in the consumption series and alarms below 15% remaining. Reuses
      # this sanctioned ~25m backstop (JOV-INV-042: no new clock).
      - name: Mint CI App read token for budget sample
        id: ci-app-token
        if: ${{ always() && vars.CI_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Sample GitHub installation budgets
        id: installation-budget
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_APP_TOKEN: ${{ steps.ci-app-token.outputs.token }}
        run: node scripts/installation-budget-sentinel.mjs

      - name: Send Slack Alert on Low Installation Budget
        if: ${{ always() && (steps.installation-budget.outputs.shared_github_token_low == 'true' || steps.installation-budget.outputs.ci_app_low == 'true') }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: "#alerts-production"
          author_name: "CI Budget Sentinel"
          custom_payload: |
            {
              "text": "GitHub REST budget below 15% (shared GITHUB_TOKEN: ${{ steps.installation-budget.outputs.shared_github_token_remaining }}/${{ steps.installation-budget.outputs.shared_github_token_limit }}, CI App: ${{ steps.installation-budget.outputs.ci_app_remaining }}/${{ steps.installation-budget.outputs.ci_app_limit }}). Fleet-rule gates defer (exit 75) until the reset.",
              "attachments": [{ "color": "warning", "fields": [{ "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>", "short": false }] }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  liveness:
    name: Check automation heartbeats
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # JOV-6813: independent of the canary's own job/alert steps. Reuse this
      # sanctioned ~25m backstop; a daily AI-only success is not a heartbeat.
      - name: Check synthetic canary heartbeat
        id: synthetic-heartbeat
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/synthetic-canary-liveness.mjs

      - name: Send Slack Alert on Synthetic Silence
        if: ${{ always() && (steps.synthetic-heartbeat.outcome != 'success' || steps.synthetic-heartbeat.outputs.test_status != 'passed') }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: "#alerts-production"
          author_name: "Synthetic Monitoring"
          custom_payload: |
            {
              "text": "Production Synthetic Monitoring Failed - jov.ie",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Failed Tests", "value": ${{ toJSON(steps.synthetic-heartbeat.outputs.failed_tests || 'JOV-6813 dead-man: heartbeat check did not complete') }}, "short": false },
                  { "title": "Canary", "value": ${{ toJSON(steps.synthetic-heartbeat.outputs.run_url || format('{0}/{1}/actions/workflows/synthetic-monitoring.yml', github.server_url, github.repository)) }}, "short": false },
                  { "title": "Watchdog", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: File synthetic heartbeat Linear issue
        if: ${{ always() && (steps.synthetic-heartbeat.outcome != 'success' || steps.synthetic-heartbeat.outputs.test_status != 'passed') }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          TEST_STATUS: failed
          FAILED_TESTS: >-
            ${{ steps.synthetic-heartbeat.outputs.failed_tests || 'JOV-6813 dead-man: heartbeat check did not complete' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/synthetic-monitoring-intake.mjs

      - name: Restore previous alert state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p liveness
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=automation-liveness-state&per_page=100" --jq '([(.artifacts // [])[] | select(.expired|not)] | sort_by(.created_at) | last | .id) // empty' || true)"
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > liveness/prior.zip || true
            unzip -p liveness/prior.zip state.json > liveness/state.json 2>/dev/null || true
          fi

      - name: Compare receipts to max staleness
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_INTAKE_DISABLED: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
          FILE_ISSUES: ${{ (github.event_name != 'workflow_dispatch' || inputs.file) && 'true' || 'false' }}
        run: |
          args=(
            --output liveness/report.json
            --events liveness/stage-events.ndjson
            --decisions liveness/decisions.json
            --previous liveness/state.json
          )
          if [ "$FILE_ISSUES" = "true" ]; then args+=(--file); fi
          node scripts/automation-liveness.mjs "${args[@]}"

      # Release-lag dead-man: a green Production Controller run proves nothing because Coalesce can
      # skip the release as superseded. Alerts, naming the blocking step, when production has not
      # advanced in 3h while main has.
      # github-token-budget: 3 calls/run - names the blocking controller step, only when production lags
      - name: Production release lag
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-lag-check.mjs

      - name: Save alert state
        if: ${{ always() && hashFiles('liveness/state.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-liveness-state
          path: liveness/state.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Preserve synthetic dead-man failure
        if: ${{ always() && (steps.synthetic-heartbeat.outcome != 'success' || steps.synthetic-heartbeat.outputs.test_status != 'passed') }}
        run: |
          echo '::error::JOV-6813 synthetic canary heartbeat missing, skipped, failed, stalled, or unreadable'
          exit 1

      - name: Save run receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-liveness-receipts
          path: |
            liveness/report.json
            liveness/stage-events.ndjson
            liveness/decisions.json
          if-no-files-found: ignore
          retention-days: 90
