name: Automation Liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: A hosted dead-man reads every registered automation's run receipt (GitHub runs, the public lanes status gist, Summer and production health) outside the hosts that run those loops, so a silent host cannot hide its own silence; it only files or resolves fingerprinted Linear issues.
# removal-trigger: Remove when the lanes doctor and an independent hosted deadman both read canon/automation-registry.jsonl and alert on silence for 30 consecutive days.

# Dead-man check for canon/automation-registry.jsonl (Tim 2026-10-20: every
# automation registered, measured and auditable; silence is an alert). No new
# clock (JOV-INV-042): it follows Production Continuity Guard, which the Gem
# lanes tick fires every 5 minutes and GitHub's cron backstops when Gem is down.
# Runner Health Monitor is a telemetry node, and the workflow topology contract
# forbids workflow_run edges out of telemetry (observer recursion). The job runs
# on every fifth guard run (about 25 minutes) to keep its ~40 GitHub API reads
# per run inside the shared GITHUB_TOKEN budget; the lanes doctor alerts when no
# run lands for 60 minutes.

on:
  workflow_run:
    workflows: [Production Continuity Guard]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      file:
        description: File or resolve Linear issues for critical loops
        type: boolean
        default: true

concurrency:
  group: automation-liveness
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  liveness:
    name: Check automation heartbeats
    if: >-
      github.event_name == 'workflow_dispatch' ||
      endsWith(format('{0}', github.event.workflow_run.run_number), '0') ||
      endsWith(format('{0}', github.event.workflow_run.run_number), '5')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # JOV-6813: independent of the canary's own job/alert steps. Reuse this
      # sanctioned ~25m backstop; a daily AI-only success is not a heartbeat.
      - name: Check synthetic canary heartbeat
        id: synthetic-heartbeat
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/synthetic-canary-liveness.mjs

      - name: Send Slack Alert on Synthetic Silence
        if: ${{ always() && (steps.synthetic-heartbeat.outcome != 'success' || steps.synthetic-heartbeat.outputs.test_status != 'passed') }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: custom
          channel: '#alerts-production'
          author_name: 'Synthetic Monitoring'
          custom_payload: |
            {
              "text": "Production Synthetic Monitoring Failed - jov.ie",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Failed Tests", "value": ${{ toJSON(steps.synthetic-heartbeat.outputs.failed_tests || 'JOV-6813 dead-man: heartbeat check did not complete') }}, "short": false },
                  { "title": "Canary", "value": ${{ toJSON(steps.synthetic-heartbeat.outputs.run_url || format('{0}/{1}/actions/workflows/synthetic-monitoring.yml', github.server_url, github.repository)) }}, "short": false },
                  { "title": "Watchdog", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: File synthetic heartbeat Linear issue
        if: ${{ always() && (steps.synthetic-heartbeat.outcome != 'success' || steps.synthetic-heartbeat.outputs.test_status != 'passed') }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
          TEST_STATUS: failed
          FAILED_TESTS: >-
            ${{ steps.synthetic-heartbeat.outputs.failed_tests || 'JOV-6813 dead-man: heartbeat check did not complete' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/synthetic-monitoring-intake.mjs

      - name: Restore previous alert state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p liveness
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=automation-liveness-state&per_page=100" --jq '([(.artifacts // [])[] | select(.expired|not)] | sort_by(.created_at) | last | .id) // empty' || true)"
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > liveness/prior.zip || true
            unzip -p liveness/prior.zip state.json > liveness/state.json 2>/dev/null || true
          fi

      - name: Compare receipts to max staleness
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_INTAKE_DISABLED: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
          FILE_ISSUES: ${{ (github.event_name != 'workflow_dispatch' || inputs.file) && 'true' || 'false' }}
        run: |
          args=(
            --output liveness/report.json
            --events liveness/stage-events.ndjson
            --decisions liveness/decisions.json
            --previous liveness/state.json
          )
          if [ "$FILE_ISSUES" = "true" ]; then args+=(--file); fi
          node scripts/automation-liveness.mjs "${args[@]}"

      - name: Save alert state
        if: ${{ always() && hashFiles('liveness/state.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-liveness-state
          path: liveness/state.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Preserve synthetic dead-man failure
        if: ${{ always() && (steps.synthetic-heartbeat.outcome != 'success' || steps.synthetic-heartbeat.outputs.test_status != 'passed') }}
        run: |
          echo '::error::JOV-6813 synthetic canary heartbeat missing, skipped, failed, stalled, or unreadable'
          exit 1

      - name: Save run receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-liveness-receipts
          path: |
            liveness/report.json
            liveness/stage-events.ndjson
            liveness/decisions.json
          if-no-files-found: ignore
          retention-days: 90
