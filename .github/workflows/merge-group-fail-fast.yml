# JOV-13106: LYB's own-run cancellation; no inputs can select another run.
# A new `gh` call site would grow the shrink-only external API ratchet, so this
# job checks out only the trusted default-branch client helper (never the
# merge-group head) and cancels GITHUB_RUN_ID.
# github-token-budget: 1 calls/run - one own-run cancel after a required lane failure; no green-group calls
name: Merge Group Fail Fast
on:
  workflow_call:
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the trusted cancel helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: packages/api-client/cancel-github-run.mjs
          persist-credentials: false
      - name: Cancel the rest of this merge-group run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/api-client/cancel-github-run.mjs
