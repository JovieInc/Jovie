name: Taste Label Guard

# Compatibility backstop for retired pre-landing taste holds. Taste is steered
# before a PR opens or certified after landing behind a feature flag, so every
# `needs:taste` / `needs-human-taste` label is removed at the PR boundary.
#
# Logic + tests: scripts/lib/taste-label-guard.mjs (+ __tests__).
# See .claude/rules/release.md and docs/company/autonomous-shipping-doctrine.md.

on:
  # Base-controlled workflow definition; PR head is never checked out.
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  group: taste-label-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: Taste Label Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Same-repo PRs only (fork PRs get a read-only token), and only when the
    # label just applied is a retired taste hold.
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      (
        github.event.label.name == 'needs:taste' ||
        github.event.label.name == 'needs-human-taste'
      )
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout exact trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Clear retired taste hold
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/taste-label-guard.mjs fix-pr --pr "$PR_NUMBER" --apply
