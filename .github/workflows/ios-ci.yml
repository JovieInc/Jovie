name: iOS CI

on:
  # Merge groups call the fast unit + coverage gate. TestFlight calls the full
  # simulator/UI regression before upload. Source PRs receive the portable iOS
  # contract inside ci-fast.
  workflow_call:
    inputs:
      concurrency-key:
        description: Stable merge-queue PR identity; empty outside merge groups.
        required: false
        type: string
      checkout-ref:
        description: Exact authorized SHA for release validation; empty uses the event SHA.
        required: false
        type: string
      full-regression:
        description: Run the complete simulator UI and screenshot regression lane.
        required: false
        default: false
        type: boolean
      mac-first:
        description: Prefer an idle self-hosted Mac (mac-lane-route.yml); hosted otherwise.
        required: false
        default: false
        type: boolean
      mac-child:
        description: Set only by mac-lane.yml; runs the lane on the self-hosted Macs.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      full-regression:
        description: Run the complete simulator UI and screenshot regression lane.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # A regenerated merge-group head supersedes the prior iOS flight for that PR.
  # Manual/direct-main calls remain isolated by exact SHA and never cancel.
  group: ios-ci-${{ github.workflow }}-${{ inputs.concurrency-key || github.ref }}
  cancel-in-progress: ${{ inputs.concurrency-key != '' || github.ref != 'refs/heads/main' }}

jobs:
  # The fast gate prefers an idle self-hosted Mac (a separate child run that
  # the route cancels if no Mac picks it up); otherwise this hosted job runs.
  # Release regressions never opt in and always run on hosted macOS.
  mac:
    name: Mac Route
    if: ${{ inputs.mac-first && !inputs.mac-child && !inputs.full-regression }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/mac-lane-route.yml
    with:
      lane: ios
      checkout-sha: ${{ inputs.checkout-ref || github.sha }}
      supersede-key: ${{ inputs.concurrency-key }}

  test:
    name: ${{ inputs.full-regression && 'Full Simulator Regression' || 'Fast Unit + Coverage' }}
    needs: [mac]
    if: ${{ !cancelled() && (inputs.mac-child || needs.mac.result == 'skipped' || needs.mac.outputs.run_hosted == 'true') }}
    runs-on: ${{ inputs.mac-child && fromJSON('["self-hosted","macOS","ARM64","jovie-mac"]') || 'macos-26' }}
    timeout-minutes: ${{ inputs.full-regression && 55 || 18 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: iOS best-practices lint
        run: |
          bash scripts/ios-best-practices-lint.sh apps/ios/Jovie
          bash scripts/ios-best-practices-lint.sh apps/ios/Packages/JovieKit/Sources
          bash scripts/ios-best-practices-lint.sh apps/ios/JovieMac

      - name: Test iOS release configuration scripts
        run: |
          node --test apps/ios/scripts/write-configuration.test.mjs \
          apps/ios/scripts/capture-screenshots.test.mjs \
          apps/ios/scripts/run-xcodebuild.test.mjs \
          apps/ios/scripts/validate-wallet-release-env.test.mjs \
          apps/ios/scripts/validate-testflight-env.test.mjs \
          apps/ios/scripts/validate-testflight-artifact.test.mjs \
          apps/ios/scripts/settings-style-guard.test.mjs

      - name: Ensure iOS local configuration exists
        run: bash apps/ios/scripts/ensure-configuration.sh

      - name: Show Xcode version
        id: xcode-version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          printf 'cache_key=%s\n' "$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # GitHub-hosted macOS jobs are isolated VMs. Cache only immutable SwiftPM
      # resolution/checkouts, never the mutable build products in DerivedData.
      # The Xcode version and Package.resolved are both part of the key so a
      # toolchain or dependency change cannot restore an incompatible cache.
      # Persistent Mac runners already retain these packages locally; uploading
      # their multi-GB cache can exhaust the job budget after tests pass.
      - name: Restore Swift package cache
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ios-ci/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          # One line: a folded key would insert spaces and never share the
          # restore-keys prefix below.
          key: ${{ runner.os }}-swiftpm-${{ steps.xcode-version.outputs.cache_key }}-${{ hashFiles('apps/ios/Jovie.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('apps/ios/Jovie.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ steps.xcode-version.outputs.cache_key }}-${{ hashFiles('apps/ios/Jovie.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Validate app icon
        run: bash apps/ios/scripts/validate-app-icon.sh

      - name: Resolve Swift package dependencies
        timeout-minutes: 5
        run: bash apps/ios/scripts/run-xcodebuild.sh -resolvePackageDependencies -derivedDataPath .build/ios-ci

      - name: Test shared JovieKit package
        run: swift test --package-path apps/ios/Packages/JovieKit --enable-code-coverage

      - name: Compile shared theme for macOS
        timeout-minutes: 3
        run: |
          mac_theme_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc -typecheck -swift-version 5 \
            -sdk "$mac_theme_sdk" -target "$(uname -m)-apple-macosx14.0" \
            apps/ios/Jovie/DesignSystem/JovieTheme.swift

      - name: Test native Mac development boundary
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/macos-native-tests
          for mac_configuration in Debug Release; do
            xcodebuild test -project apps/ios/JovieMac.xcodeproj -scheme JovieMac \
              -configuration "$mac_configuration" -destination platform=macOS \
              -derivedDataPath .build/macos-native-ci \
              -resultBundlePath "artifacts/macos-native-tests/$mac_configuration.xcresult" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_TESTABILITY=YES
          done

      - name: Upload native Mac development results
        if: ${{ always() && hashFiles('artifacts/macos-native-tests/**/*.xcresult/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-native-tests-${{ inputs.checkout-ref || github.sha }}-${{ github.run_attempt }}
          path: artifacts/macos-native-tests/*.xcresult
          if-no-files-found: error
          retention-days: 5

      - name: Run fast unit and coverage gate
        if: ${{ !inputs.full-regression }}
        timeout-minutes: 15
        env:
          # GitHub-hosted runners are fresh. Let xcodebuild boot its selected
          # simulator while it builds instead of blocking on an eager reset.
          # The persistent self-hosted Mac resets to avoid inherited state.
          JOVIE_IOS_RESET_SIMULATOR: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
          JOVIE_IOS_XCODEBUILD_TIMEOUT_SECONDS: "840"
        run: |
          bash apps/ios/scripts/run-unit-tests.sh
          bash apps/ios/scripts/check_coverage.sh

      - name: Upload fast-gate xcresult
        if: ${{ always() && !inputs.full-regression && hashFiles('artifacts/ios-test-results/Jovie.xcresult/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ inputs.checkout-ref || github.sha }}-${{ github.run_attempt }}
          path: artifacts/ios-test-results/Jovie.xcresult
          if-no-files-found: error
          retention-days: 5

      - name: Run full simulator regression
        if: ${{ inputs.full-regression }}
        timeout-minutes: 30
        env:
          # GitHub-hosted macOS runners are fresh. A shutdown/boot reset added
          # ten minutes to the release run without providing isolation.
          JOVIE_IOS_RESET_SIMULATOR: "0"
          JOVIE_IOS_XCODEBUILD_TIMEOUT_SECONDS: "1680"
        run: bash apps/ios/scripts/run-xcodebuild.sh test -derivedDataPath .build/ios-ci

      - name: Capture simulator screenshots
        if: ${{ inputs.full-regression }}
        timeout-minutes: 15
        env:
          IOS_SCREENSHOT_DERIVED_DATA: .build/ios-ci
          IOS_SCREENSHOT_REUSE_BUILD: "1"
          IOS_SCREENSHOT_CAPTURE_IPAD: "0"
          IOS_SCREENSHOT_REQUIRE_IPAD: "0"
        run: bash apps/ios/scripts/capture-screenshots.sh

      - name: Upload simulator screenshots
        if: ${{ inputs.full-regression }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ inputs.checkout-ref || github.sha }}-${{ github.run_attempt }}
          path: artifacts/ios-screenshots/*.png
          if-no-files-found: error
          retention-days: 5
