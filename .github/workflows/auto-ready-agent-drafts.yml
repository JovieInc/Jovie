name: Auto-Ready Agent Drafts
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: Hosted GitHub App token undrafts same-repo green-source drafts after PR Ready and required checks succeed CLEAN; this hop never enables auto-merge or enrolls the merge queue.
# removal-trigger: Remove the workflow_run wake when GitHub natively undrafts same-repo drafts that already satisfy required SUCCESS and CLEAN without a hosted App-token hop.

# Two controllers share this workflow:
#
# 1. Writer-owned proof recovery (manual dispatch only). Branch prefixes, bot
#    authors, and FX provenance never authorize promotion; an exact-head
#    jovie-writer-pr-proof/v1 receipt does. The owning writer's successful path
#    is scripts/writer-owned-pr-promote.sh. This job never waits for green.
#
# 2. Green-source undraft (event-driven). When a draft on JovieInc/Jovie has
#    PR Ready + required checks SUCCESS and mergeable CLEAN, undraft it so
#    Auto-Enroll / jovie-bot can pick it up. This job never enables auto-merge
#    and never enrolls the merge queue.
#
# Green-source never mutates HOLD #17156. Tim-hold / machine hold labels
# (GREEN_SOURCE_HOLD_LABELS) cover other open holds; merged PR numbers are
# not numeric exemptions.
#
# Manual dispatch without pr_number remains writer-proof recovery. Dispatch
# with pr_number + head_sha is a targeted green-source undraft. Opt out
# per-PR with machine/security/hold labels or controlled-proof/canary markers.

# Wake only on the workflows that publish the required source contexts
# (Source Validation: PR Ready + Migration Guard; Fork PR Gate; PR Size Guard).
# CI runs only on merge_group/push and check_suite fired for every workflow on
# every head, so both were pure duplicate wakes (~20% of runs, all no-ops).
on:
  workflow_run:
    workflows: ['Source Validation', 'Fork PR Gate', 'PR Size Guard']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional exact draft PR to undraft when already green+CLEAN'
        required: false
        type: string
      head_sha:
        description: 'Required exact 40-character head SHA when pr_number is set'
        required: false
        type: string

# Concurrency is job-scoped on purpose. A workflow-level group made every
# skipped wake (job `if:` false) enter the same group and replace the single
# pending real run, silently dropping other PRs' green events.

permissions:
  contents: read

jobs:
  auto-ready:
    # Writer-proof recovery stays manual. CI/check_suite must not scan 200 PRs
    # looking for proof receipts — that path is author-owned.
    # QUEUE_FREEZE=1 (repo variable): this job arms auto-merge, so it stays off.
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number == '' && vars.QUEUE_FREEZE != '1'
    concurrency:
      group: auto-ready-agent-drafts
      cancel-in-progress: false
    # Fleet controller: use the hosted image contract so `gh` is always
    # available. Some self-hosted fast runners intentionally lack it.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate short-lived Jovie App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Use the installation identity for the paired PR mutations.
          # Installation permissions stay unbounded here so commit and
          # Rolling CI Dispatch run provenance can be read.
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request events otherwise checkout the triggering merge ref,
          # which may not contain the current fleet scripts or tests.
          ref: main
          persist-credentials: false

      - name: Verify GitHub CLI
        run: gh --version

      - name: Recover proven writer-owned promotion drift
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GH_RETRY_ATTEMPTS: 8
          GH_RETRY_MAX_DELAY: 60
        run: bash scripts/auto-ready-agent-drafts.sh

  green-source:
    # Event-driven undraft when required source checks succeed. Job-level
    # filters keep failed/cancelled/unrelated suites from provisioning a runner.
    # No ready_for_review listener — merge-queue-green-enroll.yml owns that event.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_target'
        ) &&
        (
          startsWith(github.event.workflow_run.path, '.github/workflows/source-validation.yml') ||
          startsWith(github.event.workflow_run.path, '.github/workflows/fork-pr-gate.yml') ||
          startsWith(github.event.workflow_run.path, '.github/workflows/pr-size-guard.yml')
        )
      )
    # One lane per PR (or head). A newer completion cancels this run during the
    # debounce, before the Jovie Bot token is minted. Different PRs never share
    # a group. There is no workflow-level group: that dropped other PRs.
    concurrency:
      group: auto-ready-green-source-${{ github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Debounce repeated source completions
        if: github.event_name == 'workflow_run'
        run: sleep 20

      - name: Generate short-lived Jovie App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify GitHub CLI
        run: gh --version

      - name: Undraft green-source CLEAN drafts
        id: green-source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GH_RETRY_ATTEMPTS: 8
          GH_RETRY_MAX_DELAY: 60
          TARGET_PR: ${{ github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || '' }}
          TARGET_HEAD: ${{ github.event.inputs.head_sha || github.event.workflow_run.head_sha || '' }}
          # Missed-event recovery rides only the PR Ready producer's wakes, one
          # draft per wake, rotated by run number: every candidate is revisited
          # within a few wakes without a per-event full scan of every draft.
          MISSED_COHORT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Source Validation' && '1' || '0' }}
          RUN_OFFSET: ${{ github.run_number }}
        run: bash scripts/auto-ready-green-drafts.sh
