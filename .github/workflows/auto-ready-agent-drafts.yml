name: Auto-Ready Agent Drafts

# Promotes only trusted bot-created drafts, or exact current heads produced
# by the trusted FX writer. Branch prefixes never authorize. The promotion
# action pairs ready-for-review with native auto-merge intent; it never waits
# for checks to turn green and never leaves an undrafted PR without auto-merge.
# GitHub keeps the merge blocked until the existing source checks pass.
#
# Fires on the source event immediately, with CI completion as a retry signal,
# plus manual dispatch.
# Enable this workflow only after the provenance selector and App-token
# mutation path land. Opt out per-PR with taste/security/hold labels or
# explicit controlled-proof/canary markers.

on:
  # The owning agent's final source update must request ready + auto-merge while
  # that one source CI flight is still pending. `ready_for_review` is omitted on
  # purpose: an unchanged head never needs another controller or CI flight.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: auto-ready-agent-drafts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-ready:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion != 'cancelled'
      )
    # Fleet controller: use the hosted image contract so `gh` is always
    # available. Some self-hosted fast runners intentionally lack it.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate short-lived Jovie App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Use the installation identity for the paired PR mutations.
          # Installation permissions stay unbounded here so commit and
          # Rolling CI Dispatch run provenance can be read.
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}

      - name: Checkout main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request events otherwise checkout the triggering merge ref,
          # which may not contain the current fleet scripts or tests.
          ref: main
          persist-credentials: false

      - name: Verify GitHub CLI
        run: gh --version

      - name: Auto-ready trusted bot and FX-repaired drafts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GH_RETRY_ATTEMPTS: 8
          GH_RETRY_MAX_DELAY: 60
        run: bash scripts/auto-ready-agent-drafts.sh
