name: Production Controller Health
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: Deployed-base marker healing dispatches only the bounded marker-recovery re-proof inside the production-mutation FIFO; it never redeploys, aliases, promotes, or rolls back.
# revisit-trigger: Remove when the Production Controller heals interrupted deployed markers in-band instead of via a dispatched recovery run.

on:
  # Production Controller completion is the primary reconciliation signal.
  # Marker Recovery dispatches Fleet Gate Refresh directly after durable bytes;
  # keeping it out of this trigger also prevents duplicate CI replays.
  workflow_run:
    workflows: [Production Controller]
    types: [completed]
    branches: [main]
  # polling-exception: GitHub may drop a workflow_run delivery. This once-daily
  # audit is a safety net only, owned by Gem/GitHub, with 24h maximum staleness.
  # Revisit when GitHub exposes durable delivery receipts for workflow_run.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-controller-health
  cancel-in-progress: false

jobs:
  recover:
    name: Recover one exact controller generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate exact current production controller
        id: evaluate
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "needs_manual=false"
            echo "recovery_reason=not_required"
            echo "run_url=https://github.com/$REPOSITORY/actions"
            echo "short_sha=unknown"
          } >> "$GITHUB_OUTPUT"

          incident() {
            local reason="$1"
            echo "needs_manual=true" >> "$GITHUB_OUTPUT"
            echo "recovery_reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::warning::Production controller requires manual recovery: $reason"
            trap - EXIT
            exit 0
          }
          policy_generation_state() {
            local checked_out_sha="$1"
            local current_sha="$2"
            if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]] ||
              [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo invalid
            elif [ "$checked_out_sha" != "$current_sha" ]; then
              echo superseded
            else
              echo current
            fi
          }
          on_exit() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              incident evaluation_error
            fi
          }
          trap on_exit EXIT

          current_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha // empty')"
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]] || incident invalid_current_main
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${current_sha:0:7}" >> "$GITHUB_OUTPUT"

          checked_out_sha="$(git rev-parse --verify 'HEAD^{commit}' 2>/dev/null || true)"
          policy_state="$(policy_generation_state "$checked_out_sha" "$current_sha")"
          case "$policy_state" in
            invalid)
              incident invalid_checked_out_policy
              ;;
            superseded)
              echo "recovery_reason=policy_generation_superseded" >> "$GITHUB_OUTPUT"
              echo "::warning::Health policy $checked_out_sha does not match current main $current_sha; proving live jov.ie bind before skip-success."
              trap - EXIT
              node .github/scripts/assert-live-production-bind.mjs --main-sha "$current_sha"
              echo "Live production is bound to current main; superseded health policy is non-mutating."
              exit 0
              ;;
            current) ;;
            *) incident malformed_policy_generation_state ;;
          esac

          ci_workflow_json="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml")"
          jq -e '
            type == "object" and
            (.id | type == "number" and . > 0) and
            .name == "CI" and
            .path == ".github/workflows/ci.yml" and
            .state == "active"
          ' >/dev/null <<<"$ci_workflow_json" || incident invalid_ci_workflow
          ci_workflow_id="$(jq -r '.id' <<<"$ci_workflow_json")"

          controller_workflow_json="$(gh api \
            "repos/$REPOSITORY/actions/workflows/production-controller.yml")"
          jq -e '
            type == "object" and
            (.id | type == "number" and . > 0) and
            .name == "Production Controller" and
            .path == ".github/workflows/production-controller.yml" and
            .state == "active"
          ' >/dev/null <<<"$controller_workflow_json" || incident invalid_controller_workflow
          controller_workflow_id="$(jq -r '.id' <<<"$controller_workflow_json")"

          # Deployed-base marker audit. An interrupted verified marker on the
          # canonical deployed SHA classifies recovery_available, which is
          # never admissible as a release base — every later exact-main
          # controller fails authorize until the marker is re-proven. The
          # generation's own controller rerun cannot heal it once main has
          # moved on (coalescing yields the lease to the newer generation),
          # so the bounded marker-recovery workflow is the only remaining
          # proof path for a still-deployed but superseded generation.
          deployed_sha=""
          if deployed_build_info="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            "https://jov.ie/api/health/build-info" 2>/dev/null)"; then
            deployed_sha="$(jq -r '.commitSha // empty' <<<"$deployed_build_info" 2>/dev/null || true)"
          fi
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::Canonical build-info did not expose an exact deployed SHA; deployed-base marker audit skipped."
            deployed_sha=""
          fi
          if [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$current_sha" ]; then
            deployed_marker_json="$(node .github/scripts/production-marker-state.mjs \
              --sha "$deployed_sha" \
              --repo "$REPOSITORY" \
              --controller-workflow-id "$controller_workflow_id")"
            jq -e '
              type == "object" and
              (.state | IN("none", "pending", "recovery_available", "verified", "manual")) and
              (.reason | type == "string" and length > 0)
            ' >/dev/null <<<"$deployed_marker_json" ||
              incident malformed_deployed_marker_classification
            deployed_marker_state="$(jq -r '.state' <<<"$deployed_marker_json")"
            deployed_marker_reason="$(jq -r '.reason' <<<"$deployed_marker_json")"
            case "$deployed_marker_state" in
              verified|none)
                ;;
              pending)
                echo "Deployed generation $deployed_sha has an in-flight marker attempt; nothing to heal."
                exit 0
                ;;
              manual)
                incident "deployed_$deployed_marker_reason"
                ;;
              recovery_available)
                [ "$deployed_marker_reason" = "one_interrupted_marker_safe_to_rerun" ] ||
                  incident contradictory_deployed_recovery_authority
                deployed_run="$(jq -r '.controllerRun // 0' <<<"$deployed_marker_json")"
                deployed_attempt="$(jq -r '.controllerAttempt // 0' <<<"$deployed_marker_json")"
                deployed_deployment_id="$(jq -r '.deploymentId // ""' <<<"$deployed_marker_json")"
                [[ "$deployed_run" =~ ^[1-9][0-9]*$ ]] &&
                  [[ "$deployed_attempt" =~ ^[1-9][0-9]*$ ]] &&
                  [[ "$deployed_deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]] ||
                  incident malformed_deployed_recovery_evidence

                # One recovery per generation: an in-flight re-proof already
                # owns this SHA (the recovery run-name carries it verbatim).
                inflight="$(gh api \
                  "repos/$REPOSITORY/actions/workflows/production-marker-recovery.yml/runs?per_page=30" \
                  --jq --arg sha "$deployed_sha" \
                  '[.workflow_runs[] | select(.status != "completed" and ((.display_title // "") | contains($sha)))] | length')"
                if [ "$inflight" != "0" ]; then
                  echo "Marker recovery for $deployed_sha is already in flight."
                  exit 0
                fi

                # TOCTOU: re-prove the live bind and the classification at the
                # dispatch boundary; a moved deployment or a changed marker
                # state makes the heal neutral.
                boundary_build_info="$(curl --fail --silent --show-error \
                  --connect-timeout 5 --max-time 15 \
                  "https://jov.ie/api/health/build-info")" || {
                  echo "Canonical build-info became unreadable at the dispatch boundary; recovery dispatch is neutral."
                  exit 0
                }
                boundary_sha="$(jq -r '.commitSha // empty' <<<"$boundary_build_info")"
                if [ "$boundary_sha" != "$deployed_sha" ]; then
                  echo "Deployed SHA moved to $boundary_sha during evaluation; recovery dispatch is neutral."
                  exit 0
                fi
                boundary_marker="$(node .github/scripts/production-marker-state.mjs \
                  --sha "$deployed_sha" \
                  --repo "$REPOSITORY" \
                  --controller-workflow-id "$controller_workflow_id")"
                if [ "$(jq -r '.state // empty' <<<"$boundary_marker")" != "recovery_available" ]; then
                  echo "Deployed marker state changed during evaluation; recovery dispatch is neutral."
                  exit 0
                fi
                gh workflow run production-marker-recovery.yml \
                  -f sha="$deployed_sha" \
                  -f deployment_id="$deployed_deployment_id" \
                  -f controller_run="$deployed_run" \
                  -f controller_attempt="$deployed_attempt"
                echo "run_url=https://github.com/$REPOSITORY/actions" >> "$GITHUB_OUTPUT"
                echo "recovery_reason=deployed_marker_recovery_dispatched" >> "$GITHUB_OUTPUT"
                echo "Dispatched bounded marker recovery for deployed generation $deployed_sha."
                exit 0
                ;;
            esac
          fi

          marker_state_json="$(node .github/scripts/production-marker-state.mjs \
            --sha "$current_sha" \
            --repo "$REPOSITORY" \
            --controller-workflow-id "$controller_workflow_id")"
          jq -e '
            type == "object" and
            (.state | IN("none", "pending", "recovery_available", "verified", "manual")) and
            (.reason | type == "string" and length > 0)
          ' >/dev/null <<<"$marker_state_json" || incident malformed_marker_classification
          marker_state="$(jq -r '.state' <<<"$marker_state_json")"
          marker_reason="$(jq -r '.reason' <<<"$marker_state_json")"
          case "$marker_state" in
            verified)
              echo "Current main $current_sha already has exact verified production evidence."
              exit 0
              ;;
            pending)
              echo "Production marker recovery is already pending ($marker_reason)."
              exit 0
              ;;
            manual)
              incident "$marker_reason"
              ;;
            recovery_available)
              [ "$marker_reason" = "one_interrupted_marker_safe_to_rerun" ] || \
                incident contradictory_recovery_authority
              run_id="$(jq -r '.controllerRun // 0' <<<"$marker_state_json")"
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || incident malformed_recovery_run
              echo "run_url=https://github.com/$REPOSITORY/actions/runs/$run_id" \
                >> "$GITHUB_OUTPUT"

              # TOCTOU boundary: re-read the marker-owned exact attempt, its
              # rollback job, the latest run, the lease listing, and main
              # immediately before requesting the sole full rerun.
              exact_attempt="$(gh api \
                "repos/$REPOSITORY/actions/runs/$run_id/attempts/1")"
              jq -e \
                --argjson run_id "$run_id" \
                --arg sha "$current_sha" \
                --arg repo "$REPOSITORY" \
                --argjson workflow_id "$controller_workflow_id" '
                .id == $run_id and .run_attempt == 1 and
                .workflow_id == $workflow_id and
                .path == ".github/workflows/production-controller.yml" and
                .head_sha == $sha and .head_branch == "main" and
                .head_repository.full_name == $repo and
                .event == "workflow_run" and .status == "completed" and
                (.conclusion | IN("cancelled", "failure", "startup_failure", "timed_out"))
              ' >/dev/null <<<"$exact_attempt" || incident changed_exact_attempt

              exact_jobs="$(gh api \
                "repos/$REPOSITORY/actions/runs/$run_id/attempts/1/jobs?per_page=100")"
              jq -e \
                --argjson run_id "$run_id" \
                --arg sha "$current_sha" '
                type == "object" and
                (.total_count | type == "number") and
                (.jobs | type == "array") and
                .total_count == (.jobs | length) and
                all(.jobs[];
                  (.id | type == "number" and . > 0) and
                  (.run_id | type == "number" and . > 0) and
                  (.run_attempt | type == "number" and . > 0) and
                  (.name | type == "string" and length > 0) and
                  (.head_sha | type == "string" and length > 0) and
                  (.head_branch | type == "string" and length > 0) and
                  (.status | type == "string" and length > 0) and
                  ((.conclusion | type) == "string" or .conclusion == null)
                ) and
                ([.jobs[] | select(
                  (.name | type == "string") and
                  (.name | endswith("Centralized production rollback")) and
                  .run_id == $run_id and .run_attempt == 1 and
                  .head_sha == $sha and .head_branch == "main" and
                  .status == "completed" and .conclusion == "skipped"
                )] | length) == 1 and
                ([.jobs[] | select(
                  (.name | type == "string") and
                  (.name | endswith("Centralized production rollback"))
                )] | length) == 1
              ' >/dev/null <<<"$exact_jobs" || incident unsafe_rollback_at_boundary

              latest_run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              jq -e --argjson run_id "$run_id" --arg sha "$current_sha" \
                --arg repo "$REPOSITORY" --argjson workflow_id "$controller_workflow_id" '
                .id == $run_id and .run_attempt == 1 and
                .workflow_id == $workflow_id and
                .path == ".github/workflows/production-controller.yml" and
                .head_sha == $sha and .head_branch == "main" and
                .head_repository.full_name == $repo and
                .event == "workflow_run" and .status == "completed"
                and (.conclusion | IN("cancelled", "failure", "startup_failure", "timed_out"))
              ' >/dev/null <<<"$latest_run" || incident recovery_attempt_already_started

              lease_name="production-generation-recovery-$current_sha"
              lease_listing="$(gh api \
                "repos/$REPOSITORY/actions/artifacts?name=$lease_name&per_page=100")"
              jq -e --arg name "$lease_name" '
                type == "object" and .total_count == 0 and
                (.artifacts | type == "array" and length == 0)
              ' >/dev/null <<<"$lease_listing" || incident recovery_lease_already_exists

              boundary_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha // empty')"
              [[ "$boundary_sha" =~ ^[0-9a-f]{40}$ ]] || incident invalid_recovery_boundary
              if [ "$boundary_sha" != "$current_sha" ]; then
                echo "Controller recovery was superseded by $boundary_sha; neutral."
                exit 0
              fi
              gh run rerun "$run_id"
              echo "recovery_reason=full_controller_rerun_requested" >> "$GITHUB_OUTPUT"
              echo "Requested the sole full recovery for controller run $run_id."
              exit 0
              ;;
            none) ;;
          esac

          # No marker means no controller attempt may be replayed: it could
          # have mutated production without reaching durable verification.
          # The only safe automatic action is one full CI rerun when GitHub
          # failed to deliver the original workflow_run event at all.
          ci_runs="$(gh api \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$current_sha&per_page=100")"
          jq -e '
            type == "object" and
            (.total_count | type == "number") and
            (.workflow_runs | type == "array") and
            .total_count == (.workflow_runs | length) and
            all(.workflow_runs[];
              (.id | type == "number" and . > 0) and
              (.run_attempt | type == "number" and . > 0) and
              (.workflow_id | type == "number" and . > 0) and
              (.path | type == "string") and
              (.head_sha | type == "string") and
              (.head_branch | type == "string") and
              (.head_repository.full_name | type == "string") and
              (.event | type == "string") and
              (.status | type == "string") and
              ((.conclusion | type) == "string" or .conclusion == null) and
              (.updated_at | type == "string") and
              (.html_url | type == "string")
            )
          ' >/dev/null <<<"$ci_runs" || incident incomplete_ci_listing
          source_ci="$(jq -c --arg sha "$current_sha" --arg repo "$REPOSITORY" \
            --argjson workflow_id "$ci_workflow_id" '
            [.workflow_runs[] | select(
              .workflow_id == $workflow_id and
              .path == ".github/workflows/ci.yml" and
              .head_sha == $sha and .head_branch == "main" and
              .head_repository.full_name == $repo and
              .event == "push" and .status == "completed" and
              .conclusion == "success"
            )] | unique_by(.id) | sort_by(.updated_at, .id) | last // empty
          ' <<<"$ci_runs")"
          if [ -z "$source_ci" ]; then
            echo "Current main has no exact completed successful CI attempt yet."
            exit 0
          fi
          source_ci_id="$(jq -r '.id' <<<"$source_ci")"
          source_ci_attempt="$(jq -r '.run_attempt' <<<"$source_ci")"
          source_ci_updated="$(jq -r '.updated_at' <<<"$source_ci")"
          [[ "$source_ci_id" =~ ^[1-9][0-9]*$ ]] &&
            [[ "$source_ci_attempt" =~ ^[1-9][0-9]*$ ]] || incident malformed_source_ci

          replay_source_ci_once() {
            local recovery_reason="$1"
            if [ "$source_ci_attempt" -ne 1 ]; then
              incident ci_event_replay_exhausted
            fi
            local source_boundary
            source_boundary="$(gh api \
              "repos/$REPOSITORY/actions/runs/$source_ci_id/attempts/1")"
            jq -e --argjson id "$source_ci_id" --arg sha "$current_sha" \
              --arg repo "$REPOSITORY" --argjson workflow_id "$ci_workflow_id" '
              .id == $id and .run_attempt == 1 and
              .workflow_id == $workflow_id and .path == ".github/workflows/ci.yml" and
              .head_sha == $sha and .head_branch == "main" and
              .head_repository.full_name == $repo and .event == "push" and
              .status == "completed" and .conclusion == "success"
            ' >/dev/null <<<"$source_boundary" || incident changed_source_ci
            local boundary_sha
            boundary_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha // empty')"
            [[ "$boundary_sha" =~ ^[0-9a-f]{40}$ ]] || incident invalid_ci_replay_boundary
            if [ "$boundary_sha" != "$current_sha" ]; then
              echo "CI event replay was superseded by $boundary_sha; neutral."
              exit 0
            fi
            gh run rerun "$source_ci_id"
            echo "recovery_reason=$recovery_reason" >> "$GITHUB_OUTPUT"
            echo "Replayed exact successful CI once ($recovery_reason)."
          }

          expected_title="Production Controller $current_sha from CI $source_ci_id attempt $source_ci_attempt"
          controller_runs="$(gh api \
            "repos/$REPOSITORY/actions/workflows/production-controller.yml/runs?branch=main&event=workflow_run&head_sha=$current_sha&per_page=100")"
          jq -e '
            type == "object" and
            (.total_count | type == "number") and
            (.workflow_runs | type == "array") and
            .total_count == (.workflow_runs | length) and
            all(.workflow_runs[];
              (.id | type == "number" and . > 0) and
              (.run_attempt | type == "number" and . > 0) and
              (.workflow_id | type == "number" and . > 0) and
              (.display_title | type == "string") and
              (.path | type == "string") and
              (.head_sha | type == "string") and
              (.head_branch | type == "string") and
              (.head_repository.full_name | type == "string") and
              (.event | type == "string") and
              (.status | type == "string") and
              ((.conclusion | type) == "string" or .conclusion == null) and
              (.created_at | type == "string") and
              (.updated_at | type == "string") and
              (.html_url | type == "string")
            )
          ' >/dev/null <<<"$controller_runs" || incident incomplete_controller_listing
          controller_matches="$(jq -c --arg title "$expected_title" --arg sha "$current_sha" \
            --arg repo "$REPOSITORY" --argjson workflow_id "$controller_workflow_id" '
            [.workflow_runs[] | select(
              .workflow_id == $workflow_id and .display_title == $title and
              .path == ".github/workflows/production-controller.yml" and
              .head_sha == $sha and .head_branch == "main" and
              .head_repository.full_name == $repo and .event == "workflow_run"
            )] | unique_by(.id) | sort_by(.created_at, .id)
          ' <<<"$controller_runs")"
          controller_count="$(jq 'length' <<<"$controller_matches")"
          if [ "$controller_count" -gt 1 ]; then
            incident duplicate_controller_generation
          fi
          controller="$(jq -c '.[0] // empty' <<<"$controller_matches")"
          if [ -n "$controller" ]; then
            controller_id="$(jq -r '.id' <<<"$controller")"
            # Re-read the exact run before failing closed. Listing payloads can
            # lag, and production-mutation concurrency parks runs in pending /
            # waiting / requested — not only queued or in_progress.
            live_controller="$(gh api "repos/$REPOSITORY/actions/runs/$controller_id")"
            jq -e --argjson run_id "$controller_id" --arg sha "$current_sha" \
              --arg repo "$REPOSITORY" --argjson workflow_id "$controller_workflow_id" '
              .id == $run_id and
              .workflow_id == $workflow_id and
              .path == ".github/workflows/production-controller.yml" and
              .head_sha == $sha and .head_branch == "main" and
              .head_repository.full_name == $repo and
              .event == "workflow_run" and
              (.run_attempt | type == "number" and . > 0) and
              (.status | type == "string" and length > 0) and
              ((.conclusion | type) == "string" or .conclusion == null) and
              (.updated_at | type == "string" and length > 0)
            ' >/dev/null <<<"$live_controller" || incident changed_controller_run
            controller_status="$(jq -r '.status' <<<"$live_controller")"
            controller_conclusion="$(jq -r '.conclusion // empty' <<<"$live_controller")"
            controller_attempt="$(jq -r '.run_attempt' <<<"$live_controller")"
            controller_updated="$(jq -r '.updated_at // empty' <<<"$live_controller")"
            echo "run_url=https://github.com/$REPOSITORY/actions/runs/$controller_id" \
              >> "$GITHUB_OUTPUT"
            case "$controller_status" in
              queued|in_progress|pending|requested|waiting)
                echo "Controller run $controller_id is still $controller_status."
                exit 0
                ;;
            esac
            if [ "$controller_status" != "completed" ] || [ -z "$controller_conclusion" ]; then
              echo "Controller run $controller_id is not terminal yet ($controller_status/${controller_conclusion:-null})."
              exit 0
            fi
            if [ "$controller_conclusion" != "success" ] &&
              [ "$controller_attempt" = "1" ] &&
              [[ "$controller_conclusion" =~ ^(cancelled|failure|startup_failure|timed_out)$ ]]; then
              # A failed attempt may be replayed only when its exact job list
              # proves the reusable production workflow never started. This
              # is the event-driven recovery for failures in coalescing, fleet
              # admission, or exact CI authorization.
              controller_jobs="$(gh api \
                "repos/$REPOSITORY/actions/runs/$controller_id/attempts/1/jobs?per_page=100")"
              if jq -e --argjson run_id "$controller_id" --arg sha "$current_sha" '
                type == "object" and
                (.total_count | type == "number") and
                (.jobs | type == "array") and
                .total_count == (.jobs | length) and
                all(.jobs[];
                  (.id | type == "number" and . > 0) and
                  .run_id == $run_id and .run_attempt == 1 and
                  .head_sha == $sha and .head_branch == "main" and
                  (.name | type == "string" and length > 0) and
                  (.status | type == "string" and length > 0) and
                  ((.conclusion | type) == "string" or .conclusion == null)
                ) and
                ([.jobs[] | select(.name == "Production Release" and .status == "completed" and .conclusion == "skipped")] | length) == 1 and
                ([.jobs[] | select(.name | startswith("Production Release /"))] | length) == 0
              ' >/dev/null <<<"$controller_jobs"; then
                replay_source_ci_once predeploy_controller_ci_replayed
                exit 0
              fi
            fi
            # Successful controllers should upload a marker. Re-classify once
            # before failing closed so artifact listing lag cannot open an
            # incident while Production Verified is still materializing truth.
            if [ "$controller_conclusion" = "success" ]; then
              marker_state_json="$(node .github/scripts/production-marker-state.mjs \
                --sha "$current_sha" \
                --repo "$REPOSITORY" \
                --controller-workflow-id "$controller_workflow_id")"
              jq -e '
                type == "object" and
                (.state | IN("none", "pending", "recovery_available", "verified", "manual")) and
                (.reason | type == "string" and length > 0)
              ' >/dev/null <<<"$marker_state_json" || incident malformed_marker_classification
              marker_state="$(jq -r '.state' <<<"$marker_state_json")"
              marker_reason="$(jq -r '.reason' <<<"$marker_state_json")"
              case "$marker_state" in
                verified)
                  echo "Current main $current_sha has exact verified production evidence after recheck."
                  exit 0
                  ;;
                pending)
                  echo "Production marker recovery is already pending after recheck ($marker_reason)."
                  exit 0
                  ;;
                recovery_available|manual)
                  # A live successful controller cannot own interrupted-marker
                  # recovery authority; fail closed with the classifier reason.
                  incident "$marker_reason"
                  ;;
                none) ;;
              esac

              # Skip-promote / superseded controller success cannot go green
              # while live jov.ie is still on a prior SHA (JOV-5458). Marker
              # grace is only bookkeeping after live already matches main.
              trap - EXIT
              node .github/scripts/assert-live-production-bind.mjs --main-sha "$current_sha"
              trap on_exit EXIT

              # Post-success grace: artifact listing / upload can lag job
              # completion. Event recovery owns the immediate path; the daily
              # safety audit waits up to 30m before paging.
              # (JOV-4442: false controller_completed_without_marker pages.)
              if [[ "$controller_updated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
                controller_epoch="$(date -u -d "$controller_updated" +%s)"
                controller_age_seconds=$(($(date +%s) - controller_epoch))
                if [ "$controller_age_seconds" -lt 1800 ]; then
                  echo "Controller run $controller_id completed ${controller_age_seconds}s ago; waiting for marker visibility (30m grace)."
                  exit 0
                fi
              fi

              # Self-verify prod before paging: if live build matches current
              # main, deploy path worked and a missing marker is bookkeeping —
              # not a live outage. Still fail closed when conclusion is not
              # success (handled below).
              prod_build_id=""
              if prod_json="$(curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                "https://jov.ie/api/version" 2>/dev/null)"; then
                prod_build_id="$(jq -r '.buildId // empty' <<<"$prod_json" 2>/dev/null || true)"
              fi
              short_current="${current_sha:0:7}"
              if [ -n "$prod_build_id" ] && {
                [ "$prod_build_id" = "$short_current" ] ||
                [ "$prod_build_id" = "$current_sha" ] ||
                [[ "$current_sha" == "$prod_build_id"* ]]
              }; then
                echo "Prod build $prod_build_id matches current main; controller succeeded without durable marker. Neutral (bookkeeping gap, not a live outage)."
                echo "recovery_reason=controller_success_prod_current_without_marker" \
                  >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            incident controller_completed_without_marker
          fi

          source_epoch="$(date -u -d "$source_ci_updated" +%s)"
          age_seconds=$(($(date +%s) - source_epoch))
          if [ "$age_seconds" -lt 900 ]; then
            echo "Controller event remains inside the 15-minute delivery grace."
            exit 0
          fi
          replay_source_ci_once ci_event_replayed

      - name: Open one manual-recovery incident
        # Retired: fail closed in Actions; never create a GitHub backlog item.
        if: ${{ github.event_name == '__retired_linear_only__' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHORT_SHA: ${{ steps.evaluate.outputs.short_sha }}
          RUN_URL: ${{ steps.evaluate.outputs.run_url }}
          RECOVERY_REASON: ${{ steps.evaluate.outputs.recovery_reason }}
        run: |
          set -euo pipefail
          title="[Production Controller] Manual recovery required for ${SHORT_SHA:-unknown}"
          gh label create incident --force \
            --description "Production incident requiring investigation" --color "d93f0b"
          issues_json="$(gh issue list --state open --label incident --limit 100 \
            --json number,title)"
          existing="$(jq --arg title "$title" '[.[] | select(.title == $title)] | length' \
            <<<"$issues_json")"
          if [ "$existing" -gt 0 ]; then
            echo "Manual recovery incident already exists."
            exit 0
          fi
          gh issue create --title "$title" --label incident --body \
            "Automatic recovery failed closed (${RECOVERY_REASON:-unknown}). Inspect exact controller evidence before any manual rerun or production mutation: ${RUN_URL:-https://github.com/${GH_REPO}/actions}"
