name: Runner Heartbeat
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: A hosted schedule can wake the canonical main-only recovery workflows without receiving Linear, Jovie Bot, or runner-host credentials.
# revisit-trigger: Remove these dispatches when GitHub supports a durable delayed workflow retry at an upstream API reset timestamp.

on:
  # GitHub cron delivery is best-effort and can be delayed well past its nominal
  # interval. Scheduled, direct-main, and manual probes retain monitoring while
  # phase 0 prevents merge-group candidates from consuming the fixed pool.
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-heartbeat
  # A saturated/offline pool retains only the newest queued probe. The hosted
  # observer treats queued/in-progress, stale, malformed, or API-uncertain
  # evidence as down. Unit capacity remains explicitly hosted in phase 0.
  cancel-in-progress: true

jobs:
  heartbeat:
    name: Self-hosted runner heartbeat
    runs-on: jovie-runner
    timeout-minutes: 2
    steps:
      - name: Record heartbeat
        run: echo "Self-hosted heartbeat from $RUNNER_NAME"

  remediation-clock:
    name: Retry deferred backlog remediation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch canonical fleet refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run fleet-gate-refresh.yml --ref main
          gh workflow run ownerless-recovery-sweep.yml --ref main
      - name: Reconcile pending native admission
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Reuse this best-effort clock after a missed ready event or expired
          # release hold. This read-only demand probe cannot authorize admission.
          # Paginate so a draft-heavy first page cannot hide an eligible PR.
          # GraphQL variables are expanded by GitHub, not by the shell.
          # shellcheck disable=SC2016
          pages="$(gh api graphql --paginate --slurp \
            -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" \
            -f query='query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(first: 100, after: $endCursor, states: OPEN, baseRefName: "main") {
                  nodes { isDraft isInMergeQueue mergeable }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }')"
          pending="$(jq -er '
            if type == "array" and length > 0 and all(.[];
              (.errors == null) and
              (.data.repository.pullRequests.nodes | type == "array") and
              (.data.repository.pullRequests.pageInfo.hasNextPage | type == "boolean") and
              all(.data.repository.pullRequests.nodes[];
                (.isDraft | type == "boolean") and
                (.isInMergeQueue | type == "boolean") and
                (.mergeable | IN("MERGEABLE", "CONFLICTING", "UNKNOWN")))) and
              (.[-1].data.repository.pullRequests.pageInfo.hasNextPage == false) and
              all(.[:-1][]; .data.repository.pullRequests.pageInfo.hasNextPage == true)
            then [.[].data.repository.pullRequests.nodes[]
              | select(.isDraft == false and .isInMergeQueue == false and .mergeable != "CONFLICTING")]
              | length
            else error("Invalid pending admission inventory") end
          ' <<<"$pages")"
          if [[ "$pending" == '0' ]]; then
            echo 'No pending main admission demand; no queue wake needed.'
            exit 0
          fi
          # Suppress redundant passes; the canonical mutex still handles a
          # concurrent event arriving after this probe. API uncertainty fails.
          for status in queued in_progress waiting pending requested; do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/merge-queue-autoenroll.yml/runs?status=$status&per_page=1")"
            active="$(jq -er '.total_count | select(type == "number" and . >= 0 and floor == .)' <<<"$runs")"
            if (( active > 0 )); then
              echo "Canonical admission already $status; no duplicate wake."
              exit 0
            fi
          done
          # No PR payload or exact-head claim is invented. The existing writer
          # rereads fleet policy, release-wave state and every candidate gate.
          gh workflow run merge-queue-autoenroll.yml --ref main
