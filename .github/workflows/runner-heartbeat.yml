name: Runner Heartbeat
# clock-class: production-liveness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Gem
# necessary-trust-boundary: The schedule and the Gem clock event only queue a no-op job on the self-hosted pool; it holds contents:read and no Linear, Jovie Bot, or runner-host credentials.
# revisit-trigger: Remove the schedule when the self-hosted runner host reports its own liveness to a hosted observer.
# The fleet-gate receipt needs no clock (the Gem lanes emitter keeps it fresh), so
# the former remediation-clock dispatch of fleet-gate-refresh.yml is gone.

on:
  # The Gem lanes tick fires this on the designed cadence
  # (scripts/lanes/continuity_clock.py): GitHub delivered the cron below only
  # about every 6 h, so the schedule is now the backstop.
  repository_dispatch:
    types: [clock_runner_heartbeat]
  # GitHub cron delivery is best-effort and can be delayed well past its nominal
  # interval. Scheduled, direct-main, and manual probes retain monitoring while
  # phase 0 prevents merge-group candidates from consuming the fixed pool.
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-heartbeat
  # A saturated/offline pool retains only the newest queued probe. The hosted
  # observer treats queued/in-progress, stale, malformed, or API-uncertain
  # evidence as down. Unit capacity remains explicitly hosted in phase 0.
  cancel-in-progress: true

jobs:
  heartbeat:
    name: Self-hosted runner heartbeat
    runs-on: jovie-runner
    timeout-minutes: 2
    steps:
      - name: Record heartbeat
        run: echo "Self-hosted heartbeat from $RUNNER_NAME"
