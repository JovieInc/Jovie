# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# necessary-trust-boundary: Drafting a Pen frame needs the Pen CLI key and the private canonical Pen file URL; the job only reads the repo and uploads drafts as a private artifact.
# removal-trigger: Remove when Pen drafts run inside the design loop that already holds the Pen key.

name: Pen draft missing frames

# Design first (Tim, 2026-11-08): every Golden Path screen gets a Pen design
# before code. This drafts one frame per brief in docs/design-system/pen-briefs
# from the canonical workspace and uploads the drafts for review. A push
# drafts only the briefs it changed (every brief when the drafter changed),
# one job per frame, so no frame waits on another's retry budget. It never
# writes back to the canonical file or approves anything in pen-bindings.json.
# A run without the Pen secrets fails and says which one is missing.

on:
  push:
    branches: [main]
    paths:
      - 'docs/design-system/pen-briefs/**'
      - 'scripts/design/pen-draft.mjs'
      - 'scripts/design/pen-trim.mjs'
      - '.github/workflows/pen-draft.yml'
  # A brief change drafts on its own PR too, so the frames are in review
  # before merge and nobody has to start a run by hand.
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'docs/design-system/pen-briefs/**'
      - 'scripts/design/pen-draft.mjs'
      - 'scripts/design/pen-trim.mjs'
      - '.github/workflows/pen-draft.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated frames to draft (blank drafts every brief)'
        required: false
        default: ''

permissions: {}

# One group per commit: a push drafts only the briefs its own commit changed,
# so a shared group would let GitHub drop a queued run and those briefs with it.
# PRs share their own group; each PR plan includes every brief.
concurrency:
  group: pen-draft-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Pen frames
    # Fork PRs get no secrets; skip planning and its dependent draft jobs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frames: ${{ steps.pick.outputs.frames }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pushed commit and its parent, to list what the push changed.
          fetch-depth: 2

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Unit tests
        run: node --test scripts/design/pen-draft.test.mjs

      - name: Pick frames
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(--plan)
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          # A push of one commit (a queue merge) drafts what that commit
          # changed. Any other push drafts every brief.
          if [ "$EVENT" = push ] && [ "$(git rev-parse -q --verify HEAD^ || true)" = "${BEFORE:-}" ]; then
            changed="$RUNNER_TEMP/pen-changed.txt"
            git diff --name-only HEAD^ HEAD > "$changed"
            args+=(--changed "$changed")
          fi
          frames=$(node scripts/design/pen-draft.mjs "${args[@]}")
          echo "frames=$frames" >> "$GITHUB_OUTPUT"
          echo "Pen frames to draft: $frames"

  draft:
    name: Draft Pen frame
    needs: plan
    if: ${{ needs.plan.outputs.frames != '[]' }}
    runs-on: ubuntu-24.04
    # pen-draft.mjs budgets 23 minutes: one attempt, or a retry after an early
    # failure. Setup and upload take under a minute, so two are reserved.
    timeout-minutes: 25
    # Share the editor lease across PRs, main pushes and manual runs. Native
    # queueing retains up to 100 pending jobs instead of replacing the oldest.
    concurrency:
      group: pen-draft-canonical-editor
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One at a time: the Pen editor behind one PEN_CLI_KEY serves one
      # document. With 4 in parallel on Nov 8, 19 of 20 drafts got only
      # "Timeout waiting for document"; one after another, 4 of 8 drew.
      max-parallel: 1
      matrix:
        frame: ${{ fromJSON(needs.plan.outputs.frames) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Draft frame from its brief
        env:
          PEN_CLI_KEY: ${{ secrets.PEN_CLI_KEY }}
          PEN_GOLDEN_PATH_FILE_URL: ${{ secrets.PEN_GOLDEN_PATH_FILE_URL }}
          # The Pen agent is Claude Code: run it on the paid subscription, never a
          # metered API key (Tim, 2026-11-10). The metered key ran out of credit
          # and every draft since failed with billing_error.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Blank drafts on the script's default, Fable 5.2. Set the repository
          # variable to move drafts to another model without a code change.
          PEN_DRAFT_MODEL: ${{ vars.PEN_DRAFT_MODEL }}
          FRAME: ${{ matrix.frame }}
        run: node scripts/design/pen-draft.mjs --out "$RUNNER_TEMP/pen-draft" --only "$FRAME"

      - name: Upload draft
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pen-draft-${{ matrix.frame }}
          path: |
            ${{ runner.temp }}/pen-draft/*.pen
            ${{ runner.temp }}/pen-draft/*.png
            ${{ runner.temp }}/pen-draft/*.json
            !${{ runner.temp }}/pen-draft/canonical.pen
          if-no-files-found: warn
          retention-days: 14
