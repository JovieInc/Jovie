# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# necessary-trust-boundary: Drafting a Pen frame needs the Pen CLI key and the private canonical Pen file URL; the job only reads the repo and uploads drafts as a private artifact.
# removal-trigger: Remove when Pen drafts run inside the design loop that already holds the Pen key.

name: Pen draft missing frames

# Design first (Tim, 2026-11-08): every Golden Path screen gets a Pen design
# before code. This drafts one frame per brief in docs/design-system/pen-briefs
# from the canonical workspace and uploads the drafts for review. It never
# writes back to the canonical file or approves anything in pen-bindings.json.
# A run without the Pen secrets fails and says which one is missing.

on:
  push:
    branches: [main]
    paths:
      - 'docs/design-system/pen-briefs/**'
      - 'scripts/design/pen-draft.mjs'
      - '.github/workflows/pen-draft.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated frames to draft (blank drafts every brief)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: pen-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft Pen frames
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Unit tests
        run: node --test scripts/design/pen-draft.test.mjs

      - name: Draft frames from briefs
        env:
          PEN_CLI_KEY: ${{ secrets.PEN_CLI_KEY }}
          PEN_GOLDEN_PATH_FILE_URL: ${{ secrets.PEN_GOLDEN_PATH_FILE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/pen-draft")
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          node scripts/design/pen-draft.mjs "${args[@]}"

      - name: Upload drafts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pen-drafts
          path: |
            ${{ runner.temp }}/pen-draft/*.pen
            ${{ runner.temp }}/pen-draft/*.png
            ${{ runner.temp }}/pen-draft/*.json
            !${{ runner.temp }}/pen-draft/canonical.pen
          if-no-files-found: warn
          retention-days: 14
