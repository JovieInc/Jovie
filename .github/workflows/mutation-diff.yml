# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Claude
# capability-gap: Mutation testing must trigger on high-risk source pushes; folding it into Nightly Testing Agent would also run that workflow's 4-shard deterministic lane on every such push. Read-only token, no writes to GitHub or Linear.
# revisit-trigger: Fold into Nightly Testing Agent if it gains per-job path filters, or retire when mutation testing moves into an existing PR check.
name: Mutation Diff

# Diff-scoped mutation testing for changed high-risk apps/web source
# (billing, entitlements, auth, Stripe, webhooks, claim, shell navigation). Runs after merge on
# main, path-filtered, so it adds no PR or merge-group check. Scores and
# surviving mutants land in the job summary. A file in
# scripts/mutation-score-baseline.json fails the job when its score is under
# that file's floor. Files without a floor stay advisory. The job also fails
# when Stryker itself breaks, so a dead harness cannot pass as a clean run.
# Not a merge-queue required check: it does not run on pull requests.
#
# Gem-only (2026-10-29, Tim, test-quality loop): every job runs on the Gem self-hosted jovie-fixed pool because
# hosted CI is saturated. Superseded the hosted-by-default note below, kept for the load history.
# Hosted-by-default (2026-10-26, superseded): every job here ran on GitHub-hosted ubuntu-latest. The repo
# is public, so hosted minutes are free and concurrency is ~120; Stryker on the gem pool held the
# machine at load 25-50 on 16 cores (mutation processes ~10 cores plus their vitest workers) and
# starved the shipping lanes. The rolling sweep keeps its per-module score state in an Actions
# cache (restore the newest, save a run-unique key) instead of the runner's HOME.
# No cron (JOV-INV-042): the rolling sweep (job `sweep`) starts on
# every main CI completion and chains itself while modules remain. It walks every tested apps/web module
# (and, on a fixed 10-minute slice per run, every tested @jovie/ui module)
# over days, persists per-module score + tested SHA on the runner, and turns
# surviving mutants into bounded "strengthen test" tasks. It checks out
# `main` only, holds no secrets, and skips when gem is short on RAM, disk or
# CPU (scripts/mutation-sweep-preflight.mjs).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/app/api/billing/**'
      - 'apps/web/app/api/stripe/**'
      - 'apps/web/app/api/webhooks/**'
      - 'apps/web/components/features/dashboard/dashboard-nav/**'
      - 'apps/web/lib/app-shell/**'
      - 'apps/web/lib/auth/**'
      - 'apps/web/lib/billing/**'
      - 'apps/web/lib/claim/**'
      - 'apps/web/lib/cron/auth.ts'
      - 'apps/web/lib/entitlements/**'
      - 'apps/web/lib/idempotency.ts'
      - 'apps/web/lib/stripe/**'
      - 'apps/web/proxy.ts'
      # Model registry change: re-arm the top-touch modules (a better model writes better tests).
      - 'ops/registry/capacity.json'
  # Event-driven incremental sweep: after main CI settles, re-score every
  # module whose source changed since it was last scored. The sweep checks out
  # `main` itself, so a fork branch named main cannot supply code.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: diff (mutate the given files), sweep (rolling batch, changed modules first) or incremental (changed modules only)
        default: diff
        type: choice
        options: [diff, sweep, incremental]
      files:
        description: 'diff mode: space-separated repo paths to mutate (e.g. apps/web/lib/cron/auth.ts)'
        required: false
        type: string
      max_files:
        description: 'sweep modes: modules to score this run'
        default: '6'
        type: string

permissions: {}

# No concurrency group: a shared group drops queued runs during merge
# bursts, and each run only diffs its own push. Runs are read-only.

jobs:
  mutate:
    name: Mutate changed high-risk source
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'diff' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Reset workspace git state (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          # Fixed runners reuse one workspace; a sparse checkout left by an earlier job hides files
          # (.nvmrc, .github/scripts) from this full checkout (PR Fleet Rules merge_group 40908938908).
          if [[ -d .git ]]; then
            git sparse-checkout disable 2>/dev/null || true
            git config --local --unset-all core.sparseCheckout 2>/dev/null || true
            git config --local --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Diff from the last successful push run, so files from a failed or
      # dropped run are mutated next time. Falls back to the push's `before`.
      # A merge-queue push carries several PRs, so use the compare API, not
      # HEAD~1 on a shallow clone.
      - name: Resolve files to mutate
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_FILES: ${{ inputs.files }}
        run: node scripts/lib/github-installation-quota.mjs soft-fail -- bash .github/scripts/mutation-diff-resolve-files.sh

      - name: Check the runner has spare capacity
        id: capacity
        if: steps.files.outputs.files != ''
        env:
          MUTATION_MAX_LOAD: '8'
        run: |
          set +e
          node scripts/mutation-sweep-preflight.mjs
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: Gem busy; no mutation score produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js and pnpm
        if: steps.files.outputs.files != '' && steps.capacity.outputs.run == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Stryker on changed high-risk files
        id: mutation
        if: steps.files.outputs.files != '' && steps.capacity.outputs.run == 'true'
        env:
          CI: 'true'
          FILES: ${{ steps.files.outputs.files }}
          STRYKER_CONCURRENCY: '1'
          MUTATION_MAX_LOAD: '8'
        run: |
          # Capacity can change during setup. Only exit 75 means a busy host.
          set +e
          node scripts/mutation-sweep-preflight.mjs
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "Skipped: Gem busy after setup; no mutation score produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "started=true" >> "$GITHUB_OUTPUT"
          node scripts/mutation-diff.mjs --files "$FILES" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        if: ${{ always() && steps.mutation.outputs.started == 'true' && hashFiles('apps/web/reports/mutation/diff/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-diff-${{ github.run_id }}
          path: apps/web/reports/mutation/diff/
          retention-days: 14

  sweep:
    name: Rolling mutation sweep
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'diff') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'push'
      )
    # Gem self-hosted runners (test-quality loop, 2026-10-29): hosted is saturated, Gem has
    # spare cores. The preflight below still skips when Gem is short on RAM, disk or CPU.
    runs-on: [self-hosted, Linux, X64, jovie-fixed]
    timeout-minutes: 120
    permissions:
      contents: read
      # Self-chaining only: workflow_dispatch is the one event GITHUB_TOKEN may start.
      actions: write
    # One sweep at a time. Later triggers queue (one pending) rather than
    # cancel a run that is mid-module.
    concurrency:
      group: mutation-sweep
      cancel-in-progress: false
    steps:
      - name: Reset workspace git state (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          # Fixed runners reuse one workspace; a sparse checkout left by an earlier job hides files
          # (.nvmrc, .github/scripts) from this full checkout (PR Fleet Rules merge_group 40908938908).
          if [[ -d .git ]]; then
            git sparse-checkout disable 2>/dev/null || true
            git config --local --unset-all core.sparseCheckout 2>/dev/null || true
            git config --local --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Spare compute only: exit 75 means gem is busy, so skip without failing.
      - name: Check the runner has spare capacity
        id: capacity
        env:
          # Off-peak only (2026-10-29): run only when Gem's 5-minute load is below 8. Gated on load, not a clock.
          MUTATION_MAX_LOAD: '8'
          MUTATION_MIN_DISK_GB: '15'
        run: |
          set +e
          node scripts/mutation-sweep-preflight.mjs
          code=$?
          if [ "$code" -eq 75 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js and pnpm
        if: steps.capacity.outputs.run == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore sweep state
        if: steps.capacity.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jovie-mutation
          key: mutation-sweep-portable-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mutation-sweep-portable-v2-

      # The portable cache is the CI state owner. Seed it once from existing
      # local receipts, without mutating those receipts or rescoring their modules.
      - name: Stage portable sweep state
        id: portable_state
        if: steps.capacity.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache/jovie-mutation
          if [ -s .cache/jovie-mutation/sweep-state.json ]; then exit 0; fi
          legacy="$HOME/.local/state/jovie-mutation"
          if [ ! -s "$legacy/sweep-state.json" ]; then exit 0; fi
          exec 9>"$legacy/sweep.lock"
          flock -n 9 || { echo "::error::Legacy mutation state is busy; cannot seed portable cache."; exit 1; }
          cp "$legacy/sweep-state.json" .cache/jovie-mutation/
          if [ -f "$legacy/sweep-state.json.runs.jsonl" ]; then
            cp "$legacy/sweep-state.json.runs.jsonl" .cache/jovie-mutation/
          fi
          if [ -d "$legacy/survivor-tasks" ]; then
            cp -R "$legacy/survivor-tasks" .cache/jovie-mutation/
          fi

      - name: Score the next modules
        id: score
        if: steps.capacity.outputs.run == 'true'
        env:
          CI: 'true'
          STRYKER_CONCURRENCY: '1'
          MUTATION_MAX_LOAD: '8'
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'sweep' }}
          MAX_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_files || (github.event_name == 'workflow_run' && '4') || '6' }}
        run: |
          set -euo pipefail
          state_dir=".cache/jovie-mutation"
          mkdir -p "$state_dir" "$HOME/.local/state/jovie-mutation"
          # Runners share one HOME; serialize on the state file.
          exec 9>"$HOME/.local/state/jovie-mutation/sweep.lock"
          flock -n 9 || { echo "Another sweep holds the state lock; skipping."; exit 0; }
          # Rank modules by how high-touch they are (tier weight + git churn) so the sweep
          # expands from billing, auth and the golden path outward.
          git fetch --quiet --unshallow origin main 2>/dev/null || git fetch --quiet --depth=2000 origin main
          node scripts/test-quality-loop.mjs rank --out "$RUNNER_TEMP/ranked.json" --top 0
          [ -f "$state_dir/sweep-state.json" ] && node scripts/test-quality-loop.mjs model-check \
            --state "$state_dir/sweep-state.json" --ranked "$RUNNER_TEMP/ranked.json" || true
          # @jovie/ui first, on a fixed slice carved out of the apps/web budget (90 -> 75):
          # worst case 10 + 5 (one module's timeout) + 75 + 25 matches the old 90 + 25, inside
          # timeout-minutes. Same state file, keyed packages/ui/<path>, which the component
          # certificate reads. No --github-output: only the apps/web sweep drives chaining.
          ui_status=0
          nice -n 19 node scripts/mutation-sweep.mjs --include packages/ui/ \
            --state "$state_dir/sweep-state.json" \
            --mode "$MODE" --max-files "$MAX_FILES" --max-minutes 10 --file-timeout-minutes 5 \
            --summary "$GITHUB_STEP_SUMMARY" || ui_status=$?
          # Stryker mutates in place; a killed module must not leave a mutant for apps/web tests.
          git checkout --quiet -- packages/ui
          nice -n 19 node scripts/mutation-sweep.mjs \
            --touch-file "$RUNNER_TEMP/ranked.json" \
            --state "$state_dir/sweep-state.json" \
            --mode "$MODE" --max-files "$MAX_FILES" --max-minutes 75 \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT" \
            --propose-baseline "$RUNNER_TEMP/baseline-proposal.json"
          # Metrics (mutation score per surface, survivors killed, test minutes, flakes) and the
          # warn-only floor check; the report is uploaded and read by the Shipping SLO feed.
          node scripts/test-quality-loop.mjs report --state "$state_dir/sweep-state.json" \
            --out "$RUNNER_TEMP/test-quality-latest.json" || true
          node scripts/test-quality-loop.mjs ratchet --state "$state_dir/sweep-state.json" || true
          [ "$ui_status" -eq 0 ] || { echo "::error::packages/ui mutation sweep exited $ui_status"; exit "$ui_status"; }

      # The only step that sees a secret. It reads the task JSON the sweep wrote
      # and never runs Stryker or repo tests.
      - name: File survivor issues
        if: ${{ always() && steps.capacity.outputs.run == 'true' && steps.portable_state.outcome == 'success' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_TRIGGERS_DISABLED: ${{ vars.REMEDIATION_TRIGGERS_DISABLED }}
        run: |
          node scripts/mutation-sweep-file-issues.mjs \
            --tasks ".cache/jovie-mutation/survivor-tasks" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # No clock: the backlog drains by chaining. The next run starts only if
      # this one made progress and modules remain; a busy host stops the chain
      # (the capacity step skipped), and the next main CI completion restarts it.
      - name: Chain the next batch
        if: steps.score.outputs.remaining != '' && steps.score.outputs.remaining != '0' && steps.score.outputs.scored != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/api-client/cli.ts gh --priority default -- workflow run mutation-diff.yml --ref main -f mode=sweep -f max_files=6

      - name: Save sweep state
        if: ${{ always() && steps.capacity.outputs.run == 'true' && steps.portable_state.outcome == 'success' && hashFiles('.cache/jovie-mutation/sweep-state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jovie-mutation
          key: mutation-sweep-portable-v2-${{ github.run_id }}-${{ github.run_attempt }}

      # Snapshot even a failed score/filing attempt. The cache remains the
      # state owner; copying evidence must not rewrite or clear its history.
      - name: Snapshot sweep state and survivor tasks
        id: snapshot
        if: ${{ always() && steps.capacity.outputs.run == 'true' && steps.portable_state.outcome == 'success' && hashFiles('.cache/jovie-mutation/sweep-state.json') != '' }}
        run: |
          set -euo pipefail
          state_dir=".cache/jovie-mutation"
          out_dir="$RUNNER_TEMP/sweep-out"
          mkdir -p "$out_dir"
          cp "$state_dir/sweep-state.json" "$out_dir/"
          for file in "$state_dir/sweep-state.json.runs.jsonl" \
            "$RUNNER_TEMP/test-quality-latest.json" "$RUNNER_TEMP/baseline-proposal.json"; do
            if [ -f "$file" ]; then cp "$file" "$out_dir/"; fi
          done
          if [ -d "$state_dir/survivor-tasks" ]; then
            cp -R "$state_dir/survivor-tasks" "$out_dir/"
          fi

      - name: Upload sweep state and survivor tasks
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/sweep-out/
          retention-days: 30
          if-no-files-found: error

      # The persistent workspace keeps node_modules for the next run; the
      # Stryker sandbox, reports and per-module coverage must not accumulate.
      - name: Clean sweep scratch
        if: always()
        run: rm -rf apps/web/reports/mutation apps/web/.stryker-tmp packages/ui/reports/mutation packages/ui/.stryker-tmp "$RUNNER_TEMP/sweep-out"
