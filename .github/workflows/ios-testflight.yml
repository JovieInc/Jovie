name: iOS TestFlight
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Tim-White
# necessary-trust-boundary: This existing serial workflow authenticates certified source separately from Actions transports, then binds its irreversible Apple upload to an immutable source lease, intent and binary receipt.
# revisit-trigger: Replace this artifact handoff only when the canonical release-channel contract supplies equivalent atomic source-bound upload idempotency and durable provenance, proven by the same replay and lineage regressions.
run-name: iOS TestFlight ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional App Store build number override
        required: false
      changelog:
        description: Optional TestFlight changelog
        required: false
  # Production Controller is the sole automatic release signal. It starts only
  # from successful exact-main CI evidence, and this workflow additionally
  # requires its exact Production Verified job before allocating a macOS runner.
  workflow_run:
    workflows: [Production Controller]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# TestFlight archives are production mutations. Keep one active generation and
# one latest pending generation; never overlap signing or App Store uploads.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize verified iOS release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.authorize.outputs.release_sha }}
      baseline_sha: ${{ steps.authorize.outputs.baseline_sha }}
      should_release: ${{ steps.pin.outputs.lease != '' && steps.select.outputs.should_release == 'true' }}
      lease: ${{ steps.pin.outputs.lease }}
    steps:
      - name: Checkout the rate-limit hold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .testflight-bootstrap
          persist-credentials: false
          sparse-checkout: .github/scripts/gh-api-hold.sh
          sparse-checkout-cone-mode: false
      - name: Cross-prove exact production evidence
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '480'
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_RUN_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_RUN_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_RUN_STATUS: ${{ github.event.workflow_run.status }}
          TRIGGER_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          gh() {
            if [ "${1:-}" != "api" ]; then
              command gh "$@"
              return
            fi
            local err
            err="$(mktemp)"
            if GH_API_HOLD_BIN="$(command -v gh)" bash "$GITHUB_WORKSPACE/.testflight-bootstrap/.github/scripts/gh-api-hold.sh" "$@" 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            cat "$err" >&2
            # A reset outside this job's budget defers. A missing reset and a
            # permission 403 stay fatal. Do not treat the 403 body as success.
            if grep -Eq 'outside the .*budget' "$err" && grep -q 'Not passing' "$err"; then
              record_testflight_quota_defer "$err"
              rm -f "$err"
              if [ "${BASH_SUBSHELL:-0}" -eq 0 ]; then
                finish_testflight_quota_defer
                exit 0
              fi
              return 1
            fi
            rm -f "$err"
            return 1
          }
          # A command substitution fails the assignment under set -e before
          # the next command, so ERR owns that defer. DEBUG owns a later
          # explicit exit after a handled failure. A permission 403 and a
          # missing reset leave no sentinel and stay fatal. Both traps publish
          # the same warning and step summary as a direct defer.
          record_testflight_quota_defer() {
            local reset_epoch reset_iso
            reset_epoch="$(sed -n 's/.*GitHub rate limit resets at \([0-9][0-9]*\).*/\1/p' "$1" | head -n 1)"
            # GNU date accepts -d @epoch. BSD/macOS date rejects that and
            # prints an epoch with -r. GNU -r reads a file mtime, so it is
            # only the fallback after -d fails to produce an ISO instant.
            reset_iso="$(date -u -d "@${reset_epoch}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
            if ! [[ "$reset_iso" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              reset_iso="$(date -u -r "$reset_epoch" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
            fi
            if ! [[ "$reset_iso" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "::error::Installation quota defer could not format the reset instant." >&2
              exit 1
            fi
            printf '%s\n' "$reset_iso" > "$RUNNER_TEMP/testflight-authorize-quota-reset"
            : > "$RUNNER_TEMP/testflight-authorize-quota-defer"
          }
          announce_testflight_quota_defer() {
            local reset_iso deferred_sha line
            reset_iso="$(head -n 1 "$RUNNER_TEMP/testflight-authorize-quota-reset")"
            deferred_sha="${release_sha:-}"
            if ! [[ "$deferred_sha" =~ ^[0-9a-f]{40}$ ]]; then
              deferred_sha="${TRIGGER_HEAD_SHA:-}"
            fi
            if ! [[ "$deferred_sha" =~ ^[0-9a-f]{40}$ ]]; then
              deferred_sha="${MANUAL_SHA:-}"
            fi
            if ! [[ "$deferred_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Installation quota defer has no release candidate SHA." >&2
              exit 1
            fi
            line="Installation quota resets at ${reset_iso}. Deferring TestFlight publication of ${deferred_sha} to the next reconciliation. No release was authorized."
            printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${line}"
          }
          finish_testflight_quota_defer() {
            {
              echo "release_sha="
              echo "baseline_sha="
              echo "authorized=false"
              echo "manual=false"
              echo "already_released=false"
            } >> "$GITHUB_OUTPUT"
            announce_testflight_quota_defer
          }
          defer_testflight_authorize_for_quota() {
            if [ -f "$RUNNER_TEMP/testflight-authorize-quota-defer" ]; then
              finish_testflight_quota_defer
              exit 0
            fi
          }
          trap defer_testflight_authorize_for_quota ERR
          trap defer_testflight_authorize_for_quota DEBUG
          {
            echo "release_sha="
            echo "baseline_sha="
            echo "authorized=false"
            echo "manual=false"
            echo "already_released=false"
          } >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]] &&
              [[ "$TRIGGER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] &&
              [[ "$TRIGGER_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] &&
              [ "$TRIGGER_RUN_EVENT" = "workflow_run" ] &&
              [ "$TRIGGER_RUN_PATH" = ".github/workflows/production-controller.yml" ] &&
              [ "$TRIGGER_HEAD_BRANCH" = "main" ] &&
              [ "$TRIGGER_HEAD_REPOSITORY" = "$REPOSITORY" ] &&
              [ "$TRIGGER_RUN_STATUS" = "completed" ] &&
              [ "$TRIGGER_RUN_CONCLUSION" = "success" ] || {
              echo "::error::TestFlight trigger was not an exact successful Production Controller run."
              exit 1
            }
            release_sha="$TRIGGER_HEAD_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$MANUAL_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Manual TestFlight dispatch did not resolve a full commit SHA."
              exit 1
            }
            release_sha="$MANUAL_SHA"
            echo "manual=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported TestFlight event: $EVENT_NAME"
            exit 1
          fi

          production_controller_workflow="$(gh api \
            "repos/$REPOSITORY/actions/workflows/production-controller.yml")"
          jq -e '
            type == "object" and
            (.id | type == "number" and . >= 1 and floor == .) and
            .name == "Production Controller" and
            .path == ".github/workflows/production-controller.yml"
          ' >/dev/null <<<"$production_controller_workflow" || {
            echo "::error::GitHub returned malformed Production Controller workflow identity."
            exit 1
          }
          production_controller_workflow_id="$(jq -r '.id | tostring' \
            <<<"$production_controller_workflow")"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_record="$(gh api \
              "repos/$REPOSITORY/actions/runs/$TRIGGER_RUN_ID/attempts/$TRIGGER_RUN_ATTEMPT")"
            controller_generation_selector="$(cat <<'JQ'
              if (
                type == "object" and
                (.id | type == "number" and . >= 1 and floor == .) and
                (.id | tostring) == $run_id and
                (.run_attempt | type == "number" and . >= 1 and floor == .) and
                (.run_attempt | tostring) == $run_attempt and
                (.workflow_id | type == "number" and . >= 1 and floor == .) and
                (.workflow_id | tostring) == $workflow_id and
                .head_sha == $transport_sha and
                .head_branch == "main" and
                .head_repository.full_name == $repo and
                .event == "workflow_run" and
                .path == ".github/workflows/production-controller.yml" and
                .status == "completed" and
                .conclusion == "success" and
                (.display_title | type == "string" and
                  test("^Production Controller [0-9a-f]{40} from CI [1-9][0-9]* attempt [1-9][0-9]*$"))
              ) then
                .display_title
                | capture("^Production Controller (?<generation>[0-9a-f]{40}) from CI [1-9][0-9]* attempt [1-9][0-9]*$")
                | .generation
              else
                empty
              end
          JQ
          )"
            if ! controller_generation="$(jq -er \
              --arg repo "$REPOSITORY" \
              --arg run_id "$TRIGGER_RUN_ID" \
              --arg run_attempt "$TRIGGER_RUN_ATTEMPT" \
              --arg workflow_id "$production_controller_workflow_id" \
              --arg transport_sha "$release_sha" \
              "$controller_generation_selector" <<<"$run_record")"; then
              echo "::error::Exact Production Controller attempt evidence did not match the workflow_run signal."
              exit 1
            fi
            controller_transport_sha="$release_sha"
            release_sha="$controller_generation"
          fi

          current_main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha // empty')"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve exact current main for TestFlight authorization."
            exit 1
          }
          if [ "$current_main_sha" != "$release_sha" ]; then
            comparison="$(gh api "repos/$REPOSITORY/compare/$release_sha...$current_main_sha")"
            jq -e --arg sha "$release_sha" '.status == "ahead" and .merge_base_commit.sha == $sha' \
              >/dev/null <<<"$comparison" || {
              echo "::error::Certified TestFlight source left main lineage."
              exit 1
            }
          fi

          prove_existing_production_marker() {
            local expected_sha="$1"
            local marker_name="production-generation-verified-$expected_sha"
            local artifacts_json marker_candidates
            artifacts_json="$(gh api \
              "repos/$REPOSITORY/actions/artifacts?name=$marker_name&per_page=100")"
            jq -e 'type == "object" and (.artifacts | type == "array")' \
              >/dev/null <<<"$artifacts_json" || return 1
            marker_candidates="$(jq -r --arg sha "$expected_sha" '
              [
                .artifacts[]
                | select(
                    .expired == false and
                    .name == ("production-generation-verified-" + $sha)
                  )
              ]
              | sort_by(.created_at, .id) | reverse
              | .[] | [.id, .workflow_run.id] | @tsv
            ' <<<"$artifacts_json")"

            while IFS=$'\t' read -r artifact_id controller_run_id; do
              [ -n "$controller_run_id" ] || continue
              [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] &&
                [[ "$controller_run_id" =~ ^[1-9][0-9]*$ ]] || continue

              local controller_json controller_attempt controller_jobs verified_count
              controller_json="$(gh api \
                "repos/$REPOSITORY/actions/runs/$controller_run_id")" || continue
              if ! jq -e \
                --arg repo "$REPOSITORY" \
                --arg sha "$expected_sha" \
                --arg workflow_id "$production_controller_workflow_id" '
                  type == "object" and
                  (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
                  .head_branch == "main" and
                  .head_repository.full_name == $repo and
                  .event == "workflow_run" and
                  (.workflow_id | tostring) == $workflow_id and
                  .path == ".github/workflows/production-controller.yml" and
                  .status == "completed" and
                  .conclusion == "success" and
                  (.run_attempt | type == "number" and . >= 1) and
                  (.display_title | type == "string" and
                    test("^Production Controller " + $sha +
                      " from CI [1-9][0-9]* attempt [1-9][0-9]*$"))
                ' >/dev/null <<<"$controller_json"; then
                continue
              fi
              controller_attempt="$(jq -r '.run_attempt' <<<"$controller_json")"
              controller_jobs="$(gh api --paginate --slurp \
                "repos/$REPOSITORY/actions/runs/$controller_run_id/attempts/$controller_attempt/jobs?per_page=100")" || continue
              if ! jq -e '
                type == "array" and length > 0 and
                all(.[]; type == "object" and (.jobs | type == "array"))
              ' >/dev/null <<<"$controller_jobs"; then
                continue
              fi
              verified_count="$(jq --arg sha "$(jq -r .head_sha <<<"$controller_json")" '
                [
                  .[].jobs[]?
                  | select(
                      .name == "Production Verified" and
                      .head_sha == $sha and
                      .status == "completed" and
                      .conclusion == "success"
                    )
                ] | length
              ' <<<"$controller_jobs")"
              [ "$verified_count" = "1" ] || continue

              local marker_archive marker_json
              marker_archive="$RUNNER_TEMP/production-marker-${artifact_id}.zip"
              marker_json="$RUNNER_TEMP/production-marker-${artifact_id}.json"
              gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
                > "$marker_archive" || continue
              if unzip -p "$marker_archive" production-generation-verified.json \
                > "$marker_json" 2>/dev/null &&
                jq -e \
                  --arg sha "$expected_sha" \
                  --arg run "$controller_run_id" '
                    type == "object" and
                    .sha == $sha and
                    (.deploymentId | type == "string" and startswith("dpl_")) and
                    .controllerRun == $run
                  ' >/dev/null "$marker_json"; then
                return 0
              fi
            done <<<"$marker_candidates"
            return 1
          }

          production_proven=false
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            jobs_json="$(gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$TRIGGER_RUN_ID/attempts/$TRIGGER_RUN_ATTEMPT/jobs?per_page=100")"
            jq -e '
              type == "array" and length > 0 and
              all(.[]; type == "object" and (.jobs | type == "array"))
            ' >/dev/null <<<"$jobs_json" || {
              echo "::error::GitHub returned malformed Production Controller job evidence."
              exit 1
            }
            verified_count="$(jq --arg sha "$controller_transport_sha" '
              [
                .[].jobs[]?
                | select(
                    .name == "Production Verified" and
                    .head_sha == $sha and
                    .status == "completed" and
                    .conclusion == "success"
                  )
              ] | length
            ' <<<"$jobs_json")"
            verified_skipped="$(jq --arg sha "$controller_transport_sha" '
              [
                .[].jobs[]?
                | select(
                    .name == "Production Verified" and
                    .head_sha == $sha and
                    .conclusion == "skipped"
                  )
              ] | length
            ' <<<"$jobs_json")"
            if [ "$verified_count" = "1" ]; then
              production_proven=true
            fi
          fi

          if [ "$production_proven" != "true" ]; then
            if prove_existing_production_marker "$release_sha"; then
              production_proven=true
              echo "Existing exact Production Verified marker authorized $release_sha."
            elif [ "${verified_skipped:-0}" = "1" ]; then
              # The controller concluded success with Production Verified
              # skipped only when it deliberately yielded the release lease —
              # for example when the fleet gate held deployment. Nothing was
              # verified, so this observer has nothing to release and must not
              # fail main.
              echo "::notice::Production Verified was skipped for $release_sha because the controller yielded the release lease; no TestFlight release is due."
              exit 0
            else
              echo "::error::Current main lacks exact successful Production Verified evidence."
              exit 1
            fi
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"


          testflight_workflow="$(gh api \
            "repos/$REPOSITORY/actions/workflows/ios-testflight.yml")"
          jq -e '
            type == "object" and
            (.id | type == "number" and . >= 1 and floor == .) and
            .name == "iOS TestFlight" and
            .path == ".github/workflows/ios-testflight.yml"
          ' >/dev/null <<<"$testflight_workflow" || {
            echo "::error::GitHub returned malformed TestFlight workflow identity."
            exit 1
          }
          testflight_workflow_id="$(jq -r '.id | tostring' \
            <<<"$testflight_workflow")"

          # Upload markers are written only after the exact beta job succeeds.
          # Unlike workflow success, this fixed-name history cannot be polluted
          # by the common authorize-success/beta-skipped path.
          testflight_marker_history_allows_legacy_bootstrap() {
            local candidate_count="$1"
            local accepted_baseline="$2"

            [[ "$candidate_count" =~ ^[0-9]+$ ]] || return 2
            if [ -n "$accepted_baseline" ]; then
              [[ "$accepted_baseline" =~ ^[0-9a-f]{40}$ ]] || return 2
              return 0
            fi
            [ "$candidate_count" -eq 0 ]
          }

          marker_name="testflight-upload-verified"
          marker_listing="$(gh api \
            "repos/$REPOSITORY/actions/artifacts?name=$marker_name&per_page=100")"
          jq -e --arg name "$marker_name" '
            type == "object" and
            (.artifacts | type == "array") and
            all(.artifacts[]?;
              type == "object" and
              .name == $name and
              (.expired | type == "boolean")
            ) and
            all(
              .artifacts[]?
              | select(.name == $name and .expired == false);
              (.id | type == "number" and . >= 1 and floor == .) and
              (.workflow_run | type == "object") and
              (.workflow_run.id | type == "number" and . >= 1 and floor == .) and
              (.created_at | type == "string")
            )
          ' \
            >/dev/null <<<"$marker_listing" || {
            echo "::error::GitHub returned malformed TestFlight marker history."
            exit 1
          }
          marker_candidate_count="$(jq --arg name "$marker_name" '[
            .artifacts[]?
            | select(.name == $name and .expired == false)
          ] | length' <<<"$marker_listing")"
          marker_candidates="$(jq -r --arg name "$marker_name" '
            [
              .artifacts[]?
              | select(
                  .expired == false and
                  .name == $name
                )
            ]
            | sort_by(.created_at, .id) | reverse
            | .[] | [.id, .workflow_run.id] | @tsv
          ' <<<"$marker_listing")"

          accept_upload_frontier() {
            local candidate="$1" comparison
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || return 1
            if [ -z "$baseline_sha" ] || [ "$baseline_sha" = "$candidate" ]; then
              baseline_sha="$candidate"
              return 0
            fi
            comparison="$(gh api "repos/$REPOSITORY/compare/$baseline_sha...$candidate")" || return 1
            case "$(jq -r '.status // empty' <<<"$comparison")" in
              ahead)
                [ "$(jq -r '.merge_base_commit.sha // empty' <<<"$comparison")" = "$baseline_sha" ] || return 1
                baseline_sha="$candidate"
                ;;
              behind)
                [ "$(jq -r '.merge_base_commit.sha // empty' <<<"$comparison")" = "$candidate" ] || return 1
                ;;
              *) echo "::error::Proven TestFlight uploads have divergent lineage."; return 1 ;;
            esac
          }

          baseline_sha=""
          while IFS=$'\t' read -r artifact_id run_id; do
            [ -n "$artifact_id" ] || continue
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] &&
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::GitHub returned malformed TestFlight marker identity."
              exit 1
            }

            marker_archive="$RUNNER_TEMP/testflight-marker-${artifact_id}.zip"
            marker_json="$RUNNER_TEMP/testflight-marker-${artifact_id}.json"
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$marker_archive"
            if ! unzip -p "$marker_archive" testflight-upload-verified.json \
              > "$marker_json" 2>/dev/null ||
              ! jq -e '
                type == "object" and
                (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.workflowRun | type == "string" and test("^[1-9][0-9]*$")) and
                (.uploadRunAttempt | type == "string" and test("^[1-9][0-9]*$")) and
                (.uploadJob | type == "string" and test("^[1-9][0-9]*$"))
              ' >/dev/null "$marker_json"; then
              echo "::warning::Ignoring malformed TestFlight upload marker artifact $artifact_id."
              continue
            fi

            marker_sha="$(jq -r '.sha' "$marker_json")"
            marker_transport_sha="$(jq -r '.transportSha // .sha' "$marker_json")"
            marker_attested=false
            if jq -e 'has("schema")' >/dev/null "$marker_json"; then
              jq -e '
                .schema == "jovie-testflight-upload/v2" and
                .lease.schema == "jovie-testflight-release-lease/v1" and
                .lease.sourceSha == .sha and .lease.transportSha == .transportSha and
                .lease.workflowRun == .workflowRun and
                .lease.workflowAttempt == .uploadRunAttempt and
                (.binarySha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                (.buildNumber | type == "string" and test("^[0-9]+$"))
              ' >/dev/null "$marker_json" || {
                echo "::error::TestFlight receipt contradicts its source/transport attestation."
                exit 1
              }
              marker_attested=true
            fi
            marker_run_id="$(jq -r '.workflowRun' "$marker_json")"
            upload_attempt="$(jq -r '.uploadRunAttempt' "$marker_json")"
            upload_job_id="$(jq -r '.uploadJob' "$marker_json")"
            if [ "$marker_run_id" != "$run_id" ]; then
              echo "::warning::Ignoring TestFlight marker $artifact_id with mismatched run identity."
              continue
            fi

            marker_run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
            jq -e 'type == "object"' >/dev/null <<<"$marker_run" || {
              echo "::error::GitHub returned malformed marked TestFlight workflow evidence."
              exit 1
            }
            if ! jq -e \
              --arg repo "$REPOSITORY" \
              --arg run "$run_id" \
              --arg sha "$marker_transport_sha" \
              --arg workflow_id "$testflight_workflow_id" '
                type == "object" and
                (.id | tostring) == $run and
                (.run_attempt | type == "number" and . >= 1 and floor == .) and
                (.workflow_id | tostring) == $workflow_id and
                .path == ".github/workflows/ios-testflight.yml" and
                .display_title == ("iOS TestFlight " + $sha) and
                (.event == "workflow_run" or .event == "workflow_dispatch") and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repo and
                .status == "completed" and
                .conclusion == "success"
              ' >/dev/null <<<"$marker_run"; then
              echo "::warning::Ignoring TestFlight marker $artifact_id without exact workflow identity."
              continue
            fi
            marker_run_attempt="$(jq -r '.run_attempt' <<<"$marker_run")"

            # A successful publisher-only rerun cannot change the first
            # attempt's failure. Only an attested v2 receipt may recover that
            # strictly earlier failed attempt; exact beta success is still
            # required below. Cancelled or unknown attempts remain rejected.
            upload_run="$(gh api \
              "repos/$REPOSITORY/actions/runs/$run_id/attempts/$upload_attempt")"
            jq -e 'type == "object"' >/dev/null <<<"$upload_run" || {
              echo "::error::GitHub returned malformed marked TestFlight attempt evidence."
              exit 1
            }
            if ! jq -e \
              --arg repo "$REPOSITORY" \
              --arg run "$run_id" \
              --arg attempt "$upload_attempt" \
              --arg sha "$marker_transport_sha" \
              --arg workflow_id "$testflight_workflow_id" \
              --argjson marker_attempt "$marker_run_attempt" \
              --argjson attested "$marker_attested" '
                type == "object" and
                (.id | tostring) == $run and
                (.run_attempt | tostring) == $attempt and
                (.workflow_id | tostring) == $workflow_id and
                .path == ".github/workflows/ios-testflight.yml" and
                .display_title == ("iOS TestFlight " + $sha) and
                (.event == "workflow_run" or .event == "workflow_dispatch") and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repo and
                .status == "completed" and
                .run_attempt <= $marker_attempt and
                (
                  .conclusion == "success" or
                  ($attested and .conclusion == "failure" and .run_attempt < $marker_attempt)
                )
              ' >/dev/null <<<"$upload_run"; then
              echo "::warning::Ignoring TestFlight marker $artifact_id with mismatched upload attempt."
              continue
            fi

            upload_jobs="$(gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$run_id/attempts/$upload_attempt/jobs?per_page=100")"
            jq -e '
              type == "array" and length > 0 and
              all(.[]; type == "object" and (.jobs | type == "array"))
            ' >/dev/null <<<"$upload_jobs" || {
              echo "::error::GitHub returned malformed marked TestFlight job evidence."
              exit 1
            }
            marked_upload_count="$(jq \
              --arg sha "$marker_transport_sha" \
              --arg job "$upload_job_id" '
                [
                  .[].jobs[]?
                  | select(
                      (.id | tostring) == $job and
                      .name == "Upload Internal TestFlight" and
                      .head_sha == $sha and
                      .status == "completed" and
                      .conclusion == "success"
                    )
                ] | length
              ' <<<"$upload_jobs")"
            [ "$marked_upload_count" = "1" ] || {
              echo "::warning::Ignoring TestFlight marker $artifact_id without its exact successful upload job."
              continue
            }

            accept_upload_frontier "$marker_sha"
            echo "Accepted exact TestFlight upload marker $artifact_id from run $run_id attempt $upload_attempt."
          done <<<"$marker_candidates"

          if ! testflight_marker_history_allows_legacy_bootstrap \
            "$marker_candidate_count" "$baseline_sha"; then
            echo "::error::Stable TestFlight markers exist, but none fully proves a successful upload."
            exit 1
          fi

          # Bootstrap/recovery only: older uploads predate the stable marker, and
          # marker upload can fail after beta succeeds. Scan one bounded page and
          # accept a baseline only when an exact run-attempt beta job succeeded.
          # Authorization-only completion is never release truth. Once one marker
          # lands, stable upload-only history becomes the permanent index.
          if [ -z "$baseline_sha" ]; then
            runs_json="$(gh api \
              "repos/$REPOSITORY/actions/workflows/ios-testflight.yml/runs?branch=main&status=completed&per_page=100")"
            jq -e '
              type == "object" and
              (.workflow_runs | type == "array") and
              all(.workflow_runs[]?;
                type == "object" and
                (.id | type == "number" and . >= 1 and floor == .) and
                (.run_attempt | type == "number" and . >= 1 and floor == .) and
                (.workflow_id | type == "number" and . >= 1 and floor == .) and
                (.path | type == "string") and
                (.event | type == "string") and
                (.status | type == "string") and
                (.head_branch | type == "string") and
                (.head_sha | type == "string") and
                (.head_repository | type == "object") and
                (.head_repository.full_name | type == "string") and
                (.created_at | type == "string")
              )
            ' \
              >/dev/null <<<"$runs_json" || {
              echo "::error::GitHub returned malformed TestFlight run history."
              exit 1
            }
            completed_runs="$(jq -c \
              --arg repo "$REPOSITORY" \
              --arg workflow_id "$testflight_workflow_id" \
              '[.workflow_runs[]? | select(
              (.workflow_id | tostring) == $workflow_id and
              .path == ".github/workflows/ios-testflight.yml" and
              (.event == "workflow_run" or .event == "workflow_dispatch" or .event == "push") and
              .status == "completed" and
              .head_branch == "main" and .head_repository.full_name == $repo and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              (.id | type == "number") and (.run_attempt | type == "number")
            )]' <<<"$runs_json")"

            # The marker job can fail after App Store Connect has accepted beta,
            # so workflow conclusion is not external upload truth. Cross-prove
            # every exact run attempt and accept only a successful beta job.
            while IFS=$'\t' read -r run_id run_attempt run_sha; do
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] &&
                [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] &&
                [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::Completed TestFlight run history contained malformed identity."
                exit 1
              }
              run_has_upload=false
              for attempt in $(seq 1 "$run_attempt"); do
                run_jobs="$(gh api --paginate --slurp \
                  "repos/$REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100")"
                jq -e '
                  type == "array" and length > 0 and
                  all(.[]; type == "object" and (.jobs | type == "array"))
                ' >/dev/null <<<"$run_jobs" || {
                  echo "::error::GitHub returned malformed TestFlight upload job evidence."
                  exit 1
                }
                beta_count="$(jq --arg sha "$run_sha" '
                  [
                    .[].jobs[]?
                    | select(
                        .name == "Upload Internal TestFlight" and
                        .head_sha == $sha and
                        .status == "completed" and
                        .conclusion == "success"
                      )
                  ] | length
                ' <<<"$run_jobs")"
                if [ "$beta_count" -gt 1 ]; then
                  echo "::error::TestFlight run $run_id attempt $attempt has ambiguous upload jobs."
                  exit 1
                fi
                if [ "$beta_count" = "1" ]; then
                  jq -e --arg sha "$run_sha" '
                    [.[].jobs[]? | select(.name == "Upload Internal TestFlight" and .head_sha == $sha and .conclusion == "success")] |
                    length == 1 and all(.[]; (.steps | type == "array" and length > 0) and all(.steps[]; (.name | type == "string" and length > 0)))
                  ' >/dev/null <<<"$run_jobs" || {
                    echo "::error::Successful beta step provenance is unknown."
                    exit 1
                  }
                  post_lease_beta="$(jq --arg sha "$run_sha" '[.[].jobs[]? |
                    select(.name == "Upload Internal TestFlight" and .head_sha == $sha and .conclusion == "success") |
                    .steps[]? | select(.name == "Preserve exact uploaded binary attestation")
                  ] | length' <<<"$run_jobs")"
                  if [ "$post_lease_beta" != "0" ]; then
                    recovery_artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
                    recovery_id="$(jq -er --arg name "testflight-binary-$attempt" '
                      [.artifacts[] | select(.name == $name and .expired == false)] |
                      if length == 1 then .[0].id else error("missing exact uploaded binary attestation") end
                    ' <<<"$recovery_artifacts")"
                    gh api "repos/$REPOSITORY/actions/artifacts/$recovery_id/zip" > "$RUNNER_TEMP/recovered-binary.zip"
                    unzip -p "$RUNNER_TEMP/recovered-binary.zip" testflight-upload-attestation.json > "$RUNNER_TEMP/recovered-binary.json"
                    jq -e --arg repo "$REPOSITORY" --arg transport "$run_sha" --arg run "$run_id" --arg attempt "$attempt" '
                      .schema == "jovie-testflight-binary/v1" and
                      .lease.schema == "jovie-testflight-release-lease/v1" and
                      .lease.repository == $repo and .lease.transportSha == $transport and
                      .lease.workflowRun == $run and .lease.workflowAttempt == $attempt and
                      (.lease.sourceSha | type == "string" and test("^[0-9a-f]{40}$")) and
                      (.binarySha256 | type == "string" and test("^[0-9a-f]{64}$"))
                    ' >/dev/null "$RUNNER_TEMP/recovered-binary.json" || {
                      echo "::error::Successful beta lacks exact source/transport binary attestation."
                      exit 1
                    }
                    run_source_sha="$(jq -r '.lease.sourceSha' "$RUNNER_TEMP/recovered-binary.json")"
                  else
                    run_source_sha="$run_sha"
                  fi
                  run_has_upload=true
                fi
              done
              if [ "$run_has_upload" = "true" ]; then
                accept_upload_frontier "$run_source_sha"
              fi
            done < <(jq -r '
              sort_by(.created_at, .id) | reverse | .[] |
              [.id, .run_attempt, .head_sha] | @tsv
            ' <<<"$completed_runs")
          fi

          if [ -z "$baseline_sha" ]; then
            echo "::notice::No proven TestFlight upload baseline exists; treating this as the first verified release."
            exit 0
          fi
          if [ "$baseline_sha" = "$release_sha" ]; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Exact main generation $release_sha already reached TestFlight."
            exit 0
          fi

          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact authorized main
        if: ${{ steps.authorize.outputs.authorized == 'true' && steps.authorize.outputs.already_released != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.release_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Select iOS-relevant production generation
        id: select
        env:
          AUTHORIZED: ${{ steps.authorize.outputs.authorized }}
          ALREADY_RELEASED: ${{ steps.authorize.outputs.already_released }}
          MANUAL: ${{ steps.authorize.outputs.manual }}
          RELEASE_SHA: ${{ steps.authorize.outputs.release_sha }}
          BASELINE_SHA: ${{ steps.authorize.outputs.baseline_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          if [ "$AUTHORIZED" != "true" ] || [ "$ALREADY_RELEASED" = "true" ]; then
            exit 0
          fi
          if [ "$MANUAL" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Explicit current-main TestFlight rebuild authorized."
            exit 0
          fi
          if [ -z "$BASELINE_SHA" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No successful TestFlight baseline exists; releasing the verified current generation."
            exit 0
          fi

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::TestFlight comparison SHAs are malformed."
            exit 1
          }
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$RELEASE_SHA" || {
            echo "::error::The last successful TestFlight SHA is not an ancestor of the authorized current main SHA."
            exit 1
          }
          release_paths=(
            apps/ios
            fastlane
            Gemfile
            Gemfile.lock
            scripts/ios-best-practices-lint.sh
            .github/workflows/ios-ci.yml
            .github/workflows/ios-testflight.yml
            .github/scripts/testflight-release-lease.mjs
            .github/testflight-release-policy.json
          )
          changed_files="$(git diff --name-only "$BASELINE_SHA" "$RELEASE_SHA")"
          relevant_files="$(git diff --name-only "$BASELINE_SHA" "$RELEASE_SHA" -- "${release_paths[@]}")"
          printf '%s\n' "$changed_files"
          if [ -n "$relevant_files" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Verified production generation contains iOS release changes."
          else
            echo "No iOS release changes since the last successful TestFlight upload."
          fi

      - name: Checkout pinned release guard
        if: ${{ steps.select.outputs.should_release == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .testflight-tools
          sparse-checkout: |
            .github/scripts/testflight-release-lease.mjs
            .github/scripts/gh-api-hold.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pin bounded certified release
        id: pin
        if: ${{ steps.select.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '480'
          RELEASE_SHA: ${{ steps.authorize.outputs.release_sha }}
          TESTFLIGHT_TRANSPORT_SHA: ${{ github.sha }}
          BASELINE_SHA: ${{ steps.authorize.outputs.baseline_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TESTFLIGHT_LEASE_PATH: ${{ github.workspace }}/testflight-release-lease.json
        run: |
          set -euo pipefail
          # A missing file is an incomplete checkout, not an older source.
          [ -f fastlane/Fastfile ] || {
            echo "::error::Certified source checkout is missing fastlane/Fastfile."
            exit 1
          }
          # Older certified sources cannot execute the new final upload guard.
          # They must wait for a normally certified source containing this fix.
          if ! grep -q 'TESTFLIGHT_GUARD_PATH' fastlane/Fastfile; then
            echo "::notice::Certified source predates the bounded upload guard; waiting for its certified descendant."
            exit 0
          fi
          node .testflight-tools/.github/scripts/testflight-release-lease.mjs admit

      - name: Reserve immutable upload intent
        if: ${{ steps.pin.outputs.lease != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-upload-intent-${{ steps.authorize.outputs.baseline_sha || 'bootstrap' }}
          path: ${{ github.workspace }}/testflight-release-lease.json
          if-no-files-found: error
          retention-days: 90

  full-regression:
    name: Full iOS release regression
    needs: [authorize-release]
    if: ${{ needs.authorize-release.result == 'success' && needs.authorize-release.outputs.should_release == 'true' }}
    # ios-ci's opt-in Mac route job declares actions: write; a release never
    # opts in (full-regression stays on hosted macOS), but the grant must exist.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-ci.yml
    with:
      checkout-ref: ${{ needs.authorize-release.outputs.release_sha }}
      concurrency-key: release-${{ needs.authorize-release.outputs.release_sha }}
      full-regression: true

  # Store graphics for every release generation. Advisory: never gates beta.
  app-store-graphics:
    name: iOS App Store graphics
    needs: [authorize-release]
    if: ${{ needs.authorize-release.result == 'success' && needs.authorize-release.outputs.should_release == 'true' }}
    uses: ./.github/workflows/ios-app-store-graphics.yml
    with:
      checkout-ref: ${{ needs.authorize-release.outputs.release_sha }}

  beta:
    name: Upload Internal TestFlight
    needs: [authorize-release, full-regression]
    if: ${{ needs.authorize-release.result == 'success' && needs.full-regression.result == 'success' && needs.authorize-release.outputs.should_release == 'true' }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
      TESTFLIGHT_TRANSPORT_SHA: ${{ github.sha }}
      BASELINE_SHA: ${{ needs.authorize-release.outputs.baseline_sha }}
      TESTFLIGHT_LEASE: ${{ needs.authorize-release.outputs.lease }}
      TESTFLIGHT_LEASE_PATH: ${{ github.workspace }}/testflight-release-lease.json
      TESTFLIGHT_GUARD_PATH: ${{ github.workspace }}/.testflight-tools/.github/scripts/testflight-release-lease.mjs
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_COMPANY_NAME: ${{ secrets.APP_STORE_COMPANY_NAME }}
      JOVIE_IOS_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      JOVIE_IOS_OBSERVABILITY_ENVIRONMENT: production
      API_BASE_URL: https://jov.ie
      WEB_BASE_URL: https://jov.ie
      IOS_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || github.run_number }}
      TESTFLIGHT_CHANGELOG: ${{ github.event_name == 'workflow_dispatch' && inputs.changelog || format('Internal build {0}', needs.authorize-release.outputs.release_sha) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate TestFlight secrets
        shell: bash
        run: bash apps/ios/scripts/validate-testflight-env.sh

      - name: Checkout pinned release guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .testflight-tools
          sparse-checkout: |
            .github/scripts/testflight-release-lease.mjs
            .github/scripts/gh-api-hold.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Revalidate certified lease before archive
        env:
          GH_API_HOLD_BUDGET_SECONDS: '600'
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the canonical bounded hold, then re-read all authority in
          # the lease guard. This preflight cannot renew or replace the lease.
          held_main_sha="$(bash "$GITHUB_WORKSPACE/.testflight-tools/.github/scripts/gh-api-hold.sh" api "repos/${{ github.repository }}/commits/main" --jq '.sha // empty')"
          [[ "$held_main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::TestFlight archive preflight could not resolve authoritative main."
            exit 1
          }
          printf '%s\n' "$TESTFLIGHT_LEASE" > "$TESTFLIGHT_LEASE_PATH"
          node "$TESTFLIGHT_GUARD_PATH" archive

      - name: Upload internal TestFlight build
        env:
          GH_API_HOLD_BUDGET_SECONDS: '600'
        shell: bash
        run: |
          set -euo pipefail
          match_git_private_key="${MATCH_GIT_PRIVATE_KEY:-}"
          if [[ -z "${match_git_private_key//[[:space:]]/}" ]]; then
            unset MATCH_GIT_PRIVATE_KEY
          fi
          bundle exec fastlane ios beta

      - name: Preserve exact uploaded binary attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-binary-${{ github.run_attempt }}
          path: artifacts/ios-build/testflight-upload-attestation.json
          if-no-files-found: error
          retention-days: 90

  record-upload:
    name: Record exact TestFlight upload
    needs: [authorize-release, beta]
    if: ${{ always() && needs.authorize-release.result == 'success' && needs.beta.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quota_deferred: ${{ steps.record.outputs.quota_deferred }}
      quota_reset_epoch: ${{ steps.record.outputs.quota_reset_epoch }}
    steps:
      - name: Checkout the rate-limit hold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/gh-api-hold.sh
            .github/scripts/testflight-record-upload.sh
          sparse-checkout-cone-mode: false
      - name: Cross-prove and record the exact upload job
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '180'
          RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
          TRANSPORT_SHA: ${{ github.sha }}
          LEASE: ${{ needs.authorize-release.outputs.lease }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/testflight-record-upload.sh"

      - name: Preserve upload-only TestFlight baseline marker
        if: ${{ steps.record.outputs.quota_deferred != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-upload-verified
          path: ${{ runner.temp }}/testflight-upload-verified.json
          if-no-files-found: error
          retention-days: 90

  # One sleep until the known reset, then one re-attempt of the same proof.
  # This does not upload again and does not poll GitHub.
  wait-for-deferred-testflight-record:
    name: Wait for deferred TestFlight record
    needs: [record-upload]
    if: ${{ always() && needs.record-upload.result == 'success' && needs.record-upload.outputs.quota_deferred == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait until the installation quota reset
        env:
          QUOTA_RESET_EPOCH: ${{ needs.record-upload.outputs.quota_reset_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUOTA_RESET_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::TestFlight record defer has no quota reset epoch." >&2
            exit 1
          }
          now="$(date +%s)"
          wait_for=$((QUOTA_RESET_EPOCH + 5 - now))
          if [ "$wait_for" -lt 0 ]; then
            wait_for=0
          fi
          if [ "$wait_for" -gt 3900 ]; then
            echo "::error::Installation quota reset is ${wait_for}s away, outside the 3900s retry cap. Not passing." >&2
            exit 1
          fi
          echo "Waiting ${wait_for}s to record the same TestFlight upload."
          sleep "$wait_for"

  record-deferred-upload:
    name: Record deferred TestFlight upload
    needs: [authorize-release, wait-for-deferred-testflight-record]
    if: ${{ needs.wait-for-deferred-testflight-record.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the rate-limit hold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/gh-api-hold.sh
            .github/scripts/testflight-record-upload.sh
          sparse-checkout-cone-mode: false
      - name: Cross-prove and record the exact upload job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_HOLD_BUDGET_SECONDS: '180'
          TESTFLIGHT_RECORD_QUOTA_RETRY: '1'
          RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
          TRANSPORT_SHA: ${{ github.sha }}
          LEASE: ${{ needs.authorize-release.outputs.lease }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/testflight-record-upload.sh"
      - name: Preserve upload-only TestFlight baseline marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-upload-verified
          path: ${{ runner.temp }}/testflight-upload-verified.json
          if-no-files-found: error
          retention-days: 90

  require-recorded-upload:
    name: Require recorded TestFlight upload
    needs: [record-upload, record-deferred-upload]
    if: ${{ always() && needs.record-upload.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless the successful upload has a marker
        env:
          QUOTA_DEFERRED: ${{ needs.record-upload.outputs.quota_deferred }}
          RETRY_RESULT: ${{ needs.record-deferred-upload.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$QUOTA_DEFERRED" != "true" ]; then
            exit 0
          fi
          if [ "$RETRY_RESULT" != "success" ]; then
            echo "::error::Successful TestFlight upload was not recorded after the quota defer." >&2
            exit 1
          fi
