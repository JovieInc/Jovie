name: Node Runtime Freshness
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-runtime-freshness
  cancel-in-progress: true
jobs:
  policy:
    name: Enforce official Node lifecycle and patch SLA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/node-runtime-policy.mjs validate
      - run: node scripts/node-runtime-policy.mjs resolve
