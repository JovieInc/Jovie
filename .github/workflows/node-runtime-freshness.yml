name: Node Runtime Freshness
# controller-hop-exception: jovie-controller-hop/v1
# accountable-writer: Summer
# necessary-trust-boundary: Node.js publishes releases outside the repo, so this daily job is the only hop that reads nodejs.org and Docker Hub, rewrites the exact pin files and opens one jovie-bot PR; that PR merges only through the normal required checks and never deploys or publishes.
# removal-trigger: Remove the bump job when Renovate or Dependabot can move every exact pin file, tarball checksum and image digest in one PR that passes the pin contract tests.
# clock-class: upstream-advisory
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-runtime-freshness
  cancel-in-progress: true
jobs:
  policy:
    name: Enforce official Node lifecycle and patch SLA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/node-runtime-policy.mjs validate
      - run: node scripts/node-runtime-policy.mjs resolve
  bump:
    # A newer release in the pinned major opens its own pin PR the day it ships.
    # It merges like any PR: full CI, then the merge queue on the combined head.
    name: Open the patch upgrade PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prime Node toolcache (no GitHub API manifest call)
        if: ${{ hashFiles('.github/actions/prime-node-toolcache/action.yml') != '' }}
        uses: ./.github/actions/prime-node-toolcache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Move the pin to the newest release in its major
        id: bump
        run: node scripts/node-runtime-bump.mjs --latest
      - name: Generate Jovie Bot token
        id: app-token
        if: steps.bump.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
      - name: Open the pin PR once
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FROM: ${{ steps.bump.outputs.from }}
          TO: ${{ steps.bump.outputs.to }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="automation/node-${TO}"
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${branch}" >/dev/null; then
            echo "Branch ${branch} already exists; its PR carries this upgrade."
            exit 0
          fi
          git config user.name "jovie-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$branch"
          git commit -am "build(node): move production Node to ${TO}" \
            -m "Generated by node-runtime-freshness.yml (${RUN_URL})."
          git push -u origin "$branch"
          FROM="$FROM" TO="$TO" RUN_URL="$RUN_URL" \
            node -e 'const t=require("fs").readFileSync(".github/node-runtime-bump-pr.md","utf8");process.stdout.write(t.replace(/\{(FROM|TO|RUN_URL)\}/g,(_,k)=>process.env[k]))' \
            > "$RUNNER_TEMP/body.md"
          node packages/api-client/cli.ts gh --priority repair -- pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "build(node): move production Node to ${TO}" \
            --body-file "$RUNNER_TEMP/body.md"
