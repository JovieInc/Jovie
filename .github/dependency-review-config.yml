# Blocking pull-request dependency diff. GitHub Dependency Review compares only
# manifests and lockfiles the pull request changes. `high` fails that severity
# and critical. `warn-only` must stay false. `deny-licenses` is deprecated
# upstream; a future major must replace it with an equivalent denylist, not
# delete the check. LGPL is a separate family and is not denied. A dual license
# that still offers GPL or AGPL fails, because the action treats the expression
# as satisfied by the denied id.
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown
vulnerability-check: true
license-check: true
warn-only: false
comment-summary-in-pr: never
show-openssf-scorecard: false
deny-licenses:
  - AGPL-1.0
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - GPL-1.0
  - GPL-1.0-only
  - GPL-1.0-or-later
  - GPL-2.0
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-2.0-with-classpath-exception
  - GPL-3.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - GPL-3.0-with-GCC-exception
