version: 2
updates:
  # Enable version updates for Node dependencies (npm ecosystem, pnpm-managed project)
  - package-ecosystem: 'npm'
    directories:
      - '/'
    # 2026-10-12: a daily run opened 11 single-package dev bumps, each costing a
    # ~20 min merge group. Version updates now run weekly, so every group below
    # opens at most one PR per week; security updates are unaffected. Re-evaluate
    # when a grouped PR fails more than one merge group in three. Then split the
    # failing group by family instead of returning to daily single-package PRs.
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    # JOV-6837: the JOV-5465 re-evaluate trigger fired (12 open npm PRs, 5
    # DIRTY on pnpm-lock.yaml, 2026-09-27). Each lockfile bump conflicts with
    # every other one, so move-together families and low-risk dev patches
    # land as one PR each. Majors and runtime deps stay one PR per package.
    open-pull-requests-limit: 25
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    assignees:
      - 'itstimwhite'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      electron-major:
        patterns:
          - 'electron'
        update-types:
          - 'major'
      # vitest and @vitest/* must share one version; split PRs broke each other.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
      # Dev patch AND minor bumps land as one PR; dev majors (e.g. @sentry/node
      # 10 -> 11) stay one PR per package for their own review.
      dev-non-major:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # 2026-10-10: one daily batch opened 15 single-package runtime bumps. Each
      # needs the full merge group (Mac build included) under ALLGREEN with
      # max_entries_to_build 3, and the queue sat 18 deep for 90 min with no
      # merge. Non-major runtime bumps land as one grouped PR; majors stay one
      # PR per package. Re-evaluate when the grouped PR fails more than one run
      # in three (then split by family instead of by package).
      runtime-non-major:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Temporary workaround: these packages do not publish 10.3.2.
      # Dependabot currently attempts that version and fails the update job.
      - dependency-name: 'storybook'
        versions: ['10.3.2']
      - dependency-name: '@storybook/addon-docs'
        versions: ['10.3.2']
      - dependency-name: '@storybook/nextjs-vite'
        versions: ['10.3.2']
      # Pinned at 0.121.12 (2026-09-21): promptfoo 0.122+/0.123+ breaks the
      # merge_group-only `Validate Promptfoo config` gate. 0.123.1 failed the
      # step on 7 consecutive queue runs (CI run 35645275515 and siblings)
      # while 0.121.12 passed the same step at 20:38Z (run 35652372163).
      # The gate stays strict; dependabot must not propose >=0.122 until the
      # upstream import failure is diagnosed. Re-evaluate with a local
      # `pnpm --filter @jovie/web run evals:validate` against 0.123.x.
      - dependency-name: 'promptfoo'
        versions: ['>=0.122']
      # Pinned at 56.3.2 (2026-09-25): every staging `vercel deploy
      # --prebuilt --archive=tgz` since the 56.3.2 -> 59.16.0 bump (#18080)
      # is created, then fails server-side at "Extracting deployment files"
      # with "Unexpected error". Last green deploy-staging: job 106502335969
      # (CLI 56.3.2, 6861 files); first red: job 106515900378 (CLI 59.16.0,
      # same 6861 files). Ship now: stay on 56.3.2. Re-evaluate when a CLI
      # >=57 prebuilt tgz deploy of this repo reaches READY (manual preview
      # dispatch). Then drop this ignore and re-pin in deploy-workflow.test.ts.
      # >=56.4 (not >=57): the >=57 range still let the 56.5.0 bump through
      # (#18529), which fails the structural pin test.
      - dependency-name: 'vercel'
        versions: ['>=56.4']
      # Pinned at 2.5.14 (2026-10-10): 2.5.15 crashes ("Biome encountered an
      # unexpected error") on a file outside the project root, which the
      # structural Biome contract probes (scripts/lib/__tests__/biome-*.test.mjs)
      # write to os.tmpdir(). The dev-patch group PR #21118 carried that bump
      # and failed six merge groups in a row. Re-evaluate at 2.5.16: run those
      # two probe files locally against the new binary, then drop this ignore.
      - dependency-name: '@biomejs/biome'
        versions: ['2.5.15']
      # Held at 0.72.x (2026-10-12): eve is pre-1.0, so a minor is a breaking
      # release. 0.76 removed load_skill (apps/eve-pilot disables it) and changed
      # compactMessages; the runtime group #21427 failed the isolated pilot
      # checks on it. Ship now: patches only. Re-evaluate when JOV-8227 lands
      # the migration. Then drop this ignore.
      - dependency-name: 'eve'
        update-types: ['version-update:semver-minor']
      # Held at 16.3.x (2026-10-13): next 16.4.0 breaks @storybook/nextjs-vite
      # 10.6.1 (useRouter reads `.data` of undefined under RedirectBoundary), so
      # every story fails and the merge-group Storybook Surface Matrix hangs
      # (run 38361065123, #21533). Re-evaluate when Storybook's Next integration
      # supports 16.4 (JOV-8234). Then drop this ignore.
      - dependency-name: 'next'
        versions: ['>=16.4.0 <17']
      # Held at 1.60.0 (2026-10-13): the baked runner image ships Playwright
      # 1.60.0 browsers (.github/runner-image/prerequisites.json, chromium-1223)
      # and runner-setup-action.test.ts requires devDependencies.playwright to
      # match. Remove when the runner image is rebaked with a newer Playwright
      # and prerequisites.json is bumped in the same PR.
      - dependency-name: 'playwright'
        versions: ['>1.60.0']
      - dependency-name: 'playwright-core'
        versions: ['>1.60.0']

  # Isolated Eve pilot manifest (JOV-5214). This directory entry exists so
  # SECURITY advisories are tracked for the standalone install; version
  # updates stay OFF (open-pull-requests-limit: 0 keeps dependabot quiet
  # while still creating the grouped security-update job that must go green).
  - package-ecosystem: 'npm'
    directory: '/apps/eve-pilot'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 0
    assignees:
      - 'itstimwhite'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # Unfixable advisories: https://linear.app/jovie/issue/JOV-8060
      # busboy/undici are exact pins in the dev-only Vercel CLI.
      # sprintf-js is a runtime dependency of just-bash 3.6.0 and has no
      # patched release (GHSA-hp3w-g68c-fv3c). Exact-version scope only.
      # Re-evaluate and remove on compatible upstream fixes: JOV-8365.
      - dependency-name: '@fastify/busboy'
        versions: ['2.1.1']
      - dependency-name: 'sprintf-js'
        versions: ['1.1.3']
      - dependency-name: 'undici'
        versions: ['5.28.4', '5.29.0']

  # Standalone deepsec scanner install (deepsec-native.yml runs npm ci
  # daily). Security advisories tracked; version updates stay OFF the same
  # way (open-pull-requests-limit: 0).
  - package-ecosystem: 'npm'
    directory: '/scripts/security/deepsec'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 0
    assignees:
      - 'itstimwhite'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # Unfixable advisories: https://linear.app/jovie/issue/JOV-8060
      # Ship now: exact-version ignores for upstream-blocked packages only.
      # - protobufjs 7.6.4: pi-coding-agent 0.81.1's published shrinkwrap
      #   keeps it even with a 7.6.5 override and a fresh npm resolution.
      # - undici 8.5.0: deepsec 2.3.10 pins pi-coding-agent 0.81.1 exactly.
      # Re-evaluate when upstream permits patched versions in a clean npm ci.
      # Then remove the corresponding ignore (JOV-8365); never broaden it.
      - dependency-name: 'protobufjs'
        versions: ['7.6.4']
      - dependency-name: 'undici'
        versions: ['8.5.0']

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    assignees:
      - 'itstimwhite'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    groups:
      # init/analyze load one shared bundle and must move in the same PR.
      codeql-action:
        patterns:
          # Sub-actions (analyze, upload-sarif, init) are distinct names.
          - 'github/codeql-action*'
      # Every other non-major action bump lands as one weekly PR (a single
      # merge group); majors stay one PR per action.
      actions-non-major:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for Docker (if needed)
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    assignees:
      - 'itstimwhite'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'docker'
      - 'automated'
